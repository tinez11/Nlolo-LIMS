<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Life Platform Console</title>
    <script>
      // Applied before first paint so a dark-mode reload never flashes white.
      // Wrapped because storage access itself throws in some privacy modes.
      try {
        const stored = localStorage.getItem('lifeplatform.theme');
        const dark =
          stored === 'dark' ||
          (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch {
        /* no stored preference reachable; fall through to the light default */
      }
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
