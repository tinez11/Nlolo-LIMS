name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: "21"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  build-and-unit-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Build and run unit tests
        run: ./mvnw -B -q verify -DskipITs

  frontend-build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      # src/types/api/ is gitignored (generated output drifting from the specs it
      # came from is worse than regenerating it), so every checkout -- CI included
      # -- must run this before anything that imports it. Skipping this step is not
      # hypothetical: verified locally that omitting it fails Typecheck and Build
      # with TS2307 "cannot find module" on every src/api/types.ts import.
      - name: Generate API types from backend/api/openapi
        run: npm run generate:api
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  modulith-verify:
    runs-on: ubuntu-latest
    needs: build-and-unit-test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      # Runs ApplicationModules.of(Application.class).verify() plus the custom
      # NoCrossModuleJoinTest and NoCircularDependencyTest from Deliverable 2 Rev 2 §2
      # and Deliverable 3 Rev 2 §13's D4 -- a broken module boundary fails the build
      # here, not in code review.
      - name: Spring Modulith structural verification
        run: ./mvnw -B -q test -Dtest=ModularityTests,NoCrossModuleJoinTest,NoCircularDependencyTest

  contract-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Validate OpenAPI 3.1 specs (Deliverable 4)
        run: |
          pip install -q openapi-spec-validator
          for f in api/openapi/openapi-*.yaml; do
            echo "Validating $f"
            python -m openapi_spec_validator "$f"
          done
      - name: Validate AsyncAPI 2.6 event catalog (Deliverable 5)
        run: npx --yes @asyncapi/cli validate api/asyncapi-events.yaml

  db-migration-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Create app_role with correct (non-superuser, non-BYPASSRLS) attributes
        env:
          PGPASSWORD: ci_password
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE app_role LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE PASSWORD 'ci_app_password';"
      - name: Run every module's Flyway migration in sequence (mirrors Deliverable 6's manual validation)
        env:
          PGPASSWORD: ci_password
        run: |
          set -e
          # Every V*.sql per module in version order, NOT just V1 -- this loop used to
          # hardcode V1__create_<mod>_schema.sql, so refdata/V2 (runtime reference data) and
          # policyloan/V2 (partition tenant-control event trigger) were validated by nothing.
          for mod in party product underwriting policy policyloan billing claims payment audit distribution reinsurance finaccounting regreporting communication document refdata benefitpayout accumulation bonus; do
            for f in $(ls db-migrations/$mod/V*.sql 2>/dev/null | sort -V); do
              echo "Applying $f"
              psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f "$f"
            done
          done
      - name: Assert no partition is less protected than its partitioned parent (M3 final review, I2)
        env:
          PGPASSWORD: ci_password
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f db-migrations/_post-migration/verify-partition-controls.sql
      - name: Assert app_role cannot bypass RLS (Deliverable 6 §1/§5 -- automatable, not just documented)
        env:
          PGPASSWORD: ci_password
        run: |
          RESULT=$(psql -h localhost -U postgres -tA -c "SELECT rolsuper OR rolbypassrls FROM pg_roles WHERE rolname = 'app_role';")
          if [ "$RESULT" = "t" ]; then
            echo "::error::app_role has superuser or BYPASSRLS -- every RLS policy is silently inactive. Failing the build."
            exit 1
          fi
          echo "OK: app_role has neither superuser nor BYPASSRLS."

  integration-tests:
    runs-on: ubuntu-latest
    needs: [modulith-verify, db-migration-validation]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      # Testcontainers spins up Postgres/Redis/MinIO/Keycloak per test class --
      # no shared `services:` block needed here, unlike db-migration-validation above.
      - name: Run integration test suite
        run: ./mvnw -B -q verify -Dtest=none -DfailIfNoTests=false -DskipUTs -DrunITs

  # Drives the SPA through a REAL Keycloak login against the real backend. There are
  # no fabricated JWTs in this suite by design: this project has twice shipped a
  # fully green suite over a real credential path that did not work at all, because
  # every test minted its own identity.
  #
  # Deliberately NOT a required check yet. The compose stack takes minutes to become
  # healthy, and a check that fails for infrastructure reasons trains people to
  # ignore CI. Promote it once it has proven stable.
  frontend-e2e:
    runs-on: ubuntu-latest
    needs: [frontend-build-and-test, build-and-unit-test]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start the platform stack
        working-directory: backend/infra
        run: docker compose up -d --wait postgres redis minio keycloak

      - name: Apply database migrations
        working-directory: backend
        # Same schema-setup step docs/09-local-development.md has a dev run. Without
        # this the schema is empty, seed-dev-data.sh's first API call 400s, and the
        # e2e suite would be exercising an app with nowhere to put data --
        # continue-on-error had been masking exactly that.
        run: ./scripts/migrate.sh local

      - name: Build and start the application
        working-directory: backend
        env:
          # application-local.yml (port 15432, app_role) is the profile that matches
          # this compose file's Postgres port mapping; the default application.yml
          # profile has no datasource at all and the process would not start.
          SPRING_PROFILES_ACTIVE: local
        run: |
          ./mvnw -B -q package -DskipTests
          nohup java -jar target/*.jar > /tmp/app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:9090/actuator/health/readiness > /dev/null; then
              echo "application ready"; exit 0
            fi
            sleep 5
          done
          echo "application did not become ready"; tail -50 /tmp/app.log; exit 1

      - name: Seed dev data
        working-directory: backend
        run: ./scripts/seed-dev-data.sh

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: frontend
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Application log on failure
        if: failure()
        run: tail -200 /tmp/app.log || true

  security-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
      - name: Dependency vulnerability scan
        run: ./mvnw -B -q org.owasp:dependency-check-maven:check
      - name: Filesystem/container scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: "CRITICAL,HIGH"

  build-image:
    runs-on: ubuntu-latest
    needs: [contract-validation, integration-tests, security-scan]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/infra/app/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-image
    if: github.ref == 'refs/heads/main'
    environment: staging
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Run Flyway migrations against staging
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: ./scripts/migrate.sh staging
      # EVERY post-migration script, in order, through the one installer every environment uses:
      # partitions, the partition-controls check, then every pg_cron job. Idempotent, so it runs
      # on every deploy. It refuses to run if the folder holds a script it does not list.
      #
      # This used to run two of the six. The billing sweep and the commission close were left out
      # on purpose, pending a decision, because switching them on is a business-process activation:
      # the billing sweep moves real invoices to IN_GRACE/OVERDUE and opens arrears cases, and the
      # close makes commission payable. Decided 2026-09-25: install all of them everywhere.
      - name: Install partitions and scheduled jobs (pg_partman, pg_cron)
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: ./scripts/configure-db.sh staging
      - name: Rolling deploy
        run: ./scripts/deploy.sh staging ${{ github.sha }}

  deploy-production:
    runs-on: ubuntu-latest
    needs: build-image
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production   # GitHub Environment with required reviewers -- manual approval gate
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Run Flyway migrations against production
        env:
          PRODUCTION_DB_URL: ${{ secrets.PRODUCTION_DB_URL }}
        run: ./scripts/migrate.sh production
      # See the staging job's note: every post-migration script, through one installer.
      - name: Install partitions and scheduled jobs (pg_partman, pg_cron)
        env:
          PRODUCTION_DB_URL: ${{ secrets.PRODUCTION_DB_URL }}
        run: ./scripts/configure-db.sh production
      - name: Rolling deploy
        run: ./scripts/deploy.sh production ${{ github.ref_name }}
