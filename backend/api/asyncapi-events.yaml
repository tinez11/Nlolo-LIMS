asyncapi: '2.6.0'
info:
  title: Digital Life Insurance Platform — Domain Event Catalog
  version: '0.1.0-draft'
  description: >
    Every domain event produced across the 18 modules (Deliverables 2-3). Modeled as
    an in-process event bus today (Spring Application Events / Spring Modulith's Event
    Publication Registry) — one channel per event type, so this document converts
    directly to a Kafka-backed AsyncAPI spec without restructuring if a module is ever
    extracted per your stated migration path. "publish" below means "the producer
    module publishes to this channel"; consumers are documented in each channel's
    description rather than modeled as separate subscriber applications, since this
    is a shared-bus catalog, not one service's contract.
defaultContentType: application/json
channels:

  party.PartyRegistered:
    description: "Producer: party. Consumers: distribution, communication, audit."
    publish:
      message: { $ref: '#/components/messages/PartyRegistered' }
  party.PartyKycStatusChanged:
    description: "Producer: party. Consumers: underwriting, distribution, communication, audit."
    publish:
      message: { $ref: '#/components/messages/PartyKycStatusChanged' }
  party.PartyDetailsUpdated:
    description: "Producer: party. Consumers: communication, audit."
    publish:
      message: { $ref: '#/components/messages/PartyDetailsUpdated' }

  product.ProductDefinitionPublished:
    description: >-
      Producer: product. Consumers: finaccounting, audit. CORRECTION (M10 final review, I5): this
      previously also listed regreporting as a consumer; that was never true and no such listener
      exists (verified: regreporting's application package declares exactly four listeners --
      PolicyEventListener, ClaimsEventListener, BillingEventListener, ReinsuranceEventListener --
      and none of them handles a product.* event type). Not a gap either: regreporting's fact tables
      key on an OPAQUE product_id and never need a product's definition, name or version, so there
      is nothing for a product listener to project.
    publish:
      message: { $ref: '#/components/messages/ProductDefinitionPublished' }
  product.ProductVersionRetired:
    description: >-
      Producer: product. Consumers: audit. CORRECTION (M10 final review, I5): this previously also
      listed regreporting as a consumer; that was never true and no such listener exists (same
      verification as product.ProductDefinitionPublished above). Retiring a product version cannot
      change a movement already recorded against that product in a closed period, so there would be
      nothing for such a listener to do.
    publish:
      message: { $ref: '#/components/messages/ProductVersionRetired' }

  underwriting.UnderwritingCaseOpened:
    description: >-
      Producer: underwriting. Consumers: audit. CORRECTION (M10 final review, I5): this previously
      also listed regreporting as a consumer; that was never true and no such listener exists
      (verified: regreporting's four listeners handle no underwriting.* event type). Deliberate:
      every regreporting measure is a POLICY/claim/premium/cession movement, and an underwriting
      case is neither -- a case that is opened and then declined never becomes a policy at all, so
      counting it would overstate new business.
    publish:
      message: { $ref: '#/components/messages/UnderwritingCaseOpened' }
  underwriting.UnderwritingDecisionMade:
    description: >
      Producer: underwriting, from `UnderwritingApi.decide` and nowhere else. Consumers: policy
      (auto-issuance trigger on ACCEPT/LOADED — the common issuance path, per Deliverable 4's
      framing note), communication, audit.
      PRODUCER CORRECTION: this was published from `submitAssessment`, which ran the rules engine
      and took its verdict as the decision — so an assessment issued a policy, and a placeholder
      algorithm was the sole author of every decision on the platform. Submitting an assessment
      now records evidence and a non-binding recommendation and publishes nothing; a person calls
      `decide` and that is what fires this event. The payload gained `decidedBy` accordingly.
      CORRECTION (M10 final review, I5): this previously also listed regreporting as a consumer;
      that was never true and no such listener exists (same verification as
      underwriting.UnderwritingCaseOpened above). An ACCEPT/LOADED decision reaches regreporting
      as policy.PolicyIssued, which its PolicyEventListener genuinely does consume; projecting the
      decision as well would double-count the same new business.
    publish:
      message: { $ref: '#/components/messages/UnderwritingDecisionMade' }

  policy.PolicyIssued:
    description: >-
      Producer: policy. Consumers: billing, finaccounting, communication, audit.

      MEANING CHANGED (offer and acceptance): this now means "the contract record exists", NOT
      "cover started". A policy is created PROPOSED -- an offer -- and goes on risk only when its
      first premium clears, at which point policy.PolicyActivated fires. billing is the consumer
      that still belongs here and is the reason the event exists at this moment at all: it raises
      the first invoice, which is what the customer pays to accept.

      distribution, reinsurance and regreporting were REMOVED from this list and moved to
      policy.PolicyActivated. Commission, cession and the regulatory new-business count are all
      statements about a contract actually on risk; against a proposal they meant paying agents
      for people who may never pay, ceding risk the platform was not carrying (and paying a
      reinsurance premium for it), and reporting new business that around 15% of the time never
      happens.
    publish:
      message: { $ref: '#/components/messages/PolicyIssued' }
  policy.PolicyNotTakenUp:
    description: >-
      Producer: policy. Consumers: communication, audit.

      An offer closed unpaid. Published by {@code PolicyApi.expireOffer}, NOT by
      {@code policy.sweep_expired_offers()} -- the sweep sets the status with a raw UPDATE and SQL
      cannot raise a Spring event, so for as long as it was the only path an expired offer changed
      state in total silence. Tolerable while nothing consumed it; not once a customer needed
      telling they are not insured.

      Carries policyholderPartyId because the consumer that needs it most cannot look it up:
      communication may not depend on policy, so an event naming only the contract would arrive
      with nobody to tell.

      Deliberately NOT consumed by distribution or reinsurance: an offer that expired was never on
      risk, so there is no commission to claw back and no cession to unwind. Nothing was ever
      accrued or ceded against it, because both moved to PolicyActivated.
    publish:
      message: { $ref: '#/components/messages/PolicyNotTakenUp' }
  policy.PolicyActivated:
    description: >-
      Producer: policy. Consumers: distribution, reinsurance, regreporting, communication, audit.

      "On risk, premium received." Published when the first premium clears
      (PremiumCollectedEventListener -> PolicyApi.activateOnFirstPremium), and also at issuance for
      a manual issue whose issuanceBasis already carries cover (MIGRATION, CONVERSION,
      REINSTATEMENT) -- in that case both PolicyIssued and PolicyActivated fire together, so every
      downstream consumer behaves exactly as it did before offer-and-acceptance existed.

      Published exactly once per policy: activateOnFirstPremium returns silently unless the policy
      is PROPOSED, because a second PremiumCollected is the ordinary second month and re-firing
      this would double-accrue commission and double-cede the risk.

      The payload carries issueDate as well as activatedAt, and the two are different dates. All
      three moving consumers read issueDate -- it dates the treaty selection, the surrender-charge
      band and the clawback window -- and it is the date the contract was issued, not the date the
      money arrived.
    publish:
      message: { $ref: '#/components/messages/PolicyActivated' }
  policy.PolicyEndorsed:
    description: >-
      Producer: policy. Consumers: billing (schedule regen), finaccounting, audit. CORRECTION (M10
      final review, I5): this previously also listed regreporting as a consumer; that was never true
      and no such listener exists (verified: regreporting's PolicyEventListener switches on
      PolicyIssued/Lapsed/Matured/Surrendered/Reinstated only). This one is a REAL DEFERRAL rather
      than a non-need, and worth being explicit about: an endorsement CAN change a policy's sum
      assured, which policy_movement's sum_assured_issued/sum_assured_terminated measures would need
      to reflect for SUM_ASSURED_IN_FORCE to stay exact. It is not built because the gross-movement
      model has no "adjustment" cause to record a mid-period revision against, and inventing one
      before TIRA says how a revision must be reported (C2) would be guessing. Consequence, stated
      rather than hidden: SUM_ASSURED_IN_FORCE reflects sums assured AS ISSUED, not as endorsed.
    publish:
      message: { $ref: '#/components/messages/PolicyEndorsed' }
  policy.PolicyLapsed:
    description: >
      Producer: policy. Consumers: finaccounting, communication, regreporting, audit, distribution
      (M7 Task 6 -- claws back FIRST_YEAR commission when the lapse falls inside
      TZ_COMMISSION_CLAWBACK_MONTHS of issue; previously undeclared here despite a real consumer
      existing, the same drift class Task 6 also fixes on policy.PolicyIssued's payload below).
      M10 (Task 3): regreporting's own listener genuinely projects this into policy_movement's
      policies_lapsed measure -- previously listed here as a design placeholder only.
    publish:
      message: { $ref: '#/components/messages/PolicyLapsed' }
  policy.PolicyReinstated:
    description: >-
      Producer: policy. Consumers: billing, finaccounting, communication, audit, regreporting (M10
      Task 3, newly added -- regreporting's own listener projects this into policy_movement's
      policies_reinstated measure; previously absent from this list entirely).
    publish:
      message: { $ref: '#/components/messages/PolicyReinstated' }
  policy.PolicySuspended:
    description: "Producer: policy. Consumers: billing (pause schedule), finaccounting, communication, audit."
    publish:
      message: { $ref: '#/components/messages/PolicySuspended' }
  policy.PolicyMatured:
    description: >
      Producer: policy (PolicyApi.markMatured, M6 Task 2 -- a MATURITY claim settled, or the
      policy reached term). Consumers: billing (must stop invoicing this policy), finaccounting,
      audit, regreporting. Of the 6 surrender/maturity events originally declared in this file,
      this is one of only two with a real producer; policy.PolicySurrenderInitiated,
      policy.PolicyMaturityInitiated, policy.SurrenderPayoutRequested and
      policy.MaturityPayoutRequested remain unimplemented -- do not assume the whole
      surrender/maturity choreography has landed. M10 (Task 3): regreporting's own listener
      genuinely projects this into policy_movement's policies_matured measure -- previously
      listed here as a design placeholder only.
    publish:
      message: { $ref: '#/components/messages/PolicyMatured' }
  policy.PremiumRestated:
    description: >-
      Producer: policy (family funeral cover -- a life added or ended, the anniversary re-pricing).
      Consumers: billing (restates every untouched instalment due on or after effectiveFrom IN PLACE and
      replaces the schedule; an instalment already paid keeps its amount), communication, audit. Only a
      FUNERAL policy's premium moves this way.
    publish:
      message: { $ref: '#/components/messages/PremiumRestated' }
  policy.CoveredLifeAdded:
    description: "Producer: policy (family funeral cover). Consumers: communication (FUNERAL_LIFE_ADDED), audit."
    publish:
      message: { $ref: '#/components/messages/CoveredLifeAdded' }
  policy.CoveredLifeEnded:
    description: >-
      Producer: policy (family funeral cover -- removed, aged out, free cover ended, the main member's
      death). Consumers: communication (FUNERAL_LIFE_ENDED, never for a DECEASED life), audit.
    publish:
      message: { $ref: '#/components/messages/CoveredLifeEnded' }
  policy.PremiumsEnded:
    description: >-
      Producer: policy (family funeral cover -- the main member died and the family is covered free to
      the next premium date). Consumers: billing (ends the schedule; waives every unsettled instalment due
      after `after` and reverses its outstanding receivable on billing.PremiumInvoiceReduced), audit.
    publish:
      message: { $ref: '#/components/messages/PremiumsEnded' }
  policy.PolicyholderChanged:
    description: >-
      Producer: policy (family funeral cover -- the spouse took over after the main member's death).
      Consumers: audit. The policy's own record carries the new policyholder and life assured.
    publish:
      message: { $ref: '#/components/messages/PolicyholderChanged' }
  billing.PremiumInvoiceIncreased:
    description: >-
      Producer: billing (an untouched instalment restated upward). Consumers: finaccounting (DR premium
      receivable / CR unearned premium for the DIFFERENCE, keyed on restatementId), audit.
    publish:
      message: { $ref: '#/components/messages/PremiumInvoiceRestated' }
  billing.PremiumInvoiceReduced:
    description: >-
      Producer: billing (an untouched instalment restated downward). Consumers: finaccounting (the reverse,
      for the difference, keyed on restatementId), audit. Not PremiumRefundDue: nothing was collected, so
      distribution has no commission to claw back.
    publish:
      message: { $ref: '#/components/messages/PremiumInvoiceRestated' }
  billing.InvoiceWaived:
    description: >-
      Producer: billing -- a finance write-off, a pension vesting, or a policy that ended (surrender, a claim
      that ends it, free-look from inception, expiry, maturity, paid-up: every unsettled invoice for cover no
      longer given). Carries the amount still OUTSTANDING. Consumers: finaccounting (DR unearned premium /
      CR premium receivable for that amount, keyed on the invoice), audit.
    publish:
      message: { $ref: '#/components/messages/InvoiceWaived' }
  policy.BeneficiaryChanged:
    description: "Producer: policy. Consumers: claims (refresh any open claim's beneficiary snapshot), communication, audit."
    publish:
      message: { $ref: '#/components/messages/BeneficiaryChanged' }
  policy.SurrenderValueCalculated:
    description: "Producer: policy. Consumers: communication, audit. Informational quote only — no finaccounting posting."
    publish:
      message: { $ref: '#/components/messages/SurrenderValueCalculated' }
  policy.PolicySurrenderInitiated:
    description: "Producer: policy. Consumer: policyloan (loan-netting choreography start, Deliverable 3 Rev 2 §12)."
    publish:
      message: { $ref: '#/components/messages/PolicySurrenderInitiated' }
  policy.PolicyMaturityInitiated:
    description: "Producer: policy. Consumer: policyloan (same choreography, maturity path)."
    publish:
      message: { $ref: '#/components/messages/PolicyMaturityInitiated' }
  policy.PolicySurrendered:
    description: >
      Producer: policy (PolicyApi.terminateForSettledClaim, M6 Task 2 -- a DEATH/DISABILITY/
      CRITICAL_ILLNESS claim settled, discharging coverage; reuses the SURRENDERED status since
      policy.policy's CHECK offers no CLAIM_SETTLED value). Consumers: billing (must stop
      invoicing this policy), finaccounting, audit, regreporting. Of the 6 surrender/maturity
      events originally declared in this file, this is one of only two with a real producer;
      policy.PolicySurrenderInitiated, policy.PolicyMaturityInitiated,
      policy.SurrenderPayoutRequested and policy.MaturityPayoutRequested remain unimplemented --
      do not assume the whole surrender/maturity choreography has landed. M10 (Task 3):
      regreporting's own listener genuinely consumes this -- despite the event's name, it maps to
      policy_movement's policies_claim_terminated measure, not a "surrendered" column (this table
      has none), because its real producer is a settled claim, not a policyholder-initiated
      surrender; see PolicyEventListener's own javadoc.
    publish:
      message: { $ref: '#/components/messages/PolicySurrendered' }
  policy.PolicyCancelledFreeLook:
    description: >
      Producer: policy (PolicyApiImpl.cancelForFreeLook, product step 2) -- a customer exercised
      their free-look right and the sale is undone FROM INCEPTION (guide §21.3). Published only
      once a second person approves the cancellation benefitpayout prepared; preparing one
      publishes nothing, because preparing commits nothing.
      Consumers: billing (shares the surrender handler -- ending the schedule is identical and
      only the money differs), distribution (claws back EVERY unreversed accrual with NO window,
      unlike a lapse: cover never ran, so the agent kept nothing), audit.
      NOT a surrender, and a consumer must not treat it as one. A surrender ends a contract that
      RAN and pays a value; this one treats the contract as never having existed, which is why
      Policy.wasOnRiskOn answers false for every date afterwards.
    publish:
      message: { $ref: '#/components/messages/PolicyCancelledFreeLook' }
  benefitpayout.PayoutRequested:
    description: >
      Producer: benefitpayout (BenefitPayoutApiImpl.approve / retry / approveRun, and
      approveFreeLook for a refund). Consumer: payment, which turns it into a real disbursement.
      TWO SHAPES, distinguished by which id is present: an instalment payout carries
      instalmentId, a free-look refund carries cancellationId. payment reads whichever is set as
      its sourceRef, and purpose says which this is -- MATURITY_PAYOUT, SURVIVAL_BENEFIT_PAYOUT,
      INCOME_PAYOUT, PREMIUM_RETURN_PAYOUT or FREE_LOOK_REFUND.
      idempotencyKey carries the ATTEMPT for an instalment ("<id>:<attempts>"), so a retry is a
      NEW request rather than a duplicate payment drops; a free-look refund uses
      "free-look:<cancellationId>", because there is no retry path for one.
    publish:
      message: { $ref: '#/components/messages/PayoutRequested' }
  benefitpayout.PayoutPaid:
    description: >
      Producer: benefitpayout (markPaid, on the real APPROVED -> PAID transition ONLY, so a
      redelivered disbursement completion cannot post the same payout to the ledger twice).
      Consumers: finaccounting (debits claims expense, credits cash), audit.
    publish:
      message: { $ref: '#/components/messages/PayoutPaid' }
  accumulation.PayoutRequested:
    description: >
      Producer: accumulation -- a partial withdrawal approved (purpose WITHDRAWAL_PAYOUT, sourceRef
      the withdrawal id) or, from task 7, a surrender valued by the account (SURRENDER_PAYOUT,
      sourceRef the surrender request id, so policy's SurrenderPaymentListener marks it PAID
      unchanged). Consumer: payment, which records and submits the disbursement. The money has
      ALREADY left the account when this is published; a failed payment is a REVERSAL entry.
    publish:
      message: { $ref: '#/components/messages/AccountPayoutRequested' }
  accumulation.TopUpRequested:
    description: >
      Producer: accumulation, when staff request money a customer adds to a savings account.
      Consumer: payment, which records a COLLECTION with purpose ACCOUNT_TOP_UP and sourceRef the
      top-up id. Its payment.PaymentConfirmed is accumulation's, not billing's.
    publish:
      message: { $ref: '#/components/messages/TopUpRequested' }
  accumulation.StatementIssued:
    description: >
      Producer: accumulation, when a statement is filed (once per policy, period and last entry
      included). Consumers: communication -- ONLY when annual is true -- sends the yearly SMS summary
      (template ACCOUNT_STATEMENT); audit. Carries the policyholder because communication may not
      depend on accumulation or policy to find them, and both figures off the reconciled statement.
    publish:
      message: { $ref: '#/components/messages/StatementIssued' }
  accumulation.DepositMatured:
    description: >
      Producer: accumulation, once per fixed-term deposit term that reaches maturity, in the same
      transaction as the term's interest: REINVESTED (a new term opened at the rate then in force),
      PAID_OUT (DEPOSIT_MATURITY_PAYOUT requested) or AWAITING_PAYEE (no number to pay it to; finance
      records one). Consumers: audit.
    publish:
      message: { $ref: '#/components/messages/DepositMatured' }
  accumulation.PostingRecorded:
    description: >
      Producer: accumulation (LedgerService.post -- the one place a savings account's balance
      changes), once per posting, in the posting's own transaction, so a redelivered source that
      posts nothing publishes nothing. Consumers: audit. The GL deliberately does not book it yet
      (product step 3, Q10): IFRS 17 owns that classification, and a later GL change subscribes here
      without touching accumulation.
    publish:
      message: { $ref: '#/components/messages/PostingRecorded' }
  bonus.BonusEntryRecorded:
    description: >
      Producer: bonus (AttachmentLedger -- the one place a policy's attached bonuses change), once
      per attachment-ledger entry, in the entry's own transaction: REVERSIONARY when an approved
      declaration attaches, REVERSAL when one is taken back. A redelivered declaration run attaches
      nothing and publishes nothing. Consumers: audit.
    publish:
      message: { $ref: '#/components/messages/BonusEntryRecorded' }
  policy.GroupMemberAdded:
    description: >
      Producer: policy (PolicyApiImpl.addMember) -- one insured life joins a group scheme after
      activation. Consumers: regreporting, audit.
      On a credit-life scheme this is the high-volume event on the platform: a lender's monthly
      file enrols several hundred borrowers, and bulk intake calls addMember once per row, so one
      accepted submission publishes one of these per member.
      It carries NO member id, and that is a property of the domain rather than an oversight: a
      FREEFORM borrower has no party row, so memberPartyId is explicitly null and there is nothing
      stable for a consumer to key on. Any consumer needing idempotency must get it from the
      figures rather than from an identifier -- regreporting projects the DELTA between
      schemeTotalCovered and the total it last recorded, which makes a redelivery a no-op by
      arithmetic.
      schemeTotalCovered is the scheme's total AFTER this member, restated in the same
      transaction. joinedOn is the date cover started for them, and is what a consumer must
      derive a reporting period from -- not the scheme's issue date, or every file a lender ever
      sends would report in the quarter the scheme opened.
      Opening-schedule members do NOT produce this event: issueGroupScheme creates them inline and
      their cover is already inside PolicyActivated's sumAssured. A consumer that counted both
      would double-count every scheme at issuance.
    publish:
      message: { $ref: '#/components/messages/GroupMemberAdded' }
  policy.GroupMemberEvidenceGranted:
    description: >
      Producer: policy (PolicyApiImpl.recordMemberEvidenceDecision, reached from the underwriting
      decision listener). Consumers: regreporting, audit. The scheme total rises with nobody
      joining or leaving, so regreporting's running sum assured must hear of it. A REFUSED excess
      publishes nothing: cover stays at the limit and no total moves.
    publish:
      message: { $ref: '#/components/messages/GroupMemberEvidenceGranted' }
  policy.GroupMemberExited:
    description: >
      Producer: policy (PolicyApiImpl.exitOneMember, reached from dischargeForSettledClaim and
      from exitMember) -- one insured life leaves a group scheme. Consumers: billing (a premium
      credit on a refundable exit), regreporting, audit.
      The reason is CLAIM_SETTLED when a settled death claim discharged that MEMBER (the contract
      stays in force and the other lives keep their cover), or one of SETTLED_EARLY, REFINANCED,
      WRITTEN_OFF or CANCELLED when a credit-life loan simply ended. The distinction is not
      cosmetic: a settled claim earns its premium in full, while a loan that ended early does not,
      which is why only the latter carries refund detail.
      The scheme's sum assured is restated without them in the same transaction and
      schemeTotalCovered carries the resulting figure. leftOn is the DATE OF EVENT, never the day
      the payout cleared -- a death in March settled in September means cover ended in March, and
      dating it later would leave the member counted in the scheme total for six months they were
      not alive.
      A schemeTotalCovered of ZERO means the LAST member has left. The scheme closes in the same
      breath and publishes policy.PolicySurrendered, which is what takes the remaining cover out
      of force -- a consumer that also acted on the zero would remove the same cover twice.
    publish:
      message: { $ref: '#/components/messages/GroupMemberExited' }
  policy.AgentOfRecordChanged:
    description: >
      Producer: policy (PolicyApiImpl.changeSchemeAgentOfRecord) -- staff corrected who earns
      commission on a scheme. Consumers: distribution (the projection accrual reads follows it),
      audit (who changed where commission money goes, and why).
      FORWARD ONLY. Accruals already booked stay with the agent who earned them; a consumer must
      not re-attribute history from this event.
    publish:
      message: { $ref: '#/components/messages/AgentOfRecordChanged' }
  policy.SurrenderPayoutRequested:
    description: >
      Producer: policy. Consumer: payment (request/confirm pattern). NOT published for an
      ACCOUNT-valued version (product step 3): policy publishes policy.AccountSurrenderApproved
      instead, and accumulation requests the payment once it has valued the account.
    publish:
      message: { $ref: '#/components/messages/SurrenderPayoutRequested' }
  policy.AccountSurrenderApproved:
    description: >
      Producer: policy (approveSurrender, on an ACCOUNT-valued version, after the two signatures and
      the end of cover). Consumer: accumulation, which closes the account with interest to the
      approval day and requests the payment -- value less the surrender charge -- under
      SURRENDER_PAYOUT with the surrender request id as its source, so policy's own
      SurrenderPaymentListener marks the request PAID. Carries the charge percent because only
      policy resolves the surrender-charge schedule.
    publish:
      message: { $ref: '#/components/messages/AccountSurrenderApproved' }
  policy.MaturityPayoutRequested:
    description: "Producer: policy. Consumer: payment (request/confirm pattern)."
    publish:
      message: { $ref: '#/components/messages/MaturityPayoutRequested' }

  policyloan.LoanOriginated:
    description: "Producer: policyloan. Consumers: finaccounting, audit."
    publish:
      message: { $ref: '#/components/messages/LoanOriginated' }
  policyloan.LoanDisbursementRequested:
    description: "Producer: policyloan. Consumer: payment (request/confirm pattern, Deliverable 2 Rev 2 A2)."
    publish:
      message: { $ref: '#/components/messages/LoanDisbursementRequested' }
  policyloan.LoanDisbursed:
    description: "Producer: policyloan (confirmation, after consuming payment.DisbursementCompleted). Consumers: policy (encumbrance projection), finaccounting (posts a journal entry, DR 1400/CR 1000), communication, audit."
    publish:
      message: { $ref: '#/components/messages/LoanDisbursed' }
  policyloan.LoanRepaid:
    description: "Producer: policyloan. Consumers: policy (encumbrance projection), finaccounting, audit."
    publish:
      message: { $ref: '#/components/messages/LoanRepaid' }
  policyloan.LoanForcedLapseTriggered:
    description: "Producer: policyloan. Consumers: policy, communication, audit."
    publish:
      message: { $ref: '#/components/messages/LoanForcedLapseTriggered' }
  policyloan.LoanSettledForPayout:
    description: "Producer: policyloan. Consumer: policy (loan-netting choreography, settlement leg)."
    publish:
      message: { $ref: '#/components/messages/LoanSettledForPayout' }

  billing.PremiumInvoiceGenerated:
    description: "Producer: billing. Consumers: finaccounting, communication, audit."
    publish:
      message: { $ref: '#/components/messages/PremiumInvoiceGenerated' }
  billing.PremiumCollected:
    description: >-
      Producer: billing. Consumers: distribution (RENEWAL commission attribution), finaccounting,
      regreporting (M10 Task 6, newly added). Added in M7. Fires ONLY on the transition INTO PAID --
      a partial payment (PARTIALLY_PAID) and a no-op payment against an already-PAID or WAIVED
      invoice both publish nothing, so this event means "this invoice's premium is now fully
      collected", never "some money arrived". `amount` is the invoice's own premium amount, not the
      tendered amount, so an overpayment does not inflate it. `invoiceId` is a sound idempotency key
      for consumers because of that once-only edge. Exists because payment.PaymentConfirmed carries
      only sourceRef = invoiceId with no policyNumber, leaving consumers unable to attribute a
      collection to a policy. regreporting's own BillingEventListener projects this into
      premium_movement's collected_amount, resolving the productId this event lacks through its own
      policy_dimension (falling back to the UNKNOWN product sentinel on a miss) -- previously
      absent from this list entirely.
    publish:
      message: { $ref: '#/components/messages/PremiumCollected' }
  billing.PremiumOverdue:
    description: "Producer: billing. Consumers: communication, audit."
    publish:
      message: { $ref: '#/components/messages/PremiumOverdue' }
  billing.GracePeriodTriggered:
    description: "Producer: billing. Consumers: communication, audit."
    publish:
      message: { $ref: '#/components/messages/GracePeriodTriggered' }
  billing.GracePeriodExpiring:
    description: "Producer: billing. Consumers: communication, audit."
    publish:
      message: { $ref: '#/components/messages/GracePeriodExpiring' }
  billing.PaymentRequested:
    description: "Producer: billing. Consumer: payment (request/confirm pattern)."
    publish:
      message: { $ref: '#/components/messages/PaymentRequested' }
  billing.PolicyLapseRecommended:
    description: "Producer: billing. Consumer: policy (billing recommends, policy alone performs the lapse transition)."
    publish:
      message: { $ref: '#/components/messages/PolicyLapseRecommended' }
  billing.FieldReceiptCaptured:
    description: "Producer: billing (BillingSyncApi offline capture). Consumer: audit."
    publish:
      message: { $ref: '#/components/messages/FieldReceiptCaptured' }
  billing.FieldReceiptReconciliationOverdue:
    description: "Producer: billing (24h SLA breach, Deliverable 2 Rev 2 B4). Consumers: communication (staff alert), audit."
    publish:
      message: { $ref: '#/components/messages/FieldReceiptReconciliationOverdue' }
  billing.FieldReceiptReconciled:
    description: >-
      Producer: billing (a finance officer matching field cash to money received). Consumer: audit.
      Carries reconciledBy because field_receipt has no actor column -- this event is the only
      record of WHO closed the receipt, exactly as InvoiceWaived carries waivedBy.
    publish:
      message: { $ref: '#/components/messages/FieldReceiptReconciled' }

  claims.ClaimRegistered:
    description: >-
      Producer: claims. Consumers: communication, audit, regreporting. M10 (Task 6):
      regreporting's own ClaimsEventListener genuinely projects this into claim_dimension and
      claims_movement (registered_count), keyed by the envelope's occurredAt, not the payload's
      dateOfEvent -- previously listed here as a design placeholder with no listener behind it.
    publish:
      message: { $ref: '#/components/messages/ClaimRegistered' }
  claims.ClaimAssessed:
    description: >-
      Producer: claims. Consumers: audit. CORRECTION (M10 final review, I5): this previously also
      listed regreporting as a consumer; that was never true and no such listener exists (verified:
      regreporting's ClaimsEventListener switches on ClaimRegistered/Approved/Rejected/Settled
      only). Deliberate: claims_movement's four counters are registered/approved/rejected/settled --
      an assessment is an intermediate step between registration and the approve/reject decision,
      with no measure of its own, and counting it would double-count a claim already counted at
      registration.
    publish:
      message: { $ref: '#/components/messages/ClaimAssessed' }
  claims.ClaimApproved:
    description: >-
      Producer: claims. Consumers: reinsurance (recovery calc), finaccounting, communication,
      audit, regreporting. M10 (Task 6): regreporting's own listener genuinely projects this into
      claims_movement's approved_count/approved_amount -- previously listed here as a design
      placeholder only.
    publish:
      message: { $ref: '#/components/messages/ClaimApproved' }
  claims.ClaimRejected:
    description: >-
      Producer: claims. Consumers: communication, audit, regreporting. M10 (Task 6):
      regreporting's own listener genuinely projects this into claims_movement's rejected_count --
      previously listed here as a design placeholder only.
    publish:
      message: { $ref: '#/components/messages/ClaimRejected' }
  claims.ClaimSettlementRequested:
    description: "Producer: claims. Consumer: payment (request/confirm pattern, Deliverable 2 Rev 2 A3)."
    publish:
      message: { $ref: '#/components/messages/ClaimSettlementRequested' }
  claims.ClaimSettled:
    description: >-
      "Producer: claims (confirmation, after consuming payment.DisbursementCompleted). Consumers:
      reinsurance (claim recovery), finaccounting, communication, audit, regreporting. policyNumber
      and settledAmount were added in M8: without them no consumer could attribute a settlement to
      a policy or know what was paid. M10 (Task 6): regreporting's own listener genuinely projects
      this into claims_movement's settled_count/settled_amount -- previously listed here as a
      design placeholder only."
    publish:
      message: { $ref: '#/components/messages/ClaimSettled' }

  distribution.AgentOnboarded:
    description: "Producer: distribution. Consumers: communication, audit."
    publish:
      message: { $ref: '#/components/messages/AgentOnboarded' }
  distribution.AgentLicenseExpiring:
    description: "Producer: distribution. Consumers: communication, audit."
    publish:
      message: { $ref: '#/components/messages/AgentLicenseExpiring' }
  distribution.CommissionAccrued:
    description: "Producer: distribution. Consumers: finaccounting, audit."
    publish:
      message: { $ref: '#/components/messages/CommissionAccrued' }
  distribution.CommissionPayoutRequested:
    description: "Producer: distribution. Consumer: payment (request/confirm pattern)."
    publish:
      message: { $ref: '#/components/messages/CommissionPayoutRequested' }
  distribution.CommissionPaid:
    description: "Producer: distribution (confirmation). Consumers: finaccounting (posts a journal entry, DR 5100/CR 1000), communication, audit."
    publish:
      message: { $ref: '#/components/messages/CommissionPaid' }

  payment.PaymentConfirmed:
    description: "Producer: payment. Consumers: billing, policyloan (repayment leg), finaccounting, audit."
    publish:
      message: { $ref: '#/components/messages/PaymentConfirmed' }
  payment.PaymentFailed:
    description: "Producer: payment. Consumers: billing, policyloan, communication, audit."
    publish:
      message: { $ref: '#/components/messages/PaymentFailed' }
  payment.DisbursementCompleted:
    description: "Producer: payment. Consumers: policyloan, claims, distribution, policy, finaccounting, audit."
    publish:
      message: { $ref: '#/components/messages/DisbursementCompleted' }
  payment.DisbursementFailed:
    description: "Producer: payment. Consumers: policyloan, claims, distribution, policy, communication, audit."
    publish:
      message: { $ref: '#/components/messages/DisbursementFailed' }
  payment.EftDisbursementAwaitingExecution:
    description: >-
      Producer: payment. Consumers: finaccounting, audit.

      The EFT rail has no gateway and no callback: a finance officer moves the money in the
      bank's own portal. Between instructing the payout and their confirming it, days pass --
      and for that whole window a real, approved, multi-million-shilling obligation would be
      invisible in the general ledger. This event is what puts it on the books:
      finaccounting.PaymentEventListener raises DR 5100 Claims Expense / CR 2110 Claims
      Payable on it, and reverses that on EftDisbursementExecuted below.

      No equivalent exists for the mobile-money rail, deliberately -- there the gap between
      approved and paid is milliseconds and there is nothing to accrue.
    publish:
      message: { $ref: '#/components/messages/EftDisbursementAwaitingExecution' }
  payment.EftDisbursementExecuted:
    description: >-
      Producer: payment. Consumers: finaccounting, audit.

      Published alongside payment.DisbursementCompleted when finance confirms an EFT, and
      carrying only what the ledger needs. It reverses the accrual above, so the claims expense
      is recognised exactly once: DisbursementCompleted then drives claims.ClaimSettled, whose
      existing rule books DR Claims Expense / CR Cash.

      A SEPARATE event type rather than a flag on DisbursementCompleted, because journal entries
      are idempotent on (sourceEvent, sourceRef) -- the reversal and the original would collide
      under one type, and only one of the two would ever post.
    publish:
      message: { $ref: '#/components/messages/EftDisbursementExecuted' }

  reinsurance.CessionRecorded:
    description: >-
      Producer: reinsurance. Consumers: finaccounting, audit, regreporting (M10 Task 6, newly
      added -- regreporting's own ReinsuranceEventListener projects this into
      reinsurance_movement's ceded_risk_amount/ceded_premium_amount. Deliberately NOT attributed by
      product: a cession arrives from reinsurance's own transaction reacting to PolicyIssued,
      unordered against regreporting's own PolicyIssued listener, so keying by product would race
      against the policy_dimension row a cession would need; previously absent from this list
      entirely).
    publish:
      message: { $ref: '#/components/messages/CessionRecorded' }
  reinsurance.RecoveryCalculated:
    description: >-
      Producer: reinsurance, on claims.ClaimApproved (IFRS 17 I3c). Consumers: finaccounting (B-05: Dr 1420 / Cr 6120,
      against the policy's IFRS 17 dimensions), audit. Replaces reinsurance.RecoveryConfirmed: there is no staff
      Confirm -- the amount is agreed with the reinsurer on its statement.
    publish:
      message: { $ref: '#/components/messages/RecoveryCalculated' }
  reinsurance.BordereauPosted:
    description: >-
      Producer: reinsurance's month-end bordereau job (IFRS 17 I3c), one per treaty and month. Consumers: finaccounting
      (K-01 Dr 1436 / Cr 1430 premium; K-02 Dr 1431 / Cr 1436 commission not contingent on claims -- dated the month's
      last day), audit. Not published for a month that charged nothing.
    publish:
      message: { $ref: '#/components/messages/BordereauPosted' }
  reinsurance.StatementApproved:
    description: >-
      Producer: reinsurance, when a FINANCE_APPROVER approves a quarter's statement (IFRS 17 I3d). Consumers:
      finaccounting (rules v4 R-STMT, one SYSTEM journal: R-04 Dr 1430 / Cr 2550 funds withheld; R-01 Dr 1430, Cr 1431,
      Cr 1420 and 1434 the balance; R-03 Dr 1433 / Cr 6120 profit commission). Not published for an all-zero quarter.
    publish:
      message: { $ref: '#/components/messages/StatementApproved' }

  finaccounting.GlPostingRecorded:
    description: >-
      Producer: finaccounting (Task 5, M9: real double-entry GL posting, one event per journal
      entry). Consumer: audit. No longer provisional -- see GlPostingRecordedPayload's own
      description. CORRECTION (M10 Task 9): this previously also listed regreporting as a consumer;
      that was never true and no such listener exists (verified: regreporting's application package
      has no FinaccountingEventListener). Deliberately not built, not merely missed: the payload
      carries no account codes (see GlPostingRecordedPayload), so the only figure derivable from it
      would be a coarse control total with no way to attribute it to a reporting dimension --
      not worth a dedicated listener on its own. A deferral, not an oversight.
    publish:
      message: { $ref: '#/components/messages/GlPostingRecorded' }
  finaccounting.CsmRolledForward:
    description: >-
      Producer: finaccounting. Consumer: audit. Schema provisional pending C1. CORRECTION (M10 final
      review, I5): this previously also listed regreporting as a consumer; that was never true and no
      such listener exists (verified: regreporting's application package has no
      FinaccountingEventListener). Same correction Task 9 already applied to
      finaccounting.GlPostingRecorded above, and it left this channel CONTRADICTING
      docs/05-event-catalog.md, which already stated correctly that regreporting consumes neither
      finaccounting event. Doubly untrue here: CsmRolledForward is itself C1-BLOCKED with no producer
      at all yet, so nothing could be genuinely consuming it.
    publish:
      message: { $ref: '#/components/messages/CsmRolledForward' }

  communication.NotificationDispatched:
    description: "Producer: communication. Consumer: audit."
    publish:
      message: { $ref: '#/components/messages/NotificationDispatched' }
  communication.NotificationFailed:
    description: "Producer: communication. Consumer: audit."
    publish:
      message: { $ref: '#/components/messages/NotificationFailed' }

  document.DocumentUploaded:
    description: "Producer: document. Consumer: audit."
    publish:
      message: { $ref: '#/components/messages/DocumentUploaded' }

  policy.UnitLinkedSurrenderApproved:
    description: >
      Producer: policy (product step 6) -- a unit-linked surrender approved; nothing is quoted or paid by
      policy. Consumer: unitlinked, which sells every unit at the first price after approval and pays the proceeds.
    publish:
      message: { $ref: '#/components/messages/UnitLinkedEvent' }
  unitlinked.PriceApproved:
    description: >
      Producer: unitlinked -- a fund price approved by a second person. Consumer: audit.
    publish:
      message: { $ref: '#/components/messages/UnitLinkedEvent' }
  unitlinked.UnitsAllocated:
    description: >
      Producer: unitlinked -- a premium bought units (premium, allocated, allocationCharge, firstPremium,
      policyholderPartyId). Consumers: finaccounting (DR 2140 / CR 2150, CR 4310), communication (UL_ALLOCATED).
    publish:
      message: { $ref: '#/components/messages/UnitLinkedEvent' }
  unitlinked.ChargesTaken:
    description: >
      Producer: unitlinked -- the monthly policy fee and cost of insurance sold from the units.
      Consumer: finaccounting (DR 2150 / CR 4310).
    publish:
      message: { $ref: '#/components/messages/UnitLinkedEvent' }
  unitlinked.FundRevalued:
    description: >
      Producer: unitlinked -- an approved price trued 2150 up to units x price (delta).
      Consumer: finaccounting (DR 5600 / CR 2150 a rise, the reverse a fall).
    publish:
      message: { $ref: '#/components/messages/UnitLinkedEvent' }
  unitlinked.ExitPriced:
    description: >
      Producer: unitlinked -- a death, surrender, maturity, lapse or free-look sale priced (proceeds).
      Consumer: finaccounting (DR 2150 / CR 5100).
    publish:
      message: { $ref: '#/components/messages/UnitLinkedEvent' }
  unitlinked.PremiumReturned:
    description: >
      Producer: unitlinked -- a premium still waiting for units when the policy exited, returned whole.
      Consumer: finaccounting.
    publish:
      message: { $ref: '#/components/messages/UnitLinkedEvent' }
  unitlinked.ChargeRefunded:
    description: >
      Producer: unitlinked -- a cost of insurance taken after death, or a charge unwound at free-look.
      Consumer: finaccounting (DR 4310 / CR 5100).
    publish:
      message: { $ref: '#/components/messages/UnitLinkedEvent' }
  unitlinked.UnitsReinvested:
    description: >
      Producer: unitlinked -- a rejected death claim's proceeds bought back into the funds.
      Consumer: finaccounting (DR 5100 / CR 2150).
    publish:
      message: { $ref: '#/components/messages/UnitLinkedEvent' }
  unitlinked.PriceCorrected:
    description: >
      Producer: unitlinked -- an approved correction re-ran what the corrected price priced (movements,
      each with its original and corrected amount and whether its exit was already paid). Consumer: finaccounting.
    publish:
      message: { $ref: '#/components/messages/UnitLinkedEvent' }
  unitlinked.PayoutRequested:
    description: >
      Producer: unitlinked -- an exit's proceeds (SURRENDER_PAYOUT, MATURITY_PAYOUT, LAPSE_SURRENDER_PAYOUT;
      idempotencyKey unit-linked:<type>:<ref>), an adjustment owed to the customer (PRICE_CORRECTION_PAYOUT;
      price-correction:<id>), a partial withdrawal's net (WITHDRAWAL_PAYOUT; unit-linked:withdrawal:<id>) or a top-up
      refunded whole because the policy ended first (TOP_UP_REFUND; unit-linked:top-up:<id>). Consumer: payment.
    publish:
      message: { $ref: '#/components/messages/UnitLinkedEvent' }
  unitlinked.PayoutPaid:
    description: >
      Producer: unitlinked -- payment completed one of its payouts; sourceRef is the disbursement id, so a
      redelivery posts nothing twice. Consumer: finaccounting (DR 5100 / CR cash; DR 2130 / CR cash for an adjustment;
      DR 2140 / CR cash for a refunded top-up).
    publish:
      message: { $ref: '#/components/messages/UnitLinkedEvent' }
  unitlinked.AdjustmentCollected:
    description: >
      Producer: unitlinked -- an adjustment owed by the customer recorded as collected outside the platform.
      Consumer: finaccounting (DR cash / CR 1230).
    publish:
      message: { $ref: '#/components/messages/UnitLinkedEvent' }
  unitlinked.AdjustmentWaived:
    description: >
      Producer: unitlinked -- an adjustment waived with a reason by a second person.
      Consumer: finaccounting (DR 2130 / CR 5100 owed to the customer; DR 5100 / CR 1230 owed by them).
    publish:
      message: { $ref: '#/components/messages/UnitLinkedEvent' }
  unitlinked.ProceedsReady:
    description: >
      Producer: unitlinked -- an exit's proceeds are being paid. Consumer: communication (UL_PROCEEDS).
    publish:
      message: { $ref: '#/components/messages/UnitLinkedEvent' }
  unitlinked.LowFund:
    description: >
      Producer: unitlinked -- the units will meet fewer months of charges than the version's warning.
      Consumer: communication (UL_LOW_FUND).
    publish:
      message: { $ref: '#/components/messages/UnitLinkedEvent' }
  unitlinked.FundExhausted:
    description: >
      Producer: unitlinked -- the units could not meet a month's charges; the policy lapses FUND_EXHAUSTED.
      Consumer: communication (UL_LAPSED_EXHAUSTED).
    publish:
      message: { $ref: '#/components/messages/UnitLinkedEvent' }
  unitlinked.SwitchExecuted:
    description: >
      Producer: unitlinked (U2) -- a switch's two legs priced on one date (switchId, executedOn, moved, fee;
      sourceRef switch:<id>). Consumer: finaccounting (the fee, DR 2150 / CR 4310; the move stays inside 2150).
    publish:
      message: { $ref: '#/components/messages/UnitLinkedEvent' }
  unitlinked.WithdrawalPriced:
    description: >
      Producer: unitlinked (U2) -- a partial withdrawal's sale priced (withdrawalId, proceeds, surrenderCharge;
      sourceRef withdrawal:<id>). Consumer: finaccounting (DR 2150 / CR 5100 the proceeds; DR 5100 / CR 4310 the charge).
    publish:
      message: { $ref: '#/components/messages/UnitLinkedEvent' }
  unitlinked.SurrenderCharged:
    description: >
      Producer: unitlinked (U2) -- the surrender charge taken from a surrender's or a non-payment lapse's proceeds
      (amount). Consumer: finaccounting (DR 5100 / CR 4310).
    publish:
      message: { $ref: '#/components/messages/UnitLinkedEvent' }
  unitlinked.TopUpRequested:
    description: >
      Producer: unitlinked (U2) -- a top-up to collect (topUpId, idempotencyKey ul-topup:<id>, payerRef, amount
      {amount, currencyCode}). Consumer: payment, which records a COLLECTION with purpose UL_TOP_UP and sourceRef the
      top-up id.
    publish:
      message: { $ref: '#/components/messages/UnitLinkedEvent' }
  unitlinked.TopUpReceived:
    description: >
      Producer: unitlinked (U2) -- payment confirmed a top-up's money (topUpId, amount; sourceRef top-up:<id>).
      Consumer: finaccounting (DR cash / CR 2140, until it buys units or goes back).
    publish:
      message: { $ref: '#/components/messages/UnitLinkedEvent' }
  unitlinked.StatementIssued:
    description: >
      Producer: unitlinked (U2) -- a unit statement filed (statementId, policyNumber, policyholderPartyId, annual,
      year, periodFrom, periodTo, closingValue, currencyCode, priceDate -- null when no fund was priced yet).
      Consumer: communication, the annual one only (UNIT_LINKED_STATEMENT).
    publish:
      message: { $ref: '#/components/messages/UnitLinkedEvent' }

