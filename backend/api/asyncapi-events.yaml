          properties: { accrualId: {type: string, format: uuid}, statementId: {type: string, format: uuid}, agentId: {type: string, format: uuid}, policyNumber: {type: string}, tierType: {type: string}, salesChannel: {type: [string, "null"]}, reversesAccrualId: {type: [string, "null"], format: uuid}, amount: {type: object} }
