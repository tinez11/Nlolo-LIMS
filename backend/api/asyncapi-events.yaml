      description: >
        IFRS 17 I3b: published for EVERY accrual persisted -- first-year, renewal, override and a clawback reversal
        (negative amount, reversesAccrualId set) -- with its tier and the agent's sales channel, so the ledger books
        it against the channel's payable (2510 agents, 2520 brokers, 2530 bancassurance).
