    NotificationFailed: { messageId: NotificationFailed, name: NotificationFailed, payload: { $ref: '#/components/schemas/NotificationFailedPayload' } }
    DocumentUploaded: { messageId: DocumentUploaded, name: DocumentUploaded, payload: { $ref: '#/components/schemas/DocumentUploadedPayload' } }

  schemas:
    EventEnvelopeMeta:
      type: object
      description: >
        Common to every message below (Deliverable 2's DomainEventEnvelope<T>), shown
        once here rather than repeated per schema. sequenceNumber is new in this
        deliverable — a per-aggregate monotonic counter assigned by the producer within
        the same transaction as the state change, letting ordering-sensitive consumers
        (finaccounting, audit) detect and buffer out-of-order delivery.
      properties:
        eventId: { type: string, format: uuid }
        eventType: { type: string, description: "e.g. policy.PolicyIssued" }
        schemaVersion: { type: integer, default: 1 }
        tenantId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        sequenceNumber: { type: integer, description: "Monotonic per aggregate (e.g. per policyNumber), not global." }
      required: [eventId, eventType, schemaVersion, tenantId, occurredAt]

    PartyRegisteredPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { partyId: {type: string, format: uuid}, partyType: {type: string, enum: [INDIVIDUAL, CORPORATE, GROUP]} }
    PartyKycStatusChangedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { partyId: {type: string, format: uuid}, previousStatus: {type: string}, newStatus: {type: string}, evidenceDocumentRef: {type: string} }
    PartyDetailsUpdatedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { partyId: {type: string, format: uuid}, changedFields: {type: array, items: {type: string}} }

    ProductDefinitionPublishedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { productId: {type: string, format: uuid}, productVersionId: {type: string, format: uuid}, effectiveDate: {type: string, format: date}, ifrsMeasurementModel: {type: string, enum: [GMM, PAA]} }
    ProductVersionRetiredPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { productId: {type: string, format: uuid}, productVersionId: {type: string, format: uuid}, retirementDate: {type: string, format: date} }

    UnderwritingCaseOpenedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { caseId: {type: string, format: uuid}, applicantPartyId: {type: string, format: uuid}, productId: {type: string, format: uuid}, productVersionId: {type: string, format: uuid} }
    UnderwritingDecisionMadePayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          # decidedBy is new: until the decision became an explicit human act there was nobody
          # to name. The engine decided every case, and decision_decided_by did not exist.
          # Nullable on nothing -- every event published from here carries an author, because
          # decide(...) cannot be reached without one.
          properties: { caseId: {type: string, format: uuid}, outcome: {type: string, enum: [ACCEPT, LOADED, DECLINED, POSTPONED]}, loadingPercent: {type: number, nullable: true}, decidedAt: {type: string, format: date-time}, decidedBy: {type: string} }

    PolicyIssuedPayload:
      description: >
        M7 Task 6 fix: PolicyApiImpl.issuePolicy's Map.of(...) has always published `premium` and
        `premiumFrequency` (billing.application.PolicyEventListener has consumed both since M4) --
        this schema declared neither, the same under-declaration class M5/M6 each corrected once
        already. Purely additive (both fields already existed on the wire); no schemaVersion bump.
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { policyNumber: {type: string}, policyholderPartyId: {type: string, format: uuid}, productId: {type: string, format: uuid}, productVersionId: {type: string, format: uuid}, sumAssured: {type: object}, issueDate: {type: string, format: date}, premium: {type: object}, premiumFrequency: {type: string}, agentOfRecordId: {type: string, format: uuid, nullable: true} }
    PolicyEndorsedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { policyNumber: {type: string}, endorsementType: {type: string}, effectiveDate: {type: string, format: date} }
    PolicyLapsedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { policyNumber: {type: string}, lapsedAt: {type: string, format: date-time} }
    PolicyReinstatedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { policyNumber: {type: string}, reinstatedAt: {type: string, format: date-time} }
    PolicySuspendedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { policyNumber: {type: string}, suspendedAt: {type: string, format: date-time}, reason: {type: string} }
    PolicyMaturedPayload:
      description: >
        Real producer as of M6 Task 2 (PolicyApiImpl.markMatured) -- fields below are exactly
        what that Map.of(...) publishes today. No netProceeds: the surrender/maturity
        loan-netting choreography (PolicyMaturityInitiated -> ... -> MaturityPayoutRequested)
        that would compute a net figure remains unimplemented, so this event fires standalone.
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { policyNumber: {type: string}, maturedAt: {type: string, format: date-time} }
    BeneficiaryChangedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { policyNumber: {type: string}, changedAt: {type: string, format: date-time} }
    SurrenderValueCalculatedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { policyNumber: {type: string}, quotedValue: {type: object}, quotedAt: {type: string, format: date-time} }
    PolicySurrenderInitiatedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { policyNumber: {type: string}, grossProceeds: {type: object} }
    PolicyMaturityInitiatedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { policyNumber: {type: string}, grossProceeds: {type: object} }
    PolicySurrenderedPayload:
      description: >
        Real producer as of M6 Task 2 (PolicyApiImpl.terminateForSettledClaim) -- fields below
        are exactly what that Map.of(...) publishes today. Despite the event name, this producer
        fires for a settled DEATH/DISABILITY/CRITICAL_ILLNESS claim, not a policyholder-initiated
        surrender; claimId is the correlating claims.claim_id. No netProceeds: the policyholder-
        surrender loan-netting choreography (PolicySurrenderInitiated -> ... ->
        SurrenderPayoutRequested) that would compute a net figure remains unimplemented.
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { policyNumber: {type: string}, claimId: {type: string, format: uuid}, surrenderedAt: {type: string, format: date-time} }
    SurrenderPayoutRequestedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { policyNumber: {type: string}, payeeRef: {type: string}, amount: {type: object}, idempotencyKey: {type: string} }
    MaturityPayoutRequestedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { policyNumber: {type: string}, payeeRef: {type: string}, amount: {type: object}, idempotencyKey: {type: string} }

    LoanOriginatedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { loanId: {type: string, format: uuid}, policyNumber: {type: string}, principalAmount: {type: object}, interestRate: {type: number}, originatedAt: {type: string, format: date-time} }
    LoanDisbursementRequestedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { loanId: {type: string, format: uuid}, payeeRef: {type: string}, amount: {type: object}, idempotencyKey: {type: string} }
    LoanDisbursedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { loanId: {type: string, format: uuid}, disbursedAt: {type: string, format: date-time}, amount: {type: object, required: [amount, currencyCode], properties: {amount: {type: string, description: "Plain-string decimal, e.g. \"12500.00\"."}, currencyCode: {type: string}}} }
    LoanRepaidPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          required: [loanTransactionId]
          properties:
            loanId: {type: string, format: uuid}
            loanTransactionId:
              type: string
              format: uuid
              description: "This ONE repayment's own loan_transaction id. Partial repayments repeat against a single loanId, so loanId alone cannot identify a repayment: finaccounting keys its journal-entry idempotency on THIS field, and keying it on loanId silently discarded every repayment after the first."
            amount:
              type: object
              required: [amount, currencyCode]
              properties:
                amount: {type: string, description: "Plain-string decimal, e.g. \"12500.00\"."}
                currencyCode: {type: string}
            repaidAt: {type: string, format: date-time}
            outstandingBalance:
              type: object
              required: [amount, currencyCode]
              properties:
                amount: {type: string, description: "Plain-string decimal, e.g. \"12500.00\"."}
                currencyCode: {type: string}
    LoanForcedLapseTriggeredPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { loanId: {type: string, format: uuid}, policyNumber: {type: string}, triggeredAt: {type: string, format: date-time} }
    LoanSettledForPayoutPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { policyNumber: {type: string}, loanId: {type: string, format: uuid, nullable: true}, settlementAmount: {type: object, description: "Zero if no active loan."} }

    PremiumInvoiceGeneratedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { invoiceId: {type: string, format: uuid}, policyNumber: {type: string}, dueDate: {type: string, format: date}, amount: {type: object} }
    PremiumCollectedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { invoiceId: {type: string, format: uuid}, policyNumber: {type: string}, amount: {type: object}, collectedAt: {type: string, format: date-time} }
    PremiumOverduePayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { invoiceId: {type: string, format: uuid}, policyNumber: {type: string}, daysOverdue: {type: integer} }
    GracePeriodTriggeredPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { invoiceId: {type: string, format: uuid}, policyNumber: {type: string}, graceEndsAt: {type: string, format: date} }
    GracePeriodExpiringPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { invoiceId: {type: string, format: uuid}, policyNumber: {type: string}, hoursRemaining: {type: integer} }
    PaymentRequestedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { invoiceId: {type: string, format: uuid}, payerRef: {type: string}, amount: {type: object}, idempotencyKey: {type: string} }
    PolicyLapseRecommendedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { policyNumber: {type: string}, invoiceId: {type: string, format: uuid}, recommendedAt: {type: string, format: date-time} }
    FieldReceiptCapturedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { receiptId: {type: string, format: uuid}, policyNumber: {type: string}, amount: {type: object}, capturedAt: {type: string, format: date-time}, agentId: {type: string, format: uuid} }
    FieldReceiptReconciliationOverduePayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { receiptId: {type: string, format: uuid}, policyNumber: {type: string}, overdueSince: {type: string, format: date-time} }

    ClaimRegisteredPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { claimId: {type: string, format: uuid}, policyNumber: {type: string}, claimantPartyId: {type: string, format: uuid}, claimType: {type: string, enum: [DEATH, DISABILITY, CRITICAL_ILLNESS, MATURITY]}, dateOfEvent: {type: string, format: date}, requiresContestabilityReview: {type: boolean, description: "True when the claim falls inside the contestability window (or the policy's underwriting case cannot be resolved -- fails closed) and therefore needs a non-disclosure review before approval."} }
    ClaimAssessedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { claimId: {type: string, format: uuid}, fraudIndicator: {type: boolean} }
    ClaimApprovedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { claimId: {type: string, format: uuid}, policyNumber: {type: string}, approvedAmount: {type: object} }
    ClaimRejectedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { claimId: {type: string, format: uuid}, reason: {type: string} }
    ClaimSettlementRequestedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          required: [claimId, payeeRef, amount, idempotencyKey]
          properties: { claimId: {type: string, format: uuid}, payeeRef: {type: string}, amount: {type: object, required: [amount, currencyCode], properties: {amount: {type: string, description: "Plain-string decimal, e.g. \"12500.00\"."}, currencyCode: {type: string}}}, idempotencyKey: {type: string, description: "M6: payment.PaymentRequestListener.handleClaimSettlement derives disbursement_instruction.purpose=CLAIM_SETTLEMENT and source_ref=claimId from this event; no purpose field is carried on the payload itself."} }
    ClaimSettledPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { claimId: {type: string, format: uuid}, policyNumber: {type: string}, settledAmount: {type: object, required: [amount, currencyCode], properties: {amount: {type: string, description: "Plain-string decimal, e.g. \"12500.00\"."}, currencyCode: {type: string}}}, settledAt: {type: string, format: date-time} }

    AgentOnboardedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { agentId: {type: string, format: uuid}, partyId: {type: string, format: uuid}, licenseNumber: {type: string} }
    AgentLicenseExpiringPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { agentId: {type: string, format: uuid}, expiresAt: {type: string, format: date} }
    CommissionAccruedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { statementId: {type: string, format: uuid}, agentId: {type: string, format: uuid}, policyNumber: {type: string}, amount: {type: object} }
    CommissionPayoutRequestedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { statementId: {type: string, format: uuid}, payeeRef: {type: string}, amount: {type: object}, idempotencyKey: {type: string} }
    CommissionPaidPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { statementId: {type: string, format: uuid}, paidAt: {type: string, format: date-time}, amount: {type: object, required: [amount, currencyCode], properties: {amount: {type: string, description: "Plain-string decimal, e.g. \"12500.00\"."}, currencyCode: {type: string}}} }

    # M5 final-review fix (I2). All four payloads below previously omitted sourceRef, purpose and
    # gatewayReference -- the ONLY correlation and routing fields a consumer has. This architecture
    # has zero compile-time coupling between producer and consumer (DomainEventEnvelope lives in the
    # root package and every payload is a Map<String, Object>, deliberately, so that payment needs no
    # module dependency in either direction), which means THIS FILE is the entire contract. A
    # consumer built from the declarations as they were could not have worked at all:
    # policyloan.application.PaymentEventListener routes on purpose ("LOAN_DISBURSEMENT") and
    # resolves its own aggregate from sourceRef, and billing's does the same with sourceRef -- both
    # fields the spec did not mention. claims (M6), distribution (M7) and finaccounting (M9) are all
    # listed as future consumers of these events and would each have hit the same wall.
    #
    # Mirrored field-for-field against the real producers in
    # payment/application/PaymentApiImpl.java (completeDisbursement / failDisbursement /
    # confirmCollection / failCollection), read rather than inferred. Purely ADDITIVE -- no field is
    # renamed, retyped or removed -- so no schemaVersion bump is required.
    #
    # Note deliberately NOT added here: any payload for C2's IN_DOUBT state. That is the whole point
    # of IN_DOUBT -- an indeterminate outcome publishes NO event at all, because publishing a
    # *Failed event for it is what caused policyloan to compensate for payouts that may have
    # succeeded. Its signal is the lifeplatform_payment_in_doubt_total metric plus an ERROR log
    # (observability/alert-rules.yml), not an event. Recorded explicitly so a future reader does not
    # "complete" this file by inventing a payment.DisbursementInDoubt event.
    PaymentConfirmedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties:
            paymentRequestId: {type: string, format: uuid}
            idempotencyKey: {type: string}
            # billing.application.PaymentEventListener resolves the invoice from this. It is the
            # requesting aggregate's own id as a string (invoiceId.toString()), NOT a uuid-formatted
            # field by contract -- payment stores it as an opaque VARCHAR(100) source_ref and never
            # parses it, so a future producer whose aggregate key is not a UUID still fits.
            sourceRef: {type: string}
            # The aggregator's own reference. Present on a confirmation; this is the durable proof
            # the rail took the money and the value the inbound webhook correlates redeliveries on.
            gatewayReference: {type: string}
            amount: {type: object}
            confirmedAt: {type: string, format: date-time}
    PaymentFailedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties:
            paymentRequestId: {type: string, format: uuid}
            idempotencyKey: {type: string}
            sourceRef: {type: string}
            reason: {type: string}
    DisbursementCompletedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties:
            disbursementId: {type: string, format: uuid}
            idempotencyKey: {type: string}
            sourceRef: {type: string}
            # The ROUTING field, and the reason a single event type can serve several requesting
            # modules without payment depending on any of them: every consumer must filter on it
            # (policyloan checks purpose == "LOAN_DISBURSEMENT" and returns otherwise) or it will
            # try to handle another module's payout. Values match
            # disbursement_instruction.purpose's CHECK constraint (db-migrations/payment/V1:54,
            # widened by V2 to add DIVIDEND_PAYOUT).
            purpose:
              type: string
              enum: [LOAN_DISBURSEMENT, CLAIM_SETTLEMENT, COMMISSION_PAYOUT, SURRENDER_PAYOUT, MATURITY_PAYOUT, DIVIDEND_PAYOUT]
            gatewayReference: {type: string}
            amount: {type: object}
            completedAt: {type: string, format: date-time}
    DisbursementFailedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties:
            disbursementId: {type: string, format: uuid}
            idempotencyKey: {type: string}
            sourceRef: {type: string}
            purpose:
              type: string
              enum: [LOAN_DISBURSEMENT, CLAIM_SETTLEMENT, COMMISSION_PAYOUT, SURRENDER_PAYOUT, MATURITY_PAYOUT, DIVIDEND_PAYOUT]
            # No gatewayReference here, matching the real producer: failDisbursement builds its
            # payload with Map.of(...) over disbursementId/idempotencyKey/sourceRef/purpose/reason
            # only. The rail's reference IS still persisted on the row when one was supplied (so a
            # redelivered failure notification can resolve its tenant), it is simply not part of
            # this event's payload -- declared as-is rather than as-wished.
            reason: {type: string}

    CessionRecordedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { cessionId: {type: string, format: uuid}, policyNumber: {type: string}, treatyId: {type: string, format: uuid}, cededAmount: {type: object, required: [amount, currencyCode], properties: {amount: {type: string, description: "Plain-string decimal, e.g. \"12500.00\"."}, currencyCode: {type: string}}}, cededPremium: {type: object, nullable: true, required: [amount, currencyCode], properties: {amount: {type: string, description: "Plain-string decimal, e.g. \"12500.00\"."}, currencyCode: {type: string}}} }
    RecoveryCalculatedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { recoveryId: {type: string, format: uuid}, claimId: {type: string, format: uuid}, treatyId: {type: string, format: uuid}, recoverableAmount: {type: object} }
    RecoveryConfirmedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { recoveryId: {type: string, format: uuid}, confirmedAt: {type: string, format: date-time}, amount: {type: object, required: [amount, currencyCode], properties: {amount: {type: string, description: "Plain-string decimal, e.g. \"12500.00\"."}, currencyCode: {type: string}}} }

    GlPostingRecordedPayload:
      description: >-
        GL posting is real as of M9 Task 5 (FinaccountingApiImpl.postEntry) -- only IFRS 17
        MEASUREMENT (CsmRolledForward, below) remains gated on C1. postEntry publishes exactly ONE
        event per journal ENTRY, not per posting/leg (every entry has exactly two legs, DR and CR,
        which must balance for the entry to post at all): postingId is the entry's own
        journalEntryId, amount is the entry's DR total (equal to its CR total by construction), and
        groupId is always null because IFRS 17's group-of-contracts unit of account is itself
        C1-blocked. Documented as what actually ships, not the per-posting shape this schema
        originally assumed before finaccounting's aggregate design existed.
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { postingId: {type: string, format: uuid, description: "The journal entry's id -- one event is published per entry, not per leg."}, groupId: {type: string, format: uuid, nullable: true, description: "Always null in M9: the IFRS 17 group-of-contracts unit of account is C1-blocked."}, period: {type: string}, amount: {type: object, required: [amount, currencyCode], properties: {amount: {type: string, description: "Plain-string decimal, e.g. \"12500.00\". The entry's DR total."}, currencyCode: {type: string}}}, postingType: {type: string, description: "The entry's sourceEvent, e.g. claims.ClaimSettled."} }
    CsmRolledForwardPayload:
      description: "Provisional — see above."
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { groupId: {type: string, format: uuid}, period: {type: string}, csmBalance: {type: object} }

    NotificationDispatchedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { dispatchId: {type: string, format: uuid}, partyId: {type: string, format: uuid}, channel: {type: string}, templateKey: {type: string} }
    NotificationFailedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { dispatchId: {type: string, format: uuid}, reason: {type: string} }

    DocumentUploadedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { documentRef: {type: string}, ownerContext: {type: string}, documentType: {type: string} }
