        - type: object
          properties: { statementId: {type: string, format: uuid}, paidAt: {type: string, format: date-time}, amount: {type: object, required: [amount, currencyCode], properties: {amount: {type: string, description: "Plain-string decimal, e.g. \"12500.00\"."}, currencyCode: {type: string}}} }

    # M5 final-review fix (I2). All four payloads below previously omitted sourceRef, purpose and
    # gatewayReference -- the ONLY correlation and routing fields a consumer has. This architecture
    # has zero compile-time coupling between producer and consumer (DomainEventEnvelope lives in the
    # root package and every payload is a Map<String, Object>, deliberately, so that payment needs no
    # module dependency in either direction), which means THIS FILE is the entire contract. A
    # consumer built from the declarations as they were could not have worked at all:
    # policyloan.application.PaymentEventListener routes on purpose ("LOAN_DISBURSEMENT") and
    # resolves its own aggregate from sourceRef, and billing's does the same with sourceRef -- both
    # fields the spec did not mention. claims (M6), distribution (M7) and finaccounting (M9) are all
    # listed as future consumers of these events and would each have hit the same wall.
    #
    # Mirrored field-for-field against the real producers in
    # payment/application/PaymentApiImpl.java (completeDisbursement / failDisbursement /
    # confirmCollection / failCollection), read rather than inferred. Purely ADDITIVE -- no field is
    # renamed, retyped or removed -- so no schemaVersion bump is required.
    #
    # Note deliberately NOT added here: any payload for C2's IN_DOUBT state. That is the whole point
    # of IN_DOUBT -- an indeterminate outcome publishes NO event at all, because publishing a
    # *Failed event for it is what caused policyloan to compensate for payouts that may have
    # succeeded. Its signal is the lifeplatform_payment_in_doubt_total metric plus an ERROR log
    # (observability/alert-rules.yml), not an event. Recorded explicitly so a future reader does not
    # "complete" this file by inventing a payment.DisbursementInDoubt event.
    PaymentConfirmedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties:
            paymentRequestId: {type: string, format: uuid}
            idempotencyKey: {type: string}
            # billing.application.PaymentEventListener resolves the invoice from this. It is the
            # requesting aggregate's own id as a string (invoiceId.toString()), NOT a uuid-formatted
            # field by contract -- payment stores it as an opaque VARCHAR(100) source_ref and never
            # parses it, so a future producer whose aggregate key is not a UUID still fits.
            sourceRef: {type: string}
            # The aggregator's own reference. Present on a confirmation; this is the durable proof
            # the rail took the money and the value the inbound webhook correlates redeliveries on.
            gatewayReference: {type: string}
            amount: {type: object}
            confirmedAt: {type: string, format: date-time}
            # Payment V9 (product step 3). Whose money this is: billing consumes PREMIUM (sourceRef
            # an invoice id), accumulation consumes ACCOUNT_TOP_UP (sourceRef a top-up id). Absent on
            # every confirmation published before V9, and read as PREMIUM. UL_TOP_UP (payment V14, unit-linked
            # U2): unitlinked consumes it, sourceRef a unit-linked top-up id.
            purpose: {type: string, enum: [PREMIUM, ACCOUNT_TOP_UP, UL_TOP_UP]}
            # The number the money came from (2026-10-02). Billing carries it onto
            # billing.PremiumCollected; a fixed-term deposit is paid back to it by default.
            payerRef: {type: string}
    PaymentFailedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties:
            paymentRequestId: {type: string, format: uuid}
            idempotencyKey: {type: string}
            sourceRef: {type: string}
            reason: {type: string}
            purpose: {type: string, enum: [PREMIUM, ACCOUNT_TOP_UP, UL_TOP_UP], description: "As on PaymentConfirmed"}
    EftDisbursementLedgerPayload:
      description: >
        One shape for both EFT ledger events, because they carry identical facts and differ only
        in which direction finaccounting posts them. Deliberately NARROWER than
        DisbursementCompletedPayload: no idempotencyKey and no gatewayReference, because the only
        consumer is the general ledger and neither is an accounting fact.
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties:
            disbursementId: {type: string, format: uuid}
            # The ROUTING field, as on DisbursementCompletedPayload. finaccounting posts only
            # CLAIM_SETTLEMENT: 2110 is a claims account, and an EFT raised for any other purpose
            # has no business landing in it. Today claims is the only publisher that asks for the
            # EFT rail, so the guard is unreachable -- it is there so that when a second one
            # appears the failure is a log line naming the unmapped purpose, not a silently
            # miscoded liability.
            purpose: {type: string}
            # The claimId, and the same sourceRef claims.ClaimSettled posts under -- so the
            # accrual, its reversal and the cash entry all reconcile to one claim.
            sourceRef: {type: string}
            amount: {type: object}
    DisbursementCompletedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties:
            disbursementId: {type: string, format: uuid}
            idempotencyKey: {type: string}
            sourceRef: {type: string}
            # The ROUTING field, and the reason a single event type can serve several requesting
            # modules without payment depending on any of them: every consumer must filter on it
            # (policyloan checks purpose == "LOAN_DISBURSEMENT" and returns otherwise) or it will
            # try to handle another module's payout. Values match
            # disbursement_instruction.purpose's CHECK constraint (db-migrations/payment/V1:54,
            # widened by V2 to add DIVIDEND_PAYOUT, by V8 for the payout engine's four, by V9
            # for a savings withdrawal, by V10-V12 for deposits, annuities and commutation, by V13
            # for unit-linked, and by V14 for a refunded unit-linked top-up).
            purpose:
              type: string
              enum: [LOAN_DISBURSEMENT, CLAIM_SETTLEMENT, COMMISSION_PAYOUT, SURRENDER_PAYOUT, MATURITY_PAYOUT,
                     DIVIDEND_PAYOUT, SURVIVAL_BENEFIT_PAYOUT, INCOME_PAYOUT, PREMIUM_RETURN_PAYOUT,
                     FREE_LOOK_REFUND, WITHDRAWAL_PAYOUT, DEPOSIT_MATURITY_PAYOUT, ANNUITY_PAYOUT,
                     COMMUTATION_PAYOUT, PRICE_CORRECTION_PAYOUT, LAPSE_SURRENDER_PAYOUT, TOP_UP_REFUND]
            gatewayReference: {type: string}
            amount: {type: object}
            completedAt: {type: string, format: date-time}
    DisbursementFailedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties:
            disbursementId: {type: string, format: uuid}
            idempotencyKey: {type: string}
            sourceRef: {type: string}
            purpose:
              type: string
              enum: [LOAN_DISBURSEMENT, CLAIM_SETTLEMENT, COMMISSION_PAYOUT, SURRENDER_PAYOUT, MATURITY_PAYOUT, DIVIDEND_PAYOUT]
            # No gatewayReference here, matching the real producer: failDisbursement builds its
            # payload with Map.of(...) over disbursementId/idempotencyKey/sourceRef/purpose/reason
            # only. The rail's reference IS still persisted on the row when one was supplied (so a
            # redelivered failure notification can resolve its tenant), it is simply not part of
            # this event's payload -- declared as-is rather than as-wished.
            reason: {type: string}

    CessionRecordedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { cessionId: {type: string, format: uuid}, policyNumber: {type: string}, treatyId: {type: string, format: uuid}, cededAmount: {type: object, required: [amount, currencyCode], properties: {amount: {type: string, description: "Plain-string decimal, e.g. \"12500.00\"."}, currencyCode: {type: string}}}, cededPremium: {type: object, nullable: true, required: [amount, currencyCode], properties: {amount: {type: string, description: "Plain-string decimal, e.g. \"12500.00\"."}, currencyCode: {type: string}}} }
    RecoveryCalculatedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { recoveryId: {type: string, format: uuid}, claimId: {type: string, format: uuid}, policyNumber: {type: string}, treatyId: {type: string, format: uuid}, reinsuranceGroup: {type: string, description: "IFRS 17 I5a: the reinsurance-held group, RI-<treaty short id>-<year>."}, recoverableAmount: {type: object, required: [amount, currencyCode], properties: {amount: {type: string, description: "Plain-string decimal, e.g. \"12500.00\"."}, currencyCode: {type: string}}} }
    StatementApprovedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          required: [statementId, treatyId, quarter, premium, commission, recoveries, fundsWithheld, profitCommission, owedToUs, owedByUs]
          properties: { statementId: {type: string, format: uuid}, treatyId: {type: string, format: uuid}, reinsuranceGroup: {type: string, description: "IFRS 17 I5a: RI-<treaty short id>-<year>."}, reinsurerName: {type: string}, quarter: {type: string, description: "YYYY-Qn"}, premium: {$ref: '#/components/schemas/StatementMoney'}, commission: {$ref: '#/components/schemas/StatementMoney'}, recoveries: {$ref: '#/components/schemas/StatementMoney'}, fundsWithheld: {$ref: '#/components/schemas/StatementMoney'}, profitCommission: {$ref: '#/components/schemas/StatementMoney'}, owedToUs: {$ref: '#/components/schemas/StatementMoney'}, owedByUs: {$ref: '#/components/schemas/StatementMoney'} }
    StatementMoney:
      type: object
      required: [amount, currencyCode]
      properties: {amount: {type: string, description: "Plain-string decimal, e.g. \"12500.00\"."}, currencyCode: {type: string}}
    BordereauPostedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          required: [bordereauId, treatyId, period, premium, commission]
          properties: { bordereauId: {type: string, format: uuid}, treatyId: {type: string, format: uuid}, reinsuranceGroup: {type: string, description: "IFRS 17 I5a: RI-<treaty short id>-<year>."}, reinsurerName: {type: string}, period: {type: string, description: "YYYY-MM"}, policyCount: {type: integer}, premium: {type: object, required: [amount, currencyCode], properties: {amount: {type: string, description: "Plain-string decimal, e.g. \"12500.00\"."}, currencyCode: {type: string}}}, commission: {type: object, required: [amount, currencyCode], properties: {amount: {type: string, description: "Plain-string decimal, e.g. \"12500.00\"."}, currencyCode: {type: string}}} }

    GlPostingRecordedPayload:
      description: >-
        GL posting is real as of M9 Task 5 (FinaccountingApiImpl.postEntry) -- only IFRS 17
        MEASUREMENT (CsmRolledForward, below) remains gated on C1. postEntry publishes exactly ONE
        event per journal ENTRY, not per posting/leg (every entry has exactly two legs, DR and CR,
        which must balance for the entry to post at all): postingId is the entry's own
        journalEntryId, amount is the entry's DR total (equal to its CR total by construction), and
        groupId is always null because IFRS 17's group-of-contracts unit of account is itself
        C1-blocked. Documented as what actually ships, not the per-posting shape this schema
        originally assumed before finaccounting's aggregate design existed.
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { postingId: {type: string, format: uuid, description: "The journal entry's id -- one event is published per entry, not per leg."}, groupId: {type: string, format: uuid, nullable: true, description: "Always null in M9: the IFRS 17 group-of-contracts unit of account is C1-blocked."}, period: {type: string}, amount: {type: object, required: [amount, currencyCode], properties: {amount: {type: string, description: "Plain-string decimal, e.g. \"12500.00\". The entry's DR total."}, currencyCode: {type: string}}}, postingType: {type: string, description: "The entry's sourceEvent, e.g. claims.ClaimSettled."} }
    CsmRolledForwardPayload:
      description: "Provisional — see above."
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { groupId: {type: string, format: uuid}, period: {type: string}, csmBalance: {type: object} }

    NotificationDispatchedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { dispatchId: {type: string, format: uuid}, partyId: {type: string, format: uuid}, channel: {type: string}, templateKey: {type: string} }
    NotificationFailedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { dispatchId: {type: string, format: uuid}, reason: {type: string} }

    DocumentUploadedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { documentRef: {type: string}, ownerContext: {type: string}, documentType: {type: string} }
