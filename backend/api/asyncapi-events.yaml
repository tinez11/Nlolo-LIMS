    PremiumOverdue: { messageId: PremiumOverdue, name: PremiumOverdue, payload: { $ref: '#/components/schemas/PremiumOverduePayload' } }
    GracePeriodTriggered: { messageId: GracePeriodTriggered, name: GracePeriodTriggered, payload: { $ref: '#/components/schemas/GracePeriodTriggeredPayload' } }
    GracePeriodExpiring: { messageId: GracePeriodExpiring, name: GracePeriodExpiring, payload: { $ref: '#/components/schemas/GracePeriodExpiringPayload' } }
    PaymentRequested: { messageId: PaymentRequested, name: PaymentRequested, payload: { $ref: '#/components/schemas/PaymentRequestedPayload' } }
    PolicyLapseRecommended: { messageId: PolicyLapseRecommended, name: PolicyLapseRecommended, payload: { $ref: '#/components/schemas/PolicyLapseRecommendedPayload' } }
    FieldReceiptCaptured: { messageId: FieldReceiptCaptured, name: FieldReceiptCaptured, payload: { $ref: '#/components/schemas/FieldReceiptCapturedPayload' } }
    FieldReceiptReconciliationOverdue: { messageId: FieldReceiptReconciliationOverdue, name: FieldReceiptReconciliationOverdue, payload: { $ref: '#/components/schemas/FieldReceiptReconciliationOverduePayload' } }
    FieldReceiptReconciled: { messageId: FieldReceiptReconciled, name: FieldReceiptReconciled, payload: { $ref: '#/components/schemas/FieldReceiptReconciledPayload' } }
    ClaimRegistered: { messageId: ClaimRegistered, name: ClaimRegistered, payload: { $ref: '#/components/schemas/ClaimRegisteredPayload' } }
    ClaimAssessed: { messageId: ClaimAssessed, name: ClaimAssessed, payload: { $ref: '#/components/schemas/ClaimAssessedPayload' } }
    ClaimApproved: { messageId: ClaimApproved, name: ClaimApproved, payload: { $ref: '#/components/schemas/ClaimApprovedPayload' } }
    ClaimRejected: { messageId: ClaimRejected, name: ClaimRejected, payload: { $ref: '#/components/schemas/ClaimRejectedPayload' } }
    ClaimSettlementRequested: { messageId: ClaimSettlementRequested, name: ClaimSettlementRequested, payload: { $ref: '#/components/schemas/ClaimSettlementRequestedPayload' } }
    ClaimSettled: { messageId: ClaimSettled, name: ClaimSettled, payload: { $ref: '#/components/schemas/ClaimSettledPayload' } }
    AgentOnboarded: { messageId: AgentOnboarded, name: AgentOnboarded, payload: { $ref: '#/components/schemas/AgentOnboardedPayload' } }
    AgentLicenseExpiring: { messageId: AgentLicenseExpiring, name: AgentLicenseExpiring, payload: { $ref: '#/components/schemas/AgentLicenseExpiringPayload' } }
    CommissionAccrued: { messageId: CommissionAccrued, name: CommissionAccrued, payload: { $ref: '#/components/schemas/CommissionAccruedPayload' } }
    CommissionPayoutRequested: { messageId: CommissionPayoutRequested, name: CommissionPayoutRequested, payload: { $ref: '#/components/schemas/CommissionPayoutRequestedPayload' } }
    CommissionPaid: { messageId: CommissionPaid, name: CommissionPaid, payload: { $ref: '#/components/schemas/CommissionPaidPayload' } }
    PaymentConfirmed: { messageId: PaymentConfirmed, name: PaymentConfirmed, payload: { $ref: '#/components/schemas/PaymentConfirmedPayload' } }
    PaymentFailed: { messageId: PaymentFailed, name: PaymentFailed, payload: { $ref: '#/components/schemas/PaymentFailedPayload' } }
    DisbursementCompleted: { messageId: DisbursementCompleted, name: DisbursementCompleted, payload: { $ref: '#/components/schemas/DisbursementCompletedPayload' } }
    DisbursementFailed: { messageId: DisbursementFailed, name: DisbursementFailed, payload: { $ref: '#/components/schemas/DisbursementFailedPayload' } }
    EftDisbursementAwaitingExecution: { messageId: EftDisbursementAwaitingExecution, name: EftDisbursementAwaitingExecution, payload: { $ref: '#/components/schemas/EftDisbursementLedgerPayload' } }
    EftDisbursementExecuted: { messageId: EftDisbursementExecuted, name: EftDisbursementExecuted, payload: { $ref: '#/components/schemas/EftDisbursementLedgerPayload' } }
    CessionRecorded: { messageId: CessionRecorded, name: CessionRecorded, payload: { $ref: '#/components/schemas/CessionRecordedPayload' } }
    RecoveryCalculated: { messageId: RecoveryCalculated, name: RecoveryCalculated, payload: { $ref: '#/components/schemas/RecoveryCalculatedPayload' } }
    BordereauPosted: { messageId: BordereauPosted, name: BordereauPosted, payload: { $ref: '#/components/schemas/BordereauPostedPayload' } }
    StatementApproved: { messageId: StatementApproved, name: StatementApproved, payload: { $ref: '#/components/schemas/StatementApprovedPayload' } }
    GlPostingRecorded: { messageId: GlPostingRecorded, name: GlPostingRecorded, payload: { $ref: '#/components/schemas/GlPostingRecordedPayload' } }
    CsmRolledForward: { messageId: CsmRolledForward, name: CsmRolledForward, payload: { $ref: '#/components/schemas/CsmRolledForwardPayload' } }
    NotificationDispatched: { messageId: NotificationDispatched, name: NotificationDispatched, payload: { $ref: '#/components/schemas/NotificationDispatchedPayload' } }
    NotificationFailed: { messageId: NotificationFailed, name: NotificationFailed, payload: { $ref: '#/components/schemas/NotificationFailedPayload' } }
    DocumentUploaded: { messageId: DocumentUploaded, name: DocumentUploaded, payload: { $ref: '#/components/schemas/DocumentUploadedPayload' } }

    UnitLinkedEvent: { messageId: UnitLinkedEvent, name: UnitLinkedEvent, payload: { $ref: '#/components/schemas/UnitLinkedEventPayload' } }
  schemas:
    InvoiceWaivedPayload:
      type: object
      required: [invoiceId, policyNumber, reason, waivedBy, amount]
      properties:
        invoiceId: { type: string, format: uuid }
        policyNumber: { type: string }
        reason: { type: string }
        waivedBy: { type: string, description: "A user, or system for a waiver the platform made" }
        amount:
          type: object
          description: The amount still outstanding when it was waived
          required: [amount, currencyCode]
          properties:
            amount: { type: string, description: Decimal string }
            currencyCode: { type: string }
    UnitLinkedEventPayload:
      type: object
      description: Product step 6. Always carries policyNumber (except PriceApproved and FundRevalued, which carry fundCode) and sourceRef; money as decimal strings with currencyCode.
      additionalProperties: true
    EventEnvelopeMeta:
      type: object
      description: >
        Common to every message below (Deliverable 2's DomainEventEnvelope<T>), shown
        once here rather than repeated per schema. sequenceNumber is new in this
        deliverable — a per-aggregate monotonic counter assigned by the producer within
        the same transaction as the state change, letting ordering-sensitive consumers
        (finaccounting, audit) detect and buffer out-of-order delivery.
      properties:
        eventId: { type: string, format: uuid }
        eventType: { type: string, description: "e.g. policy.PolicyIssued" }
        schemaVersion: { type: integer, default: 1 }
        tenantId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        sequenceNumber: { type: integer, description: "Monotonic per aggregate (e.g. per policyNumber), not global." }
      required: [eventId, eventType, schemaVersion, tenantId, occurredAt]

    PartyRegisteredPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { partyId: {type: string, format: uuid}, partyType: {type: string, enum: [INDIVIDUAL, CORPORATE, GROUP]} }
    PartyKycStatusChangedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { partyId: {type: string, format: uuid}, previousStatus: {type: string}, newStatus: {type: string}, evidenceDocumentRef: {type: string} }
    PartyDetailsUpdatedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { partyId: {type: string, format: uuid}, changedFields: {type: array, items: {type: string}} }

    ProductDefinitionPublishedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { productId: {type: string, format: uuid}, productVersionId: {type: string, format: uuid}, effectiveDate: {type: string, format: date}, ifrsMeasurementModel: {type: string, enum: [GMM, PAA]} }
    ProductVersionRetiredPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { productId: {type: string, format: uuid}, productVersionId: {type: string, format: uuid}, retirementDate: {type: string, format: date} }

    UnderwritingCaseOpenedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { caseId: {type: string, format: uuid}, applicantPartyId: {type: string, format: uuid}, productId: {type: string, format: uuid}, productVersionId: {type: string, format: uuid} }
    UnderwritingDecisionMadePayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          # decidedBy is new: until the decision became an explicit human act there was nobody
          # to name. The engine decided every case, and decision_decided_by did not exist.
          # Nullable on nothing -- every event published from here carries an author, because
          # decide(...) cannot be reached without one.
          properties: { caseId: {type: string, format: uuid}, outcome: {type: string, enum: [ACCEPT, LOADED, DECLINED, POSTPONED]}, loadingPercent: {type: number, nullable: true}, decidedAt: {type: string, format: date-time}, decidedBy: {type: string} }

    PolicyIssuedPayload:
      description: >
        M7 Task 6 fix: PolicyApiImpl.issuePolicy's Map.of(...) has always published `premium` and
        `premiumFrequency` (billing.application.PolicyEventListener has consumed both since M4) --
        this schema declared neither, the same under-declaration class M5/M6 each corrected once
        already. Purely additive (both fields already existed on the wire); no schemaVersion bump.


        `status` is new with offer notifications, and it is genuinely new on the wire rather than
        another under-declaration. It exists because a consumer has to distinguish an OFFER from
        an issuance that is already in force: a MIGRATION/CONVERSION/REINSTATEMENT basis publishes
        PolicyIssued and PolicyActivated together, and telling that customer to "pay by DATE to
        start your cover" would be false -- they are insured now. communication may not depend on
        policy, so it cannot look the status up; carrying it is the only way it can tell the two
        apart. PROPOSED for ordinary new business, ACTIVE otherwise, and always present so no
        consumer has to treat an absent key as a third case.

        agentOfRecordId is the RESOLVED agent -- the one written on the policy -- not the value
        the issue request carried. The two are not always the same: where an agent registered
        the policyholder, that agent is bound at issuance and whatever the caller supplied is
        discarded. This event used to announce the caller's value while PolicyActivated carried
        the resolved one, so the platform published two different answers to "who sold this
        policy" and the wrong one was on the earlier, more obvious event to consume. Null still
        means a direct sale.
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { policyNumber: {type: string}, policyholderPartyId: {type: string, format: uuid}, productId: {type: string, format: uuid}, productVersionId: {type: string, format: uuid}, sumAssured: {type: object}, issueDate: {type: string, format: date}, premium: {type: object}, premiumFrequency: {type: string}, agentOfRecordId: {type: string, format: uuid, nullable: true}, status: {type: string, enum: [PROPOSED, ACTIVE]} }
    PolicyActivatedPayload:
      description: >
        The union of what distribution's, reinsurance's and regreporting's handlers actually read,
        checked against each handler rather than assumed from the producer -- which is how the
        omission of issueDate was caught before this event had a single consumer.

        issueDate and activatedAt are both present and are different dates: the contract was
        issued when the offer was made, and went on risk when the money arrived. Consumers that
        date a treaty, a surrender-charge band or a clawback window want the former.
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { policyNumber: {type: string}, policyholderPartyId: {type: string, format: uuid}, productId: {type: string, format: uuid}, productVersionId: {type: string, format: uuid}, sumAssured: {type: object}, premium: {type: object}, premiumFrequency: {type: string}, issueDate: {type: string, format: date}, agentOfRecordId: {type: string, format: uuid, nullable: true}, activatedAt: {type: string, format: date} }
    PolicyNotTakenUpPayload:
      description: >
        policyholderPartyId is load-bearing rather than convenient: communication is the consumer
        this event exists for, it may not depend on policy, and an event naming only the contract
        would reach it with nobody to tell.
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { policyNumber: {type: string}, policyholderPartyId: {type: string, format: uuid}, productId: {type: string, format: uuid}, expiredAt: {type: string, format: date} }
    PolicyEndorsedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { policyNumber: {type: string}, endorsementType: {type: string}, effectiveDate: {type: string, format: date} }
    PolicyLapsedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties:
            policyNumber: {type: string}
            lapsedAt: {type: string, format: date-time}
            # Product step 3, both optional and present only on an exhaustion lapse: an ACCOUNT
            # policy whose savings account could no longer pay its own monthly fee.
            reason: {type: string, enum: [ACCOUNT_EXHAUSTED]}
            exhaustedOn: {type: string, format: date}
    PolicyReinstatedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { policyNumber: {type: string}, reinstatedAt: {type: string, format: date-time} }
    PremiumRestatedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          required: [policyNumber, policyholderPartyId, productVersionId, premiumAmount, effectiveFrom, reason]
          properties:
            policyNumber: { type: string }
            policyholderPartyId: { type: string, format: uuid }
            productVersionId: { type: string, format: uuid }
            premiumAmount:
              type: object
              properties:
                amount: { type: string }
                currencyCode: { type: string }
            effectiveFrom: { type: string, format: date, description: "The next premium date: the first instalment at the new amount" }
            reason: { type: string }
    CoveredLifePayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          required: [policyNumber, policyholderPartyId, coveredLifeId, fullName, role]
          properties:
            policyNumber: { type: string }
            policyholderPartyId: { type: string, format: uuid }
            coveredLifeId: { type: string, format: uuid }
            fullName: { type: string }
            role: { type: string, enum: [MAIN_MEMBER, SPOUSE, CHILD, PARENT, EXTENDED] }
            coverStart: { type: string, format: date, description: "CoveredLifeAdded only" }
            endReason: { type: string, description: "CoveredLifeEnded only" }
            endedOn: { type: string, format: date, description: "CoveredLifeEnded only" }
    PremiumsEndedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          required: [policyNumber, after, reason]
          properties:
            policyNumber: { type: string }
            after: { type: string, format: date, description: "No instalment due after this date is owed" }
            reason: { type: string }
    PolicyholderChangedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          required: [policyNumber, previousPartyId, policyholderPartyId]
          properties:
            policyNumber: { type: string }
            previousPartyId: { type: string, format: uuid }
            policyholderPartyId: { type: string, format: uuid }
    PremiumInvoiceRestatedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          required: [restatementId, invoiceId, policyNumber, dueDate, reason, amount]
          properties:
            restatementId: { type: string, format: uuid, description: "One per restatement of one instalment: the ledger's idempotency key" }
            invoiceId: { type: string, format: uuid }
            policyNumber: { type: string }
            dueDate: { type: string, format: date }
            reason: { type: string }
            amount:
              type: object
              description: The difference, always positive; the event type says which way it moved.
              properties:
                amount: { type: string }
                currencyCode: { type: string }
    PolicySuspendedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { policyNumber: {type: string}, suspendedAt: {type: string, format: date-time}, reason: {type: string} }
    PolicyMaturedPayload:
      description: >
        Real producer as of M6 Task 2 (PolicyApiImpl.markMatured) -- fields below are exactly
        what that Map.of(...) publishes today. No netProceeds: the surrender/maturity
        loan-netting choreography (PolicyMaturityInitiated -> ... -> MaturityPayoutRequested)
        that would compute a net figure remains unimplemented, so this event fires standalone.
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { policyNumber: {type: string}, maturedAt: {type: string, format: date-time} }
    BeneficiaryChangedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { policyNumber: {type: string}, changedAt: {type: string, format: date-time} }
    SurrenderValueCalculatedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { policyNumber: {type: string}, quotedValue: {type: object}, quotedAt: {type: string, format: date-time} }
    PolicySurrenderInitiatedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { policyNumber: {type: string}, grossProceeds: {type: object} }
    PolicyMaturityInitiatedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { policyNumber: {type: string}, grossProceeds: {type: object} }
    PolicySurrenderedPayload:
      description: >
        Real producer as of M6 Task 2 (PolicyApiImpl.terminateForSettledClaim) -- fields below
        are exactly what that Map.of(...) publishes today. Despite the event name, this producer
        fires for a settled DEATH/DISABILITY/CRITICAL_ILLNESS claim, not a policyholder-initiated
        surrender; claimId is the correlating claims.claim_id. No netProceeds: the policyholder-
        surrender loan-netting choreography (PolicySurrenderInitiated -> ... ->
        SurrenderPayoutRequested) that would compute a net figure remains unimplemented.
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { policyNumber: {type: string}, claimId: {type: string, format: uuid}, surrenderedAt: {type: string, format: date-time} }
    PolicyCancelledFreeLookPayload:
      description: >
        cancelledBy is the APPROVER's subject, not the person who prepared the cancellation --
        two people are involved and this names the one who released the money.
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties: { policyNumber: {type: string}, cancelledAt: {type: string, format: date-time}, cancelledBy: {type: string} }
    PayoutRequestedPayload:
      description: >
        Exactly one of instalmentId and cancellationId is present -- see the channel description.
        amount is {amount, currencyCode}, a decimal STRING and never a JSON number, like every
        other money figure on this platform.
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties:
            instalmentId: {type: string, format: uuid}
            cancellationId: {type: string, format: uuid}
            idempotencyKey: {type: string}
            policyNumber: {type: string}
            payeeRef: {type: string}
            purpose: {type: string, enum: [MATURITY_PAYOUT, SURVIVAL_BENEFIT_PAYOUT, INCOME_PAYOUT, PREMIUM_RETURN_PAYOUT, FREE_LOOK_REFUND]}
            amount: {type: object, properties: {amount: {type: string}, currencyCode: {type: string}}}
    PayoutPaidPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties:
            instalmentId: {type: string, format: uuid}
            policyNumber: {type: string}
            kind: {type: string, enum: [SURVIVAL, MATURITY, INCOME, RETURN_OF_PREMIUM]}
            paidAmount: {type: object, properties: {amount: {type: string}, currencyCode: {type: string}}}
    StatementIssuedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties:
            statementId: {type: string, format: uuid}
            policyNumber: {type: string}
            policyholderPartyId: {type: string, format: uuid}
            periodFrom: {type: string, format: date}
            periodTo: {type: string, format: date}
            closingBalance: {type: object, properties: {amount: {type: string}, currencyCode: {type: string}}}
            interestCredited: {type: object, properties: {amount: {type: string}, currencyCode: {type: string}}}
            annual: {type: boolean, description: "True only from the annual run -- the SMS is sent only then"}
    DepositMaturedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          required: [policyNumber, periodId, outcome, interest]
          properties:
            policyNumber: {type: string}
            periodId: {type: string, format: uuid}
            outcome: {type: string, enum: [REINVESTED, PAID_OUT, AWAITING_PAYEE]}
            interest: {type: string, description: "The term's interest, posted at maturity (decimal string)"}
            nextPeriodId: {type: string, format: uuid, description: "Only when reinvested"}
    AccountSurrenderApprovedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties:
            surrenderRequestId: {type: string, format: uuid}
            policyNumber: {type: string}
            payeeRef: {type: string}
            surrenderChargePercent: {type: string, description: "Decimal string, from the version's own schedule"}
            approvedBy: {type: string}
            approvedAt: {type: string, format: date-time}
    AccountPayoutRequestedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties:
            purpose: {type: string, enum: [WITHDRAWAL_PAYOUT, SURRENDER_PAYOUT, DEPOSIT_MATURITY_PAYOUT]}
            sourceRef: {type: string, description: "The withdrawal id, the surrender request id, or a matured deposit's '<periodId>:<attempt>'"}
            idempotencyKey: {type: string}
            policyNumber: {type: string}
            payeeRef: {type: string}
            amount: {type: object, properties: {amount: {type: string}, currencyCode: {type: string}}}
    TopUpRequestedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties:
            topUpId: {type: string, format: uuid}
            idempotencyKey: {type: string}
            policyNumber: {type: string}
            payerRef: {type: string}
            amount: {type: object, properties: {amount: {type: string}, currencyCode: {type: string}}}
    PostingRecordedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties:
            postingId: {type: string, format: uuid}
            policyNumber: {type: string}
            sourceType: {type: string, description: "invoice, month-end, withdrawal, surrender, instalment, claim, ..."}
            sourceRef: {type: string, description: "Unique per sourceType within a tenant: one source, one posting"}
            createdBy: {type: string}
            approvedBy: {type: string, description: "Empty when no second person signed"}
            entries:
              type: array
              items:
                type: object
                properties:
                  seq: {type: integer}
                  type: {type: string}
                  amount: {type: string, description: "Signed decimal string"}
                  balanceAfter: {type: string}
                  effectiveDate: {type: string, format: date}
    BonusEntryRecordedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties:
            policyNumber: {type: string}
            seq: {type: integer}
            type: {type: string, enum: [REVERSIONARY, REVERSAL]}
            amount: {type: object, description: "Signed: a reversal is negative", properties: {amount: {type: string}, currencyCode: {type: string}}}
            totalAfter: {type: object, properties: {amount: {type: string}, currencyCode: {type: string}}}
            effectiveDate: {type: string, format: date, description: "A declaration's valuation date; a reversal's own date"}
            sourceRef: {type: string, description: "declaration:<id>:<policy> or reversal:<entry id> -- one source, one entry"}
    GroupMemberAddedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
          properties:
            policyNumber: {type: string}
            # Explicitly null for a FREEFORM member rather than omitted, so a consumer can tell
            # "this life is not a party" from "this producer forgot". Every credit-life borrower
            # enrolled from a lender's file is FREEFORM.
            memberPartyId: {type: [string, "null"], format: uuid}
            memberType: {type: string, enum: [PARTY, FREEFORM]}
            memberName: {type: [string, "null"]}
            joinedOn: {type: string, format: date}
            coveredAmount: {type: object}
            underwritingStatus: {type: string}
            # The scheme's total AFTER this member. regreporting's whole input: it projects the
            # delta between this and the total it last recorded.
            schemeTotalCovered: {type: object}
    AgentOfRecordChangedPayload:
      type: object
      required: [policyNumber, reason, changedBy]
      properties:
        policyNumber: { type: string }
        previousAgentOfRecordId: { type: [string, "null"], format: uuid }
        agentOfRecordId:
          type: [string, "null"]
          format: uuid
          description: Null means the scheme is now direct -- nobody earns on its next file.
        reason: { type: string }
        changedBy: { type: string }
    GroupMemberExitedPayload:
      description: >
        reason is CLAIM_SETTLED for every occurrence today. The field exists anyway because a
        leaver and a death are different facts about the same row, and a consumer must not have
        to guess which one it saw -- an exit API for ordinary leavers is a later build and will
        publish the same event with a different reason. schemeTotalCovered is the scheme total
        AFTER this member came off it.
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeMeta'
        - type: object
