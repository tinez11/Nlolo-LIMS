openapi: 3.1.0
info:
  title: Audit Event Journal API
  version: "1.0.0"
  description: >
    External REST surface of the `audit` module. The 16th spec on this platform, and
    the module's first: `audit` has held a domain API since M1 and has recorded every
    domain event since, with no way to read it from outside.


    READ WHAT THIS IS. `audit.audit_log` records
    `(event_id, event_type, schema_version, sequence_number, occurred_at, recorded_at,
    payload)` and is written by `DomainEventAuditListener` on every published domain
    event. There is NO actor column, and no before/after values and no reason. So this
    endpoint answers "what happened in this tenant, in order". It does NOT answer "who
    did it and why".


    That matters because a compliance screen wants actor, action, record, before,
    after and reason -- and five of those six exist nowhere on this platform. Any UI
    built over this must say what it is rather than presenting an event feed as
    compliance evidence. Closing the gap means either carrying actor identity in every
    domain event payload or building a second mechanism beside this journal; it is
    recorded as an open item in the M13 design spec, not solved here.


    `payloadJson` is returned RAW and unparsed, deliberately: the payload shape varies
    per event type across forty-odd events, and normalising it here would be a
    translation layer nobody has specified.


    Operational note carried from `V1__create_audit_schema.sql`: this table is
    PARTITIONED BY RANGE (occurred_at) with monthly partitions, and it is the
    highest-volume table on the platform. An unbounded query scans every partition --
    callers are expected to bound `from`/`to`. Retention is an open compliance
    decision, still unresolved.
servers:
  - url: https://api.nlolo-lifeplatform.tz/v1
paths:
  /audit-log:
    get:
      summary: The tenant's domain-event journal, newest first (paged)
      description: >-
        Staff only. Tenant-scoped by the validated JWT, with Postgres RLS as the
        backstop.


        `eventTypePrefix` filters by module, since `eventType` is `module.EventName` --
        `policy.` returns every policy event. Both date bounds are optional and both
        are inclusive.
      security:
        - staffAuth: []
      parameters:
        - name: eventTypePrefix
          in: query
          description: Prefix match on eventType, e.g. `policy.` or `claims.ClaimSettled`.
          schema: { type: string }
        - name: from
          in: query
          description: Inclusive lower bound on occurredAt.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Inclusive upper bound on occurredAt.
          schema: { type: string, format: date-time }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEntryView' }
                  page: { $ref: 'openapi-common.yaml#/components/schemas/PageMeta' }
        '401': { $ref: 'openapi-common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
  /activity:
    get:
      summary: The activity log -- who did what, when, to what, and how it ended (paged, newest first)
      description: >-
        2026-11-14. One line per write a signed-in person made, and one `SYSTEM` line per business event no person's
        action raised (scheduled runs, and everything recorded before the log existed). Events an action raised are
        not lines of their own: they are counted on its line and listed when it is opened. Personal numbers in a
        line are masked. Holders of `audit.view` only. Dates default to the last seven days.
      security:
        - staffAuth: []
      parameters:
        - $ref: '#/components/parameters/ActivityPerson'
        - $ref: '#/components/parameters/ActivityRecordType'
        - $ref: '#/components/parameters/ActivityRecordId'
        - $ref: '#/components/parameters/ActivityQ'
        - $ref: '#/components/parameters/ActivityKind'
        - $ref: '#/components/parameters/ActivityOutcome'
        - $ref: '#/components/parameters/ActivityFrom'
        - $ref: '#/components/parameters/ActivityTo'
        - name: page
          in: query
          schema: { type: integer, minimum: 0 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityPage' }
        '401': { $ref: 'openapi-common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
  /activity/people:
    get:
      summary: Everyone who has acted in this tenant, for the person filter
      security:
        - staffAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ActivityPerson' }
        '401': { $ref: 'openapi-common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
  /activity/{activityId}:
    get:
      summary: One line opened -- what changed, what followed, and the technical detail
      description: >-
        The line, unmasked; each field sent, with the value it had before where an earlier change to the same record
        carried it; the business events the action raised; and the route, status and body as recorded (secrets are
        never recorded).
      security:
        - staffAuth: []
      parameters:
        - name: activityId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityDetail' }
        '401': { $ref: 'openapi-common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
  /activity.csv:
    get:
      summary: The filtered activity log as a CSV file (at most 10,000 lines)
      security:
        - staffAuth: []
      parameters:
        - $ref: '#/components/parameters/ActivityPerson'
        - $ref: '#/components/parameters/ActivityRecordType'
        - $ref: '#/components/parameters/ActivityRecordId'
        - $ref: '#/components/parameters/ActivityQ'
        - $ref: '#/components/parameters/ActivityKind'
        - $ref: '#/components/parameters/ActivityOutcome'
        - $ref: '#/components/parameters/ActivityFrom'
        - $ref: '#/components/parameters/ActivityTo'
      responses:
        '200':
          description: 'Columns: When, Who, Did, Record, Amount, Outcome, Reason. Personal numbers masked.'
          content:
            text/csv:
              schema: { type: string }
        '401': { $ref: 'openapi-common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
components:
  parameters:
    ActivityPerson:
      name: person
      in: query
      description: The subject of the person who acted, or `SYSTEM`.
      schema: { type: string }
    ActivityRecordType:
      name: recordType
      in: query
      description: 'policy, client, claim, agent, scheme, staff user, product, underwriting case, ... Needs recordId.'
      schema: { type: string }
    ActivityRecordId:
      name: recordId
      in: query
      schema: { type: string }
    ActivityQ:
      name: q
      in: query
      description: Words to find in the record's name or number, or the action.
      schema: { type: string }
    ActivityKind:
      name: kind
      in: query
      schema: { $ref: '#/components/schemas/ActivityKind' }
    ActivityOutcome:
      name: outcome
      in: query
      schema: { $ref: '#/components/schemas/ActivityOutcome' }
    ActivityFrom:
      name: from
      in: query
      schema: { type: string, format: date-time }
    ActivityTo:
      name: to
      in: query
      schema: { type: string, format: date-time }
  securitySchemes:
    customersAuth:
      type: openIdConnect
      openIdConnectUrl: https://iam.nlolo-lifeplatform.tz/realms/lifeplatform/.well-known/openid-configuration
    agentsAuth:
      type: openIdConnect
      openIdConnectUrl: https://iam.nlolo-lifeplatform.tz/realms/lifeplatform/.well-known/openid-configuration
    staffAuth:
      type: openIdConnect
      openIdConnectUrl: https://iam.nlolo-lifeplatform.tz/realms/lifeplatform/.well-known/openid-configuration
    regulatorsAuth:
      type: openIdConnect
      openIdConnectUrl: https://iam.nlolo-lifeplatform.tz/realms/lifeplatform/.well-known/openid-configuration
  schemas:
    ActivityKind:
      type: string
      enum: [claims, money, policies, people, products, settings, other]
    ActivityOutcome:
      type: string
      enum: [DONE, REFUSED, FAILED]
    ActivityActorKind:
      type: string
      enum: [STAFF, AGENT, CUSTOMER, SYSTEM]
    ActivityPerson:
      type: object
      additionalProperties: false
      required: [subject, name]
      properties:
        subject: { type: string }
        name: { type: [string, 'null'] }
    ActivityLine:
      description: >-
        One action, or one business event no action raised (actorKind SYSTEM, label = the event type, id = the
        event's id, eventCount 0).
      type: object
      additionalProperties: false
      required: [id, occurredAt, actorSubject, actorName, actorKind, label, kind, recordType, recordId, recordLabel,
                 amount, outcome, reason, eventCount]
      properties:
        id: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        actorSubject:
          type: [string, 'null']
          description: Who acted, as the person filter takes it; null on a SYSTEM line.
        actorName: { type: [string, 'null'] }
        actorKind: { $ref: '#/components/schemas/ActivityActorKind' }
        label: { type: string }
        kind: { $ref: '#/components/schemas/ActivityKind' }
        recordType: { type: [string, 'null'] }
        recordId: { type: [string, 'null'] }
        recordLabel: { type: [string, 'null'] }
        amount:
          anyOf:
            - type: 'null'
            - $ref: 'openapi-common.yaml#/components/schemas/Money'
        outcome: { $ref: '#/components/schemas/ActivityOutcome' }
        reason:
          type: [string, 'null']
          description: The words the person saw, on a refused action.
        eventCount: { type: integer, minimum: 0 }
    ActivityPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ActivityLine' }
        page: { $ref: 'openapi-common.yaml#/components/schemas/PageMeta' }
    ActivityChange:
      type: object
      additionalProperties: false
      required: [field, before, after]
      properties:
        field: { type: string }
        before:
          type: [string, 'null']
          description: Null when no earlier change to this record carried the field.
        after: { type: [string, 'null'] }
    ActivityEvent:
      description: A business event the action raised -- the same shape a dashboard's recent activity uses.
      type: object
      additionalProperties: false
      required: [eventType, occurredAt, refs, amount]
      properties:
        eventType: { type: string }
        occurredAt: { type: string, format: date-time }
        refs:
          type: object
          additionalProperties: { type: string }
        amount:
          anyOf:
            - type: 'null'
            - $ref: 'openapi-common.yaml#/components/schemas/Money'
    ActivityTechnical:
      type: object
      additionalProperties: false
      required: [method, route, statusCode, body]
      properties:
        method: { type: [string, 'null'] }
        route: { type: [string, 'null'] }
        statusCode: { type: [integer, 'null'] }
        body:
          type: [string, 'null']
          description: The body as recorded (secrets never are), or a SYSTEM line's event payload.
    ActivityDetail:
      type: object
      additionalProperties: false
      required: [line, changes, events, technical]
      properties:
        line: { $ref: '#/components/schemas/ActivityLine' }
        changes:
          type: array
          items: { $ref: '#/components/schemas/ActivityChange' }
        events:
          type: array
          items: { $ref: '#/components/schemas/ActivityEvent' }
        technical: { $ref: '#/components/schemas/ActivityTechnical' }
    AuditEntryView:
      description: >-
        One recorded domain event. Note what is absent: no actor, no before/after, no
        reason -- this is an event journal, not a who-did-what trail.
      type: object
      required: [eventId, eventType, occurredAt, payloadJson]
      properties:
        eventId: { type: string, format: uuid }
        eventType:
          type: string
          description: '`module.EventName`, e.g. `policy.PolicyIssued`.'
          example: policy.PolicyIssued
        occurredAt: { type: string, format: date-time }
        payloadJson:
          type: string
          description: >-
            The event's own JSON payload, RAW and unparsed as a string. Its shape
            varies per eventType; this endpoint does not normalise it.
