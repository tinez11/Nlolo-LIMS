openapi: 3.1.0
info:
  title: Benefit Payouts API
  version: "0.1.0-draft"
  description: >
    External REST surface of the `benefitpayout` module — the guide's "tap" (§21.4): money the
    insurer pays OUT while the life assured is still alive. A maturity benefit, the survival
    benefits of a money-back plan, an income stream, and a premium return on a return-of-premium
    term policy. A policy's whole schedule is stored at issue (§16), and each instalment is brought
    due by a scheduled drain, reviewed by one person and approved by another before any money moves.
servers:
  - url: https://api.nlolo-lifeplatform.tz/v1
paths:
  /policies/{policyNumber}/payouts:
    get:
      summary: Every payout instalment on one policy, in due-date order
      description: >
        Empty for a policy whose product version authored no payout schedule — every policy sold
        before this module existed, and every term policy after it.
      security:
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
      responses:
        '200':
          description: The policy's schedule
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PayoutInstalment' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
  /payouts:
    get:
      summary: The payouts register
      description: >
        FINANCE_OFFICER or ADMIN only: this is the queue from which money is paid. Ordered by due
        date then id, so two pages never repeat or skip a row.
      security:
        - staffAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: >
            One status, or omitted for every status — the same one-filter-at-a-time shape every
            other register on this platform offers.
          schema: { $ref: '#/components/schemas/InstalmentStatus' }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: One page of the register
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PayoutInstalment' }
                  page: { $ref: 'openapi-common.yaml#/components/schemas/PageMeta' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
  /payouts/{instalmentId}:
    get:
      summary: One payout instalment
      security:
        - staffAuth: []
      parameters:
        - { name: instalmentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The instalment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutInstalment' }
        '404':
          description: No such instalment in this tenant
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /payouts/{instalmentId}/review:
    post:
      summary: Review a DUE payout — the payee, and proof of life where it is required
      description: >
        A SURVIVAL or INCOME payout needs proof the life assured is alive; a MATURITY or
        RETURN_OF_PREMIUM does not, because it is owed by the calendar alone.
      security:
        - staffAuth: []
      parameters:
        - { name: instalmentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payeeRef]
              properties:
                payeeRef: { type: string, maxLength: 200, description: "Mobile money / bank payout destination" }
                proofOfLifeMethod:
                  anyOf:
                    - { $ref: '#/components/schemas/ProofOfLifeMethod' }
                    - { type: 'null' }
                proofOfLifeDocumentId: { type: [string, "null"], format: uuid }
      responses:
        '200':
          description: Reviewed, awaiting a second person's approval
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutInstalment' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '422':
          description: Refused — not DUE, no payee, or no proof of life where it is required
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /payouts/{instalmentId}/approve:
    post:
      summary: Approve a REVIEWED payout, by someone other than its reviewer
      description: >
        Requests the disbursement. The money is REQUESTED, not paid — the instalment reaches PAID
        only when the payment provider confirms it.
      security:
        - staffAuth: []
      parameters:
        - { name: instalmentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '202':
          description: Approved and the payment requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutInstalment' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '422':
          description: Refused — not REVIEWED, or the approver is the reviewer
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /payouts/{instalmentId}/retry:
    post:
      summary: Try a FAILED payment again
      description: >
        Only a payout whose disbursement genuinely failed. An IN_DOUBT one stays APPROVED and waits
        for someone to reconcile it against the provider's statement — retrying it could pay the
        customer twice. The approval stands; the request goes out under a new idempotency key.
      security:
        - staffAuth: []
      parameters:
        - { name: instalmentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '202':
          description: A fresh payment requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutInstalment' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '422':
          description: Refused — the payout is not FAILED
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /policies/{policyNumber}/free-look-cancellation:
    post:
      summary: Prepare a free-look cancellation, with itemised deductions
      description: >
        Open to any staff member: preparing one commits nothing. The window is counted from the
        ISSUE date, because it runs from when the customer received the contract and could read
        it. Deductions are itemised rather than a percentage — someone exercising a statutory
        right to walk away is owed an explanation of every shilling withheld.
      security:
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payeeRef]
              properties:
                payeeRef: { type: string, maxLength: 200, description: "Where the refund is sent" }
                deductions:
                  type: array
                  items:
                    type: object
                    required: [description, amount]
                    properties:
                      description: { type: string, maxLength: 200 }
                      amount:
                        type: string
                        pattern: '^\d+(\.\d{1,2})?$'
                        description: A decimal string, never a JSON number.
                      documentId: { type: [string, "null"], format: uuid }
      responses:
        '201':
          description: Prepared, awaiting a second person's approval
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FreeLookCancellation' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '422':
          description: >
            Refused — outside the window, not an individual policy, not ACTIVE, the version has no
            free-look period, or the deductions exceed the premiums collected
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
    get:
      summary: The policy's most recent free-look cancellation, if it has one
      description: 204 when it has none — "this policy was never cancelled" is not an error.
      security:
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
      responses:
        '200':
          description: The cancellation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FreeLookCancellation' }
        '204': { description: The policy has no free-look cancellation }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
  /free-look-cancellations/{cancellationId}/approve:
    post:
      summary: Approve a cancellation, by someone other than the person who prepared it
      description: >
        Voids the policy from inception, withdraws its whole payout schedule and requests the
        refund. A refund of nothing — where the deductions used up the premiums exactly — requests
        no disbursement at all.
      security:
        - staffAuth: []
      parameters:
        - { name: cancellationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '202':
          description: Approved and the refund requested — not yet paid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FreeLookCancellation' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404':
          description: No such cancellation in this tenant
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
        '422':
          description: Refused — already decided, or the approver prepared it
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /payment-runs:
    get:
      summary: Payment runs, newest first (a bare array — runs are few)
      description: >
        One run per tenant per day, carrying that day's income instalments. FINANCE_OFFICER or
        ADMIN only: this is the batch from which money is released.
      security:
        - staffAuth: []
      responses:
        '200':
          description: Runs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PaymentRun' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
  /payment-runs/{paymentRunId}:
    get:
      summary: One run, with its server-computed total
      security:
        - staffAuth: []
      parameters:
        - { name: paymentRunId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentRun' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404':
          description: No such run in this tenant
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /payment-runs/{paymentRunId}/instalments:
    get:
      summary: The instalments in one run, in due-date order
      security:
        - staffAuth: []
      parameters:
        - { name: paymentRunId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Instalments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PayoutInstalment' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
  /payment-runs/{paymentRunId}/approve:
    post:
      summary: Approve a PREPARED run; requests every instalment's payment
      description: >
        One signature, not two. Each stream's first instalment already carried a reviewer and a
        separate approver; what stands behind the rest is the proof-of-life interval, which
        suspends the stream the moment it lapses and keeps it out of the batch.
      security:
        - staffAuth: []
      parameters:
        - { name: paymentRunId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '202':
          description: Approved and the payments requested — not yet paid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentRun' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '422':
          description: Refused — the run is already approved, or a stream has no confirmed payee
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /payout-streams/{streamId}/proof-of-life:
    post:
      summary: Record proof of life on an income stream
      description: >
        Restarts the stream's clock and releases the instalments the overdue proof held. One it
        does NOT release is an instalment held because the premiums are behind: proving someone is
        alive says nothing about what they have paid.
      security:
        - staffAuth: []
      parameters:
        - { name: streamId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proofOfLifeMethod]
              properties:
                proofOfLifeMethod: { $ref: '#/components/schemas/ProofOfLifeMethod' }
                proofOfLifeDocumentId: { type: [string, "null"], format: uuid }
      responses:
        '204': { description: Recorded }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '422':
          description: Refused — the stream has ended, or no method was given
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
components:
  schemas:
    FreeLookCancellation:
      type: object
      required: [cancellationId, policyNumber, status, premiumsCollected, refundAmount, payeeRef, requestedBy, deductions]
      properties:
        cancellationId: { type: string, format: uuid }
        policyNumber: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        status: { type: string, enum: [REQUESTED, APPROVED, PAID, FAILED] }
        premiumsCollected:
          description: What came in. Carried beside the refund so the arithmetic can be checked.
          $ref: 'openapi-common.yaml#/components/schemas/Money'
        refundAmount: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        payeeRef: { type: string }
        requestedBy: { type: string }
        approvedBy: { type: [string, "null"] }
        deductions:
          type: array
          items:
            type: object
            required: [description, amount]
            properties:
              description: { type: string }
              amount: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
              documentId: { type: [string, "null"], format: uuid }
    PaymentRun:
      type: object
      required: [paymentRunId, runDate, status, instalmentCount, total]
      properties:
        paymentRunId: { type: string, format: uuid }
        runDate: { type: string, format: date }
        status: { type: string, enum: [PREPARED, APPROVED] }
        approvedBy: { type: [string, "null"] }
        instalmentCount: { type: integer }
        total:
          description: Computed by the server — the console never sums the instalments itself.
          $ref: 'openapi-common.yaml#/components/schemas/Money'
    InstalmentStatus:
      type: string
      description: >
        IN_DOUBT is deliberately distinct from FAILED: the money may or may not have moved, and
        retrying it blindly is how a payout is made twice.
      enum: [SCHEDULED, DUE, ON_HOLD, REVIEWED, APPROVED, PAID, FAILED, IN_DOUBT, CANCELLED]
    ProofOfLifeMethod:
      type: string
      enum: [IN_PERSON, PHONE_OR_VIDEO, LIFE_CERTIFICATE]
    PayoutInstalment:
      type: object
      required: [instalmentId, policyNumber, kind, dueDate, status, attempts]
      properties:
        instalmentId: { type: string, format: uuid }
        policyNumber: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        kind: { type: string, enum: [SURVIVAL, MATURITY, INCOME, RETURN_OF_PREMIUM] }
        dueDate: { type: string, format: date }
        originalAmount:
          description: What the contract authored. Null on a premium return until it falls due.
          anyOf:
            - { $ref: 'openapi-common.yaml#/components/schemas/Money' }
            - { type: 'null' }
        currentAmount:
          description: What is payable now — lower than the original after a paid-up conversion.
          anyOf:
            - { $ref: 'openapi-common.yaml#/components/schemas/Money' }
            - { type: 'null' }
        restatementReason: { type: [string, "null"] }
        status: { $ref: '#/components/schemas/InstalmentStatus' }
        statusReason:
          description: Why it is held or cancelled, in the server's own words.
          type: [string, "null"]
        streamId: { type: [string, "null"], format: uuid }
        payeeRef: { type: [string, "null"] }
        proofOfLifeMethod:
          anyOf:
            - { $ref: '#/components/schemas/ProofOfLifeMethod' }
            - { type: 'null' }
        reviewedBy: { type: [string, "null"] }
        approvedBy: { type: [string, "null"] }
        paymentRunId: { type: [string, "null"], format: uuid }
        attempts: { type: integer }
