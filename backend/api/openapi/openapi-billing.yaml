openapi: 3.1.0
info:
  title: Premium Billing & Collection API
  version: "0.1.0-draft"
  description: >
    External REST surface of the `billing` module. The BillingSyncApi from Deliverable 2
    (offline field-receipt capture) is a separate, agent-portal-only endpoint set,
    included here since agents genuinely call it directly from the field app.
servers:
  - url: https://api.nlolo-lifeplatform.tz/v1
paths:
  /field-receipts:
    get:
      summary: The reconciliation queue — field-captured receipts and whether they have matched
      description: >
        The read this entity never had. Capture (POST /agents/{agentId}/field-receipts) was its
        only endpoint, so cash an agent recorded in the field could sit unmatched past its SLA,
        raise the medium-severity FieldReceiptReconciliationOverdue Prometheus alert, and still
        be invisible to every human on the platform. That alert's own description reads "one or
        more agent-captured receipts have exceeded the OFFLINE_RECEIPT_SLA_HOURS refdata
        parameter without a matching PaymentConfirmed" — it names a count and no receipt, so the
        only available follow-up was a hand-written database query.


        Finance-gated: this is unreconciled money across the tenant, not one agent's own
        submissions. An agent-scoped read is a real and separate need, deliberately not built —
        the field app that would call it does not exist yet.


        Ordered capturedAtServer ASC then receiptId — oldest unmatched cash first, which is both
        the work order and the SLA order. The tie-breaker is load-bearing: a bulk sync from one
        agent lands many receipts in the same instant, and paging an order with ties can show one
        receipt twice while never showing another.
      security:
        - staffAuth: []
      parameters:
        - name: status
          in: query
          description: Omit for every state.
          schema: { type: string, enum: [PENDING_RECONCILIATION, RECONCILED, RECONCILIATION_OVERDUE] }
        - name: page
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FieldReceiptView' }
                  page: { $ref: 'openapi-common.yaml#/components/schemas/PageMeta' }
        '401': { $ref: 'openapi-common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
  /field-receipts/{receiptId}/reconcile:
    post:
      summary: Match a field receipt to money received, and close it
      description: >
        The transition that had no caller. FieldReceipt.reconcile() has existed since M5 with a
        javadoc claiming it closes the offline-receipt SLA loop, and nothing on the platform ever
        invoked it — no endpoint, no event listener, no sweep step. A receipt could therefore only
        ratchet PENDING_RECONCILIATION → RECONCILIATION_OVERDUE and stay there: the reconciliation
        queue could fill and never drain, and the FieldReceiptReconciliationOverdue alert, once
        firing, would never clear.


        MANUAL, by a finance officer, rather than automatic on payment.PaymentConfirmed. Matching
        cash to a receipt automatically needs a rule nobody has written down — which payment clears
        which receipt, what a partial amount means, what happens when one policy has several open
        receipts — and inventing one would put a guess between an agent's collection and the
        ledger. This records that a person matched it, and who: the acting subject travels on
        billing.FieldReceiptReconciled into audit_log, because field_receipt has no actor column
        (the same way InvoiceWaived records who waived).


        Idempotent: reconciling an already-RECONCILED receipt returns it unchanged rather than
        409ing, because two officers clearing the same queue row is a race, not an error.
        RECONCILIATION_OVERDUE is reconcilable too — being past SLA is exactly when this is most
        needed.
      security:
        - staffAuth: []
      parameters:
        - name: receiptId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The reconciled receipt, so the caller can render the new status without a second read
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldReceiptView' }
        '401': { $ref: 'openapi-common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404':
          description: >
            No such receipt in the caller's tenant. A receipt in ANOTHER tenant lands here too,
            not on a 403 — telling a caller "this exists but is not yours" confirms the id.
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /arrears:
    get:
      summary: The collections queue — this tenant's arrears cases, worst escalation first
      description: >
        The only tenant-wide read in this module. Every other billing endpoint is keyed by a
        policy number or an invoice id the caller must already know, which meant "which
        policies are in arrears" could not be asked at all: dunning was visible only as a
        badge on one invoice row of one policy record. A platform that escalates through five
        dunning levels and then recommends lapse had no way to show anybody the escalations.


        Finance-gated, unlike the per-policy invoice reads. A customer may see the invoices on
        their own contract; a tenant-wide list of who is behind on payments is a collections
        officer's screen.


        Ordered dunningLevel DESC, openedAt ASC, arrearsCaseId ASC — the work order, and TOTAL.
        The tie-breaker is not decoration: dunning level takes five values and a sweep opens
        many cases in the same instant, so paging a query whose order has ties can show one
        case twice and never show another. On a collections queue that is a customer nobody
        chases.


        A row's money comes from the invoice the case was opened against, resolved for the
        whole page in one query. It is null, never zero, if that invoice cannot be resolved —
        a zero here would read as "nothing owed".
      security:
        - staffAuth: []
      parameters:
        - name: minDunningLevel
          in: query
          description: >
            A FLOOR, not an exact match: the question a collections officer asks is "what is at
            level 3 or worse", and an exact filter would hide the level-5 cases from somebody
            triaging level 3 upward. Omit for every level.
          schema: { type: integer, minimum: 1, maximum: 5 }
        - name: resolved
          in: query
          description: >
            Omit for both, false for the live queue, true for cases already settled or waived.
            An arrears case is resolved rather than deleted, because whether a customer was
            chased is part of the record.
          schema: { type: boolean }
        - name: page
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ArrearsCaseView' }
                  page: { $ref: 'openapi-common.yaml#/components/schemas/PageMeta' }
        '401': { $ref: 'openapi-common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
  /policies/{policyNumber}/invoices:
    get:
      summary: List outstanding invoices for a policy
      security:
        - customersAuth: [profile]
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        - name: status
          in: query
          schema: { type: string, enum: [DUE, PARTIALLY_PAID, PAID, IN_GRACE, OVERDUE, WAIVED] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InvoiceView' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
  /policies/{policyNumber}/credits:
    get:
      summary: Premium credited back on a policy -- refunds to members who left early, oldest first
      security:
        - customersAuth: [profile]
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PremiumCreditView' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
  /policies/{policyNumber}/invoices/next-due:
    get:
      summary: Lightweight "what do I owe?" lookup (Deliverable 3 Rev 2, Bi2 — built for USSD)
      security:
        - customersAuth: [profile]
        - agentsAuth: [agent]
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceView' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404':
          description: Policy not found, or no invoice currently due for it
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /invoices/{invoiceId}/waiver:
    post:
      summary: Waive an invoice (staff only — reason is mandatory and audit-relevant)
      security:
        - staffAuth: []
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 10 }
      responses:
        '200': { description: Invoice waived }
        '400': { $ref: 'openapi-common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
  /invoices/{invoiceId}/payment-request:
    post:
      summary: Request collection of an invoice's premium through payment (staff/agent)
      description: >
        Publishes billing.PaymentRequested (request/confirm pattern) — payment attempts collection
        against payerRef and, on success, publishes payment.PaymentConfirmed, which billing's own
        PaymentEventListener consumes to move the invoice toward PARTIALLY_PAID/PAID.
        Customers may request payment only for an invoice belonging to their own policy
        (object-level check against the token's party_id claim); agents and staff are scoped to
        their tenant.
      security:
        - customersAuth: [profile]
        - staffAuth: []
        - agentsAuth: [agent]
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        # Deliberately NOT a $ref to openapi-common.yaml#/components/parameters/IdempotencyKey:
        # that shared parameter is `required: false` (the platform-wide "accepted, not enforced"
        # convention), and on THIS endpoint the header is required and genuinely enforced. It is the
        # value that reaches payment's (tenant_id, idempotency_key) registry, so it decides whether a
        # request is a deduplicated duplicate or a real new collection attempt. Same header name,
        # same client-supplied semantics, stricter requiredness.
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1 }
          description: >
            Client-generated key identifying this collection ATTEMPT, not the invoice. Reusing a key
            is deduplicated by payment, so a double-submit is safe; supplying a NEW key starts a new
            attempt, which is what makes an operator retry after a decline (or a PARTIALLY_PAID
            top-up) possible at all. There is no default — a missing or blank value is a 400, because
            any default would either make retry impossible or discard duplicate protection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payerRef]
              properties:
                payerRef: { type: string }
      responses:
        '202': { description: "Payment requested for the invoice's balance due (charged, less paid, less credited), accepted for processing" }
        '400': { $ref: 'openapi-common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '409':
          description: "Nothing is owed on this invoice: payments and credits already cover what was charged (NOTHING_OWED)"
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /agents/{agentId}/field-receipts:
    post:
      summary: Capture a premium receipt offline (BillingSyncApi — agent field app)
      description: >
        Lands as PENDING_RECONCILIATION (FieldReceiptCaptured). If unmatched by a
        PaymentConfirmed within the refdata-configured SLA (default 24h), escalates
        to FieldReceiptReconciliationOverdue (Deliverable 2 Rev 2, B4).
      security:
        - agentsAuth: [agent]
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policyNumber, amount, clientIdempotencyKey, capturedAt]
              properties:
                policyNumber: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
                amount: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
                clientIdempotencyKey: { type: string }
                capturedAt: { type: string, format: date-time, description: "Client-device timestamp — server timestamp also recorded for reconciliation ordering." }
      responses:
        '202':
          description: Accepted, pending reconciliation
          content:
            application/json:
              schema:
                type: object
                properties:
                  receiptId: { type: string, format: uuid }
                  status: { type: string, enum: [PENDING_RECONCILIATION] }
        '400': { $ref: 'openapi-common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
components:
  schemas:
    FieldReceiptView:
      description: >
        One agent-captured premium receipt: cash an agent says they took in the field, and
        whether the platform has matched it to a payment yet.


        Both timestamps are carried, and the gap between them is the point. capturedAtClient is
        when the agent recorded it on a phone that may have been offline for hours;
        capturedAtServer is when it reached the platform, and the reconciliation SLA runs from
        there. A large gap is itself worth seeing — it distinguishes "we were slow" from "the
        field was offline".


        clientIdempotencyKey is deliberately absent. It is the field app's dedup token, not a
        fact about the money, and exposing it invites somebody to quote it back as a reference.
      type: object
      additionalProperties: false
      properties:
        receiptId: { type: string, format: uuid }
        policyNumber: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        agentId: { type: string, format: uuid }
        amount:
          allOf:
            - $ref: 'openapi-common.yaml#/components/schemas/Money'
          nullable: true
        capturedAtClient:
          type: string
          format: date-time
          description: When the agent recorded it, which may be well before the platform saw it.
        capturedAtServer:
          type: string
          format: date-time
          description: When it reached the platform. The reconciliation SLA runs from here.
        status:
          type: string
          enum: [PENDING_RECONCILIATION, RECONCILED, RECONCILIATION_OVERDUE]
        reconciledAt:
          type: [string, "null"]
          format: date-time
          description: Null until a matching PaymentConfirmed arrives.
    ArrearsCaseView:
      description: >
        One row of the collections queue: a policy in arrears, how far it has escalated, and
        what is owed.


        lastNotifiedDunningLevel is deliberately exposed. It is the difference between "this
        customer has been chased at this level" and "this level was reached and nobody has been
        told" — which on this platform were the same thing for a long time, because the
        notification sweep that publishes billing.PremiumOverdue had no caller. A gap between
        it and dunningLevel is a real operational fact, and it belongs on the screen rather
        than only in the database.
      type: object
      additionalProperties: false
      properties:
        arrearsCaseId: { type: string, format: uuid }
        policyNumber: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        invoiceId: { type: string, format: uuid }
        dunningLevel:
          type: integer
          minimum: 1
          maximum: 5
          description: 1-4 chase the customer; 5 is the level at which lapse is recommended.
        lastNotifiedDunningLevel:
          type: integer
          minimum: 0
          description: >
            0 means nothing has been announced for this case yet. Equal to dunningLevel means
            the customer has been told about the level they are actually at.
        openedAt: { type: string, format: date-time }
        resolvedAt:
          type: [string, "null"]
          format: date-time
          description: Null while the case is open. Set when the invoice is paid or waived.
        amount:
          description: >
            From the invoice the case was opened against. Null, never zero, if that invoice
            cannot be resolved — a zero on a collections screen reads as "nothing owed".
          allOf:
            - $ref: 'openapi-common.yaml#/components/schemas/Money'
          nullable: true
        dueDate: { type: [string, "null"], format: date }
        invoiceStatus:
          type: [string, "null"]
          enum: [DUE, PARTIALLY_PAID, PAID, IN_GRACE, OVERDUE, WAIVED, null]
    PremiumCreditView:
      type: object
      additionalProperties: false
      description: >-
        Premium refunded to a member who left before the cover it paid for ran out. Its own
        record, never a reduction of the invoice it is credited against.
      required: [creditId, policyNumber, policyMemberId, originalInvoiceId, amount, exitReason, exitDate, createdAt]
      properties:
        creditId: { type: string, format: uuid }
        policyNumber: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        policyMemberId: { type: string, format: uuid }
        originalInvoiceId:
          type: string
          format: uuid
          description: The invoice raised by the file that charged this member.
        amount: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        exitReason:
          type: string
          description: Why the member left, as policy recorded it -- e.g. SETTLED_EARLY.
        exitDate: { type: string, format: date }
        createdAt: { type: string, format: date-time }
    InvoiceView:
      type: object
      additionalProperties: false
      properties:
        invoiceId: { type: string, format: uuid }
        policyNumber: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        dueDate: { type: string, format: date }
        amount: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        status: { type: string, enum: [DUE, PARTIALLY_PAID, PAID, IN_GRACE, OVERDUE, WAIVED] }
        gracePeriodEndsAt: { type: [string, "null"], format: date }
        dunningLevel:
          type: [integer, "null"]
          minimum: 1
          maximum: 5
          description: Present only when an ArrearsCase is open (Deliverable 3 Rev 2, Bi1).
        amountPaid:
          allOf:
            - $ref: 'openapi-common.yaml#/components/schemas/Money'
          description: Collected against this invoice so far.
        amountCredited:
          allOf:
            - $ref: 'openapi-common.yaml#/components/schemas/Money'
          description: >-
            Premium given back off this invoice to members who left early (see GET
            /policies/{policyNumber}/credits). A credit is its own record; `amount` keeps saying
            what was charged.
        balanceDue:
          allOf:
            - $ref: 'openapi-common.yaml#/components/schemas/Money'
          description: >-
            What is actually owed -- amount, less paid, less credited, never negative. A payment
            request asks for this, not for `amount`.
        enrolmentSubmissionId:
          type: [string, "null"]
          format: uuid
          description: The monthly file that raised this invoice, on credit life. Null for a scheduled premium.
