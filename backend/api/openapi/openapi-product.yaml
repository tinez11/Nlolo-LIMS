openapi: 3.1.0
info:
  title: Product Configuration API
  version: "0.1.0-draft"
  description: >
    External REST surface of the `product` module. Product authoring (create/publish
    versions, rating tables) is a staff/actuarial back-office capability; the
    read/catalog side is what customer and agent channels actually consume
    (product browsing, quote calculation inputs).
servers:
  - url: https://api.nlolo-lifeplatform.tz/v1
paths:
  /products:
    get:
      summary: List active products (catalog browsing)
      security:
        - customersAuth: [profile]
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - name: category
          in: query
          schema: { type: string, enum: [TERM_LIFE, ENDOWMENT, WHOLE_LIFE, ANNUITY, UNIT_LINKED, GROUP_LIFE, EDUCATION_SAVINGS, CREDIT_LIFE, FUNERAL] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProductSummary' }
    post:
      summary: Create a new product definition (staff/actuarial only)
      security:
        - staffAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProductRequest' }
      responses:
        '201':
          description: Product created (status DRAFT)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductSummary' }
  /products/drafts:
    get:
      summary: List DRAFT products — created but never published (staff/actuarial only)
      description: >-
        Authoring is two phases: create the definition, then publish a version. Only the
        second flips DRAFT to ACTIVE, and `GET /products` returns ACTIVE only — so a product
        whose second phase was abandoned appeared in no list while `ux_product_code` kept
        holding its code. The code was burned and the product could be neither seen nor
        finished. This is the list that makes it reachable, so the publish form can be
        reopened against it.


        A separate path rather than a `status` parameter on `GET /products`, because that
        endpoint answers to customersAuth and agentsAuth: an unlaunched product is not
        something a policyholder or a tied agent gets to enumerate. This one is staff-only
        and, in the implementation, ADMIN-only — the same role that may create a product.
      security:
        - staffAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProductSummary' }
  /products/{productId}:
    get:
      summary: One product by id — its code, name, category and status
      description: >-
        The lookup that turns a product id into a product NAME. Nothing did:
        `/products/{productId}/active-snapshot` takes an id but its view carries pricing and
        eligibility, never the code or the name, and `GET /products` carries both but is
        keyed by nothing. So a caller holding an id had to fetch the whole catalogue and
        scan it, and got nothing at all for a product that is DRAFT or has been retired out
        of the catalogue.


        Every console screen referencing a product it had not itself chosen from a list
        therefore printed the raw uuid: the underwriting queue rendered a column of them,
        and the case detail rail printed one under the label "Product".


        Any status, deliberately — a retired product is the case that needs this most, since
        it is gone from the catalogue while the policies and cases referencing it are still
        on screen. Same security as `GET /products`, and NOT the staff-only gate on
        `/products/drafts`: what that one protects is ENUMERATION of unlaunched products,
        and resolving a single id the caller already holds enumerates nothing.
      security:
        - customersAuth: [profile]
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductSummary' }
        '404':
          description: "`PRODUCT_NOT_FOUND` -- no such product in this tenant"
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /products/{productId}/online-listing:
    get:
      summary: How the customer portal offers the product (staff)
      security:
        - staffAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnlineListing' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
    put:
      summary: Offer the product online or not, and say what it is (ADMIN)
      description: >-
        Off by default. Offering it needs a summary, and a published version -- 400 otherwise.
      security:
        - staffAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [available]
              properties:
                available: { type: boolean }
                summary: { type: [string, "null"] }
                benefits:
                  type: [array, "null"]
                  items: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnlineListing' }
        '400': { $ref: 'openapi-common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
  /products/{productId}/versions:
    get:
      summary: Every published version of a product (staff)
      description: >-
        The most recently published first; `current` marks the version a sale today is priced on -- what the active
        snapshot resolves, the later-published winning a tie on effective date (2026-10-08). The product page listed
        only that one, so earlier versions, and which of them the older policies were sold on, could not be seen.
      security:
        - staffAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProductVersionSummaryView' }
        '404':
          description: No such product
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
    post:
      summary: Publish a new product version (staff/actuarial only)
      description: >-
        Publishes a version and activates the product. Since IFRS 17 I2 the measurement model is not asked for -- the
        accounting policy register decides it -- and the version carries its expected profitability and an optional
        model override instead.
      security:
        - staffAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductVersionSpec' }
      responses:
        '201':
          description: Version published
        '422':
          description: Incomplete rating-factor coverage, or a fund definition on a non-unit-linked product
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /products/{productId}/active-snapshot:
    get:
      summary: Get the version active as of a given date (used for quoting and rating)
      description: >-
        A product in the catalogue does NOT imply a version in force today. Publishing a
        version flips the definition to ACTIVE whatever its effective date, and a version
        carries a retirement date -- so a product can be listed while its only version
        starts next week, or after every version it ever had has retired. Both are normal
        states of product authoring, not errors in the request.


        Which is why the two 404s below carry different error codes. They were one code
        (`PRODUCT_NOT_FOUND`) and the version lookup ran before the existence check, so
        "its version starts tomorrow" was reported as "no such product" -- and the console,
        which must hedge on a bare 404 because one can be a disguised denial, told a staff
        member the record did not exist or their role forbade it, immediately after they
        clicked it in the catalogue.
      security:
        - customersAuth: [profile]
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: effectiveDate
          in: query
          description: Defaults to today. The date the version is resolved as of.
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductSnapshot' }
        '404':
          description: >-
            `PRODUCT_NOT_FOUND` -- no such product. `NO_ACTIVE_PRODUCT_VERSION` -- the
            product exists and no version of it is in force on that date; the detail names
            the date asked about and, where one is scheduled, the date the next version
            takes effect.
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /products/{productId}/premium-quote:
    post:
      summary: Price a product for one applicant, on the version active as of a date
      description: >-
        200, not 201: nothing is created. Persists nothing, publishes nothing, and
        takes NO Idempotency-Key -- it is a calculation, so replaying it is free and
        there is no duplicate to prevent.

        POST rather than GET despite being a read, because the body carries
        dateOfBirth, sex and smokerStatus; a GET would put those in a URL and
        therefore into access logs, proxy logs and browser history.

        Resolution is STRICT: a version with no base rate table, an age outside every
        band, or a declared occupation class / sum-assured band with no multiplier
        each return 422 naming the dimension. Nothing falls back to a neutral value,
        because a fallback here produces a plausible premium for a real contract and
        nothing fails.
      security:
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PremiumQuoteRequest' }
      responses:
        '200':
          description: Priced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PremiumQuoteView' }
        '401': { $ref: 'openapi-common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { description: "No product, or no version active as of that date" }
        '422': { $ref: 'openapi-common.yaml#/components/responses/UnprocessableEntity' }
  /products/{productId}/versions/{versionId}/rating:
    get:
      summary: The rating basis for one version, for actuarial and product review
      description: >-
        Deliberately separate from ProductSnapshot, which Underwriting and Billing
        read on the issuance and billing path: folding rate tables into it would make
        every consumer carry data exactly one screen needs, and it could not be
        role-scoped because Billing must keep reading it. This is staff-only.
      security:
        - staffAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: versionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionRatingView' }
        '401': { $ref: 'openapi-common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { description: "No such version for that product in this tenant" }
  /products/{productId}/versions/{versionId}/annuity:
    get:
      summary: An annuity version's forms and payment frequencies, for the case form
      description: >-
        Product step 5. The forms a purchase may choose and the frequencies it may be paid at --
        not the rate rows, which only the pricer reads; a quote is how anyone sees a figure. 404
        NOT_AN_ANNUITY for any version that is not an annuity. Agents open cases, so they may read it.
      security:
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The annuity terms
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnuityTerms' }
        '401': { $ref: 'openapi-common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404':
          description: Not an annuity version
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /products/{productId}/versions/{versionId}/funeral:
    get:
      summary: A funeral plan version's plans, premium table, role rules and claim rules
      description: >-
        Family funeral cover. Everything staff configured on the version, including the premium table,
        which the application screen shows per life. 404 NOT_A_FUNERAL_PRODUCT for any other version.
        Agents sell this product, so they may read it.
      security:
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The funeral terms
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FuneralTerms' }
        '401': { $ref: 'openapi-common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404':
          description: Not a funeral plan version
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /products/{productId}/versions/{versionId}/unit-linked:
    get:
      summary: A unit-linked version's funds, allocation, fee, mortality, death and lapse rules
      description: >-
        Product step 6, U1. Everything staff configured on the version. 404 NOT_A_UNIT_LINKED_PRODUCT for
        any other version. Agents sell this product, so they may read it.
      security:
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The unit-linked terms
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnitLinkedTerms' }
        '401': { $ref: 'openapi-common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404':
          description: Not a unit-linked version
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /products/{productId}/versions/{versionId}/funeral-quote:
    post:
      summary: Price a family on one funeral plan
      description: >-
        Family funeral cover. A line per life (its age on asOf, the plan's benefit for its role, its yearly
        premium from the table), the family's yearly total, and the instalment: the total loaded for the
        frequency and divided once, rounded once. asOf defaults to today. 422 FUNERAL_QUOTE_REFUSED names
        what the plan will not cover (a second spouse, a child too old to join, a role the plan does not
        cover). 404 NOT_A_FUNERAL_PRODUCT for any other version.
      security:
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FuneralQuoteRequest' }
      responses:
        '200':
          description: The family, priced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FuneralQuote' }
        '401': { $ref: 'openapi-common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404':
          description: Not a funeral plan version
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
        '422':
          description: The plan will not cover or cannot price this family
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /products/{productId}/versions/{versionId}/exclusion-periods:
    put:
      summary: Set or clear a version's policy-term exclusion windows
      description: >-
        How long each exclusion stays open, in months from cover start. Without this operation
        the windows could only be set by writing SQL, which left the claims exclusion gate inert
        in any real deployment: a version ships with both null, no window is ever open, and every
        exclusion decline an assessor tries to record is refused for citing one that is not.

        For credit life that is not a minor gap. Below the free cover limit nobody is
        underwritten -- and with the limit far above any loan these lenders write, nobody ever is
        -- so these two windows are the entire anti-selection control the product has. The client
        confirmed 12 and 12 on 2026-09-22.

        PUT because it is idempotent and replaces both values together. Sending one field alone
        CLEARS the other, deliberately: these are the version's exclusions as a whole, and a
        partial update would make "no suicide exclusion" indistinguishable from "I did not
        mention it". A body of {} is therefore a legitimate request meaning the product excludes
        neither, not a malformed one.

        Read them back through GET /products/{productId}/active-snapshot, which already carries
        both fields.
      security:
        - staffAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: versionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetExclusionPeriodsRequest' }
      responses:
        '204': { description: Set }
        '400': { $ref: 'openapi-common.yaml#/components/responses/BadRequest' }
        '401': { $ref: 'openapi-common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { description: "No such version in this tenant" }
components:
  schemas:
    OnlineListing:
      type: object
      additionalProperties: false
      required: [productId, productName, category, defaultCurrency, available, summary, benefits]
      properties:
        productId: { type: string, format: uuid }
        productName: { type: string }
        category: { type: string }
        defaultCurrency: { type: string }
        available: { type: boolean }
        summary: { type: [string, "null"] }
        benefits:
          type: array
          items: { type: string }
    ProductVersionSummaryView:
      type: object
      additionalProperties: false
      required: [productVersionId, effectiveDate, retirementDate, current, publishedAt, publishedBy, gracePeriodDays,
                 expectedProfitabilityBucket, measurementModelOverride, survivalInvestmentComponentPercent]
      properties:
        survivalInvestmentComponentPercent: { type: [number, "null"], description: "IFRS 17 I3b: the investment share (%) of a survival or income instalment" }
        productVersionId: { type: string, format: uuid }
        effectiveDate: { type: string, format: date }
        retirementDate: { type: [string, "null"], format: date }
        current: { type: boolean, description: "The version a sale today is priced on" }
        publishedAt: { type: string, format: date-time }
        publishedBy: { type: [string, "null"] }
        gracePeriodDays: { type: integer }
        expectedProfitabilityBucket: { type: [string, "null"] }
        measurementModelOverride: { type: [string, "null"] }
    ProductSummary:
      type: object
      properties:
        productId: { type: string, format: uuid }
        productCode: { type: string }
        productName: { type: string }
        category: { type: string }
        status: { type: string, enum: [DRAFT, ACTIVE, RETIRED] }
        defaultCurrency: { type: string, example: TZS }
        portfolioCode: { $ref: '#/components/schemas/PortfolioCode' }
    PortfolioCode:
      type: string
      description: >-
        The IFRS 17 portfolio (IFRS 17 spec §6): contracts subject to similar risks and managed together. With the
        cohort (issue year) and the version's expected profitability it decides a policy's group of contracts.
      enum: [TERM, WL, END, MB, PAR, ULIP, SAV, DEP, IANN, DANN, PEN, GRPL, CRL, FUN]
    ProfitabilityBucket:
      type: string
      description: "Expected profitability at initial recognition (IFRS 17 para 16), signed off by the actuary at publish."
      enum: [ONEROUS, NO_SIGNIFICANT_RISK, REMAINING]
    Ifrs17Model:
      type: string
      enum: [GMM, VFA, PAA, IFRS9]
    CreateProductRequest:
      type: object
      required: [productCode, productName, category, portfolioCode, defaultCurrency]
      properties:
        productCode: { type: string }
        productName: { type: string }
        category: { type: string, enum: [TERM_LIFE, ENDOWMENT, WHOLE_LIFE, ANNUITY, UNIT_LINKED, GROUP_LIFE, EDUCATION_SAVINGS, CREDIT_LIFE, FUNERAL] }
        portfolioCode: { $ref: '#/components/schemas/PortfolioCode' }
        defaultCurrency: { type: string, example: TZS }
    EligibilityBounds:
      description: >-
        What this version will accept. Every bound optional -- an unbounded dimension is a real
        product design, not a gap.

        The bounds are NOT all the same kind of rule, and the gates that consume them differ.
        Entry age is a HARD refusal: base_rate_table is keyed on (age range, sex, smoker status)
        and a quote already 422s with PremiumNotQuotableException when no cell matches, so an
        out-of-range age cannot be priced at all. Term is a HARD refusal too: term is
        staff-entered configuration, and a term the product was not designed for is the wrong
        product. Sum assured is a SOFT flag: above retention is not invalid business, it is what
        reinsurance is for, and the breach is recorded in reasonForManualIssue rather than
        blocked.

        Sum-assured bounds carry no currency -- they are read in the product's own
        defaultCurrency, and a bound in a currency the product does not price in means nothing.
      type: [object, "null"]
      properties:
        minEntryAge: { type: [integer, "null"], minimum: 0, maximum: 120 }
        maxEntryAge: { type: [integer, "null"], minimum: 0, maximum: 120 }
        minTermMonths: { type: [integer, "null"], minimum: 1 }
        maxTermMonths: { type: [integer, "null"], minimum: 1 }
        minSumAssured: { type: [number, "null"], exclusiveMinimum: 0 }
        maxSumAssured: { type: [number, "null"], exclusiveMinimum: 0 }
    ProductVersionSpec:
      type: object
      required: [effectiveDate, ratingTable, benefitSchedule, tiraFiling]
      properties:
        ifrsMeasurementModel:
          type: [string, "null"]
          enum: [GMM, PAA, null]
          deprecated: true
          description: "Retired by IFRS 17 I2: the measurement model is the accounting policy register's. Accepted, stored, never read for accounting."
        expectedProfitabilityBucket:
          description: "Omitted means REMAINING. See ProfitabilityBucket."
          type: [string, "null"]
          enum: [ONEROUS, NO_SIGNIFICANT_RISK, REMAINING, null]
        measurementModelOverride:
          description: >-
            Omitted means none: the register's model applies, which is the ordinary case. An override counts only where
            the register in force on the issue date lists it in MODEL_OVERRIDE_ALLOWED for the product's portfolio.
          type: [string, "null"]
          enum: [GMM, VFA, PAA, IFRS9, null]
        survivalInvestmentComponentPercent:
          description: >-
            IFRS 17 I3b: the share (%) of each survival benefit or income instalment that is an investment component
            (paid in all circumstances). Omitted: none -- the whole instalment is an insurance service expense.
          type: [number, "null"]
          minimum: 0
          maximum: 100
        effectiveDate: { type: string, format: date }
        retirementDate: { type: [string, "null"], format: date }
        eligibility: { $ref: '#/components/schemas/EligibilityBounds' }
        cashValue:
          description: >-
            The version's cash-value (surrender value) table and its actuarial sign-off. Optional,
            and only on ENDOWMENT, WHOLE_LIFE and EDUCATION_SAVINGS: pure protection has no cash
            value. Values are per 1,000 of sum assured at each policy year, optionally by entry-age
            band. A TABLE paid-up basis needs a paid-up value on every row.
          type: object
          required: [basisReference, basisDate, paidUpBasis, minYearsForValue, rows]
          properties:
            basisReference: { type: string, maxLength: 200 }
            basisDate: { type: string, format: date }
            paidUpBasis: { type: string, enum: [PROPORTIONATE, TABLE] }
            minYearsForValue: { type: integer, minimum: 2, maximum: 3 }
            rows:
              type: array
              minItems: 1
              items:
                type: object
                required: [policyYear, cashValuePerMille]
                properties:
                  policyYear: { type: integer, minimum: 1 }
                  ageFrom: { type: [integer, "null"], minimum: 0 }
                  ageTo: { type: [integer, "null"], minimum: 0 }
                  cashValuePerMille: { type: number, minimum: 0 }
                  paidUpPerMille: { type: [number, "null"], minimum: 0 }
        payoutTerms:
          description: >-
            Free-look and payout servicing terms. freeLookDays is REQUIRED on an individual product
            (term, endowment, whole life, education savings) and unused on group and credit life,
            whose cancellation is the scheme contract's. The other three are required only when the
            rows that need them are present: a proof-of-life interval once an INCOME row exists, and
            the deduction setting once a SURVIVAL row does.
          type: object
          properties:
            freeLookDays: { type: [integer, "null"], minimum: 1, maximum: 365 }
            proofOfLifeIntervalMonths: { type: [integer, "null"], minimum: 1, maximum: 60 }
            survivalBenefitsDeductedFromDeath: { type: [boolean, "null"] }
            deathBenefitPremiumPercent: { type: [number, "null"] }
        payoutSchedule:
          description: >-
            What this version pays while the life assured is ALIVE. MATURITY and RETURN_OF_PREMIUM
            pay once on the policy's own maturity date and so carry no years or frequency; SURVIVAL
            and INCOME state a range of policy years, and their amountValue is PER POLICY YEAR,
            split across that year's instalments.
          type: array
          items:
            type: object
            required: [kind, amountBasis, amountValue]
            properties:
              kind: { type: string, enum: [SURVIVAL, MATURITY, INCOME, RETURN_OF_PREMIUM] }
              fromPolicyYear: { type: [integer, "null"], minimum: 1 }
              toPolicyYear: { type: [integer, "null"], minimum: 1 }
              amountBasis:
                type: string
                enum: [PERCENT_OF_SA, FIXED, PERCENT_OF_PREMIUMS, ACCOUNT_VALUE]
                description: >-
                  ACCOUNT_VALUE (product step 3) pays the whole account on the maturity date: only on
                  the MATURITY row of an ACCOUNT version, with amountValue 100.
              amountValue: { type: number, exclusiveMinimum: 0 }
              frequency:
                type: [string, "null"]
                enum: [ANNUAL, SEMI_ANNUAL, QUARTERLY, MONTHLY, null]
        accumulation:
          description: >-
            Present only on an ACCOUNT version (product step 3) -- a ledger of contributions, charges
            and interest instead of step 1's per-mille scale. Refused on a version that also carries
            a cashValue scale, and on any category but ENDOWMENT, WHOLE_LIFE and EDUCATION_SAVINGS.
            Its charges must start at policy year 1, cover every year once, and end open-ended.
          type: [object, "null"]
          required: [guaranteedRatePercent, minimumBalance, charges]
          properties:
            guaranteedRatePercent: { type: number, minimum: 0, maximum: 100, description: "Effective annual floor" }
            minimumBalance: { type: number, minimum: 0, description: "A partial withdrawal may not leave less" }
            charges:
              type: array
              minItems: 1
              items:
                type: object
                required: [fromPolicyYear, contributionAllocationPercent, transferAllocationPercent, monthlyPolicyFee]
                properties:
                  fromPolicyYear: { type: integer, minimum: 1 }
                  toPolicyYear: { type: [integer, "null"], minimum: 1, description: "Null on the last row: every year after" }
                  contributionAllocationPercent: { type: number, minimum: 0, maximum: 100 }
                  transferAllocationPercent: { type: number, minimum: 0, maximum: 100 }
                  monthlyPolicyFee: { type: number, minimum: 0 }
        deposit:
          description: >-
            Present only on a fixed-term deposit (2026-10-02). Rates by deposit band and term, each the
            total for the term, not a yearly rate. A band runs from its start up to the next band's
            start; every band offers every term. The server builds a zero-charge account plan behind
            it, so this is refused alongside `accumulation`, and the version carries no payout schedule
            and no frequency loading.
          type: [object, "null"]
          required: [rates]
          properties:
            rates:
              type: array
              minItems: 1
              items:
                type: object
                required: [minAmount, termMonths, ratePercent]
                properties:
                  minAmount: { type: number, exclusiveMinimum: 0, description: "Where the band starts" }
                  termMonths: { type: integer, minimum: 1, maximum: 120 }
                  ratePercent: { type: number, minimum: 0, maximum: 100, description: "For the whole term" }
        bonus:
          description: >-
            Present only on a with-profits version (product step 4). Refused on an account-valued
            version, on a fixed-term deposit, and on any category but ENDOWMENT and WHOLE_LIFE.
            surrenderBasis has no default: what attached bonuses add to a surrender is a contract term
            the version must state.
          type: [object, "null"]
          properties:
            method: { type: [string, "null"], enum: [SIMPLE, COMPOUND, null] }
            paidUpParticipates: { type: boolean, description: "Whether a policy paid-up on a valuation date still receives that declaration" }
            surrenderBasis: { type: [string, "null"], enum: [NONE, SUM_ASSURED_SCALE, OWN_SCALE, null] }
            surrenderRows:
              type: array
              items:
                type: object
                required: [fromCompletedYears, perMille]
                properties:
                  fromCompletedYears: { type: integer, minimum: 0 }
                  perMille: { type: number, minimum: 0, maximum: 1000 }
        annuity:
          description: >-
            Required on an ANNUITY version and refused on every other (product step 5). Forms are
            configurable combinations of four settings -- guaranteed years, joint life with a survivor
            percentage, escalation, capital protection -- each with its own grid of annual income per
            1,000 of purchase price. timing has no default. Every age within the version's entry-age
            bounds must have a rate in every form (and both sexes on BY_SEX, and every age difference
            on a joint form): a gap is refused at publish.
          type: [object, "null"]
          properties:
            timing: { type: [string, "null"], enum: [ARREARS, ADVANCE, null] }
            proofOfLifeIntervalMonths: { type: [integer, "null"], minimum: 1, maximum: 24 }
            jointAgeDifferenceMin: { type: [integer, "null"], description: "Annuitant age minus joint-life age; joint forms' bands must cover min..max" }
            jointAgeDifferenceMax: { type: [integer, "null"] }
            basisReference: { type: [string, "null"], maxLength: 100 }
            basisDate: { type: [string, "null"], format: date }
            forms:
              type: array
              items:
                type: object
                properties:
                  formCode: { type: [string, "null"], maxLength: 30 }
                  guaranteeYears: { type: [integer, "null"], minimum: 0, maximum: 30 }
                  joint: { type: [boolean, "null"] }
                  survivorPercent: { type: [number, "null"], minimum: 1, maximum: 100 }
                  escalationPercent: { type: [number, "null"], minimum: 0, maximum: 10 }
                  capitalProtected: { type: [boolean, "null"] }
                  rateBasis: { type: [string, "null"], enum: [UNISEX, BY_SEX, null] }
                  rates:
                    type: array
                    items:
                      type: object
                      properties:
                        sex: { type: [string, "null"], enum: [FEMALE, MALE, null] }
                        age: { type: [integer, "null"], minimum: 0, maximum: 120 }
                        ageDifferenceFrom: { type: [integer, "null"] }
                        ageDifferenceTo: { type: [integer, "null"] }
                        annualRatePerMille: { type: [number, "null"], exclusiveMinimum: 0 }
            frequencies:
              type: array
              items:
                type: object
                properties:
                  frequency: { type: [string, "null"], enum: [MONTHLY, QUARTERLY, SEMI_ANNUAL, ANNUAL, null] }
                  factor: { type: [number, "null"], exclusiveMinimum: 0, maximum: 1 }
            vesting:
              description: >-
                A deferred annuity (product step 5 D2): present only on an ANNUITY version that also
                carries an ACCOUNT accumulation plan, and required on one. The version saves in an
                account until it vests inside minVestingAge..maxVestingAge, then pays an income at the
                rates of the product's current version on that day. Every form's grid must then cover
                the vesting window rather than the entry ages. The default form may not be joint-life.
                surrenderBeforeVesting has no default: the version must say whether it is locked.
              type: [object, "null"]
              properties:
                minVestingAge: { type: [integer, "null"], minimum: 0, maximum: 120 }
                maxVestingAge: { type: [integer, "null"], minimum: 0, maximum: 120 }
                defaultFormCode: { type: [string, "null"], maxLength: 30 }
                defaultFrequency: { type: [string, "null"], enum: [MONTHLY, QUARTERLY, SEMI_ANNUAL, ANNUAL, null] }
                maxCommutationPercent: { type: [number, "null"], minimum: 0, maximum: 100 }
                surrenderBeforeVesting: { type: [boolean, "null"] }
        funeral:
          description: >-
            Required on a FUNERAL version and refused on every other (family funeral cover). The plans a
            customer picks from, each plan's benefit per role (no row = the plan does not cover that role),
            a FIXED yearly premium per plan, role and age band, the role rules, and the claim rules. Every
            age a covered role can reach -- from its youngest entry age to the age its cover stops (a
            student child's, if later), or to maxPricedAge where it never stops -- must be priced exactly
            once, or publishing is refused. A FUNERAL version carries no rating factors or base rates: the
            premium table is its whole price. One main member and one spouse per policy.
          type: [object, "null"]
          properties:
            plans:
              type: array
              items:
                type: object
                properties:
                  planCode: { type: [string, "null"], maxLength: 20 }
                  name: { type: [string, "null"], maxLength: 100 }
                  groupMonthlyRate:
                    type: [number, "null"]
                    exclusiveMinimum: 0
                    description: The group rate per member, per groupRatePeriod, the member's family included; required when soldAs is GROUP or BOTH, absent otherwise
                  groupRatePeriod:
                    type: [string, "null"]
                    enum: [MONTHLY, YEARLY, null]
                    description: What the group rate is per. MONTHLY when absent. YEARLY bills a scheme once a year and fixes its member list while it is in force.
            benefits:
              type: array
              items:
                type: object
                properties:
                  planCode: { type: [string, "null"], maxLength: 20 }
                  role: { type: [string, "null"], enum: [MAIN_MEMBER, SPOUSE, CHILD, PARENT, EXTENDED, null] }
                  benefit: { type: [number, "null"], exclusiveMinimum: 0 }
            premiums:
              type: array
              items:
                type: object
                properties:
                  planCode: { type: [string, "null"], maxLength: 20 }
                  role: { type: [string, "null"], enum: [MAIN_MEMBER, SPOUSE, CHILD, PARENT, EXTENDED, null] }
                  ageFrom: { type: [integer, "null"], minimum: 0 }
                  ageTo: { type: [integer, "null"], minimum: 0 }
                  yearlyPremium:
                    type: [number, "null"]
                    minimum: 0
                    description: Zero for a dependant included in the main member's premium (a flat family rate); a main member's premium must be above zero
            roles:
              type: array
              items:
                type: object
                properties:
                  role: { type: [string, "null"], enum: [MAIN_MEMBER, SPOUSE, CHILD, PARENT, EXTENDED, null] }
                  maxLives: { type: [integer, "null"], minimum: 1 }
                  minEntryAge: { type: [integer, "null"], minimum: 0 }
                  maxEntryAge: { type: [integer, "null"], minimum: 0 }
                  coverStopAge: { type: [integer, "null"], description: "Null = cover never stops for age" }
                  studentStopAge: { type: [integer, "null"], description: "CHILD only: a student child's stop age" }
            maxPricedAge: { type: [integer, "null"], minimum: 1, maximum: 120 }
            waitingPeriodMonths: { type: [integer, "null"], minimum: 1, description: "Null = no waiting period" }
            accidentWaivesWaiting: { type: [boolean, "null"] }
            dependantClaimPayee: { type: [string, "null"], enum: [MAIN_MEMBER, MAIN_MEMBER_BENEFICIARY, null] }
            onMainMemberDeath: { type: [string, "null"], enum: [POLICY_ENDS, SPOUSE_TAKES_OVER, null] }
            freeCoverToPaidDate: { type: [boolean, "null"] }
            soldAs:
              type: [string, "null"]
              enum: [INDIVIDUAL, GROUP, BOTH, null]
              description: Individual policies (priced by the premium table), group schemes (priced at each plan's group rate), or both; absent = INDIVIDUAL
        unitLinked:
          description: >-
            Required on a UNIT_LINKED version and refused on every other (product step 6, U1). The register
            funds the version offers (OPEN funds in the product's currency), the percent of each premium that
            buys units in each policy year (bands from year 1, contiguous, the last open-ended), the monthly
            policy fee, the mortality table the monthly cost of insurance is charged from (it must cover
            minEntryAge to 120), the death and lapse rules (lapseRule defaults to EXHAUSTION), the surrender
            and premium floors per frequency (a frequency with no row is not offered), and the sum-assured
            multiples of the annual premium. A priced (base-rate) version cannot be unit-linked.
          type: [object, "null"]
          properties:
            fundCodes: { type: array, items: { type: string } }
            allocationBands:
              type: array
              items:
                type: object
                properties:
                  fromYear: { type: [integer, "null"], minimum: 1 }
                  toYear: { type: [integer, "null"], description: "Null = onwards" }
                  percent: { type: [number, "null"], minimum: 0, maximum: 100 }
            monthlyPolicyFee: { type: [number, "null"], minimum: 0 }
            mortalityBasis: { type: [string, "null"], enum: [UNISEX, BY_SEX, null] }
            mortality:
              type: array
              items:
                type: object
                properties:
                  ageFrom: { type: [integer, "null"], minimum: 0 }
                  ageTo: { type: [integer, "null"], description: "Null = onwards" }
                  sex: { type: [string, "null"], enum: [FEMALE, MALE, null], description: "Null on a UNISEX table" }
                  annualRatePerMille: { type: [number, "null"], minimum: 0 }
            deathRule: { type: [string, "null"], enum: [HIGHER_OF, SUM_ASSURED_PLUS_FUND, null] }
            lapseRule: { type: [string, "null"], enum: [EXHAUSTION, NON_PAYMENT, null] }
            minimumPremiumYears: { type: [integer, "null"], minimum: 0, description: "Required under NON_PAYMENT" }
            minimumSurrenderYears: { type: [integer, "null"], minimum: 0 }
            lowFundWarningMonths: { type: [integer, "null"], minimum: 0 }
            premiumMinimums:
              type: array
              items:
                type: object
                properties:
                  frequency: { type: [string, "null"], enum: [MONTHLY, QUARTERLY, ANNUALLY, SINGLE, null] }
                  amount: { type: [number, "null"], exclusiveMinimum: 0 }
            sumAssuredMultipleMin: { type: [number, "null"], exclusiveMinimum: 0 }
            sumAssuredMultipleMax: { type: [number, "null"], exclusiveMinimum: 0 }
            options:
              description: >-
                U2, optional: switches (free per policy year and the fee beyond them, both or neither), withdrawals
                (minimum and value left, both or neither; whether one cuts the sum assured), top-ups (allocation
                percent and minimum, both or neither) and surrender-charge bands (from year 1, contiguous, last
                open-ended). Absent = none of them offered. Fixed once the version is published.
              type: [object, "null"]
              properties:
                freeSwitchesPerYear: { type: [integer, "null"], minimum: 0 }
                switchFee: { type: [number, "null"], minimum: 0 }
                minimumWithdrawal: { type: [number, "null"], exclusiveMinimum: 0 }
                minimumRemainingValue: { type: [number, "null"], minimum: 0 }
                withdrawalReducesSumAssured: { type: [boolean, "null"] }
                topUpAllocationPercent: { type: [number, "null"], exclusiveMinimum: 0, maximum: 100 }
                minimumTopUp: { type: [number, "null"], exclusiveMinimum: 0 }
                surrenderCharges:
                  type: [array, "null"]
                  items:
                    type: object
                    properties:
                      fromYear: { type: [integer, "null"], minimum: 1 }
                      toYear: { type: [integer, "null"], description: "Null = onwards" }
                      percent: { type: [number, "null"], minimum: 0, maximum: 100 }
        tiraFiling:
          description: >-
            The TIRA filing that authorises this version. Required: in Tanzania a product and
            its rates must be filed with and approved by TIRA before sale, and a version may
            not exist without it. NOT verified against TIRA -- this records what a human
            asserts, and it does NOT introduce a second approver: one ADMIN can still publish
            alone, now with a reference they typed themselves.
          type: object
          required: [reference, approvalDate]
          properties:
            reference: { type: string, maxLength: 60 }
            approvalDate: { type: string, format: date }
        frequencyLoading:
          description: >-
            What this version charges for paying in instalments rather than once a year.
            Optional: an absent block, or absent percentages, mean a monthly payer is charged
            the same total as an annual one -- a real pricing decision, and what every version
            published before this field existed does. Applied to the ANNUAL premium before it
            is divided into instalments.
          type: object
          properties:
            monthlyPercent: { type: number, minimum: 0, maximum: 100 }
            quarterlyPercent: { type: number, minimum: 0, maximum: 100 }
        ratingTable:
          description: >-
            Multipliers applied on top of the base rate. For factorType AGE, ageFrom and ageTo
            are REQUIRED and are what the platform rates on -- `band` remains as the
            human-readable label but is not matched against. Age was previously resolved by
            exact string equality on `band`, which underwriting could not produce, so age was
            never rated at all. ageFrom/ageTo must be absent for every other factor type.

            sumAssuredFrom/sumAssuredTo are the same for factorType SUM_ASSURED_BAND, and are
            REQUIRED on any such row whose multiplier is not exactly 1. A sum assured used to
            be rated by exact string equality on `band` against one of LOW, MEDIUM or HIGH --
            three values hardcoded in underwriting on thresholds of two and ten million, none
            of them shown on any authoring screen. A real product published with the band
            "5000000" matched none of them and priced every policy as though it carried no sum
            assured factor at all. They must be absent for every other factor type (422).
          type: array
          items:
            type: object
            properties:
              factorType: { type: string, enum: [AGE, OCCUPATION_CLASS, SMOKER_STATUS, SUM_ASSURED_BAND] }
              band: { type: string }
              multiplier: { type: number }
              ageFrom: { type: [integer, "null"], minimum: 0 }
              ageTo:
                description: Inclusive, matching BaseRate.
                type: [integer, "null"]
                minimum: 0
              sumAssuredFrom: { type: [number, "null"], minimum: 0 }
              sumAssuredTo:
                description: Inclusive, matching ageTo and BaseRate.
                type: [number, "null"]
                minimum: 0
        baseRates:
          description: >-
            The rates this version is priced from: the annual rate per 1,000 of sum
            assured for each (age band, sex, smoker status). Multipliers in ratingTable
            apply on top, for occupation class and sum-assured band.

            OPTIONAL. A version published without base rates is valid and sellable but
            cannot be quoted -- GROUP_LIFE is rated on scheme size and cannot populate
            this key at all. When present, ratingTable must NOT carry AGE or
            SMOKER_STATUS factors: those are keys here and would be counted twice
            (422).
          type: array
          items:
            $ref: '#/components/schemas/BaseRate'
        benefitSchedule:
          type: array
          items:
            type: object
            properties:
              benefitType: { type: string, enum: [DEATH, DISABILITY, CRITICAL_ILLNESS, MATURITY, SURRENDER] }
              calculationMethod: { type: string, enum: [SUM_ASSURED, PERCENTAGE_OF_SUM_ASSURED, FLAT_AMOUNT] }
              percent: { type: [number, "null"], description: Set for PERCENTAGE_OF_SUM_ASSURED and null otherwise. }
              flatAmount: { type: [number, "null"], description: Set for FLAT_AMOUNT and null otherwise. }
        fundDefinitions:
          type: [array, "null"]
          description: >-
            Retired (product step 6). A non-empty list is refused with 422 -- funds live in the shared
            register (openapi-unitlinked.yaml) and a version names them in unitLinked.fundCodes.
          items:
            type: object
            properties:
              fundCode: { type: string }
              currentNav: { type: number }
    BaseRate:
      description: >-
        One cell of a version's base rate table. `ageTo` is INCLUSIVE, and the range
        is structured rather than a band string so resolving an applicant's age is a
        comparison, not a parse -- see V3__base_rate_structured_age.sql.
      type: object
      required: [ageFrom, ageTo, sex, smokerStatus, ratePerMille]
      properties:
        ageFrom: { type: integer, minimum: 0 }
        ageTo: { type: integer, minimum: 0 }
        sex: { type: string, enum: [FEMALE, MALE] }
        smokerStatus: { type: string, enum: [SMOKER, NON_SMOKER, UNKNOWN] }
        ratePerMille:
          description: Annual rate per 1,000 of sum assured.
          type: number
          exclusiveMinimum: 0
        termFromMonths:
          description: >-
            Optional lower bound of the policy term this rate is for (V16). Both term bounds
            together or neither; both null means the rate applies to any term.
          type: integer
          minimum: 1
        termToMonths:
          description: Optional upper bound of the policy term, inclusive.
          type: integer
          minimum: 1
    PremiumQuoteRequest:
      description: >-
        Takes dateOfBirth, never a precomputed age: entry age is the input a
        mispriced policy turns on, so it is derived where the rate table lives.
        `occupationClass` and `smokerStatus` are ASSERTED by the caller -- no party
        record carries either.

        There is deliberately no `sumAssuredBand`: it was asserted by the caller and
        matched by string equality against rating_table.band, which is the defect V9
        removed from the issuance path. `sumAssuredAmount` determines the band, and
        the multiplier is resolved from it by range.
      type: object
      required: [sumAssuredAmount, sumAssuredCurrency, dateOfBirth, sex, smokerStatus, occupationClass, frequency]
      properties:
        sumAssuredAmount: { type: number, exclusiveMinimum: 0 }
        sumAssuredCurrency: { type: string, example: TZS }
        dateOfBirth: { type: string, format: date }
        sex: { type: string, enum: [FEMALE, MALE] }
        smokerStatus: { type: string, enum: [SMOKER, NON_SMOKER, UNKNOWN] }
        occupationClass: { type: string }
        # SINGLE carries no frequency loading -- a loading prices the cost of spreading
        # payment across the year, and a single premium spreads nothing. Its instalment is
        # the whole loaded annual figure, charged once, so `instalmentsPerYear` comes back 0
        # rather than 1: there is no recurring period, and a 1 would read as "annually" to
        # any arithmetic that divides by it.
        #
        # The annual figure IS the single premium only while the cover term is twelve months.
        # A single premium over a longer policyTermMonths is refused (422) rather than quoted at
        # the wrong number, until a single-premium basis is added.
        frequency: { type: string, enum: [MONTHLY, QUARTERLY, ANNUALLY, SINGLE] }
        asOf:
          description: Selects the product version. Defaults to today.
          type: [string, "null"]
          format: date
        policyTermMonths:
          description: >-
            The policy term the quote is for (V16). Optional: null prices against unbanded rates
            only and is refused on a term-banded version, the same rule issuance follows.
          type: integer
          minimum: 1
    PremiumQuoteView:
      description: >-
        The premium AND its derivation. The breakdown is returned because
        "reproduce exactly what the customer was shown" is a requirement, and
        without it a UI could only show one by recomputing it. No policy fee is
        included: no product field holds one.
      type: object
      properties:
        productVersionId: { type: string, format: uuid }
        currency: { type: string, example: TZS }
        ageAtEntry: { type: integer }
        ageFrom: { type: integer }
        ageTo: { type: integer }
        ratePerMille: { type: number }
        annualBase: { type: number }
        appliedFactors:
          type: array
          items:
            type: object
            properties:
              factorType: { type: string, enum: [AGE, OCCUPATION_CLASS, SMOKER_STATUS, SUM_ASSURED_BAND] }
              band: { type: string }
              multiplier: { type: number }
        annualAfterFactors: { type: number }
        frequencyLoadingPercent: { type: number }
        annualAfterFrequencyLoading: { type: number }
        # 0 for SINGLE, and the instalment beside it is then the whole premium. See the
        # request schema's own note.
        frequency: { type: string, enum: [MONTHLY, QUARTERLY, ANNUALLY, SINGLE] }
        instalmentsPerYear: { type: integer }
        instalmentAmount: { type: number }
    AnnuityTerms:
      description: An annuity version's forms and payment frequencies (product step 5), without rate rows.
      type: object
      additionalProperties: false
      required: [timing, proofOfLifeIntervalMonths, forms, frequencies, vesting]
      properties:
        timing: { type: string, enum: [ARREARS, ADVANCE] }
        proofOfLifeIntervalMonths: { type: integer }
        forms:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [formCode, guaranteeYears, joint, escalationPercent, capitalProtected, rateBasis]
            properties:
              formCode: { type: string }
              guaranteeYears: { type: integer }
              joint: { type: boolean }
              survivorPercent: { type: [string, "null"], description: "Decimal string, no trailing zeros; null on a single-life form" }
              escalationPercent: { type: string, description: "Decimal string, no trailing zeros" }
              capitalProtected: { type: boolean }
              rateBasis: { type: string, enum: [UNISEX, BY_SEX] }
        frequencies:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [frequency, factor]
            properties:
              frequency: { type: string, enum: [MONTHLY, QUARTERLY, SEMI_ANNUAL, ANNUAL] }
              factor: { type: string, description: "Decimal string, no trailing zeros" }
        vesting:
          description: A deferred annuity's vesting terms (product step 5 D2); null on an immediate annuity.
          type: [object, "null"]
          additionalProperties: false
          required: [minVestingAge, maxVestingAge, defaultFormCode, defaultFrequency, maxCommutationPercent, surrenderBeforeVesting]
          properties:
            minVestingAge: { type: integer }
            maxVestingAge: { type: integer }
            defaultFormCode: { type: string }
            defaultFrequency: { type: string, enum: [MONTHLY, QUARTERLY, SEMI_ANNUAL, ANNUAL] }
            maxCommutationPercent: { type: string, description: "Decimal string, no trailing zeros" }
            surrenderBeforeVesting: { type: boolean }
    UnitLinkedTerms:
      description: A unit-linked version's terms (product step 6, U1). Every rule the unit engine applies, as data.
      type: object
      additionalProperties: false
      required: [unitLinked, fundCodes, allocationBands, monthlyPolicyFee, mortalityBasis, mortality, deathRule, lapseRule,
                 minimumSurrenderYears, lowFundWarningMonths, premiumMinimums, sumAssuredMultipleMin, sumAssuredMultipleMax]
      properties:
        unitLinked: { type: boolean, const: true }
        fundCodes: { type: array, items: { type: string } }
        allocationBands:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [fromYear, percent]
            properties:
              fromYear: { type: integer }
              toYear: { type: [integer, "null"] }
              percent: { type: number }
        monthlyPolicyFee: { type: number }
        mortalityBasis: { type: string, enum: [UNISEX, BY_SEX] }
        mortality:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [ageFrom, annualRatePerMille]
            properties:
              ageFrom: { type: integer }
              ageTo: { type: [integer, "null"] }
              sex: { type: [string, "null"], enum: [FEMALE, MALE, null] }
              annualRatePerMille: { type: number }
        deathRule: { type: string, enum: [HIGHER_OF, SUM_ASSURED_PLUS_FUND] }
        lapseRule: { type: string, enum: [EXHAUSTION, NON_PAYMENT] }
        minimumPremiumYears: { type: [integer, "null"] }
        minimumSurrenderYears: { type: integer }
        lowFundWarningMonths: { type: integer }
        premiumMinimums:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [frequency, amount]
            properties:
              frequency: { type: string, enum: [MONTHLY, QUARTERLY, ANNUALLY, SINGLE] }
              amount: { type: number }
        sumAssuredMultipleMin: { type: number }
        sumAssuredMultipleMax: { type: number }
        options: { $ref: '#/components/schemas/UnitLinkedOptions' }
    UnitLinkedOptions:
      description: >-
        A unit-linked version's U2 terms: switches, withdrawals, top-ups and the surrender charge. A feature whose
        fields are null is not offered; a version published before U2 has every field null and no bands.
      type: object
      additionalProperties: false
      properties:
        freeSwitchesPerYear: { type: [integer, "null"], minimum: 0 }
        switchFee: { type: [number, "null"], description: "Per switch beyond the free ones; with freeSwitchesPerYear or neither" }
        minimumWithdrawal: { type: [number, "null"] }
        minimumRemainingValue: { type: [number, "null"], description: "Value a withdrawal must leave; with minimumWithdrawal or neither" }
        withdrawalReducesSumAssured: { type: boolean, description: "Spec Q4; default false" }
        topUpAllocationPercent: { type: [number, "null"], exclusiveMinimum: 0, maximum: 100 }
        minimumTopUp: { type: [number, "null"], description: "With topUpAllocationPercent or neither" }
        surrenderCharges:
          type: array
          description: From policy year 1, contiguous, the last open-ended; empty = no surrender charge
          items:
            type: object
            additionalProperties: false
            required: [fromYear, percent]
            properties:
              fromYear: { type: integer, minimum: 1 }
              toYear: { type: [integer, "null"] }
              percent: { type: number, minimum: 0, maximum: 100 }
    FuneralTerms:
      description: A funeral plan version's terms (family funeral cover), premium table included.
      type: object
      additionalProperties: false
      required: [plans, benefits, premiums, roles, maxPricedAge, waitingPeriodMonths, accidentWaivesWaiting,
                 dependantClaimPayee, onMainMemberDeath, freeCoverToPaidDate, soldAs]
      properties:
        plans:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [planCode, name, groupMonthlyRate, groupRatePeriod]
            properties:
              planCode: { type: string }
              name: { type: string }
              groupMonthlyRate: { type: [number, "null"], description: "The group rate per member, per groupRatePeriod" }
              groupRatePeriod: { type: string, enum: [MONTHLY, YEARLY] }
        benefits:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [planCode, role, benefit]
            properties:
              planCode: { type: string }
              role: { $ref: '#/components/schemas/FuneralRole' }
              benefit: { type: number }
        premiums:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [planCode, role, ageFrom, ageTo, yearlyPremium]
            properties:
              planCode: { type: string }
              role: { $ref: '#/components/schemas/FuneralRole' }
              ageFrom: { type: integer }
              ageTo: { type: integer }
              yearlyPremium: { type: number }
        roles:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [role, maxLives, minEntryAge, maxEntryAge, coverStopAge, studentStopAge]
            properties:
              role: { $ref: '#/components/schemas/FuneralRole' }
              maxLives: { type: integer }
              minEntryAge: { type: integer }
              maxEntryAge: { type: integer }
              coverStopAge: { type: [integer, "null"] }
              studentStopAge: { type: [integer, "null"] }
        maxPricedAge: { type: integer }
        waitingPeriodMonths: { type: [integer, "null"] }
        accidentWaivesWaiting: { type: boolean }
        dependantClaimPayee: { type: string, enum: [MAIN_MEMBER, MAIN_MEMBER_BENEFICIARY] }
        onMainMemberDeath: { type: string, enum: [POLICY_ENDS, SPOUSE_TAKES_OVER] }
        freeCoverToPaidDate: { type: boolean }
        soldAs: { type: string, enum: [INDIVIDUAL, GROUP, BOTH] }
    FuneralRole:
      type: string
      enum: [MAIN_MEMBER, SPOUSE, CHILD, PARENT, EXTENDED]
    FuneralQuoteRequest:
      type: object
      properties:
        planCode: { type: [string, "null"] }
        frequency: { type: [string, "null"], enum: [MONTHLY, QUARTERLY, ANNUALLY, SINGLE, null] }
        asOf: { type: [string, "null"], format: date, description: "Defaults to today's civil date" }
        lives:
          type: array
          description: Every life, the main member included.
          items:
            type: object
            properties:
              role: { type: [string, "null"], enum: [MAIN_MEMBER, SPOUSE, CHILD, PARENT, EXTENDED, null] }
              name: { type: [string, "null"] }
              dateOfBirth: { type: [string, "null"], format: date }
              student: { type: [boolean, "null"], description: "A child only" }
    FuneralQuote:
      type: object
      additionalProperties: false
      required: [planCode, frequency, lines, totalYearlyPremium, instalment, mainMemberBenefit]
      properties:
        planCode: { type: string }
        frequency: { type: string, enum: [MONTHLY, QUARTERLY, ANNUALLY] }
        lines:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [role, name, age, benefit, yearlyPremium]
            properties:
              role: { $ref: '#/components/schemas/FuneralRole' }
              name: { type: [string, "null"] }
              age: { type: integer }
              benefit: { type: number }
              yearlyPremium: { type: number }
        totalYearlyPremium: { type: number }
        instalment: { type: number, description: "The yearly total loaded for the frequency, divided once, rounded once" }
        mainMemberBenefit: { type: number, description: "The policy's sum assured" }
    VersionRatingView:
      description: The rating basis for one version, for actuarial and product review.
      type: object
      properties:
        productId: { type: string, format: uuid }
        productVersionId: { type: string, format: uuid }
        effectiveDate: { type: string, format: date }
        frequencyLoading:
          description: >-
            What paying in instalments costs. Part of the rating basis an actuary reviews,
            so it belongs here and not only on a quote. Absent percentages mean unloaded --
            a monthly payer charged the same total as an annual one.
          type: object
          properties:
            monthlyPercent: { type: number }
            quarterlyPercent: { type: number }
        tiraFiling:
          description: >-
            The filing that authorises this version, or absent for one published before
            filings were required. Absent is a real answer, not missing data.
          type: object
          properties:
            reference: { type: string }
            approvalDate: { type: string, format: date }
        baseRates:
          type: array
          items: { $ref: '#/components/schemas/BaseRate' }
        ratingFactors:
          description: >-
            The bounds are returned alongside the band because they, not the band text, are
            what the platform rates on -- for AGE since V5 and for SUM_ASSURED_BAND since V9.
            A review screen showing only the label would be showing the part that turned out
            not to decide anything.
          type: array
          items:
            type: object
            properties:
              factorType: { type: string, enum: [AGE, OCCUPATION_CLASS, SMOKER_STATUS, SUM_ASSURED_BAND] }
              band: { type: string }
              multiplier: { type: number }
              ageFrom: { type: [integer, "null"] }
              ageTo: { type: [integer, "null"] }
              sumAssuredFrom: { type: [number, "null"] }
              sumAssuredTo: { type: [number, "null"] }
        benefitSchedule:
          type: array
          items:
            type: object
            properties:
              benefitType: { type: string, enum: [DEATH, DISABILITY, CRITICAL_ILLNESS, MATURITY, SURRENDER] }
              calculationMethod: { type: string, enum: [SUM_ASSURED, PERCENTAGE_OF_SUM_ASSURED, FLAT_AMOUNT] }
              percent: { type: [number, "null"], description: Set for PERCENTAGE_OF_SUM_ASSURED and null otherwise. }
              flatAmount: { type: [number, "null"], description: Set for FLAT_AMOUNT and null otherwise. }
    SetExclusionPeriodsRequest:
      type: object
      additionalProperties: false
      description: >-
        Both fields nullable, and null clears that window -- a product with no such exclusion is
        the normal case and has to stay expressible, which is why neither is required. The 120
        upper bound is not arbitrary: a window longer than a decade is not a policy term, it is a
        typo, and the cost of accepting one is a claim declined years after any assessor would
        defend the decision.
      properties:
        suicideExclusionMonths: { type: [integer, "null"], minimum: 0, maximum: 120 }
        preExistingExclusionMonths: { type: [integer, "null"], minimum: 0, maximum: 120 }
    ProductSnapshot:
      type: object
      properties:
        productId: { type: string, format: uuid }
        productVersionId: { type: string, format: uuid }
        effectiveDate: { type: string, format: date }
        ifrsMeasurementModel:
          type: [string, "null"]
          enum: [GMM, PAA, null]
          deprecated: true
          description: "Retired by IFRS 17 I2; null for a version published since."
        portfolioCode: { $ref: '#/components/schemas/PortfolioCode' }
        profitabilityBucket: { $ref: '#/components/schemas/ProfitabilityBucket' }
        modelOverride:
          description: "Null: the accounting policy register's model applies."
          type: [string, "null"]
          enum: [GMM, VFA, PAA, IFRS9, null]
        survivalInvestmentComponentPercent:
          description: "IFRS 17 I3b: the investment component share (%) of a survival or income instalment; null where not set."
          type: [number, "null"]
        gracePeriodDays: { type: integer }
        maxLoanToValuePercent: { type: number }
        category: { type: string, enum: [TERM_LIFE, ENDOWMENT, WHOLE_LIFE, ANNUITY, UNIT_LINKED, GROUP_LIFE, EDUCATION_SAVINGS, CREDIT_LIFE, FUNERAL] }
        surrenderChargeScheduleJson: { type: [string, "null"], description: Raw JSON surrender-charge schedule from product_version.surrender_charge_schedule; null until a future milestone adds a way to author it. }
        suicideExclusionMonths:
          type: [integer, "null"]
          description: >-
            Months from cover start during which an assessor may cite suicide as a decline reason.
            Null where the product has no such exclusion. An OPEN window is permission to cite a
            reason, never a bar on settlement -- an ordinary death inside one is paid in full,
            because this product has no general waiting period.
        preExistingExclusionMonths:
          type: [integer, "null"]
          description: >-
            The same, for a pre-existing condition. Null where the product has no such exclusion.
        eligibility:
          description: >-
            What this version will accept. Always present; an unbounded version is the object with
            six nulls. Read by the issue screen's gates, where entry age and term are hard refusals
            and sum assured is a soft flag.
          allOf: [{ $ref: '#/components/schemas/EligibilityBounds' }]
