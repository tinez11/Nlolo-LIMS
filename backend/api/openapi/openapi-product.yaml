openapi: 3.1.0
info:
  title: Product Configuration API
  version: "0.1.0-draft"
  description: >
    External REST surface of the `product` module. Product authoring (create/publish
    versions, rating tables) is a staff/actuarial back-office capability; the
    read/catalog side is what customer and agent channels actually consume
    (product browsing, quote calculation inputs).
servers:
  - url: https://api.nlolo-lifeplatform.tz/v1
paths:
  /products:
    get:
      summary: List active products (catalog browsing)
      security:
        - customersAuth: [profile]
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - name: category
          in: query
          schema: { type: string, enum: [TERM_LIFE, ENDOWMENT, WHOLE_LIFE, ANNUITY, UNIT_LINKED, GROUP_LIFE, EDUCATION_SAVINGS, CREDIT_LIFE] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProductSummary' }
    post:
      summary: Create a new product definition (staff/actuarial only)
      security:
        - staffAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProductRequest' }
      responses:
        '201':
          description: Product created (status DRAFT)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductSummary' }
  /products/drafts:
    get:
      summary: List DRAFT products — created but never published (staff/actuarial only)
      description: >-
        Authoring is two phases: create the definition, then publish a version. Only the
        second flips DRAFT to ACTIVE, and `GET /products` returns ACTIVE only — so a product
        whose second phase was abandoned appeared in no list while `ux_product_code` kept
        holding its code. The code was burned and the product could be neither seen nor
        finished. This is the list that makes it reachable, so the publish form can be
        reopened against it.


        A separate path rather than a `status` parameter on `GET /products`, because that
        endpoint answers to customersAuth and agentsAuth: an unlaunched product is not
        something a policyholder or a tied agent gets to enumerate. This one is staff-only
        and, in the implementation, ADMIN-only — the same role that may create a product.
      security:
        - staffAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProductSummary' }
  /products/{productId}:
    get:
      summary: One product by id — its code, name, category and status
      description: >-
        The lookup that turns a product id into a product NAME. Nothing did:
        `/products/{productId}/active-snapshot` takes an id but its view carries pricing and
        eligibility, never the code or the name, and `GET /products` carries both but is
        keyed by nothing. So a caller holding an id had to fetch the whole catalogue and
        scan it, and got nothing at all for a product that is DRAFT or has been retired out
        of the catalogue.


        Every console screen referencing a product it had not itself chosen from a list
        therefore printed the raw uuid: the underwriting queue rendered a column of them,
        and the case detail rail printed one under the label "Product".


        Any status, deliberately — a retired product is the case that needs this most, since
        it is gone from the catalogue while the policies and cases referencing it are still
        on screen. Same security as `GET /products`, and NOT the staff-only gate on
        `/products/drafts`: what that one protects is ENUMERATION of unlaunched products,
        and resolving a single id the caller already holds enumerates nothing.
      security:
        - customersAuth: [profile]
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductSummary' }
        '404':
          description: "`PRODUCT_NOT_FOUND` -- no such product in this tenant"
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /products/{productId}/versions:
    post:
      summary: Publish a new product version (staff/actuarial only)
      description: Rejected with 422 if ifrsMeasurementModel is not set (Deliverable 3 Rev 2 — carried from Deliverable 2 Rev 2's mandatory-before-ACTIVE rule).
      security:
        - staffAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductVersionSpec' }
      responses:
        '201':
          description: Version published
        '422':
          description: Missing ifrsMeasurementModel, incomplete rating-factor coverage, or a fund definition on a non-unit-linked product
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /products/{productId}/active-snapshot:
    get:
      summary: Get the version active as of a given date (used for quoting and rating)
      description: >-
        A product in the catalogue does NOT imply a version in force today. Publishing a
        version flips the definition to ACTIVE whatever its effective date, and a version
        carries a retirement date -- so a product can be listed while its only version
        starts next week, or after every version it ever had has retired. Both are normal
        states of product authoring, not errors in the request.


        Which is why the two 404s below carry different error codes. They were one code
        (`PRODUCT_NOT_FOUND`) and the version lookup ran before the existence check, so
        "its version starts tomorrow" was reported as "no such product" -- and the console,
        which must hedge on a bare 404 because one can be a disguised denial, told a staff
        member the record did not exist or their role forbade it, immediately after they
        clicked it in the catalogue.
      security:
        - customersAuth: [profile]
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: effectiveDate
          in: query
          description: Defaults to today. The date the version is resolved as of.
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductSnapshot' }
        '404':
          description: >-
            `PRODUCT_NOT_FOUND` -- no such product. `NO_ACTIVE_PRODUCT_VERSION` -- the
            product exists and no version of it is in force on that date; the detail names
            the date asked about and, where one is scheduled, the date the next version
            takes effect.
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /products/{productId}/premium-quote:
    post:
      summary: Price a product for one applicant, on the version active as of a date
      description: >-
        200, not 201: nothing is created. Persists nothing, publishes nothing, and
        takes NO Idempotency-Key -- it is a calculation, so replaying it is free and
        there is no duplicate to prevent.

        POST rather than GET despite being a read, because the body carries
        dateOfBirth, sex and smokerStatus; a GET would put those in a URL and
        therefore into access logs, proxy logs and browser history.

        Resolution is STRICT: a version with no base rate table, an age outside every
        band, or a declared occupation class / sum-assured band with no multiplier
        each return 422 naming the dimension. Nothing falls back to a neutral value,
        because a fallback here produces a plausible premium for a real contract and
        nothing fails.
      security:
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PremiumQuoteRequest' }
      responses:
        '200':
          description: Priced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PremiumQuoteView' }
        '401': { $ref: 'openapi-common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { description: "No product, or no version active as of that date" }
        '422': { $ref: 'openapi-common.yaml#/components/responses/UnprocessableEntity' }
  /products/{productId}/versions/{versionId}/rating:
    get:
      summary: The rating basis for one version, for actuarial and product review
      description: >-
        Deliberately separate from ProductSnapshot, which Underwriting and Billing
        read on the issuance and billing path: folding rate tables into it would make
        every consumer carry data exactly one screen needs, and it could not be
        role-scoped because Billing must keep reading it. This is staff-only.
      security:
        - staffAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: versionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionRatingView' }
        '401': { $ref: 'openapi-common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { description: "No such version for that product in this tenant" }
components:
  schemas:
    ProductSummary:
      type: object
      properties:
        productId: { type: string, format: uuid }
        productCode: { type: string }
        productName: { type: string }
        category: { type: string }
        status: { type: string, enum: [DRAFT, ACTIVE, RETIRED] }
        defaultCurrency: { type: string, example: TZS }
    CreateProductRequest:
      type: object
      required: [productCode, productName, category, defaultCurrency]
      properties:
        productCode: { type: string }
        productName: { type: string }
        category: { type: string, enum: [TERM_LIFE, ENDOWMENT, WHOLE_LIFE, ANNUITY, UNIT_LINKED, GROUP_LIFE, EDUCATION_SAVINGS, CREDIT_LIFE] }
        defaultCurrency: { type: string, example: TZS }
    EligibilityBounds:
      description: >-
        What this version will accept. Every bound optional -- an unbounded dimension is a real
        product design, not a gap.

        The bounds are NOT all the same kind of rule, and the gates that consume them differ.
        Entry age is a HARD refusal: base_rate_table is keyed on (age range, sex, smoker status)
        and a quote already 422s with PremiumNotQuotableException when no cell matches, so an
        out-of-range age cannot be priced at all. Term is a HARD refusal too: term is
        staff-entered configuration, and a term the product was not designed for is the wrong
        product. Sum assured is a SOFT flag: above retention is not invalid business, it is what
        reinsurance is for, and the breach is recorded in reasonForManualIssue rather than
        blocked.

        Sum-assured bounds carry no currency -- they are read in the product's own
        defaultCurrency, and a bound in a currency the product does not price in means nothing.
      type: [object, "null"]
      properties:
        minEntryAge: { type: [integer, "null"], minimum: 0, maximum: 120 }
        maxEntryAge: { type: [integer, "null"], minimum: 0, maximum: 120 }
        minTermMonths: { type: [integer, "null"], minimum: 1 }
        maxTermMonths: { type: [integer, "null"], minimum: 1 }
        minSumAssured: { type: [number, "null"], exclusiveMinimum: 0 }
        maxSumAssured: { type: [number, "null"], exclusiveMinimum: 0 }
    ProductVersionSpec:
      type: object
      required: [ifrsMeasurementModel, effectiveDate, ratingTable, benefitSchedule, tiraFiling]
      properties:
        ifrsMeasurementModel: { type: string, enum: [GMM, PAA] }
        effectiveDate: { type: string, format: date }
        retirementDate: { type: [string, "null"], format: date }
        eligibility: { $ref: '#/components/schemas/EligibilityBounds' }
        tiraFiling:
          description: >-
            The TIRA filing that authorises this version. Required: in Tanzania a product and
            its rates must be filed with and approved by TIRA before sale, and a version may
            not exist without it. NOT verified against TIRA -- this records what a human
            asserts, and it does NOT introduce a second approver: one ADMIN can still publish
            alone, now with a reference they typed themselves.
          type: object
          required: [reference, approvalDate]
          properties:
            reference: { type: string, maxLength: 60 }
            approvalDate: { type: string, format: date }
        frequencyLoading:
          description: >-
            What this version charges for paying in instalments rather than once a year.
            Optional: an absent block, or absent percentages, mean a monthly payer is charged
            the same total as an annual one -- a real pricing decision, and what every version
            published before this field existed does. Applied to the ANNUAL premium before it
            is divided into instalments.
          type: object
          properties:
            monthlyPercent: { type: number, minimum: 0, maximum: 100 }
            quarterlyPercent: { type: number, minimum: 0, maximum: 100 }
        ratingTable:
          description: >-
            Multipliers applied on top of the base rate. For factorType AGE, ageFrom and ageTo
            are REQUIRED and are what the platform rates on -- `band` remains as the
            human-readable label but is not matched against. Age was previously resolved by
            exact string equality on `band`, which underwriting could not produce, so age was
            never rated at all. ageFrom/ageTo must be absent for every other factor type.

            sumAssuredFrom/sumAssuredTo are the same for factorType SUM_ASSURED_BAND, and are
            REQUIRED on any such row whose multiplier is not exactly 1. A sum assured used to
            be rated by exact string equality on `band` against one of LOW, MEDIUM or HIGH --
            three values hardcoded in underwriting on thresholds of two and ten million, none
            of them shown on any authoring screen. A real product published with the band
            "5000000" matched none of them and priced every policy as though it carried no sum
            assured factor at all. They must be absent for every other factor type (422).
          type: array
          items:
            type: object
            properties:
              factorType: { type: string, enum: [AGE, OCCUPATION_CLASS, SMOKER_STATUS, SUM_ASSURED_BAND] }
              band: { type: string }
              multiplier: { type: number }
              ageFrom: { type: [integer, "null"], minimum: 0 }
              ageTo:
                description: Inclusive, matching BaseRate.
                type: [integer, "null"]
                minimum: 0
              sumAssuredFrom: { type: [number, "null"], minimum: 0 }
              sumAssuredTo:
                description: Inclusive, matching ageTo and BaseRate.
                type: [number, "null"]
                minimum: 0
        baseRates:
          description: >-
            The rates this version is priced from: the annual rate per 1,000 of sum
            assured for each (age band, sex, smoker status). Multipliers in ratingTable
            apply on top, for occupation class and sum-assured band.

            OPTIONAL. A version published without base rates is valid and sellable but
            cannot be quoted -- GROUP_LIFE is rated on scheme size and cannot populate
            this key at all. When present, ratingTable must NOT carry AGE or
            SMOKER_STATUS factors: those are keys here and would be counted twice
            (422).
          type: array
          items:
            $ref: '#/components/schemas/BaseRate'
        benefitSchedule:
          type: array
          items:
            type: object
            properties:
              benefitType: { type: string, enum: [DEATH, DISABILITY, CRITICAL_ILLNESS, MATURITY, SURRENDER] }
              calculationMethod: { type: string, enum: [SUM_ASSURED, PERCENTAGE_OF_SUM_ASSURED, FLAT_AMOUNT] }
              percent: { type: [number, "null"], description: Set for PERCENTAGE_OF_SUM_ASSURED and null otherwise. }
              flatAmount: { type: [number, "null"], description: Set for FLAT_AMOUNT and null otherwise. }
        fundDefinitions:
          type: [array, "null"]
          description: Only valid when category = UNIT_LINKED.
          items:
            type: object
            properties:
              fundCode: { type: string }
              currentNav: { type: number }
    BaseRate:
      description: >-
        One cell of a version's base rate table. `ageTo` is INCLUSIVE, and the range
        is structured rather than a band string so resolving an applicant's age is a
        comparison, not a parse -- see V3__base_rate_structured_age.sql.
      type: object
      required: [ageFrom, ageTo, sex, smokerStatus, ratePerMille]
      properties:
        ageFrom: { type: integer, minimum: 0 }
        ageTo: { type: integer, minimum: 0 }
        sex: { type: string, enum: [FEMALE, MALE] }
        smokerStatus: { type: string, enum: [SMOKER, NON_SMOKER, UNKNOWN] }
        ratePerMille:
          description: Annual rate per 1,000 of sum assured.
          type: number
          exclusiveMinimum: 0
    PremiumQuoteRequest:
      description: >-
        Takes dateOfBirth, never a precomputed age: entry age is the input a
        mispriced policy turns on, so it is derived where the rate table lives.
        `occupationClass` and `smokerStatus` are ASSERTED by the caller -- no party
        record carries either.

        There is deliberately no `sumAssuredBand`: it was asserted by the caller and
        matched by string equality against rating_table.band, which is the defect V9
        removed from the issuance path. `sumAssuredAmount` determines the band, and
        the multiplier is resolved from it by range.
      type: object
      required: [sumAssuredAmount, sumAssuredCurrency, dateOfBirth, sex, smokerStatus, occupationClass, frequency]
      properties:
        sumAssuredAmount: { type: number, exclusiveMinimum: 0 }
        sumAssuredCurrency: { type: string, example: TZS }
        dateOfBirth: { type: string, format: date }
        sex: { type: string, enum: [FEMALE, MALE] }
        smokerStatus: { type: string, enum: [SMOKER, NON_SMOKER, UNKNOWN] }
        occupationClass: { type: string }
        frequency: { type: string, enum: [MONTHLY, QUARTERLY, ANNUALLY] }
        asOf:
          description: Selects the product version. Defaults to today.
          type: [string, "null"]
          format: date
    PremiumQuoteView:
      description: >-
        The premium AND its derivation. The breakdown is returned because
        "reproduce exactly what the customer was shown" is a requirement, and
        without it a UI could only show one by recomputing it. No policy fee is
        included: no product field holds one.
      type: object
      properties:
        productVersionId: { type: string, format: uuid }
        currency: { type: string, example: TZS }
        ageAtEntry: { type: integer }
        ageFrom: { type: integer }
        ageTo: { type: integer }
        ratePerMille: { type: number }
        annualBase: { type: number }
        appliedFactors:
          type: array
          items:
            type: object
            properties:
              factorType: { type: string, enum: [AGE, OCCUPATION_CLASS, SMOKER_STATUS, SUM_ASSURED_BAND] }
              band: { type: string }
              multiplier: { type: number }
        annualAfterFactors: { type: number }
        frequencyLoadingPercent: { type: number }
        annualAfterFrequencyLoading: { type: number }
        frequency: { type: string, enum: [MONTHLY, QUARTERLY, ANNUALLY] }
        instalmentsPerYear: { type: integer }
        instalmentAmount: { type: number }
    VersionRatingView:
      description: The rating basis for one version, for actuarial and product review.
      type: object
      properties:
        productId: { type: string, format: uuid }
        productVersionId: { type: string, format: uuid }
        effectiveDate: { type: string, format: date }
        frequencyLoading:
          description: >-
            What paying in instalments costs. Part of the rating basis an actuary reviews,
            so it belongs here and not only on a quote. Absent percentages mean unloaded --
            a monthly payer charged the same total as an annual one.
          type: object
          properties:
            monthlyPercent: { type: number }
            quarterlyPercent: { type: number }
        tiraFiling:
          description: >-
            The filing that authorises this version, or absent for one published before
            filings were required. Absent is a real answer, not missing data.
          type: object
          properties:
            reference: { type: string }
            approvalDate: { type: string, format: date }
        baseRates:
          type: array
          items: { $ref: '#/components/schemas/BaseRate' }
        ratingFactors:
          description: >-
            The bounds are returned alongside the band because they, not the band text, are
            what the platform rates on -- for AGE since V5 and for SUM_ASSURED_BAND since V9.
            A review screen showing only the label would be showing the part that turned out
            not to decide anything.
          type: array
          items:
            type: object
            properties:
              factorType: { type: string, enum: [AGE, OCCUPATION_CLASS, SMOKER_STATUS, SUM_ASSURED_BAND] }
              band: { type: string }
              multiplier: { type: number }
              ageFrom: { type: [integer, "null"] }
              ageTo: { type: [integer, "null"] }
              sumAssuredFrom: { type: [number, "null"] }
              sumAssuredTo: { type: [number, "null"] }
        benefitSchedule:
          type: array
          items:
            type: object
            properties:
              benefitType: { type: string, enum: [DEATH, DISABILITY, CRITICAL_ILLNESS, MATURITY, SURRENDER] }
              calculationMethod: { type: string, enum: [SUM_ASSURED, PERCENTAGE_OF_SUM_ASSURED, FLAT_AMOUNT] }
              percent: { type: [number, "null"], description: Set for PERCENTAGE_OF_SUM_ASSURED and null otherwise. }
              flatAmount: { type: [number, "null"], description: Set for FLAT_AMOUNT and null otherwise. }
    ProductSnapshot:
      type: object
      properties:
        productId: { type: string, format: uuid }
        productVersionId: { type: string, format: uuid }
        effectiveDate: { type: string, format: date }
        ifrsMeasurementModel: { type: string, enum: [GMM, PAA] }
        gracePeriodDays: { type: integer }
        maxLoanToValuePercent: { type: number }
        category: { type: string, enum: [TERM_LIFE, ENDOWMENT, WHOLE_LIFE, ANNUITY, UNIT_LINKED, GROUP_LIFE, EDUCATION_SAVINGS, CREDIT_LIFE] }
        surrenderChargeScheduleJson: { type: [string, "null"], description: Raw JSON surrender-charge schedule from product_version.surrender_charge_schedule; null until a future milestone adds a way to author it. }
        eligibility:
          description: >-
            What this version will accept. Always present; an unbounded version is the object with
            six nulls. Read by the issue screen's gates, where entry age and term are hard refusals
            and sum assured is a soft flag.
          allOf: [{ $ref: '#/components/schemas/EligibilityBounds' }]
