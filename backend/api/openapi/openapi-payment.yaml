openapi: 3.1.0
info:
  title: Payments & Disbursements API
  version: "0.1.0-draft"
  description: >
    External REST surface of the `payment` module — deliberately minimal. Per
    Deliverable 2 Rev 2, every payment/disbursement is initiated by an internal
    event (PaymentRequested, LoanDisbursementRequested, ClaimSettlementRequested,
    CommissionPayoutRequested, SurrenderPayoutRequested, MaturityPayoutRequested),
    never by a channel calling `payment` directly to "make a payment." The only
    externally-facing concern is checking status and receiving gateway callbacks.
servers:
  - url: https://api.nlolo-lifeplatform.tz/v1
paths:
  /payments:
    get:
      summary: The payments register -- money in and money out as one list, newest first (collections.view or payouts.view)
      description: >
        2026-10-27. Both ledgers through one read: a collection (IN) or a disbursement (OUT). The state filter speaks the
        work's words -- attention is IN_DOUBT and FAILED, waiting is PENDING and AWAITING_EXECUTION, done is CONFIRMED
        and COMPLETED. policyNumber is recorded from 2026-10-27 on; older rows and commission carry none.
      security:
        - staffAuth: []
      parameters:
        - { name: direction, in: query, required: false, schema: { type: string, enum: [IN, OUT] } }
        - { name: state, in: query, required: false, schema: { type: string, enum: [attention, waiting, done, all] } }
        - { name: policyNumber, in: query, required: false, schema: { type: string } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentRegisterPage' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
  /receipts:
    get:
      summary: The receipts waiting to be confirmed on one invoice, oldest first (collections.view or collections.manage)
      description: >
        2026-10-28. What the invoice shows as in flight, so a receipt is visible where it was recorded and not only in
        somebody else's approvals inbox.
      security:
        - staffAuth: []
      parameters:
        - { name: invoiceId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Receipt' } }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
    post:
      summary: Record a receipt for premium the gateway did not pull (collections.manage)
      description: >
        2026-10-27. Cash, a bank deposit, a cheque, a Lipa-number payment or a TANQR scan, against one invoice. It pays
        nothing until a second person approves it. Refused (409, RECEIPT_REFUSED) for an invoice already paid or
        waived, an amount above what is owed, a future date, a reference already on a live receipt, or -- since
        2026-10-28 -- an amount that, with the receipts already waiting on the invoice, would be more than is owed.
      security:
        - staffAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordReceipt' }
      responses:
        '201':
          description: Recorded, awaiting approval
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '400': { $ref: 'openapi-common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'openapi-common.yaml#/components/responses/Conflict' }
  /receipts/{receiptId}:
    get:
      summary: One recorded receipt (collections.view or collections.manage)
      security:
        - staffAuth: []
      parameters:
        - { name: receiptId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
  /receipts/{receiptId}/approval:
    post:
      summary: Confirm a receipt someone else recorded (collections.approve); the invoice is paid from it
      security:
        - staffAuth: []
      parameters:
        - { name: receiptId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Confirmed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'openapi-common.yaml#/components/responses/Conflict' }
  /receipts/{receiptId}/rejection:
    post:
      summary: Refuse a receipt someone else recorded, saying why (collections.approve); it pays nothing
      security:
        - staffAuth: []
      parameters:
        - { name: receiptId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Refused
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'openapi-common.yaml#/components/responses/Conflict' }
  /payments/{paymentRequestId}/status:
    get:
      summary: Get payment status
      description: >
        Staff/agents only — REALM_CUSTOMERS is deliberately NOT admitted (see Task 8's
        implementation note). payment's tables store only opaque payer_ref/payee_ref and
        source_ref, with no party_id or policy_number column, so there is no way to perform
        the mandatory object-level ownership check a customer token would require
        (openapi-common.yaml:149-154, OWASP API #1). Admitting the realm without that check
        would be a Broken-Object-Level-Authorization hole; this is a deliberate contract
        narrowing versus an earlier design sketch, not an oversight.
      security:
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - name: paymentRequestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentStatusView' }
        '400': { $ref: 'openapi-common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
  /payments/status-by-key:
    get:
      summary: Get payment/disbursement status by idempotency key (Deliverable 3 Rev 2, Pay2 — for clients that lost track of the generated ID, e.g. after a dropped USSD session)
      description: >
        Staff/agents only — same REALM_CUSTOMERS exclusion and reason as
        /payments/{paymentRequestId}/status above. Resolves against BOTH ledgers
        (PaymentStatusView.kind says which one answered).
      security:
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - name: idempotencyKey
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentStatusView' }
        '400': { $ref: 'openapi-common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
  /payout-batches/{batchId}:
    get:
      summary: Get a settlement batch's status (Deliverable 3 Rev 2, Pay1 — commission runs, maturity batches, dividend runs)
      security:
        - staffAuth: []
      parameters:
        - name: batchId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutBatchView' }
        '400': { $ref: 'openapi-common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
  /disbursements:
    get:
      summary: The payouts instructed for one source — a claim reading its own settlement (staff — CLAIMS_ASSESSOR, CLAIMS_MANAGER or FINANCE_OFFICER)
      description: >
        A claim reached SETTLEMENT_REQUESTED and its page said nothing more: whether money had
        moved, by which rail, to whom, or — on an EFT — that it was waiting on a finance officer
        the claims staff could not see. Newest first, and a list, because a failed payout sends
        the claim back to APPROVED and a re-approval instructs again.
      security:
        - staffAuth: []
      parameters:
        - name: purpose
          in: query
          required: true
          schema: { type: string, example: CLAIM_SETTLEMENT }
        - name: sourceRef
          in: query
          required: true
          description: What the payout is for; a claim settlement carries the claim's id.
          schema: { type: string }
      responses:
        '200':
          description: OK — newest first; empty when nothing has been instructed
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DisbursementView' }
        '400': { $ref: 'openapi-common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
  /disbursements/awaiting-execution:
    get:
      summary: Finance's EFT work queue — every payout instructed by bank transfer and not yet confirmed
      description: >
        A credit-life claim pays a lender millions of shillings, so it takes the EFT rail rather
        than the mobile-money gateway (spec §2.9). An EFT has no integration and no callback: it
        is recorded AWAITING_EXECUTION, and a finance officer moves it in the bank's own portal.
        This is how they find out what they owe. Without it the confirm endpoint below would be
        an entry point nobody could navigate to.

        FINANCE_OFFICER, not any staff role — see the confirm endpoint for why.
      security:
        - staffAuth: []
      responses:
        '200':
          description: OK — oldest first, because the oldest unpaid lender payout matters most
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AwaitingEftView' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
  /disbursements/{disbursementId}/eft-execution:
    post:
      summary: Record that finance executed an EFT in the bank, and under which reference
      description: >
        The EFT rail's completion, and the only one it has. The transfer already happened, out of
        band; this call records it and publishes payment.DisbursementCompleted, which settles the
        claim, takes the borrower off cover and books the claims expense to the general ledger.

        FINANCE_OFFICER only, deliberately narrower than the read endpoints on this file: anyone
        who can call this can mark money as having moved when it has not.

        200 rather than 202 — nothing here happens later. Repeating it on an already-confirmed
        EFT is a no-op that publishes nothing, so a finance officer clicking twice does not
        settle a claim twice.
      security:
        - staffAuth: []
      parameters:
        - name: disbursementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarkEftExecutedRequest' }
      responses:
        '200': { description: Recorded }
        '400': { $ref: 'openapi-common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        # The shared Conflict response, which openapi-common describes as "Optimistic-locking
        # conflict or state-machine violation" -- and this is exactly the second of those: the
        # instruction is not awaiting execution, most often because someone tried to
        # hand-complete a mobile-money payout that the gateway owns and no person may confirm.
        # Spelt out inline first, with its own schema ref; that ref named ProblemDetail, which
        # does not exist (openapi-common defines ProblemDetails), and an unresolvable $ref does
        # not fail the file that carries it -- it fails every request the contract test validates
        # against that whole spec. All twelve PaymentContractTest cases errored with
        # "Unable to load API spec", none of them about this endpoint.
        '409': { $ref: 'openapi-common.yaml#/components/responses/Conflict' }
  /webhooks/mobile-money-callback:
    post:
      summary: >
        Inbound gateway callback (Vodacom M-Pesa / Airtel Money / Tigo Pesa). Not part
        of the platform's own OpenAPI contract in the usual sense — each aggregator has
        its own callback payload shape; this endpoint is the ACL boundary translating
        that shape into PaymentConfirmed/PaymentFailed internally. Authenticated via the
        aggregator's own HMAC-SHA256 signature scheme (Task 8's MobileMoneyHmacFilter),
        not Keycloak — this is the one path in the whole platform's filter chain that is
        permitAll() for exactly this method+path, because a differently-authenticated
        caller, not an unauthenticated one, sits in front of it.
      security: []
      parameters:
        - name: X-MobileMoney-Signature
          in: header
          required: true
          schema: { type: string }
          description: >
            hex(HMAC-SHA256(sharedSecret, "<X-MobileMoney-Timestamp>.<raw request body>")).
            Verified with a constant-time comparison; a mismatch is rejected without
            revealing which check failed.
        - name: X-MobileMoney-Timestamp
          in: header
          required: true
          schema: { type: string, format: date-time }
          description: >
            Signed timestamp, checked against a bounded replay window (config:
            mobile-money.callback-replay-window-seconds) — a captured-and-replayed
            callback stops verifying once the window closes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Aggregator-specific payload — see each gateway's own API docs.
      responses:
        '200': { description: Acknowledged. Returned even for a well-formed callback whose gatewayReference is unrecognized or whose outcome could not be applied — a non-200 would only provoke a pointless retry (see Task 8's MobileMoneyCallbackController javadoc). }
        '400': { $ref: 'openapi-common.yaml#/components/responses/BadRequest' }
        '401':
          description: >
            Missing/malformed signature or timestamp header, stale timestamp (outside the
            replay window), or signature mismatch. Deliberately generic — the response body
            never says which check failed.
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
components:
  schemas:
    ReceiptMethod:
      type: string
      enum: [CASH, BANK_DEPOSIT, CHEQUE, LIPA_NUMBER, TANQR]
    RecordReceipt:
      type: object
      additionalProperties: false
      required: [invoiceId, method, reference, amount, receivedOn]
      properties:
        invoiceId: { type: string, format: uuid }
        method: { $ref: '#/components/schemas/ReceiptMethod' }
        reference:
          type: string
          minLength: 1
          maxLength: 100
          description: The method's own reference -- a bank slip, a cheque number, a Lipa or TANQR transaction id.
        amount: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        receivedOn: { type: string, format: date }
        payerRef: { type: [string, 'null'], maxLength: 255 }
        note: { type: [string, 'null'], maxLength: 500 }
        fieldReceiptId:
          type: [string, 'null']
          format: uuid
          description: The agent's field receipt this brings in; it is matched when the receipt is approved.
    Receipt:
      type: object
      additionalProperties: false
      required: [receiptId, method, reference, payerRef, amount, invoiceId, receivedOn, status, recordedBy, recordedAt]
      properties:
        receiptId: { type: string, format: uuid }
        method:
          type: string
          enum: [MOBILE_MONEY, CASH, BANK_DEPOSIT, CHEQUE, LIPA_NUMBER, TANQR]
          description: How it came in. MOBILE_MONEY is a request to the payer's phone, confirmed like any receipt (2026-10-27).
        reference: { type: string }
        payerRef: { type: string }
        amount: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        invoiceId: { type: string, format: uuid }
        policyNumber: { type: [string, 'null'] }
        receivedOn: { type: [string, 'null'], format: date, description: 'The day it was received; null on a mobile-money request' }
        note: { type: [string, 'null'] }
        fieldReceiptId: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [AWAITING_APPROVAL, CONFIRMED, REJECTED] }
        recordedBy: { type: string }
        recordedAt: { type: string, format: date-time }
        decidedBy: { type: [string, 'null'] }
        decidedAt: { type: [string, 'null'], format: date-time }
        decisionReason: { type: [string, 'null'] }
    PaymentRegisterPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PaymentRecord' }
        page: { $ref: 'openapi-common.yaml#/components/schemas/PageMeta' }
    PaymentRecord:
      type: object
      additionalProperties: false
      description: One payment in the register -- a collection (IN) or a disbursement (OUT).
      required: [id, direction, purpose, method, status, amount, counterparty, sourceRef, createdAt]
      properties:
        id: { type: string, format: uuid }
        direction: { type: string, enum: [IN, OUT] }
        purpose: { type: string }
        method: { type: string, enum: [MOBILE_MONEY, EFT, CASH, BANK_DEPOSIT, CHEQUE, LIPA_NUMBER, TANQR] }
        status:
          type: string
          enum: [PENDING, AWAITING_EXECUTION, AWAITING_APPROVAL, IN_DOUBT, CONFIRMED, COMPLETED, FAILED, REJECTED]
        amount: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        counterparty: { type: string, description: Who paid (IN) or who is paid (OUT), as recorded. }
        reference: { type: [string, 'null'], description: The rail's or the bank's reference, once there is one. }
        sourceRef: { type: string, description: The owning record's id -- an invoice, a claim, an instalment. }
        policyNumber: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        executedBy: { type: [string, 'null'] }
        executedAt: { type: [string, 'null'], format: date-time }
    AwaitingEftView:
      type: object
      additionalProperties: false
      description: >
        One bank transfer somebody has to go and make. Deliberately NOT PaymentStatusView, which
        answers "what became of this payment" about a payment the caller already knows about.
        Nothing else on the platform tells a finance officer these exist, so the row carries what
        the act needs: who is paid, what for, how much, and since when.
      required: [disbursementId, amount, payeeRef, sourceRef, waitingSince, method]
      properties:
        disbursementId: { type: string, format: uuid }
        amount: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        payeeRef:
          type: string
          description: >
            The payee as the ordering module recorded them, NOT a resolved name — this platform
            has no party-name lookup on this path, and a printed reference the claim was settled
            against beats an invented name.
        purpose: { type: [string, "null"] }
        sourceRef:
          type: string
          description: What this pays; a claim settlement carries the claim's own reference.
        waitingSince:
          type: string
          format: date-time
          description: >
            When the instruction was raised. Not decoration: every row here is money the insurer
            owes and has not paid, and on a credit-life claim an ageing row is a lender still
            carrying a dead borrower's loan.
        method:
          type: string
          enum: [MOBILE_MONEY, EFT, CHEQUE]
          description: EFT is a bank transfer made in the bank's portal; CHEQUE is written by hand.
        payeeBank: { type: [string, "null"], description: The bank a transfer goes to; null on mobile money and cheques. }
        payeeBranch: { type: [string, "null"] }
        payeeAccountName: { type: [string, "null"] }
        payeeAccountNumber: { type: [string, "null"] }
    DisbursementView:
      type: object
      additionalProperties: false
      description: >
        One payout, as the page that ordered it reads it back. Carries no executedBy: that is
        the finance officer's identity-provider subject, not something to show a person.
      required: [disbursementId, method, status, amount, payeeRef, reference, createdAt, executedAt]
      properties:
        disbursementId: { type: string, format: uuid }
        method:
          type: string
          enum: [MOBILE_MONEY, EFT, CHEQUE]
          description: >
            EFT and CHEQUE wait for a finance officer to make the transfer in the bank and record it;
            mobile money completes when the gateway calls back.
        status:
          type: string
          enum: [PENDING, AWAITING_EXECUTION, IN_DOUBT, COMPLETED, FAILED]
        amount: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        payeeRef: { type: string }
        reference:
          type: [string, "null"]
          description: >
            The gateway's reference on mobile money; on an EFT, the bank's own reference once
            finance records it. Null until then.
        createdAt: { type: string, format: date-time }
        executedAt:
          type: [string, "null"]
          format: date-time
          description: When finance recorded an EFT as made. Null otherwise.
        payeeBank: { type: [string, "null"], description: The bank a transfer goes to; null on mobile money and cheques. }
        payeeBranch: { type: [string, "null"] }
        payeeAccountName: { type: [string, "null"] }
        payeeAccountNumber: { type: [string, "null"] }
    PaymentStatusView:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        idempotencyKey: { type: string }
        kind:
          type: string
          enum: [PAYMENT, DISBURSEMENT]
          description: >
            Which ledger answered. Always PAYMENT for
            /payments/{paymentRequestId}/status; either kind for /payments/status-by-key,
            since that lookup resolves against both ledgers.
        status:
          type: string
          enum: [PENDING, AWAITING_EXECUTION, IN_DOUBT, CONFIRMED, COMPLETED, FAILED]
          description: >
            Union of both ledgers' vocabularies — a payment's success status is CONFIRMED, a
            disbursement's is COMPLETED (see kind to know which applies). PENDING and IN_DOUBT are
            the two NON-terminal states, and the difference between them matters to a client:
            PENDING means the instruction has not reached the rail with any outcome yet, while
            IN_DOUBT means it did reach the rail and the outcome is unknown (a read timeout, or an
            acceptance carrying no gateway reference) — money may or may not have moved. An
            IN_DOUBT row is not final and can still resolve to CONFIRMED/COMPLETED or FAILED when
            the aggregator's asynchronous notification arrives, so a client must not treat it as a
            failure. Added in M5's final review; see db-migrations/payment/V4.

            AWAITING_EXECUTION is the third non-terminal state and belongs to the EFT rail
            alone: the instruction is recorded and posted, and NOTHING has been handed to any
            rail — a person in finance has to move the money in the bank's own portal and
            confirm it. It is deliberately not PENDING, because a payout sitting on somebody's
            desk must not look identical to one the gateway is already working; nothing retries
            it and no callback will ever resolve it. See db-migrations/payment/V6.
        amount: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
    MarkEftExecutedRequest:
      type: object
      additionalProperties: false
      required: [bankReference]
      properties:
        bankReference:
          type: string
          minLength: 1
          description: >
            The bank's own reference for the transfer — what a reconciliation matches against a
            statement line, and the only evidence the platform will ever hold that this payout
            left. Mandatory for exactly that reason: an EFT recorded as executed with nothing to
            look it up by is a claim marked paid on somebody's word.
    PayoutBatchView:
      type: object
      additionalProperties: false
      properties:
        batchId: { type: string, format: uuid }
        batchType: { type: string, enum: [COMMISSION_RUN, MATURITY_BATCH, DIVIDEND_RUN] }
        status: { type: string, enum: [IN_PROGRESS, COMPLETED, PARTIAL_FAILURE] }
        disbursementCount: { type: integer }
        failedCount: { type: integer }
