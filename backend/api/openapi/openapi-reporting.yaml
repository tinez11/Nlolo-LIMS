openapi: 3.1.0
info:
  title: Reporting API
  version: "0.1.0-draft"
  description: >
    Operational and management reports (spec 2026-10-11-reporting-management-design.md). Every report returns
    one shape, ReportResult: sections of typed columns and rows whose values are all strings -- money and counts
    never travel as JSON numbers. Which date parameters a report takes is its dateFilterKind in the catalogue;
    a date parameter the report does not take is refused with 400, never ignored. Read access is
    FINANCE_OFFICER, FINANCE_APPROVER or ADMIN; rebuilding is ADMIN only.
servers:
  - url: https://api.nlolo-lifeplatform.tz/v1
paths:
  /reports/catalogue:
    get:
      summary: Every report this tenant can run, in business order
      security:
        - staffAuth: []
      responses:
        '200':
          description: The catalogue
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReportDefinition' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /reports/{reportKey}:
    get:
      summary: Run a report
      security:
        - staffAuth: []
      parameters:
        - { name: reportKey, in: path, required: true, schema: { type: string } }
        - { name: asOf, in: query, required: false, schema: { type: string, format: date } }
        - { name: compareAsOf, in: query, required: false, schema: { type: string, format: date } }
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
        - { name: cohortFrom, in: query, required: false, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
        - { name: cohortTo, in: query, required: false, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
        - { name: productId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: productCategory, in: query, required: false, schema: { type: string } }
        - { name: agentId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: salesChannel, in: query, required: false, schema: { type: string } }
        - { name: branchCode, in: query, required: false, schema: { type: string } }
        - { name: clientType, in: query, required: false, schema: { $ref: '#/components/schemas/ClientType' } }
        - { name: groupBy, in: query, required: false, schema: { $ref: '#/components/schemas/GroupBy' } }
        - { name: monthFrom, in: query, required: false, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
        - { name: monthTo, in: query, required: false, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
        - { name: accountCode, in: query, required: false, schema: { type: string, pattern: '^[1-9]\d{3}$' } }
        - { name: compareWith, in: query, required: false, schema: { type: string, enum: [PRIOR_PERIOD, SAME_PERIOD_LAST_YEAR, NONE] } }
      responses:
        '200':
          description: The report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /reports/{reportKey}/parts:
    get:
      summary: What one line of a report is made of -- the computation tree
      description: >-
        A statement line opens to its accounts, an account to its sub-accounts or its postings (20 a page). The check
        is the server's sum over ALL the parts, and balanced says whether they equal the line. Takes the same filters
        as the report itself. 404 for a report or line that has no parts.
      security:
        - staffAuth: []
      parameters:
        - { name: reportKey, in: path, required: true, schema: { type: string } }
        - { name: lineId, in: query, required: true, schema: { type: string } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0 } }
        - { name: monthFrom, in: query, required: false, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
        - { name: monthTo, in: query, required: false, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
        - { name: compareWith, in: query, required: false, schema: { type: string, enum: [PRIOR_PERIOD, SAME_PERIOD_LAST_YEAR, NONE] } }
        - { name: accountCode, in: query, required: false, schema: { type: string, pattern: '^[1-9]\d{3}$' } }
      responses:
        '200':
          description: The line's parts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportParts' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /reports/{reportKey}/export:
    get:
      summary: The same report as a file
      description: "Takes every parameter GET /reports/{reportKey} takes, plus format."
      security:
        - staffAuth: []
      parameters:
        - { name: reportKey, in: path, required: true, schema: { type: string } }
        - { name: format, in: query, required: true, schema: { type: string, enum: [xlsx, csv, pdf] } }
        - { name: asOf, in: query, required: false, schema: { type: string, format: date } }
        - { name: compareAsOf, in: query, required: false, schema: { type: string, format: date } }
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
        - { name: cohortFrom, in: query, required: false, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
        - { name: cohortTo, in: query, required: false, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
        - { name: productId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: productCategory, in: query, required: false, schema: { type: string } }
        - { name: agentId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: salesChannel, in: query, required: false, schema: { type: string } }
        - { name: branchCode, in: query, required: false, schema: { type: string } }
        - { name: clientType, in: query, required: false, schema: { $ref: '#/components/schemas/ClientType' } }
        - { name: groupBy, in: query, required: false, schema: { $ref: '#/components/schemas/GroupBy' } }
        - { name: monthFrom, in: query, required: false, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
        - { name: monthTo, in: query, required: false, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
        - { name: accountCode, in: query, required: false, schema: { type: string, pattern: '^[1-9]\d{3}$' } }
        - { name: compareWith, in: query, required: false, schema: { type: string, enum: [PRIOR_PERIOD, SAME_PERIOD_LAST_YEAR, NONE] } }
      responses:
        '200':
          description: The file, as an attachment
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
            text/csv:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /reports/settings/solvency-factors:
    get:
      summary: Every version of the solvency factors, newest first, ending with the built-in placeholder set
      security:
        - staffAuth: []
      responses:
        '200':
          description: The versions
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SolvencyFactorSet' } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      summary: Publish a new version of the solvency factors (reports.solvency-factors)
      description: "A version is never edited: a past month re-runs on the version in force at its end."
      security:
        - staffAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewSolvencyFactorSet' }
      responses:
        '201':
          description: Published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolvencyFactorSet' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /reports/rebuild:
    post:
      summary: Rebuild this tenant's reporting data from the audit journal (ADMIN)
      description: "Runs in the background. A second request while one runs returns the running one."
      security:
        - staffAuth: []
      responses:
        '202':
          description: Started, or already running
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RebuildStatus' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /reports/rebuild/status:
    get:
      summary: The latest rebuild for this tenant
      security:
        - staffAuth: []
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RebuildStatus' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /collections/follow-up:
    get:
      summary: Premiums to follow up -- due today, due soon or overdue, with the client to call and what was done
      description: >
        Staff with collections.view or collections.manage. A policy never activated (an offer) is left out, and so is a
        premium the policy balance or the agent's cash already covers. The three counts are for the same filters, so a
        tab can show how many it holds.
      security:
        - staffAuth: []
      parameters:
        - $ref: '#/components/parameters/FollowUpView'
        - $ref: '#/components/parameters/SoonDays'
        - $ref: '#/components/parameters/LateBand'
        - { name: agentId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: branchCode, in: query, required: false, schema: { type: string } }
        - { name: productId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: search, in: query, required: false, schema: { type: string } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: One page of the list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FollowUpPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /collections/follow-up/export:
    get:
      summary: The same list, every row, as a file (recorded as reporting.ListDownloaded)
      security:
        - staffAuth: []
      parameters:
        - { name: format, in: query, required: true, schema: { type: string, enum: [xlsx, csv, pdf] } }
        - $ref: '#/components/parameters/FollowUpView'
        - $ref: '#/components/parameters/SoonDays'
        - $ref: '#/components/parameters/LateBand'
        - { name: agentId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: branchCode, in: query, required: false, schema: { type: string } }
        - { name: productId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: search, in: query, required: false, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/ListFile' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /agents/me/follow-up:
    get:
      summary: The signed-in agent's premiums to follow up -- the policies their team sold
      security:
        - agentsAuth: [agent]
      parameters:
        - $ref: '#/components/parameters/FollowUpView'
        - $ref: '#/components/parameters/SoonDays'
        - $ref: '#/components/parameters/LateBand'
        - { name: search, in: query, required: false, schema: { type: string } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: One page of the agent's list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FollowUpPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /agents/me/follow-up/export:
    get:
      summary: The agent's list as a file, for a hard copy (recorded as reporting.ListDownloaded)
      security:
        - agentsAuth: [agent]
      parameters:
        - { name: format, in: query, required: true, schema: { type: string, enum: [xlsx, csv, pdf] } }
        - $ref: '#/components/parameters/FollowUpView'
        - $ref: '#/components/parameters/SoonDays'
        - $ref: '#/components/parameters/LateBand'
        - { name: search, in: query, required: false, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/ListFile' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /collections/figures:
    get:
      summary: The collection figures -- of the premiums due in the period, how much is paid, and the rate
      security:
        - staffAuth: []
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: The figures
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionFigures' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
components:
  parameters:
    FollowUpView:
      { name: view, in: query, required: false, schema: { type: string, enum: [DUE_TODAY, DUE_SOON, OVERDUE], default: OVERDUE } }
    SoonDays:
      { name: soonDays, in: query, required: false, schema: { type: integer, enum: [7, 14, 30], default: 7 } }
    LateBand:
      name: lateBand
      in: query
      required: false
      schema: { type: string, enum: ["1–7 days", "8–14 days", "15–30 days", "31–60 days", "61–90 days", "More than 90 days"] }
  responses:
    ListFile:
      description: The file, as an attachment
      content:
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema: { type: string, format: binary }
        text/csv:
          schema: { type: string, format: binary }
        application/pdf:
          schema: { type: string, format: binary }
    Problem:
      description: An error, as RFC 7807 problem details
      content:
        application/problem+json:
          schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  schemas:
    FollowUpAction:
      type: object
      additionalProperties: false
      required: [kind, recordedBy, recordedAt]
      properties:
        kind: { type: string, enum: [CALL, REMINDER, PAYMENT_REQUEST] }
        outcome: { type: [string, "null"], enum: [WILL_PAY, CANNOT_PAY_NOW, NO_ANSWER, WRONG_NUMBER, null] }
        promisedOn: { type: [string, "null"], format: date }
        note: { type: [string, "null"] }
        recordedBy: { type: string }
        recordedAt: { type: string, format: date-time }
    FollowUpRow:
      type: object
      additionalProperties: false
      required: [invoiceId, policyNumber, owed, currency, dueDate, daysLate, actions]
      properties:
        invoiceId: { type: string, format: uuid }
        policyNumber: { type: string }
        clientName: { type: [string, "null"] }
        clientPhone: { type: [string, "null"] }
        productName: { type: [string, "null"] }
        agentId: { type: [string, "null"], format: uuid }
        agentName: { type: [string, "null"] }
        branchCode: { type: [string, "null"] }
        owed: { type: number }
        currency: { type: string }
        dueDate: { type: string, format: date }
        daysLate: { type: integer, description: "0 when not yet late" }
        lateBand: { type: [string, "null"] }
        policyStatus: { type: [string, "null"] }
        lapseExpectedOn: { type: [string, "null"], format: date }
        agentCashHeld: { type: [number, "null"], description: "Cash an agent holds on the policy, less than what is owed" }
        agentCashWith: { type: [string, "null"] }
        actions:
          type: array
          description: "What was done, newest first, at most five"
          items: { $ref: '#/components/schemas/FollowUpAction' }
    FollowUpPage:
      type: object
      additionalProperties: false
      required: [rows, total, page, pageSize, dueToday, dueSoon, overdue, overdueOwed]
      properties:
        rows: { type: array, items: { $ref: '#/components/schemas/FollowUpRow' } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        dueToday: { type: integer }
        dueSoon: { type: integer }
        overdue: { type: integer }
        overdueOwed: { type: number }
    CollectionFigures:
      type: object
      additionalProperties: false
      required: [from, to, due, paid, dueTodayCount, dueTodayOwed, overdueCount, overdueOwed, currency]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        due: { type: number }
        paid: { type: number }
        ratePercent: { type: [string, "null"], description: "paid ÷ due, one decimal; null when nothing fell due" }
        dueTodayCount: { type: integer }
        dueTodayOwed: { type: number }
        overdueCount: { type: integer }
        overdueOwed: { type: number }
        currency: { type: string }
    GroupBy:
      type: string
      enum: [PRODUCT, PRODUCT_CATEGORY, AGENT, CHANNEL, BRANCH]
    ClientType:
      type: string
      enum: [INDIVIDUAL, CORPORATE, GROUP]
    DateFilterKind:
      type: string
      enum: [AS_OF, PERIOD, COHORT, AS_OF_AND_PERIOD, MONTH, MONTH_RANGE]
    ColumnType:
      type: string
      enum: [TEXT, COUNT, MONEY, PERCENT, DATE]
    ReportDefinition:
      type: object
      additionalProperties: false
      required: [key, title, description, category, dateFilterKind, groupByOptions, comparable, requiresAccount, comparesPeriods]
      properties:
        key: { type: string }
        title: { type: string }
        description: { type: string }
        category: { type: string, enum: [MANAGEMENT, ACCOUNTING, CLAIMS, SOLVENCY, REINSURANCE, COMMISSIONS] }
        dateFilterKind: { $ref: '#/components/schemas/DateFilterKind' }
        groupByOptions: { type: array, items: { $ref: '#/components/schemas/GroupBy' } }
        comparable: { type: boolean, description: "Accepts compareAsOf" }
        requiresAccount: { type: boolean, description: "The report is about ONE chart account and cannot run without accountCode. Ask for it beside the other filters rather than submitting and showing the refusal." }
        comparesPeriods: { type: boolean, description: "Takes compareWith: the prior period or the same period last year (2026-11-09)" }
    ReportColumn:
      type: object
      additionalProperties: false
      required: [key, label, type]
      properties:
        key: { type: string }
        label: { type: string }
        type: { $ref: '#/components/schemas/ColumnType' }
    ReportSection:
      type: object
      additionalProperties: false
      required: [title, columns, rows, totals]
      properties:
        title: { type: string }
        columns: { type: array, items: { $ref: '#/components/schemas/ReportColumn' } }
        rows:
          type: array
          items:
            type: object
            additionalProperties: { type: string }
        totals:
          type: object
          description: "Empty when the section has no total row"
          additionalProperties: { type: string }
    ReportResult:
      type: object
      additionalProperties: false
      required: [key, title, filterSummary, generatedAt, sections, figures, notices]
      properties:
        key: { type: string }
        title: { type: string }
        filterSummary: { type: string }
        generatedAt: { type: string, format: date-time }
        sections: { type: array, items: { $ref: '#/components/schemas/ReportSection' } }
        figures: { type: array, items: { $ref: '#/components/schemas/ReportFigure' } }
        chart: { anyOf: [ { type: 'null' }, { $ref: '#/components/schemas/ReportChart' } ] }
        comparisonLabel: { type: [string, 'null'] }
        notices:
          type: array
          description: "What a reader must know before trusting the figures, such as placeholder solvency factors (2026-11-09)"
          items: { type: string }
    ReportFigure:
      type: object
      additionalProperties: false
      required: [key, label, value, lead, unit]
      properties:
        key: { type: string }
        label: { type: string }
        value: { type: string }
        prior: { type: [string, 'null'] }
        change: { type: [string, 'null'] }
        changePercent: { type: [string, 'null'] }
        goodWhen: { type: [string, 'null'], enum: [UP, DOWN, null] }
        lead: { type: boolean }
        unit: { type: string, enum: [MONEY, COUNT, PERCENT, DAYS] }
    ReportChart:
      type: object
      additionalProperties: false
      required: [kind, description, bars, series, unit]
      properties:
        kind: { type: string, enum: [BRIDGE, TREND] }
        unit: { type: string, enum: [MONEY, COUNT, PERCENT], description: "How every value on the chart is written" }
        description: { type: string }
        bars:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [label, value, kind]
            properties:
              label: { type: string }
              value: { type: string }
              kind: { type: string, enum: [START, UP, DOWN, END] }
        series:
          type: array
          description: "A TREND chart's lines; empty on a BRIDGE"
          items:
            type: object
            additionalProperties: false
            required: [label, dashed, points]
            properties:
              label: { type: string }
              dashed: { type: boolean, description: "A projection rather than what happened" }
              points:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [period]
                  properties:
                    period: { type: string }
                    value: { type: [string, 'null'], description: "Null is a gap: nothing to draw for that period" }
    SolvencyCharge:
      type: object
      additionalProperties: false
      required: [key, label, accounts, percent]
      properties:
        key: { type: string }
        label: { type: string }
        accounts: { type: array, items: { type: string } }
        percent: { type: number, description: "A rate in per cent: 4 is four per cent" }
    SolvencyThreshold:
      type: object
      additionalProperties: false
      required: [key, label, ratioPercent]
      properties:
        key: { type: string }
        label: { type: string }
        ratioPercent: { type: number }
    SolvencyShock:
      type: object
      additionalProperties: false
      required: [key, label, kind, accounts]
      properties:
        key: { type: string }
        label: { type: string }
        kind: { type: string, enum: [ASSETS, INSURANCE, LOSS] }
        accounts: { type: array, items: { type: string } }
        percent: { type: [number, 'null'] }
        amount: { type: [number, 'null'] }
    SolvencyFactors:
      type: object
      additionalProperties: false
      required: [insurance, market, credit, operationalPercent, inadmissible, combination, thresholds, shocks]
      properties:
        insurance: { type: array, items: { $ref: '#/components/schemas/SolvencyCharge' } }
        market: { type: array, items: { $ref: '#/components/schemas/SolvencyCharge' } }
        credit: { type: array, items: { $ref: '#/components/schemas/SolvencyCharge' } }
        operationalPercent: { type: number }
        inadmissible: { type: array, items: { type: string } }
        combination: { type: string, enum: [ROOT_SUM_OF_SQUARES, SIMPLE_SUM] }
        thresholds: { type: array, items: { $ref: '#/components/schemas/SolvencyThreshold' } }
        shocks: { type: array, items: { $ref: '#/components/schemas/SolvencyShock' } }
    SolvencyFactorSet:
      type: object
      additionalProperties: false
      required: [version, name, effectiveFrom, placeholder, factors]
