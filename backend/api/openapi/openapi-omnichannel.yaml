openapi: 3.1.0
info:
  title: Customer Documents API
  version: "0.1.0-draft"
  description: >
    The documents a customer can ask for (2026-10-07): a policy's premium payment schedule and a savings plan's
    account statement, as JSON for the console's tables and as PDF or Excel to hand over. Staff read any policy in
    their tenant; a customer only their own (the token's party_id must be the policyholder).
servers:
  - url: https://api.nlolo-lifeplatform.tz/v1
paths:
  /policies/{policyNumber}/payment-schedule:
    get:
      summary: A policy's premium payment schedule
      description: >-
        Every premium due, oldest first, with what was paid against it, the day the last payment arrived, the
        receipt references and who paid, its status (Paid, Partly paid, Due, Upcoming, In grace, Overdue, Waived)
        and its balance; and the totals -- charged, paid, outstanding now, still to come, and the next payment.
      security:
        - staffAuth: []
        - customersAuth: [profile]
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentSchedule' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
  /policies/{policyNumber}/payment-schedule/{format}:
    get:
      summary: The payment schedule as a PDF or Excel file
      security:
        - staffAuth: []
        - customersAuth: [profile]
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        - { name: format, in: path, required: true, schema: { type: string, enum: [pdf, xlsx] } }
      responses:
        '200':
          description: The file
          content:
            application/pdf: { schema: { type: string, format: binary } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
  /policies/{policyNumber}/savings-statement:
    get:
      summary: A savings plan's account statement for a period
      description: >-
        Every entry in the period in date order with money in, money out and the balance after it, framed by the
        opening and closing balance, and each kind of movement totalled. 404 for a policy with no savings account.
      security:
        - staffAuth: []
        - customersAuth: [profile]
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavingsStatement' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
  /policies/{policyNumber}/savings-statement/{format}:
    get:
      summary: The savings statement as a PDF or Excel file
      security:
        - staffAuth: []
        - customersAuth: [profile]
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        - { name: format, in: path, required: true, schema: { type: string, enum: [pdf, xlsx] } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: The file
          content:
            application/pdf: { schema: { type: string, format: binary } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
  /policies/{policyNumber}/policy-schedule/pdf:
    get:
      summary: The policy schedule, as a PDF
      description: >-
        What the policy is on one page (2026-10-08, customer portal step 3): who holds it and who it insures, what it
        pays (each covered life on a funeral plan), the beneficiaries, the premium, and what a savings plan is worth.
        Staff any policy; a customer their own.
      security:
        - staffAuth: []
        - customersAuth: [profile]
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
      responses:
        '200':
          description: The file
          content:
            application/pdf: { schema: { type: string, format: binary } }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
  /policies/{policyNumber}/receipts:
    get:
      summary: Every premium received on the policy, newest first
      security:
        - staffAuth: []
        - customersAuth: [profile]
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReceiptLine' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
  /policies/{policyNumber}/receipts/{receiptId}/pdf:
    get:
      summary: One premium receipt, as a PDF
      security:
        - staffAuth: []
        - customersAuth: [profile]
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        - name: receiptId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The file
          content:
            application/pdf: { schema: { type: string, format: binary } }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
  /parties/{partyId}/portal-access:
    parameters:
      - name: partyId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: A client's customer-portal access
      description: NOT_INVITED, INVITED (a login exists, never signed in), ACTIVE (has signed in) or REVOKED.
      security:
        - staffAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalAccess' }
    post:
      summary: Invite a client to the customer portal (customer service or admin)
      description: >-
        Creates the client's login in the customers realm with their tenant and party written on by the platform
        (2026-10-08, the customer portal design step 1). With an email the identity provider sends its set-your-password
        link; without one the response carries a one-time password, shown to the staff member once and kept nowhere.
        A revoked client is invited again on the same login. 422 for a corporate client, a client holding no policy,
        or one with no email or phone; 409 when access is already open.
      security:
        - staffAuth: []
      responses:
        '201':
          description: Invited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalInvite' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '409':
          description: Access is already open
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
        '422':
          description: The client cannot be invited
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
    delete:
      summary: Revoke a client's portal access (customer service or admin)
      security:
        - staffAuth: []
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalAccess' }
  /parties/{partyId}/portal-access/resend:
    post:
      summary: Send the set-your-password link again, or issue a new one-time password
      security:
        - staffAuth: []
      parameters:
        - name: partyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalInvite' }
  /customer/me:
    get:
      summary: The signed-in customer
      description: >-
        The client record the token's party_id names -- never one the request chooses. The portal's first call after
        sign-in, so it also marks the invite used.
      security:
        - customersAuth: [profile]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [partyId, displayName, email, phoneNumber]
                properties:
                  partyId: { type: string, format: uuid }
                  displayName: { type: string }
                  email: { type: [string, "null"] }
                  phoneNumber: { type: [string, "null"] }
  /customer/dashboard:
    get:
      summary: The signed-in customer's dashboard
      description: >-
        Policies held, in-force count, the earliest premium due, claims in progress and what savings and unit-linked
        plans are worth -- for the token's own party only (2026-10-08, customer portal step 2). accountValue and
        nextPremium are null when they do not apply.
      security:
        - customersAuth: [profile]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerDashboard' }
  /customer/policies/{policyNumber}:
    get:
      summary: One of the signed-in customer's policies, customer-safe
      description: >-
        Names rather than ids, and nothing a staff member alone sees. 403 for a policy the customer does not hold.
        The blocks that do not apply to the product are null.
      security:
        - customersAuth: [profile]
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerPolicy' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
  /customer/products:
    get:
      summary: The products offered online
      security:
        - customersAuth: [profile]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CustomerProduct' }
  /customer/products/{productId}/quote:
    post:
      summary: An indicative price on the customer's own details
      description: >-
        Their age, sex and smoker status as we hold them. Not an offer -- underwriting may load or decline. 422 when the
        product is priced by an adviser or their details are missing; 404 for a product not offered online.
      security:
        - customersAuth: [profile]
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sumAssured]
              properties:
                sumAssured: { type: number }
                frequency: { type: [string, "null"], enum: [MONTHLY, QUARTERLY, ANNUALLY, null] }
                termYears: { type: [integer, "null"] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerQuote' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '422':
          description: Cannot be priced online
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /customer/applications:
    get:
      summary: What the customer has asked for
      security:
        - customersAuth: [profile]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CustomerApplication' }
    post:
      summary: Ask for a product
      description: >-
        Opens an application (an underwriting case) with the customer as applicant and life insured, on the version on
        sale today. 409 while one for the same product is still being reviewed.
      security:
        - customersAuth: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId: { type: string, format: uuid }
                sumAssured: { type: [number, "null"] }
                frequency: { type: [string, "null"] }
                termYears: { type: [integer, "null"] }
      responses:
        '201':
          description: Asked for
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerApplication' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '409':
          description: Already asked for
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
components:
  securitySchemes:
    staffAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.nlolo-lifeplatform.tz/realms/staff/protocol/openid-connect/auth
          tokenUrl: https://auth.nlolo-lifeplatform.tz/realms/staff/protocol/openid-connect/token
          scopes: {}
    customersAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.nlolo-lifeplatform.tz/realms/customers/protocol/openid-connect/auth
          tokenUrl: https://auth.nlolo-lifeplatform.tz/realms/customers/protocol/openid-connect/token
          scopes:
            profile: The customer's own records
  schemas:
    ReceiptLine:
      type: object
      additionalProperties: false
      required: [receiptId, receivedOn, amount, currency, reference, paidBy, coversFrom, coversTo]
      properties:
        receiptId: { type: string, format: uuid }
        receivedOn: { type: string, format: date }
        amount: { type: number }
        currency: { type: string }
        reference: { type: [string, "null"] }
        paidBy: { type: [string, "null"] }
        coversFrom: { type: [string, "null"], format: date, description: "First day of cover the premium paid for" }
        coversTo: { type: [string, "null"], format: date, description: "Last day of cover the premium paid for" }
    CustomerAmount:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount: { type: number }
        currency: { type: [string, "null"] }
    CustomerPolicySummary:
      type: object
      additionalProperties: false
      required: [policyNumber, productName, productCategory, status, sumAssured, currency, premium, premiumFrequency,
                 nextDueDate, nextDueAmount, value]
      properties:
        policyNumber: { type: string }
        productName: { type: [string, "null"] }
        productCategory: { type: [string, "null"] }
        status: { type: string }
        sumAssured: { type: [number, "null"] }
        currency: { type: [string, "null"] }
        premium: { type: [number, "null"] }
        premiumFrequency: { type: [string, "null"] }
        nextDueDate: { type: [string, "null"], format: date }
        nextDueAmount: { type: [number, "null"] }
        value: { type: [number, "null"], description: "A savings balance or unit-linked fund value; null on cover alone" }
    CustomerDashboard:
      type: object
      additionalProperties: false
      required: [displayName, activePolicies, claimsInProgress, nextPremium, accountValue, policies]
      properties:
        displayName: { type: string }
        activePolicies: { type: integer }
        claimsInProgress: { type: integer }
        nextPremium:
          anyOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [policyNumber, productName, amount, currency, dueDate, status]
              properties:
                policyNumber: { type: string }
                productName: { type: [string, "null"] }
                amount: { type: number }
                currency: { type: string }
                dueDate: { type: string, format: date }
                status: { type: string }
        accountValue:
          anyOf:
            - type: 'null'
            - $ref: '#/components/schemas/CustomerAmount'
        policies:
          type: array
          items: { $ref: '#/components/schemas/CustomerPolicySummary' }
    CustomerPolicy:
      type: object
      additionalProperties: false
      required: [summary, lifeAssuredName, commencementDate, maturityDate, termMonths, beneficiaries, coveredLives,
                 savings, units, annuity, claims]
      properties:
        summary: { $ref: '#/components/schemas/CustomerPolicySummary' }
        lifeAssuredName: { type: [string, "null"] }
        commencementDate: { type: [string, "null"], format: date }
        maturityDate: { type: [string, "null"], format: date }
        termMonths: { type: [integer, "null"] }
        beneficiaries:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, sharePercent]
            properties:
              name: { type: [string, "null"] }
              sharePercent: { type: [number, "null"] }
        coveredLives:
          type: [array, "null"]
          items:
            type: object
            additionalProperties: false
            required: [name, role, benefit, status, waitingPeriodEnds]
            properties:
              name: { type: string }
              role: { type: string }
              benefit: { type: [number, "null"] }
              status: { type: string }
              waitingPeriodEnds: { type: [string, "null"], format: date }
        savings:
          anyOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [balance, currency, status, openedOn]
              properties:
                balance: { type: number }
                currency: { type: string }
                status: { type: string }
                openedOn: { type: [string, "null"], format: date }
        units:
          anyOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [totalValue, currency, holdings]
              properties:
                totalValue: { type: [number, string, "null"] }
                currency: { type: [string, "null"] }
                holdings:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [fundName, units, price, priceDate, value]
                    properties:
                      fundName: { type: [string, "null"] }
                      units: { type: [number, "null"] }
                      price: { type: [number, "null"] }
                      priceDate: { type: [string, "null"], format: date }
                      value: { type: [number, "null"] }
        annuity:
          anyOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [status, annualIncome, instalment, frequency, firstPaymentDate, guaranteedUntil, purchasePrice, currency]
              properties:
                status: { type: string }
                annualIncome: { type: [number, "null"] }
                instalment: { type: [number, "null"] }
                frequency: { type: [string, "null"] }
                firstPaymentDate: { type: [string, "null"], format: date }
                guaranteedUntil: { type: [string, "null"], format: date }
                purchasePrice: { type: [number, "null"] }
                currency: { type: [string, "null"] }
        claims:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [claimId, claimType, status, dateOfEvent, approvedAmount, currency]
            properties:
              claimId: { type: string, format: uuid }
              claimType: { type: string }
              status: { type: string }
              dateOfEvent: { type: string, format: date }
              approvedAmount: { type: [number, "null"] }
              currency: { type: [string, "null"] }
    CustomerProduct:
      type: object
      additionalProperties: false
      required: [productId, productName, category, currency, summary, benefits, quotable]
      properties:
        productId: { type: string, format: uuid }
        productName: { type: string }
        category: { type: string }
        currency: { type: string }
        summary: { type: [string, "null"] }
        benefits: { type: array, items: { type: string } }
        quotable: { type: boolean, description: Priced here from a sum assured; otherwise an adviser prices it }
    CustomerQuote:
      type: object
      additionalProperties: false
      required: [productId, productName, currency, sumAssured, frequency, instalment, yearly, ageAtEntry]
      properties:
        productId: { type: string, format: uuid }
        productName: { type: string }
        currency: { type: string }
        sumAssured: { type: number }
        frequency: { type: string }
        instalment: { type: number }
        yearly: { type: number }
        ageAtEntry: { type: integer }
    CustomerApplication:
      type: object
      additionalProperties: false
      required: [caseId, proposalNumber, productId, productName, sumAssured, currency, status, statusText]
      properties:
        caseId: { type: string, format: uuid }
        proposalNumber: { type: [string, "null"] }
        productId: { type: string, format: uuid }
        productName: { type: [string, "null"] }
        sumAssured: { type: [number, "null"] }
        currency: { type: [string, "null"] }
        status: { type: string }
        statusText: { type: string }
    PortalAccess:
      type: object
      additionalProperties: false
      required: [partyId, status, username, delivery, invitedBy, invitedAt, activatedAt, revokedBy, revokedAt]
      properties:
        partyId: { type: string, format: uuid }
        status: { type: string, enum: [NOT_INVITED, INVITED, ACTIVE, REVOKED] }
        username: { type: [string, "null"] }
        delivery: { type: [string, "null"], enum: [EMAIL_LINK, TEMPORARY_PASSWORD, null] }
        invitedBy: { type: [string, "null"] }
        invitedAt: { type: [string, "null"], format: date-time }
        activatedAt: { type: [string, "null"], format: date-time }
        revokedBy: { type: [string, "null"] }
        revokedAt: { type: [string, "null"], format: date-time }
    PortalInvite:
      type: object
      additionalProperties: false
      required: [access, temporaryPassword]
      properties:
        access: { $ref: '#/components/schemas/PortalAccess' }
        temporaryPassword:
          type: [string, "null"]
          description: The one-time password for a client with no email; shown once, stored nowhere. Null when emailed.
    PaymentSchedule:
      type: object
      additionalProperties: false
      required: [policyNumber, policyholderName, productName, policyStatus, premium, premiumFrequency, currency,
                 coverStart, lines, totals]
      properties:
        policyNumber: { type: string }
        policyholderName: { type: [string, "null"] }
        productName: { type: [string, "null"] }
        policyStatus: { type: [string, "null"] }
        premium: { type: [number, "null"] }
        premiumFrequency: { type: [string, "null"] }
        currency: { type: [string, "null"] }
        coverStart: { type: [string, "null"], format: date }
        lines:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [number, invoiceId, dueDate, amountDue, amountPaid, paidOn, receipts, paidBy, status, balance]
            properties:
              number: { type: integer }
              invoiceId: { type: string, format: uuid }
              dueDate: { type: string, format: date }
              amountDue: { type: number }
              amountPaid: { type: number }
              paidOn: { type: [string, "null"], format: date }
              receipts: { type: [string, "null"], description: "Receipt references, comma-separated" }
              paidBy: { type: [string, "null"], description: "Who paid (a phone number, cash), comma-separated" }
              status: { type: string, enum: [Paid, Partly paid, Due, Upcoming, In grace, Overdue, Waived] }
              balance: { type: number }
        totals:
          type: object
          additionalProperties: false
          required: [charged, paid, outstanding, upcoming, nextDueDate, nextDueAmount]
          properties:
            charged: { type: number }
            paid: { type: number }
            outstanding: { type: number, description: "Unpaid on premiums already due" }
            upcoming: { type: number, description: "Unpaid on premiums not yet due" }
            nextDueDate: { type: [string, "null"], format: date }
            nextDueAmount: { type: [number, "null"] }
    SavingsStatement:
      type: object
      additionalProperties: false
      required: [policyNumber, policyholderName, productName, currency, periodFrom, periodTo, openingBalance,
                 closingBalance, lines, totals]
      properties:
        policyNumber: { type: string }
        policyholderName: { type: [string, "null"] }
        productName: { type: [string, "null"] }
        currency: { type: string }
        periodFrom: { type: string, format: date }
        periodTo: { type: string, format: date }
        openingBalance: { type: number }
        closingBalance: { type: number }
        lines:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [date, description, moneyIn, moneyOut, balance]
            properties:
              date: { type: string, format: date }
              description: { type: string }
