openapi: 3.1.0
info:
  title: Customer Documents API
  version: "0.1.0-draft"
  description: >
    The documents a customer can ask for (2026-10-07): a policy's premium payment schedule and a savings plan's
    account statement, as JSON for the console's tables and as PDF or Excel to hand over. Staff read any policy in
    their tenant; a customer only their own (the token's party_id must be the policyholder).
servers:
  - url: https://api.nlolo-lifeplatform.tz/v1
paths:
  /quotations/scheme/pdf:
    post:
      summary: A group funeral scheme quotation an association can sign and keep, before the scheme is proposed
      description: >
        Drawn like every customer document: the association and the plan with its group rate in two columns, a line
        per member with the family's cover, the bill (the plan's group rate per member, as issuance charges it) and the
        scheme's total cover, what each role on a family is covered for, and signature lines for the association and
        an authorised officer. Inputs only; priced on the server by the product module's group funeral quote. Nothing
        is stored.


        422 while any family is one the plan will not take -- the proposal would refuse the whole scheme -- naming
        each member's problem. An agent may quote only for an association it registered; any other is a 404.
      security:
        - agentsAuth: []
        - staffAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchemeQuotationRequest' }
      responses:
        '200':
          description: The scheme quotation
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: 'openapi-common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '422':
          description: Cannot be quoted as entered
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /quotations/pdf:
    post:
      summary: A quotation an applicant can sign and keep, before any case exists
      description: >
        The open-case form's quotation as a customer document, drawn like the policy schedule: the issuer and title,
        the proposer and the product in two columns, what the cover pays (a line per life on a funeral plan), the
        totals in the quotation panel's own words -- Premium, Annual equivalent, Total over N years with its number of
        payments -- then the notes and the applicant's and the authorised officer's signature lines.


        INPUTS ONLY. No premium, total or benefit is accepted: every figure is quoted again on the server -- a premium
        from the version's rate table with the applicant's own date of birth, sex, smoker status and occupation class
        read from their record, a family from the plan's grid, a deposit from its band -- because an applicant signs
        this. Nothing is recorded: no quotation row, no case, no stored document.


        An agent may quote only for a client it registered; any other applicant is a 404. 422 when the product cannot
        be priced as entered (the quoter's own reason), or for a product whose price comes from terms this form does
        not collect -- an annuity, a unit-linked policy, a group scheme.
      security:
        - agentsAuth: []
        - staffAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuotationRequest' }
      responses:
        '200':
          description: The quotation
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: 'openapi-common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '422':
          description: Cannot be quoted as entered
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /agent-quotations:
    post:
      summary: The customer agrees -- save the quotation they accepted
      description: >
        The FIRST write in the agents' prospect-to-proposal flow (2026-10-20): quoting, changing the inputs and
        downloading the PDF store nothing; this is called only when the agent confirms that the customer agrees. The
        same inputs as the quotation PDF -- never a figure -- priced again on the server, and saved with those figures
        and the date. Discarded by the agent's cancel or, if never submitted as a proposal, at the end of the day.
        An agent may quote a registered client only if it registered them (404 otherwise); 422 for a product or input
        the quotation cannot price, or a deposit on a term or amount it does not take.
      security:
        - agentsAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuotationRequest' }
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentQuotation' }
        '401': { $ref: 'openapi-common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '422':
          description: Cannot be quoted as entered
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /agent-quotations/{quotationId}:
    parameters:
      - { name: quotationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: One of the caller's own saved quotations -- what onboarding is filled in from
      security:
        - agentsAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentQuotation' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
    delete:
      summary: The customer did not go ahead -- discard the saved quotation
      description: 422 once a proposal was opened from it; it is then kept with the proposal.
      security:
        - agentsAuth: []
      responses:
        '204': { description: Discarded }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '422':
          description: Already submitted
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /agent-quotations/{quotationId}/proposal:
    parameters:
      - { name: quotationId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Submit the saved quotation as a proposal to the underwriter
      description: >
        Opens an underwriting case for the registered customer from the SAVED quotation -- its product version, sum
        assured, term, frequency and (for a funeral plan) family -- nothing typed again, and links the case to it. The
        customer must be one the agent registered, and the one quoted where the quotation was for a registered client.
      security:
        - agentsAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [applicantPartyId]
              properties:
                applicantPartyId: { type: string, format: uuid }
      responses:
        '201':
          description: Submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentQuotation' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '422':
          description: Cannot be proposed as quoted
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /policies/{policyNumber}/payment-schedule:
    get:
      summary: A policy's premium payment schedule
      description: >-
        Every premium due, oldest first, with what was paid against it, the day the last payment arrived, the
        receipt references and who paid, its status (Paid, Partly paid, Due, Upcoming, In grace, Overdue, Waived)
        and its balance; and the totals -- charged, paid, outstanding now, still to come, and the next payment.
      security:
        - staffAuth: []
        - customersAuth: [profile]
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentSchedule' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
  /policies/{policyNumber}/payment-schedule/{format}:
    get:
      summary: The payment schedule as a PDF or Excel file
      security:
        - staffAuth: []
        - customersAuth: [profile]
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        - { name: format, in: path, required: true, schema: { type: string, enum: [pdf, xlsx] } }
      responses:
        '200':
          description: The file
          content:
            application/pdf: { schema: { type: string, format: binary } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
  /policies/{policyNumber}/savings-statement:
    get:
      summary: A savings plan's account statement for a period
      description: >-
        Every entry in the period in date order with money in, money out and the balance after it, framed by the
        opening and closing balance, and each kind of movement totalled. 404 for a policy with no savings account.
      security:
        - staffAuth: []
        - customersAuth: [profile]
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavingsStatement' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
  /policies/{policyNumber}/savings-statement/{format}:
    get:
      summary: The savings statement as a PDF or Excel file
      security:
        - staffAuth: []
        - customersAuth: [profile]
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        - { name: format, in: path, required: true, schema: { type: string, enum: [pdf, xlsx] } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: The file
          content:
            application/pdf: { schema: { type: string, format: binary } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
  /policies/{policyNumber}/policy-schedule/pdf:
    get:
      summary: The policy schedule, as a PDF
      description: >-
        What the policy is on one page (2026-10-08, customer portal step 3): who holds it and who it insures, what it
        pays (each covered life on a funeral plan), the beneficiaries, the premium, and what a savings plan is worth.
        Staff any policy; a customer their own.
      security:
        - staffAuth: []
        - customersAuth: [profile]
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
      responses:
        '200':
          description: The file
          content:
            application/pdf: { schema: { type: string, format: binary } }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
  /policies/{policyNumber}/deposit-schedule/pdf:
    get:
      summary: A fixed-term deposit's schedule as a PDF
      description: >-
        The running term, what it pays at maturity, and what it would pay if closed early at each month (2026-10-09).
        Staff, or the customer for a policy they hold. 400 for a policy that is not a deposit or has no term running.
      security:
        - staffAuth: []
        - customersAuth: [profile]
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
      responses:
        '200':
          description: The PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '400': { $ref: 'openapi-common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
  /policies/{policyNumber}/receipts:
    get:
      summary: Every premium received on the policy, newest first
      security:
        - staffAuth: []
        - customersAuth: [profile]
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReceiptLine' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
  /policies/{policyNumber}/receipts/{receiptId}/pdf:
    get:
      summary: One premium receipt, as a PDF
      security:
        - staffAuth: []
        - customersAuth: [profile]
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        - name: receiptId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The file
          content:
            application/pdf: { schema: { type: string, format: binary } }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
  /parties/{partyId}/portal-access:
    parameters:
      - name: partyId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: A client's customer-portal access
      description: NOT_INVITED, INVITED (a login exists, never signed in), ACTIVE (has signed in) or REVOKED.
      security:
        - staffAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalAccess' }
    post:
      summary: Invite a client to the customer portal (customer service or admin)
      description: >-
        Creates the client's login in the customers realm with their tenant and party written on by the platform
        (2026-10-08, the customer portal design step 1). With an email the identity provider sends its set-your-password
        link; without one the response carries a one-time password, shown to the staff member once and kept nowhere.
        A revoked client is invited again on the same login. 422 for a corporate client, a client holding no policy,
        or one with no email or phone; 409 when access is already open.
      security:
        - staffAuth: []
      responses:
        '201':
          description: Invited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalInvite' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '409':
          description: Access is already open
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
        '422':
          description: The client cannot be invited
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
    delete:
      summary: Revoke a client's portal access (customer service or admin)
      security:
        - staffAuth: []
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalAccess' }
  /parties/{partyId}/portal-access/resend:
    post:
      summary: Send the set-your-password link again, or issue a new one-time password
      security:
        - staffAuth: []
      parameters:
        - name: partyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalInvite' }
  /customer/me:
    get:
      summary: The signed-in customer
      description: >-
        The client record the token's party_id names -- never one the request chooses. The portal's first call after
        sign-in, so it also marks the invite used.
      security:
        - customersAuth: [profile]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [partyId, displayName, email, phoneNumber]
                properties:
                  partyId: { type: string, format: uuid }
                  displayName: { type: string }
                  email: { type: [string, "null"] }
                  phoneNumber: { type: [string, "null"] }
  /customer/dashboard:
    get:
      summary: The signed-in customer's dashboard
      description: >-
        Policies held, in-force count, the earliest premium due, claims in progress and what savings and unit-linked
        plans are worth -- for the token's own party only (2026-10-08, customer portal step 2). accountValue and
        nextPremium are null when they do not apply.
      security:
        - customersAuth: [profile]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerDashboard' }
  /customer/policies/{policyNumber}:
    get:
      summary: One of the signed-in customer's policies, customer-safe
      description: >-
        Names rather than ids, and nothing a staff member alone sees. 403 for a policy the customer does not hold.
        The blocks that do not apply to the product are null.
      security:
        - customersAuth: [profile]
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerPolicy' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
  /customer/claims:
    get:
      summary: The claims the signed-in customer made
      description: Newest event first, each with the number of documents still asked of the customer.
      security:
        - customersAuth: [profile]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CustomerClaimSummary' }
  /customer/claims/{claimId}:
    get:
      summary: One of the customer's claims, in plain words
      description: >-
        Its stages, the decision in a customer's words, documents sent and documents asked for. Never an assessor's
        findings or a staff note. 403 for a claim somebody else made.
      security:
        - customersAuth: [profile]
      parameters:
        - name: claimId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerClaim' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
  /customer/products:
    get:
      summary: The products offered online
      security:
        - customersAuth: [profile]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CustomerProduct' }
  /customer/products/{productId}/quote:
    post:
      summary: An indicative price on the customer's own details
      description: >-
        Their age, sex and smoker status as we hold them. Not an offer -- underwriting may load or decline. Priced by
        what the product is (2026-10-29): cover and cash-value plans from sumAssured, frequency and termYears; a deposit
        from amount and termMonths; a funeral plan from planCode, frequency and the family beside the customer, who is
        always the main member. 422 when the product is priced by an adviser, their details are missing, or the plan
        will not cover someone; 404 for a product not offered online.
      security:
        - customersAuth: [profile]
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sumAssured: { type: [number, "null"] }
                frequency: { type: [string, "null"], enum: [MONTHLY, QUARTERLY, ANNUALLY, null] }
                termYears: { type: [integer, "null"] }
                amount: { type: [number, "null"], description: "A deposit's amount" }
                termMonths: { type: [integer, "null"], description: "A deposit's term" }
                planCode: { type: [string, "null"], description: A funeral plan }
                family:
                  type: array
                  items:
                    type: object
                    required: [role, name, dateOfBirth]
                    properties:
                      role: { type: string, enum: [SPOUSE, CHILD, PARENT, EXTENDED] }
                      name: { type: string }
                      dateOfBirth: { type: string, format: date }
                      student: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerQuote' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '422':
          description: Cannot be priced online
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /customer/applications:
    get:
      summary: What the customer has asked for
      security:
        - customersAuth: [profile]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CustomerApplication' }
    post:
      summary: Ask for a product
      description: >-
        Opens an application (an underwriting case) with the customer as applicant and life insured, on the version on
        sale today, straight to underwriting. The pricing inputs are the quote's and are priced again here. Carries who
        receives the money (shares totalling 100) and an answer to every health question the product asks, recorded as
        asked in the language given. 409 while one for the same product is still being reviewed; 422 for missing
        answers, shares that do not total 100, or a family the plan will not cover.
      security:
        - customersAuth: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId: { type: string, format: uuid }
                sumAssured: { type: [number, "null"] }
                frequency: { type: [string, "null"] }
                termYears: { type: [integer, "null"] }
                amount: { type: [number, "null"] }
                termMonths: { type: [integer, "null"] }
                planCode: { type: [string, "null"] }
                family:
                  type: array
                  items:
                    type: object
                    required: [role, name, dateOfBirth]
                    properties:
                      role: { type: string, enum: [SPOUSE, CHILD, PARENT, EXTENDED] }
                      name: { type: string }
                      dateOfBirth: { type: string, format: date }
                      student: { type: boolean }
                beneficiaries:
                  type: array
                  items:
                    type: object
                    required: [name, sharePercent]
                    properties:
                      name: { type: string }
                      relationship: { type: [string, "null"] }
                      phone: { type: [string, "null"] }
                      sharePercent: { type: number }
                answers:
                  type: array
                  items:
                    type: object
                    required: [code, answer]
                    properties:
                      code: { type: string }
                      answer: { type: string, enum: ["YES", "NO"] }
                      notes: { type: [string, "null"] }
                language: { type: [string, "null"], enum: [EN, SW, null] }
      responses:
        '201':
          description: Asked for
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerApplication' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '409':
          description: Already asked for
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /customer/messages:
    get:
      summary: The signed-in customer's messages
      description: >-
        What was sent to them by SMS and email, newest first, once per message however many channels carried it --
        readable here whether or not it reached their phone. Never a delivery outcome or failure reason.
      security:
        - customersAuth: [profile]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CustomerMessage' }
  /customer/messages/{messageId}/read:
    post:
      summary: Mark a message read
      description: 404 for a message that is not the customer's own.
      security:
        - customersAuth: [profile]
      parameters:
        - name: messageId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerMessage' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
components:
  securitySchemes:
    staffAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.nlolo-lifeplatform.tz/realms/staff/protocol/openid-connect/auth
          tokenUrl: https://auth.nlolo-lifeplatform.tz/realms/staff/protocol/openid-connect/token
          scopes: {}
    customersAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.nlolo-lifeplatform.tz/realms/customers/protocol/openid-connect/auth
          tokenUrl: https://auth.nlolo-lifeplatform.tz/realms/customers/protocol/openid-connect/token
          scopes:
            profile: The customer's own records
    agentsAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.nlolo-lifeplatform.tz/realms/agents/protocol/openid-connect/auth
          tokenUrl: https://auth.nlolo-lifeplatform.tz/realms/agents/protocol/openid-connect/token
          scopes: {}
  schemas:
    AgentQuotation:
      type: object
      description: >-
        A quotation the customer agreed to (2026-10-20): the inputs as quoted, and the server's figures for them on the
        day -- the quote of the module that owns the price (a premium quote, a savings quote or a funeral family quote).
      required: [quotationId, productId, productVersionId, inputs, quoted, quotedOn, validUntil]
      properties:
        quotationId: { type: string, format: uuid }
        applicantPartyId: { type: [string, "null"], format: uuid }
        productId: { type: string, format: uuid }
        productVersionId: { type: string, format: uuid, description: The version actually priced }
        inputs: { $ref: '#/components/schemas/QuotationRequest' }
        quoted:
          type: object
          required: [sumAssured, currency, quote]
          properties:
            sumAssured: { type: [number, "null"], description: What the proposal is opened at }
            currency: { type: string }
            quote: { type: object, additionalProperties: true }
        quotedOn: { type: string, format: date }
        validUntil: { type: string, format: date }
        caseId: { type: [string, "null"], format: uuid, description: The proposal opened from it }
        proposalNumber: { type: [string, "null"] }
    SchemeQuotationRequest:
      type: object
      description: Inputs only -- the bill and every family's cover are priced on the server.
      required: [productId, productVersionId, associationPartyId]
      properties:
        productId: { type: string, format: uuid }
        productVersionId: { type: string, format: uuid }
        associationPartyId:
          type: string
          format: uuid
          description: The association. Its name, phone and address are read from its record, never sent.
        planCode: { type: [string, "null"] }
        commencement: { type: [string, "null"], format: date }
        families:
          type: [array, "null"]
          items:
            type: object
            properties:
              memberReference: { type: [string, "null"] }
              lives:
                type: array
                items:
                  type: object
                  required: [role]
                  properties:
                    role: { type: string, enum: [MAIN_MEMBER, SPOUSE, CHILD, PARENT, EXTENDED] }
                    name: { type: [string, "null"] }
                    dateOfBirth: { type: [string, "null"], format: date }
                    student: { type: boolean }
    QuotationRequest:
      type: object
      description: >-
        Inputs only -- every figure on the document is quoted again on the server. Exactly one of applicantPartyId and
        prospect names who is quoted; a prospect's quotation is marked as such, valid for 30 days, and stores nothing.
      required: [productId, productVersionId]
      properties:
        productId: { type: string, format: uuid }
        productVersionId: { type: string, format: uuid }
        applicantPartyId:
          type: [string, "null"]
          format: uuid
          description: The proposer. Their name, contact and rating facts are read from their record, never sent.
        prospect:
          type: [object, "null"]
          description: Somebody not registered yet (2026-10-20). Their rating facts as the agent typed them.
          required: [fullName]
          properties:
            fullName: { type: string, maxLength: 255 }
            phoneNumber: { type: [string, "null"], maxLength: 30 }
            dateOfBirth: { type: [string, "null"], format: date }
            sex: { type: [string, "null"], enum: [MALE, FEMALE, null] }
            smokerStatus: { type: [string, "null"], enum: [SMOKER, NON_SMOKER, UNKNOWN, null] }
            occupationClass: { type: [string, "null"], maxLength: 30 }
        sumAssured:
          type: [number, "null"]
          description: >-
            The sum assured, or a deposit's amount, or a term account's contribution per payment. Null on a funeral
            plan, whose plan sets the benefit.
        ratePercent:
          type: [number, "null"]
          description: "A term account's rate, % a year, inside its version's band (2026-10-21). Null on any other product."
        currency: { type: [string, "null"] }
        frequency:
          type: [string, "null"]
          enum: [MONTHLY, QUARTERLY, ANNUALLY, SINGLE, null]
        policyTermMonths: { type: [integer, "null"] }
        premiumPayingTermMonths:
          type: [integer, "null"]
          description: Null means the whole term.
        commencement:
          type: [string, "null"]
          format: date
          description: The proposed commencement; every age and rate is taken on this day. Defaults to today.
        funeralPlanCode: { type: [string, "null"] }
        lives:
          type: [array, "null"]
          description: A funeral plan's lives, the main member first.
          items:
            type: object
            required: [role]
            properties:
              role: { type: string, enum: [MAIN_MEMBER, SPOUSE, CHILD, PARENT, EXTENDED] }
              name: { type: [string, "null"] }
              dateOfBirth: { type: [string, "null"], format: date }
              student: { type: boolean }
    ReceiptLine:
      type: object
      additionalProperties: false
      required: [receiptId, receivedOn, amount, currency, reference, paidBy, coversFrom, coversTo]
      properties:
        receiptId: { type: string, format: uuid }
        receivedOn: { type: string, format: date }
        amount: { type: number }
        currency: { type: string }
        reference: { type: [string, "null"] }
        paidBy: { type: [string, "null"] }
        coversFrom: { type: [string, "null"], format: date, description: "First day of cover the premium paid for" }
        coversTo: { type: [string, "null"], format: date, description: "Last day of cover the premium paid for" }
    CustomerAmount:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount: { type: number }
        currency: { type: [string, "null"] }
    CustomerPolicySummary:
      type: object
      additionalProperties: false
      required: [policyNumber, productName, productCategory, status, sumAssured, currency, premium, premiumFrequency,
                 nextDueDate, nextDueAmount, value]
      properties:
        policyNumber: { type: string }
        productName: { type: [string, "null"] }
        productCategory: { type: [string, "null"] }
        status: { type: string }
        sumAssured: { type: [number, "null"] }
        currency: { type: [string, "null"] }
        premium: { type: [number, "null"] }
        premiumFrequency: { type: [string, "null"] }
        nextDueDate: { type: [string, "null"], format: date }
        nextDueAmount: { type: [number, "null"] }
        value: { type: [number, "null"], description: "A savings balance or unit-linked fund value; null on cover alone" }
    CustomerDashboard:
      type: object
      additionalProperties: false
      required: [displayName, activePolicies, claimsInProgress, nextPremium, accountValue, policies, unreadMessages]
      properties:
        unreadMessages: { type: integer, description: Messages not yet opened in the portal }
        displayName: { type: string }
        activePolicies: { type: integer }
        claimsInProgress: { type: integer }
        nextPremium:
          anyOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [policyNumber, productName, amount, currency, dueDate, status]
              properties:
                policyNumber: { type: string }
                productName: { type: [string, "null"] }
                amount: { type: number }
                currency: { type: string }
                dueDate: { type: string, format: date }
                status: { type: string }
        accountValue:
          anyOf:
            - type: 'null'
            - $ref: '#/components/schemas/CustomerAmount'
        policies:
          type: array
          items: { $ref: '#/components/schemas/CustomerPolicySummary' }
    CustomerPolicy:
      type: object
      additionalProperties: false
      required: [summary, lifeAssuredName, commencementDate, maturityDate, termMonths, beneficiaries, coveredLives,
                 savings, units, annuity, claims, deposit]
      properties:
        deposit:
          description: A fixed-term deposit's running term (2026-10-09); null on anything else
          anyOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [principal, currency, termMonths, ratePercent, startDate, maturityDate, interestSoFar,
                         interestAtMaturity, amountAtMaturity]
              properties:
                principal: { type: number }
                currency: { type: string }
                termMonths: { type: integer }
                ratePercent: { type: number, description: For the whole term, not a year }
                startDate: { type: string, format: date }
                maturityDate: { type: string, format: date }
                interestSoFar: { type: number }
                interestAtMaturity: { type: number }
                amountAtMaturity: { type: number }
        summary: { $ref: '#/components/schemas/CustomerPolicySummary' }
        lifeAssuredName: { type: [string, "null"] }
        commencementDate: { type: [string, "null"], format: date }
        maturityDate: { type: [string, "null"], format: date }
        termMonths: { type: [integer, "null"] }
        beneficiaries:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, sharePercent]
            properties:
              name: { type: [string, "null"] }
              sharePercent: { type: [number, "null"] }
        coveredLives:
          type: [array, "null"]
          items:
            type: object
            additionalProperties: false
            required: [coveredLifeId, name, role, benefit, status, waitingPeriodEnds]
            properties:
              coveredLifeId: { type: string, format: uuid }
              name: { type: string }
              role: { type: string }
              benefit: { type: [number, "null"] }
              status: { type: string }
              waitingPeriodEnds: { type: [string, "null"], format: date }
        savings:
          anyOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [balance, currency, status, openedOn]
              properties:
                balance: { type: number }
                currency: { type: string }
                status: { type: string }
                openedOn: { type: [string, "null"], format: date }
        units:
          anyOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [totalValue, currency, holdings]
              properties:
                totalValue: { type: [number, string, "null"] }
                currency: { type: [string, "null"] }
                holdings:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [fundName, units, price, priceDate, value]
                    properties:
                      fundName: { type: [string, "null"] }
                      units: { type: [number, "null"] }
                      price: { type: [number, "null"] }
                      priceDate: { type: [string, "null"], format: date }
                      value: { type: [number, "null"] }
        annuity:
          anyOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [status, annualIncome, instalment, frequency, firstPaymentDate, guaranteedUntil, purchasePrice, currency]
              properties:
                status: { type: string }
                annualIncome: { type: [number, "null"] }
                instalment: { type: [number, "null"] }
                frequency: { type: [string, "null"] }
                firstPaymentDate: { type: [string, "null"], format: date }
                guaranteedUntil: { type: [string, "null"], format: date }
                purchasePrice: { type: [number, "null"] }
                currency: { type: [string, "null"] }
        claims:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [claimId, claimType, status, dateOfEvent, approvedAmount, currency]
            properties:
              claimId: { type: string, format: uuid }
              claimType: { type: string }
              status: { type: string }
              dateOfEvent: { type: string, format: date }
              approvedAmount: { type: [number, "null"] }
              currency: { type: [string, "null"] }
    CustomerClaimSummary:
      type: object
      additionalProperties: false
      required: [claimId, policyNumber, productName, claimType, status, statusText, dateOfEvent, actionsRequired]
      properties:
        claimId: { type: string, format: uuid }
        policyNumber: { type: string }
        productName: { type: [string, "null"] }
        claimType: { type: string }
        status: { type: string }
        statusText: { type: string }
        dateOfEvent: { type: string, format: date }
        actionsRequired: { type: integer, description: Documents still asked of the customer }
    CustomerClaim:
      type: object
      additionalProperties: false
      required: [claimId, policyNumber, productName, claimType, status, statusText, dateOfEvent, steps, decision,
                 approvedAmount, currency, documents, requests]
      properties:
        claimId: { type: string, format: uuid }
        policyNumber: { type: string }
        productName: { type: [string, "null"] }
        claimType: { type: string }
        status: { type: string }
        statusText: { type: string }
        dateOfEvent: { type: string, format: date }
        steps:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [label, state, date]
            properties:
              label: { type: string }
              state: { type: string, enum: [DONE, CURRENT, PENDING] }
              date: { type: [string, "null"], format: date-time }
        decision: { type: [string, "null"], description: The decision in a customer's words; null while undecided }
        approvedAmount: { type: [number, "null"] }
        currency: { type: [string, "null"] }
        documents:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [documentRef, description, uploadedAt, uploadedByName]
            properties:
              documentRef: { type: string }
              description: { type: [string, "null"] }
              uploadedAt: { type: string, format: date-time }
              uploadedByName: { type: [string, "null"] }
        requests:
          type: array
          description: Documents asked for -- open and received; withdrawn ones are left out
          items:
            type: object
            additionalProperties: false
            required: [requestId, document, reason, requestedAt, status, receivedAt]
            properties:
              requestId: { type: string, format: uuid }
              document: { type: string }
              reason: { type: [string, "null"] }
              requestedAt: { type: string, format: date-time }
              status: { type: string, enum: [OPEN, RECEIVED] }
              receivedAt: { type: [string, "null"], format: date-time }
    CustomerProduct:
      type: object
      additionalProperties: false
      required: [productId, productName, category, currency, summary, benefits, quotable, kind, online, terms, questions]
      properties:
        productId: { type: string, format: uuid }
        productName: { type: string }
        category: { type: string }
        currency: { type: string }
        summary: { type: [string, "null"] }
        benefits: { type: array, items: { type: string } }
        quotable: { type: boolean, description: The same as online }
        kind:
          type: string
          enum: [PROTECTION, CASH_VALUE, DEPOSIT, FUNERAL, SAVINGS_ACCOUNT, TERM_ACCOUNT, ANNUITY, UNIT_LINKED, EDUCATION, OTHER]
          description: What the product is, from what its version carries -- not its category alone
        online: { type: boolean, description: Priced and asked for here; otherwise an adviser prices it after a request }
        terms:
          type: object
          additionalProperties: false
          required: [minTermYears, maxTermYears, minAmount, maxAmount, depositTermMonths, funeralPlans, funeralRoles]
          properties:
            minTermYears: { type: [integer, "null"] }
            maxTermYears: { type: [integer, "null"] }
            minAmount: { type: [number, "null"] }
            maxAmount: { type: [number, "null"] }
            depositTermMonths: { type: array, items: { type: integer } }
            funeralPlans:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [planCode, name, mainMemberBenefit]
                properties:
                  planCode: { type: string }
                  name: { type: string }
                  mainMemberBenefit: { type: [number, "null"] }
            funeralRoles:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [role, maxLives, minEntryAge, maxEntryAge]
                properties:
                  role: { type: string }
                  maxLives: { type: integer }
                  minEntryAge: { type: integer }
                  maxEntryAge: { type: integer }
        questions:
          type: array
          description: The health questions an application asks, in English and Swahili; empty where none are asked
          items:
            type: object
            additionalProperties: false
            required: [code, en, sw]
            properties:
              code: { type: string }
              en: { type: string }
              sw: { type: string }
    CustomerQuote:
      type: object
      additionalProperties: false
      required: [productId, productName, kind, currency, sumAssured, frequency, instalment, yearly, ageAtEntry, termYears,
        totalOverTerm, paidByYear, deposit, funeral, savings]
      properties:
        productId: { type: string, format: uuid }
        productName: { type: string }
        kind: { type: string }
        currency: { type: string }
        sumAssured: { type: number, description: "Paid on a death, a deposit's amount, or a funeral plan's main-member benefit" }
        frequency: { type: string }
        instalment: { type: number }
        yearly: { type: [number, "null"] }
        ageAtEntry: { type: [integer, "null"] }
        termYears: { type: [integer, "null"] }
        totalOverTerm: { type: [number, "null"], description: All the premiums over the term; null where it does not total }
        paidByYear:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [year, paid]
            properties:
              year: { type: integer }
              paid: { type: number }
        deposit:
          type: [object, "null"]
          additionalProperties: false
          required: [amount, termMonths, ratePercent, interest, maturityValue, maturityDate, offeredTermMonths, refusal]
          properties:
            amount: { type: [number, "null"] }
            termMonths: { type: [integer, "null"] }
            ratePercent: { type: [number, "null"], description: For the whole term, not a year }
            interest: { type: [number, "null"] }
            maturityValue: { type: [number, "null"] }
            maturityDate: { type: [string, "null"], format: date }
            offeredTermMonths: { type: array, items: { type: integer } }
            refusal: { type: [string, "null"] }
        funeral:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [role, name, age, benefit, yearlyPremium]
            properties:
              role: { type: string }
              name: { type: [string, "null"] }
              age: { type: integer }
              benefit: { type: number }
              yearlyPremium: { type: number }
        savings:
          description: A savings account's rate and minimum; null for every other kind.
          type: [object, "null"]
          additionalProperties: false
          required: [ratePercent, guaranteedRatePercent, minimumBalance]
          properties:
            ratePercent: { type: [number, "null"], description: "Earned today, % a year: the declared rate, never below the guarantee" }
            guaranteedRatePercent: { type: [number, "null"], description: "The least it ever earns, % a year" }
            minimumBalance: { type: [number, "null"], description: "The least the account keeps; the first payment must reach it" }
    CustomerApplication:
      type: object
      additionalProperties: false
      required: [caseId, proposalNumber, productId, productName, sumAssured, currency, status, statusText, stage, decidedAt]
      properties:
        caseId: { type: string, format: uuid }
        proposalNumber: { type: [string, "null"] }
        productId: { type: string, format: uuid }
        productName: { type: [string, "null"] }
        sumAssured: { type: [number, "null"] }
        currency: { type: [string, "null"] }
        status: { type: string }
        statusText: { type: string }
        stage:
          type: string
          enum: [REVIEWING, NEEDS_YOU, ACCEPTED, ISSUED, POSTPONED, DECLINED]
          description: Where it is, for the progress line
        decidedAt: { type: [string, "null"], format: date-time }
    CustomerMessage:
      type: object
      additionalProperties: false
      required: [messageId, title, policyNumber, body, sentAt, read]
      properties:
        messageId: { type: string, format: uuid }
        title: { type: string }
        policyNumber: { type: [string, "null"] }
        body: { type: [string, "null"], description: The text as sent; null on messages from before it was kept }
        sentAt: { type: string, format: date-time }
        read: { type: boolean }
    PortalAccess:
      type: object
      additionalProperties: false
      required: [partyId, status, username, delivery, invitedBy, invitedAt, activatedAt, revokedBy, revokedAt]
      properties:
        partyId: { type: string, format: uuid }
        status: { type: string, enum: [NOT_INVITED, INVITED, ACTIVE, REVOKED] }
        username: { type: [string, "null"] }
        delivery: { type: [string, "null"], enum: [EMAIL_LINK, TEMPORARY_PASSWORD, SMS_PASSWORD, null] }
        invitedBy: { type: [string, "null"] }
        invitedAt: { type: [string, "null"], format: date-time }
        activatedAt: { type: [string, "null"], format: date-time }
        revokedBy: { type: [string, "null"] }
        revokedAt: { type: [string, "null"], format: date-time }
    PortalInvite:
      type: object
      additionalProperties: false
      required: [access, temporaryPassword, smsSentTo, notice]
      properties:
        access: { $ref: '#/components/schemas/PortalAccess' }
        temporaryPassword:
          type: [string, "null"]
          description: >-
            The one-time password when staff must hand it over -- no email and no phone to text, or the SMS failed.
            Shown once, stored nowhere. Null when a link was emailed or the password was texted.
        smsSentTo:
          type: [string, "null"]
          description: The number the one-time password was texted to; null when it was not texted.
        notice:
          type: [string, "null"]
          description: Why the password is being shown to staff after all -- the SMS was not sent, with the reason.
    PaymentSchedule:
      type: object
      additionalProperties: false
      required: [policyNumber, policyholderName, productName, policyStatus, premium, premiumFrequency, currency,
                 coverStart, lines, totals]
      properties:
        policyNumber: { type: string }
        policyholderName: { type: [string, "null"] }
        productName: { type: [string, "null"] }
        policyStatus: { type: [string, "null"] }
        premium: { type: [number, "null"] }
        premiumFrequency: { type: [string, "null"] }
        currency: { type: [string, "null"] }
        coverStart: { type: [string, "null"], format: date }
        lines:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [number, invoiceId, dueDate, amountDue, amountPaid, paidOn, receipts, paidBy, status, balance,
                       coversFrom, coversTo]
            properties:
              coversFrom: { type: [string, "null"], format: date, description: "First day of the cover this premium pays for" }
              coversTo: { type: [string, "null"], format: date, description: "Last day of the cover this premium pays for" }
              number: { type: integer }
              invoiceId: { type: string, format: uuid }
              dueDate: { type: string, format: date }
              amountDue: { type: number }
              amountPaid: { type: number }
              paidOn: { type: [string, "null"], format: date }
              receipts: { type: [string, "null"], description: "Receipt references, comma-separated" }
              paidBy: { type: [string, "null"], description: "Who paid (a phone number, cash), comma-separated" }
              status: { type: string, enum: [Paid, Partly paid, Due, Upcoming, In grace, Overdue, Waived] }
              balance: { type: number }
        totals:
          type: object
          additionalProperties: false
          required: [charged, paid, outstanding, upcoming, nextDueDate, nextDueAmount]
          properties:
            charged: { type: number }
            paid: { type: number }
            outstanding: { type: number, description: "Unpaid on premiums already due" }
            upcoming: { type: number, description: "Unpaid on premiums not yet due" }
            nextDueDate: { type: [string, "null"], format: date }
            nextDueAmount: { type: [number, "null"] }
    SavingsStatement:
      type: object
      additionalProperties: false
      required: [policyNumber, policyholderName, productName, currency, periodFrom, periodTo, openingBalance,
                 closingBalance, lines, totals]
      properties:
        policyNumber: { type: string }
        policyholderName: { type: [string, "null"] }
        productName: { type: [string, "null"] }
        currency: { type: string }
        periodFrom: { type: string, format: date }
        periodTo: { type: string, format: date }
        openingBalance: { type: number }
        closingBalance: { type: number }
        lines:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [date, description, moneyIn, moneyOut, balance]
            properties:
              date: { type: string, format: date }
              description: { type: string }
