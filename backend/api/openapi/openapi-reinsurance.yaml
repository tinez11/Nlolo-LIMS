openapi: 3.1.0
info:
  title: Reinsurance API
  version: "1.0.0"
  description: >
    External REST surface of the `reinsurance` module: treaty authoring (staff/finance-only),
    the read paths over cessions, claim recoveries and the monthly bordereaux (IFRS 17 I3c). Cession,
    recovery and bordereau CALCULATION are not exposed here at all: all are event- or job-driven
    internally, so there is no create endpoint for any of them.


    Every endpoint requires the staff realm AND the fine-grained FINANCE_OFFICER or ADMIN role,
    the same decision M7 recorded for `distribution`: there is no reinsurance-specific staff role,
    docs/04-api-contracts.md:21 deferred this surface entirely, and reinsurance is a
    finance-adjacent back-office concern.


    `cessionPercent` is always a decimal string, never a JSON number - it multiplies money exactly
    as a commission rate does, and this platform forbids floats anywhere in the wire format.
servers:
  - url: https://api.nlolo-lifeplatform.tz/v1
paths:
  /treaties:
    post:
      summary: Author a reinsurance treaty
      description: >
        Staff/finance only. Creates a treaty, so `Idempotency-Key` is required: a retried POST
        must not silently create a duplicate treaty. `cessionPercent` must be present for
        QUOTA_SHARE and absent otherwise - enforced downstream as a 422, not here, so a malformed
        request gets exactly one status code regardless of which layer notices first.
      security:
        - staffAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTreatyRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreatyView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: "Reinsurer name is too long, retention limit is negative, cessionPercent is missing for QUOTA_SHARE or present for SURPLUS/XOL, cessionPercent is out of the (0, 100] range, or effectiveTo is before effectiveFrom. A blank reinsurer name is a 400 (see BadRequest), not a 422."
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
    get:
      summary: List treaties, optionally filtered by status
      security:
        - staffAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/TreatyStatus' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TreatyView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /treaties/{treatyId}:
    get:
      summary: Get treaty detail
      security:
        - staffAuth: []
      parameters:
        - $ref: '#/components/parameters/TreatyId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreatyView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /treaties/{treatyId}/cessions:
    get:
      summary: What has been ceded TO this treaty (paged)
      description: >
        The read a treaty most obviously needs and did not have. Cessions could be listed only
        through the policy they were made on, so a treaty stated a retention limit and a cession
        percent while every cession naming it was unreachable from it.


        PAGED, unlike GET /policies/{policyNumber}/cessions. A policy has a handful of cessions
        and a pager over a fully-downloaded array lies about the network; a treaty gains one per
        policy it covers for as long as it runs, which is the unbounded case. Newest first.
      security:
        - staffAuth: []
      parameters:
        - $ref: '#/components/parameters/TreatyId'
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: pageSize
          in: query
          required: false
          description: "Capped server-side at 100 regardless of the value sent."
          schema: { type: integer, minimum: 1, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CessionSearchResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /treaties/{treatyId}/utilisation:
    get:
      summary: How much has been ceded to this treaty
      description: >
        A count and two totals, summed in the DATABASE. Separate from the paged list above because
        a caller must never sum the page in hand and call it the treaty's utilisation - that
        figure is always too small and always plausible. Its own path rather than fields on
        GET /treaties/{treatyId}, so listing treaties does not aggregate the cession table per row.


        DELIBERATELY NOT A PERCENTAGE. Retention is what the cedant keeps per life, not a cap on
        the treaty, so dividing ceded amount by it would produce a figure that reads like capacity
        consumed and means nothing of the sort. No capacity or limit is modelled anywhere on this
        platform, and inventing the denominator would be inventing the number.


        Zeroes, never nulls: an ACTIVE treaty nobody has ceded to yet is an ordinary state, and
        the currency then comes from the treaty's own retention limit since there is no cession
        row to read one off.
      security:
        - staffAuth: []
      parameters:
        - $ref: '#/components/parameters/TreatyId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreatyUtilisationView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /policies/{policyNumber}/cessions:
    get:
      summary: List the cessions recorded against a policy
      description: >
        Empty rather than 404 when the policy carries no cession, or does not exist in this
        tenant - this endpoint has no authority over policy existence, only over cession rows.
      security:
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CessionView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /claims/{claimId}/recoveries:
    get:
      summary: List the reinsurance recoveries recorded against a claim
      description: >
        Empty rather than 404 when the claim carries no recovery, or does not exist in this
        tenant - this endpoint has no authority over claim existence, only over recovery rows.
      security:
        - staffAuth: []
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ClaimRecoveryView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /treaties/{treatyId}/bordereaux:
    get:
      summary: The treaty's monthly bordereaux, newest month first (IFRS 17 I3c)
      description: >
        Written by the month-end job for every closed month from the treaty's effective-from, final once written.
        Each posts K-01 (ceded premium, Dr 1436 / Cr 1430) and K-02 (commission not contingent on claims,
        Dr 1431 / Cr 1436); recoveries are listed only to be matched (K-03). Rows carry no lines.
      security:
        - staffAuth: []
      parameters:
        - $ref: '#/components/parameters/TreatyId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BordereauView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /treaties/{treatyId}/bordereau-preview:
    get:
      summary: A month's bordereau as it would be written now, not stored
      description: >
        The current month (Dar es Salaam) when `period` is absent. A month already written returns the written one.
        `bordereauId` and `createdAt` are null on a preview.
      security:
        - staffAuth: []
      parameters:
        - $ref: '#/components/parameters/TreatyId'
        - name: period
          in: query
          required: false
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BordereauView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /bordereaux/{bordereauId}:
    get:
      summary: One bordereau with its lines
      security:
        - staffAuth: []
      parameters:
        - name: bordereauId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BordereauView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  parameters:
    TreatyId:
      name: treatyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ClaimId:
      name: claimId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Required. The same key is treated as the same attempt and deduplicated; a new key is a
        genuinely new attempt. There is deliberately no default.
      schema: { type: string, minLength: 1 }
  responses:
    BadRequest:
      description: "Malformed request body, or a missing or blank Idempotency-Key"
      content:
        application/problem+json:
          schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/problem+json:
          schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
    Forbidden:
      description: "Authenticated but not permitted - wrong realm, or missing FINANCE_OFFICER/ADMIN role"
      content:
        application/problem+json:
          schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
    NotFound:
      description: No such resource in this tenant. Also returned for a resource belonging to another tenant, so that cross-tenant existence is not leaked.
      content:
        application/problem+json:
          schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  schemas:
    TreatyType:
      type: string
      enum: [QUOTA_SHARE, SURPLUS, XOL]
      description: >
        XOL is accepted by the schema and by treaty authoring, but cedes nothing at issuance -
        excess-of-loss is a claim-level treaty, so automatic cession calculation on new business
        does not apply to it. It participates only in recovery.
    TreatyStatus:
      type: string
      enum: [ACTIVE, EXPIRED]
      description: Only ACTIVE treaties are eligible for cession selection.
    CreateTreatyRequest:
      type: object
      required: [reinsurerName, treatyType, retentionLimit, effectiveFrom, commissionPercent]
      properties:
        reinsurerName: { type: string, minLength: 1, maxLength: 200 }
        treatyType: { $ref: '#/components/schemas/TreatyType' }
        retentionLimit: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        cessionPercent:
          type: [string, "null"]
          pattern: '^\d+(\.\d{1,2})?$'
          description: "Decimal string, never a JSON number. Required for QUOTA_SHARE, must be absent otherwise."
        effectiveFrom: { type: string, format: date }
        effectiveTo:
          type: [string, "null"]
          format: date
          description: Omitted or null for a treaty with no known end date.
        commissionPercent:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
          description: >
            IFRS 17 I3c (K-02): the reinsurer's commission not contingent on claims, a percent of each month's ceded
            premium from 0 to 100. Required on every treaty; "0" when the reinsurer pays none.
        xolAnnualPremium:
          type: [string, "null"]
          pattern: '^\d+(\.\d{1,2})?$'
          description: "XOL only: the flat yearly premium in the treaty's currency, charged one twelfth a month."
    TreatyView:
      type: object
      required: [treatyId, reinsurerName, treatyType, status, retentionLimit, effectiveFrom, commissionPercent]
      properties:
        treatyId: { type: string, format: uuid }
        reinsurerName: { type: string }
        treatyType: { $ref: '#/components/schemas/TreatyType' }
        status: { $ref: '#/components/schemas/TreatyStatus' }
        retentionLimit: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        cessionPercent:
          type: [string, "null"]
          pattern: '^\d+(\.\d{1,2})?$'
          description: "Decimal string, never a JSON number. Non-null exactly for QUOTA_SHARE."
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: [string, "null"], format: date }
        commissionPercent:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
          description: "The commission not contingent on claims (K-02), a percent of each month's ceded premium."
        xolAnnualPremium:
          allOf:
            - $ref: 'openapi-common.yaml#/components/schemas/Money'
          nullable: true
          description: "An XOL treaty's flat yearly premium, charged one twelfth a month; null otherwise."
    BordereauView:
      type: object
      required: [treatyId, period, currency, policyCount, premium, commission, recoveries, lines]
      properties:
        bordereauId: { type: [string, "null"], format: uuid, description: "Null on a preview." }
        treatyId: { type: string, format: uuid }
        period: { type: string, description: "YYYY-MM" }
        currency: { type: string }
        policyCount: { type: integer, description: "Policies charged this month (the XOL premium is not one)." }
        premium: { type: string, description: "Ceded premium, decimal string in `currency`." }
        commission: { type: string, description: "Commission not contingent on claims, decimal string." }
        recoveries: { type: string, description: "Recoveries recorded this month, matched only (K-03)." }
        createdAt: { type: [string, "null"], format: date-time, description: "Null on a preview." }
        lines:
          type: array
          description: "Empty on a list row."
          items: { $ref: '#/components/schemas/BordereauLine' }
    BordereauLine:
      type: object
      required: [type, premium, commission, recovery]
      properties:
        type: { type: string, enum: [PREMIUM, XOL_PREMIUM, RECOVERY] }
        policyNumber: { type: [string, "null"] }
        claimId: { type: [string, "null"], format: uuid }
        premiumShare: { type: [string, "null"], description: "The cession's share of the policy's premium, 0 < share <= 1." }
        policyPremium: { type: [string, "null"], description: "The policy's premium the share was taken of." }
        premium: { type: string }
        commission: { type: string }
        recovery: { type: string }
    CessionSearchResponse:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CessionView' }
        page:
          type: object
          required: [page, pageSize, totalElements]
          properties:
            page: { type: integer }
            pageSize: { type: integer }
            totalElements: { type: integer }
    TreatyUtilisationView:
      type: object
      required: [treatyId, cessionCount, cededAmount, cededPremium]
      properties:
        treatyId: { type: string, format: uuid }
        cessionCount:
          type: integer
          format: int64
          description: "Every cession naming this treaty, not the page in hand."
        cededAmount: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        cededPremium: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
    CessionView:
      type: object
      required: [cessionId, policyNumber, treatyId, cededAmount]
      properties:
        cessionId: { type: string, format: uuid }
        policyNumber: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        treatyId: { type: string, format: uuid }
        cededAmount: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        cededPremium:
          # See openapi-distribution.yaml flatAmount for why nullable: true stays on
          # nullable $ref fields specifically.
          allOf:
            - $ref: 'openapi-common.yaml#/components/schemas/Money'
          nullable: true
          description: "Null for a treaty type that cedes risk without a modelled premium share."
    ClaimRecoveryView:
      type: object
      required: [recoveryId, claimId, treatyId, recoverableAmount]
      properties:
        recoveryId: { type: string, format: uuid }
        claimId: { type: string, format: uuid }
        treatyId: { type: string, format: uuid }
        recoverableAmount: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        confirmedAt:
          type: [string, "null"]
          format: date-time
          description: >
            Set only on recoveries from before IFRS 17 I3c, when staff confirmed them. A recovery is now posted when its
            claim is approved (B-05) and agreed with the reinsurer on its statement.
