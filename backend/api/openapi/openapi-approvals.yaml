openapi: 3.1.0
info:
  title: Approvals API
  version: "0.1.0-draft"
  description: >
    What waits for the viewer's signature, across the platform (2026-10-27). Each module that holds an approval reports
    its own rows; the answer keeps only the kinds the viewer's permissions let them act on. A kind whose module could
    not be read is marked unreadable and counted as nothing -- never as zero waiting.
servers:
  - url: https://api.nlolo-lifeplatform.tz/v1
paths:
  /approvals:
    get:
      summary: Everything waiting for the viewer's signature (any active staff member)
      description: >
        Groups appear only for kinds the viewer holds the acting permission for. Rows are the oldest waiting, at most 25
        a group; `total` is the whole queue. On a two-person kind the viewer's own requests are listed with `yours` and
        left out of `actionable`.
      security:
        - staffAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalsView' }
        '403': { $ref: '#/components/responses/Problem' }
  /actions:
    get:
      summary: The jobs waiting for the viewer -- the bell (2026-11-03)
      description: >
        Work waiting for somebody to act, read live from each module's own records, so a job leaves the list the moment
        it is done. An agent gets their own clients' work; a staff member the kinds their permissions act on, and one
        row for the signatures the approvals screen holds for them. Newest first, at most 30; `total` is every job.
      security:
        - agentsAuth: [agent]
        - staffAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionsView' }
        '403': { $ref: '#/components/responses/Problem' }
components:
  responses:
    Problem:
      description: An error, as RFC 7807 problem details
      content:
        application/problem+json:
          schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  schemas:
    ActionsView:
      type: object
      required: [total, incomplete, groups]
      properties:
        total:
          type: integer
          minimum: 0
          description: Every job waiting for the viewer -- the bell's number.
        incomplete:
          type: boolean
          description: Some module could not be read, so the number may be short.
        groups:
          type: array
          description: One per kind of work with anything waiting, the kind with the newest job first.
          items: { $ref: '#/components/schemas/ActionGroup' }
    ActionGroup:
      type: object
      required: [kind, act, total, items]
      properties:
        kind:
          type: string
          description: >
            proposal-returned, proposal-postponed, kyc-resend, offer-closing (an agent's); proposal-review,
            proposal-referred, issue-failed, kyc-verify, claim-assess, claim-settle, credit-life-file, signatures
            (staff's). The console routes and labels on it.
        act: { type: string, description: 'What the viewer is asked to do: "Review it".' }
        total: { type: integer, minimum: 1, description: Every job of this kind. }
        items:
          type: array
          description: The newest of them, at most 20.
          items: { $ref: '#/components/schemas/ActionItem' }
    ActionItem:
      type: object
      required: [reference, title, detail]
      properties:
        reference: { type: string, description: The record's own id -- a case, party, claim, submission or policy. }
        policyNumber: { type: [string, 'null'] }
        title: { type: string, description: 'Who it is about, read first: "Asha Mollel".' }
        detail: { type: string, description: 'What it is, short: "Proposal PRO-0012 returned".' }
        since: { type: [string, 'null'], format: date-time, description: When it started waiting. }
    ApprovalsView:
      type: object
      required: [actionable, groups]
      properties:
        actionable:
          type: integer
          minimum: 0
          description: How many the viewer can act on now, across every group.
        groups:
          type: array
          items: { $ref: '#/components/schemas/ApprovalGroup' }
    ApprovalGroup:
      type: object
      required: [kind, label, act, total, actionable, unreadable, rows]
      properties:
        kind:
          type: string
          description: Stable key the console routes on, e.g. account-withdrawal.
        label: { type: string }
        act:
          type: string
          description: What acting on one means, as a verb.
        total: { type: integer, minimum: 0 }
        actionable: { type: integer, minimum: 0 }
        unreadable: { type: boolean }
        rows:
          type: array
          items: { $ref: '#/components/schemas/ApprovalRow' }
    ApprovalRow:
      type: object
      required: [reference, summary, yours]
      properties:
        reference:
          type: string
          description: The row's own id (a product id for a declaration, a period for a reopening).
        policyNumber: { type: [string, 'null'] }
        summary: { type: string }
        amount:
          anyOf:
            - type: 'null'
            - { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        requestedBy:
          type: [string, 'null']
          description: The asker's subject; null for a queue nobody asked for.
        requestedByName:
          type: [string, 'null']
          description: The asker's name, where the platform knows them.
        requestedAt:
          type: [string, 'null']
          format: date-time
        yours:
          type: boolean
          description: The viewer asked for this, so somebody else must sign it.
        detail:
          type: [string, 'null']
          description: A second line a signer needs before opening it -- who is paid and how, the reason given (2026-11-09).
        clientName:
          type: [string, 'null']
          description: The policyholder's name, for a row on a policy (2026-11-09).
