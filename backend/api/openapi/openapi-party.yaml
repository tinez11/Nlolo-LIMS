openapi: 3.1.0
info:
  title: Party Management API
  version: "0.1.0-draft"
  description: >
    External REST surface of the `party` module. Per ADR-001, response field names
    are role-specific where a consuming UI needs them (e.g. an agent-onboarding
    flow reads this same PartyView but the agent portal's own DTO layer renders it
    as "Agent", never as "Party" — that translation happens in `distribution`/BFF
    layers, not here). GroupMembership is its own paginated resource (Deliverable 3
    Rev 2, Pa1) — never embedded in the Group representation.
servers:
  - url: https://api.nlolo-lifeplatform.tz/v1
paths:
  /parties/individuals:
    post:
      summary: Register an individual (self-service signup, agent-assisted, or staff-assisted)
      security:
        - customersAuth: []
        - agentsAuth: [agent]
        - staffAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterIndividualRequest' }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartyView' }
        '400': { $ref: 'openapi-common.yaml#/components/responses/BadRequest' }
        # An identity document already registered to another party in this tenant
        # (errorCode DUPLICATE_IDENTITY_DOCUMENT), enforced by the partial unique index
        # ux_party_individual_identity.
        '409': { $ref: 'openapi-common.yaml#/components/responses/Conflict' }
  /parties/individuals/{partyId}:
    put:
      summary: Correct a person's recorded details
      description: >-
        Replaces what the platform has recorded about this person. A full replacement rather
        than a patch, so clearing a field is expressible — an omitted field and a cleared one
        cannot be the same message.


        **KYC status is not touched.** KYC here is what a passport is: a document verifying that
        this person is who they say they are. Amending the record does not un-verify that
        document, so a correction never sends a verified client back to PENDING and makes them
        prove themselves again over a misspelled street.


        **Staff only**, unlike registration, which agents and customers may also do. Creating
        your own record is not the same act as rewriting one: an agent able to amend a client
        afterwards could change the identity a policy was underwritten against, and a customer
        could change theirs after a claim event.
      security:
        - staffAuth: []
      parameters:
        - name: partyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterIndividualRequest' }
      responses:
        '200':
          description: Amended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartyDetailView' }
        '400': { $ref: 'openapi-common.yaml#/components/responses/BadRequest' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        # The amended identity document already belongs to a DIFFERENT party
        # (DUPLICATE_IDENTITY_DOCUMENT). Colliding with itself is not a conflict.
        '409': { $ref: 'openapi-common.yaml#/components/responses/Conflict' }
  /parties/corporates/{partyId}:
    put:
      summary: Correct a company's recorded details
      description: >-
        The same act as amending a person, for a company or a group — and with the same rule
        about KYC, which is untouched.


        **No registrationNumber.** A company's registration number is its identity in the
        national register: the thing the duplicate check runs on, and the thing a policy was
        underwritten against. Correcting a phone number must not be a route to quietly becoming
        a different company. A genuinely mis-recorded registration number is a deliberate act
        with its own evidence, not a side effect of an edit form.
      security:
        - staffAuth: []
      parameters:
        - name: partyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AmendCorporateRequest' }
      responses:
        '200':
          description: Amended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartyDetailView' }
        '400': { $ref: 'openapi-common.yaml#/components/responses/BadRequest' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
  /parties/corporates:
    post:
      summary: Register a corporate (e.g. an employer or SACCO for a group scheme)
      security:
        - agentsAuth: [agent]
        - staffAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterCorporateRequest' }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartyView' }
        '400': { $ref: 'openapi-common.yaml#/components/responses/BadRequest' }
        # Spec-truth fix: DuplicateRegistrationNumberException has returned 409
        # DUPLICATE_REGISTRATION_NUMBER since M1 and was never declared here.
        '409': { $ref: 'openapi-common.yaml#/components/responses/Conflict' }
  /parties:
    get:
      summary: List/search parties (staff KYC review queue; agents see only parties they registered)
      description: >
        Staff may filter by kycStatus alone (any/no createdBy). An agents-realm caller is
        force-scoped to createdBy = its own JWT subject regardless of any client input -- there is
        no way for an agent to browse another agent's, staff's, or a self-service registration.
      security:
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - name: kycStatus
          in: query
          schema: { type: string, enum: [PENDING, VERIFIED, REJECTED] }
        - name: q
          in: query
          description: Free-text, case-insensitive substring match against displayName.
          schema: { type: string }
        - name: partyType
          in: query
          description: >
            Comma-separated party types (`partyType=CORPORATE,GROUP`). Restricts the result
            to those types; omit for every type. A list rather than a single value because
            the client register is two working areas and the second of them is corporates AND
            groups together -- as two requests that area could not be paged or totalled as
            one list, and as a single value it would silently stop listing GROUP parties the
            day one can be created.

            Declared as a pattern-constrained STRING rather than `type: array`, which is what
            it really is. This is the platform's first array query parameter, and the
            contract validator every party test asserts through cannot validate one in any
            serialization: the repeated form is rejected outright ("Multiple values found for
            parameter but it is not an array") and the comma-separated form is then fed to a
            JSON parser ("Unrecognized token 'CORPORATE'"). The pattern keeps real
            spec-level validation of the allowed values, and Spring still binds the value to
            a `List<PartyType>` natively, so nothing is lost but the array keyword.
          schema:
            type: string
            pattern: '^(INDIVIDUAL|CORPORATE|GROUP)(,(INDIVIDUAL|CORPORATE|GROUP))*$'
            example: CORPORATE,GROUP
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PartyView' }
                  page: { $ref: 'openapi-common.yaml#/components/schemas/PageMeta' }
        '401': { $ref: 'openapi-common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
  /parties/{partyId}:
    get:
      summary: Get party detail
      description: >-
        Returns PartyDetailView, not the four-field PartyView the list returns: the full record a
        client register displays. Object-level scoping applies to both non-staff realms -- a
        customers-realm token may read only its own party, and an agents-realm token only a party it
        registered (createdBy equal to its own subject). Both are refused with 403.
      security:
        - customersAuth: [profile]
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - name: partyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartyDetailView' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
  /parties/{partyId}/documents:
    get:
      summary: Documents filed against this party
      description: >-
        Metadata only, newest first. Lives on the party rather than on the document module because
        authorizing a document means asking its owning aggregate, and document cannot depend back on
        party without a module cycle. An agents-realm token may read only a client it registered.
      security:
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - name: partyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PartyDocumentView' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { description: "No such party in this tenant" }
  /parties/{partyId}/kyc-evidence:
    post:
      summary: Upload a KYC evidence file (staff, or the agent who registered the client)
      description: >
        Uploads a document (ID scan, proof of address, certificate of incorporation)
        and returns its documentRef -- pass that ref to POST .../kyc to record a
        verification decision against it. Two separate calls, not one, because a
        decision may reuse evidence already on file rather than re-uploading it.


        **An agent may upload, for a client they registered, and may not verify.** The agent who
        took the documents files them and a staff member decides whether they are good — the
        same separation underwriting and claims both insist on, and the one place KYC lacked it.
        `POST /parties/{partyId}/kyc` stays staff-only for that reason.
      security:
        - staffAuth: []
        - agentsAuth: [agent]
      parameters:
        - name: partyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Evidence uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KycEvidenceUploadResponse' }
        '400': { $ref: 'openapi-common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
  /parties/{partyId}/kyc:
    post:
      summary: Submit KYC evidence and update verification status (staff-verified only)
      security:
        - staffAuth: []
      parameters:
        - name: partyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, evidenceDocumentRef]
              properties:
                status: { type: string, enum: [VERIFIED, REJECTED, PENDING] }
                evidenceDocumentRef: { type: string, description: "DocumentRef from the document module" }
      responses:
        '200': { description: KYC status updated }
  /parties/{partyId}/groups/{groupId}/members:
    get:
      summary: List group members (paginated — never loaded as part of the group aggregate, Deliverable 3 Rev 2 Pa1)
      security:
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - name: partyId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: groupId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/GroupMembershipView' }
                  page: { $ref: 'openapi-common.yaml#/components/schemas/PageMeta' }
    post:
      summary: Add a group member
      security:
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - name: partyId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: groupId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [memberPartyId]
              properties:
                memberPartyId: { $ref: 'openapi-common.yaml#/components/schemas/PartyRef' }
      responses:
        '201': { description: Member added }
components:
  schemas:
    RegisterIndividualRequest:
      description: >-
        Only fullName, dateOfBirth and contactInfo are required. Everything in the person record
        is optional on purpose: registration happens in front of a person who may not have the
        answers to hand, and a half-known record beats none. sex and smokerStatus are the two
        that matter most downstream -- together with dateOfBirth they are base_rate_table's key,
        so a party registered without them cannot be priced from its own record.
      type: object
      required: [fullName, dateOfBirth, contactInfo]
      properties:
        fullName: { type: string }
        dateOfBirth: { type: string, format: date }
        contactInfo:
          type: object
          properties:
            phoneNumber: { type: string, pattern: '^\+255\d{9}$' }
            email: { type: [string, "null"], format: email }
        sex: { type: [string, "null"], enum: [FEMALE, MALE, null] }
        smokerStatus:
          description: >-
            UNKNOWN means the question was put and not answered, which a product may price
            deliberately. Absent means nobody asked. The two are not the same and must stay
            distinguishable.
          type: [string, "null"]
          enum: [SMOKER, NON_SMOKER, UNKNOWN, null]
        idType:
          description: Required if idNumber is present, and rejected if it is absent.
          type: [string, "null"]
          enum: [NATIONAL_ID, PASSPORT, DRIVING_LICENCE, VOTER_ID, null]
        idNumber: { type: [string, "null"], maxLength: 50 }
        clientReference:
          description: >-
            The insurer's OWN reference for this client, supplied rather than minted. Optional,
            and unique per tenant where present.


            Not an identity document and not the platform id: `partyId` names the client to
            this platform and `idNumber` names the person to the state, while this is the number
            business already uses for them in its own records. It exists so the two books can be
            reconciled without matching on name and date of birth, which is the matching that
            goes wrong. A client registered without one is complete, not incomplete.
          type: [string, "null"]
          maxLength: 50
        occupation:
          description: As declared by the applicant, free text. Not a classification.
          type: [string, "null"]
          maxLength: 120
        occupationClass:
          description: >-
            The rating band an underwriter assigns, matching product.rating_table's
            OCCUPATION_CLASS factor. Free text rather than an enum because the platform owns no
            canonical occupation list -- refdata backs no dropdown anywhere -- so this is
            validated at quote time against the product's own bands.
          type: [string, "null"]
          maxLength: 30
        employerName: { type: [string, "null"], maxLength: 255 }
        nationality: { type: [string, "null"], pattern: '^[A-Za-z]{2}$', example: TZ }
        address: { $ref: '#/components/schemas/AddressRequest' }
    AddressRequest:
      description: >-
        One address per party, shaped for Tanzanian addressing. Every field optional -- an
        address is frequently partial at registration.
      type: [object, "null"]
      properties:
        line: { type: [string, "null"], maxLength: 255 }
        ward: { type: [string, "null"], maxLength: 100 }
        district: { type: [string, "null"], maxLength: 100 }
        region: { type: [string, "null"], maxLength: 100 }
        postalCode: { type: [string, "null"], maxLength: 20 }
    RegisterCorporateRequest:
      type: object
      required: [registeredName, registrationNumber, contactInfo]
      properties:
        registeredName: { type: string }
        registrationNumber: { type: string, description: "Unique per tenant." }
        contactInfo:
          type: object
          description: >-
            Same shape as RegisterIndividualRequest.contactInfo -- the controller reads
            exactly phoneNumber and email off the shared ContactInfo record. Both are
            optional (Jakarta @Pattern/@Email treat null as valid), but the object itself
            is @NotNull, so {} is accepted and a missing contactInfo is a 400.
          properties:
            phoneNumber: { type: string, pattern: '^\+255\d{9}$' }
            email: { type: [string, "null"], format: email }
    AmendCorporateRequest:
      type: object
      required: [registeredName, contactInfo]
      description: >-
        Deliberately NOT RegisterCorporateRequest minus a field — its own schema, because the
        omission is the point. There is no registrationNumber here: a company's registration
        number is its identity in the national register, and an edit form must not be a route to
        becoming a different company.
      properties:
        registeredName: { type: string }
        contactInfo:
          type: object
          description: Same shape as RegisterCorporateRequest.contactInfo.
          properties:
            phoneNumber: { type: string, pattern: '^\+255\d{9}$' }
            email: { type: [string, "null"], format: email }
    PartyView:
      type: object
      properties:
        partyId: { type: string, format: uuid }
        partyType: { type: string, enum: [INDIVIDUAL, CORPORATE, GROUP] }
        kycStatus: { type: string, enum: [PENDING, VERIFIED, REJECTED] }
        displayName: { type: string }
    PartyDetailView:
      description: >-
        The full party record, returned only by GET /parties/{partyId}. Separate from PartyView,
        which stays four fields because it is every row of a page and four other modules read it as
        an existence check. Every field beyond the first four is nullable -- an individual has no
        registration number, a corporate has no date of birth, contact details are optional at
        registration, and kycVerifiedAt is set only once a decision has been recorded.
      type: object
      properties:
        partyId: { type: string, format: uuid }
        partyType: { type: string, enum: [INDIVIDUAL, CORPORATE, GROUP] }
        kycStatus: { type: string, enum: [PENDING, VERIFIED, REJECTED] }
        displayName: { type: string }
        dateOfBirth: { type: [string, "null"], format: date }
        registrationNumber: { type: [string, "null"] }
        phoneNumber: { type: [string, "null"], example: "+255712345678" }
        email: { type: [string, "null"] }
        kycVerifiedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        createdBy:
          description: The JWT subject that registered this party -- what the agents realm is scoped on.
          type: [string, "null"]
        createdByName:
          description: >-
            Who createdBy is, by name — the registering token's display name, captured at
            registration. For display only; access is scoped on createdBy. Null for older
            records whose registrar could not be named exactly.
          type: [string, "null"]
        sex: { type: [string, "null"], enum: [FEMALE, MALE, null] }
        smokerStatus:
          description: UNKNOWN means asked and not answered; absent means nobody asked.
          type: [string, "null"]
          enum: [SMOKER, NON_SMOKER, UNKNOWN, null]
        identityDocument: { $ref: '#/components/schemas/IdentityDocumentView' }
        occupation: { type: [string, "null"] }
        occupationClass: { type: [string, "null"] }
        employerName: { type: [string, "null"] }
        nationality: { type: [string, "null"], example: TZ }
        address: { $ref: '#/components/schemas/AddressView' }
        clientReference:
          description: >-
            The insurer's OWN reference for this client, supplied rather than minted. Optional,
            and unique per tenant where present.


            Not an identity document and not the platform id: `partyId` names the client to
            this platform and `idNumber` names the person to the state, while this is the number
            business already uses for them in its own records. It exists so the two books can be
            reconciled without matching on name and date of birth, which is the matching that
            goes wrong. A client registered without one is complete, not incomplete.
          type: [string, "null"]
          maxLength: 50
        registeredByPartyId:
          description: >-
            The PARTY id of the agent who registered this client, taken from the registering
            token's party_id claim. Null when staff registered them, when they registered
            themselves, or when they predate the column — all real states, not missing data.


            This is what makes an agent's commission real. Commission accrues off
            PolicyActivated.agentOfRecordId, and the policy module resolves this party id to an
            agent at issuance and binds it as the agent of record. Before it existed, the only
            record of who registered a client was createdBy — a Keycloak subject that nothing
            could resolve to an agent — so an agent could sign a customer up and earn nothing on
            their policies unless somebody separately named them on every case.


            A party id rather than an agent id because the party module may not depend on
            distribution and so cannot name, validate or resolve an agent.
          type: [string, "null"]
          format: uuid
    IdentityDocumentView:
      description: >-
        Both fields are set together or both null -- enforced by
        party_identity_document_complete. The object itself is always present on the response;
        an unrecorded document is the object with two nulls.
      type: object
      properties:
        type: { type: [string, "null"], enum: [NATIONAL_ID, PASSPORT, DRIVING_LICENCE, VOTER_ID, null] }
        number: { type: [string, "null"] }
    AddressView:
      description: >-
        Always present on the response; an unrecorded address is the object with five nulls.
      type: object
      properties:
        line: { type: [string, "null"] }
        ward: { type: [string, "null"] }
        district: { type: [string, "null"] }
        region: { type: [string, "null"] }
        postalCode: { type: [string, "null"] }
    PartyDocumentView:
      description: >-
        One document filed under this party. Metadata only; content is fetched through the
        document endpoints. ownerContext is omitted deliberately -- it is always
        "party:<the id in the URL>" and is an internal addressing convention.
      type: object
      properties:
        documentRef: { type: string }
        documentType: { type: string, enum: [KYC_EVIDENCE, POLICY_DOCUMENT, CLAIM_EVIDENCE, SIGNED_FORM, UNDERWRITING_EVIDENCE] }
        contentType: { type: [string, "null"] }
        fileName: { type: [string, "null"] }
        uploadedBy: { type: [string, "null"] }
        uploadedAt: { type: string, format: date-time }
    KycEvidenceUploadResponse:
      type: object
      required: [documentRef]
      properties:
        documentRef: { type: string }
    GroupMembershipView:
      type: object
      properties:
        memberPartyId: { $ref: 'openapi-common.yaml#/components/schemas/PartyRef' }
        joinDate: { type: string, format: date }
        status: { type: string, enum: [ACTIVE, REMOVED] }
