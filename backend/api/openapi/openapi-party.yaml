openapi: 3.1.0
info:
  title: Party Management API
  version: "0.1.0-draft"
  description: >
    External REST surface of the `party` module. Per ADR-001, response field names
    are role-specific where a consuming UI needs them (e.g. an agent-onboarding
    flow reads this same PartyView but the agent portal's own DTO layer renders it
    as "Agent", never as "Party" — that translation happens in `distribution`/BFF
    layers, not here). GroupMembership is its own paginated resource (Deliverable 3
    Rev 2, Pa1) — never embedded in the Group representation.
servers:
  - url: https://api.nlolo-lifeplatform.tz/v1
paths:
  /parties/individuals:
    post:
      summary: Register an individual (self-service signup, agent-assisted, or staff-assisted)
      security:
        - customersAuth: []
        - agentsAuth: [agent]
        - staffAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterIndividualRequest' }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartyView' }
  /parties/corporates:
    post:
      summary: Register a corporate (e.g. an employer or SACCO for a group scheme)
      security:
        - agentsAuth: [agent]
        - staffAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterCorporateRequest' }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartyView' }
  /parties:
    get:
      summary: List/search parties (staff KYC review queue; agents see only parties they registered)
      description: >
        Staff may filter by kycStatus alone (any/no createdBy). An agents-realm caller is
        force-scoped to createdBy = its own JWT subject regardless of any client input -- there is
        no way for an agent to browse another agent's, staff's, or a self-service registration.
      security:
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - name: kycStatus
          in: query
          schema: { type: string, enum: [PENDING, VERIFIED, REJECTED] }
        - name: q
          in: query
          description: Free-text, case-insensitive substring match against displayName.
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PartyView' }
                  page: { $ref: 'openapi-common.yaml#/components/schemas/PageMeta' }
        '401': { $ref: 'openapi-common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
  /parties/{partyId}:
    get:
      summary: Get party detail
      security:
        - customersAuth: [profile]
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - name: partyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartyView' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
  /parties/{partyId}/kyc-evidence:
    post:
      summary: Upload a KYC evidence file (staff only)
      description: >
        Uploads a document (ID scan, proof of address, certificate of incorporation)
        and returns its documentRef -- pass that ref to POST .../kyc to record a
        verification decision against it. Two separate calls, not one, because a
        decision may reuse evidence already on file rather than re-uploading it.
      security:
        - staffAuth: []
      parameters:
        - name: partyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Evidence uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KycEvidenceUploadResponse' }
        '400': { $ref: 'openapi-common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
  /parties/{partyId}/kyc:
    post:
      summary: Submit KYC evidence and update verification status (staff-verified only)
      security:
        - staffAuth: []
      parameters:
        - name: partyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, evidenceDocumentRef]
              properties:
                status: { type: string, enum: [VERIFIED, REJECTED, PENDING] }
                evidenceDocumentRef: { type: string, description: "DocumentRef from the document module" }
      responses:
        '200': { description: KYC status updated }
  /parties/{partyId}/groups/{groupId}/members:
    get:
      summary: List group members (paginated — never loaded as part of the group aggregate, Deliverable 3 Rev 2 Pa1)
      security:
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - name: partyId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: groupId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/GroupMembershipView' }
                  page: { $ref: 'openapi-common.yaml#/components/schemas/PageMeta' }
    post:
      summary: Add a group member
      security:
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - name: partyId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: groupId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [memberPartyId]
              properties:
                memberPartyId: { $ref: 'openapi-common.yaml#/components/schemas/PartyRef' }
      responses:
        '201': { description: Member added }
components:
  schemas:
    RegisterIndividualRequest:
      type: object
      required: [fullName, dateOfBirth, contactInfo]
      properties:
        fullName: { type: string }
        dateOfBirth: { type: string, format: date }
        contactInfo:
          type: object
          properties:
            phoneNumber: { type: string, pattern: '^\+255\d{9}$' }
            email: { type: [string, "null"], format: email }
    RegisterCorporateRequest:
      type: object
      required: [registeredName, registrationNumber, contactInfo]
      properties:
        registeredName: { type: string }
        registrationNumber: { type: string, description: "Unique per tenant." }
        contactInfo:
          type: object
          description: >-
            Same shape as RegisterIndividualRequest.contactInfo -- the controller reads
            exactly phoneNumber and email off the shared ContactInfo record. Both are
            optional (Jakarta @Pattern/@Email treat null as valid), but the object itself
            is @NotNull, so {} is accepted and a missing contactInfo is a 400.
          properties:
            phoneNumber: { type: string, pattern: '^\+255\d{9}$' }
            email: { type: [string, "null"], format: email }
    PartyView:
      type: object
      properties:
        partyId: { type: string, format: uuid }
        partyType: { type: string, enum: [INDIVIDUAL, CORPORATE, GROUP] }
        kycStatus: { type: string, enum: [PENDING, VERIFIED, REJECTED] }
        displayName: { type: string }
    KycEvidenceUploadResponse:
      type: object
      required: [documentRef]
      properties:
        documentRef: { type: string }
    GroupMembershipView:
      type: object
      properties:
        memberPartyId: { $ref: 'openapi-common.yaml#/components/schemas/PartyRef' }
        joinDate: { type: string, format: date }
        status: { type: string, enum: [ACTIVE, REMOVED] }
