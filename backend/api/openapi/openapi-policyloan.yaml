openapi: 3.1.0
info:
  title: Policy Loans & Cash Value API
  version: "0.1.0-draft"
  description: >
    External REST surface of the `policyloan` module. Note: the reserve/confirm
    interaction with `policy` (Deliverable 3 Rev 2 B1 fix) is an in-process call this
    module makes internally — it is not exposed here, since no external channel needs
    to call it directly. Disbursement is asynchronous and event-driven internally
    (Deliverable 2 Rev 2 A2) — the client polls status via GET .../loans/{loanId}.
servers:
  - url: https://api.nlolo-lifeplatform.tz/v1
paths:
  /policies/{policyNumber}/loans:
    post:
      summary: Originate a new policy loan
      security:
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        - $ref: 'openapi-common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestedAmount, payeeRef]
              properties:
                requestedAmount: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
                payeeRef: { type: string, description: "Mobile money / bank disbursement destination" }
      responses:
        '202':
          description: Loan reservation confirmed and disbursement requested (async — see LoanDisbursed event / poll below)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoanView' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '409':
          description: Requested amount exceeds available loan value, or the policy is not in force
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
    get:
      summary: List loans against a policy
      security:
        - customersAuth: [profile]
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LoanView' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
  /loans/forced-lapse-review-queue:
    get:
      summary: Loans whose balance has grown and whose forced-lapse shortfall test is outstanding
      description: >
        Operational worklist filled by the daily interest-accrual sweep
        (db-migrations/_post-migration/configure-loan-interest-accrual.sql). The sweep grows loan
        balances cross-tenant in SQL but cannot run the shortfall test itself — that needs the
        policy's cash value, which this module reads only through policy's public API — so it
        flags each loan it accrued and this queue is how a caller finds them. Drain it with
        POST /loans/{loanId}/forced-lapse-evaluation. STAFF only: it spans the whole loan book
        rather than one policy, so the own-policy-only check the other operations apply has
        nothing to bind to. Ordered oldest-flagged first.
      security:
        - staffAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LoanView' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
  /loans/{loanId}/forced-lapse-evaluation:
    post:
      summary: Run the forced-lapse shortfall test for one loan
      description: >
        Compares the loan's outstanding balance (principal plus accrued interest, net of
        repayments) against the policy's cash value. If the balance is strictly greater, the loan
        moves to FORCED_LAPSE_TRIGGERED and the policy is LAPSED — "automatic policy termination
        when loan balance plus interest exceeds cash value" (docs/01-domain-map.md:224). If it is
        not, the loan is left as it is and only cleared from the review queue. Idempotent, and
        safe to call on a terminal loan, which is a normal consequence of draining the queue.
        200 rather than 202: this completes synchronously, with no external rail involved.
        STAFF only, because it can terminate a policy.
      security:
        - staffAuth: []
      parameters:
        - name: loanId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Shortfall test completed — the loan as it now stands
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoanView' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '500':
          description: >
            Documented deliberately, because there is one reachable case and callers should not
            read it as a transient fault: the loan and the policy's cash value are denominated in
            different currencies. No conversion is defined on this platform, and guessing one
            would terminate a policy on a wrong comparison, so the operation refuses rather than
            converts. That state is a data defect to be fixed, not retried — hence 500 and not a
            409, which would misrepresent a bug as a business conflict.
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /loans/{loanId}:
    get:
      summary: Get loan detail and current outstanding balance
      security:
        - customersAuth: [profile]
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - name: loanId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoanView' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
  /loans/{loanId}/repayments:
    post:
      summary: Record a repayment (ad hoc or scheduled — RepaymentSchedule is optional per Deliverable 3 Rev 2 B3)
      security:
        - customersAuth: [profile]
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - name: loanId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: 'openapi-common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, paymentReference]
              properties:
                amount: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
                paymentReference: { type: string }
      responses:
        '202':
          description: Repayment accepted — pending payment gateway confirmation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoanView' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'openapi-common.yaml#/components/responses/Conflict' }
components:
  schemas:
    LoanView:
      type: object
      properties:
        loanId: { type: string, format: uuid }
        policyNumber: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        principalAmount: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        outstandingBalance: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        currentInterestRate:
          type: number
          description: The rate from the most recent LoanInterestTerm entry (Deliverable 3 Rev 2, L1).
        status:
          type: string
          enum: [RESERVED_PENDING_ORIGINATION, ORIGINATED, DISBURSEMENT_REQUESTED, DISBURSED, REPAYING, SETTLED, FORCED_LAPSE_TRIGGERED, DISBURSEMENT_FAILED]
