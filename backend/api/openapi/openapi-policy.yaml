openapi: 3.1.0
info:
  title: Policy Administration API
  version: "0.1.0-draft"
  description: >
    External REST surface of the `policy` module (the platform's hub aggregate).
    Normal issuance is system-triggered by consuming UnderwritingDecisionMade
    internally — there is deliberately no public "issue policy" endpoint for the
    common path. A staff-only manual-issue endpoint exists solely for exception
    handling (e.g. re-issuing after a manual review overturns an automated block).
    That endpoint now requires a REAL underwriting case and refuses one that already
    has a policy, answering 409 with the existing policy number: one case issues
    exactly one contract, enforced by ux_policy_underwriting_case. Both paths reach
    the same issuePolicy, and until that guard existed either could duplicate the
    other — which the automatic path's own retry advice actively invited.
    Issuance produces an OFFER, not cover: a policy sits PROPOSED from the moment
    an underwriter accepts until its first premium clears, and only then is it in
    force. So a 201 from either path means the contract record exists and the
    customer has something to pay against — not that anybody is insured yet. An
    offer nobody pays for ends at NOT_TAKEN_UP, which is deliberately not LAPSED:
    lapsing is what happens to an in-force policy whose premiums stop. The one
    exception is a manual issue whose issuanceBasis already carries cover
    (MIGRATION, CONVERSION, REINSTATEMENT), which is ACTIVE on the 201.
    Surrender/maturity are asynchronous (Camunda-orchestrated loan-netting choreography,
    Deliverable 2 Rev 2 §3.4 / Deliverable 3 Rev 2 §12) — both return 202 with a
    pollable process status, never a synchronous final result.
servers:
  - url: https://api.nlolo-lifeplatform.tz/v1
paths:
  /policies/manual-issue:
    post:
      summary: Manually issue a policy (staff exception path only)
      description: >-
        Single-life policies only. A GROUP_LIFE or CREDIT_LIFE product answers 422
        `NOT_A_SINGLE_LIFE_PRODUCT`: issued here it would be a group contract with no member
        schedule, covering nobody. Schemes are issued through their own set-up.
      security:
        - staffAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualIssueRequest' }
      responses:
        '201':
          description: Policy issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyView' }
        # A missing or unrecognised issuanceBasis lands here. Undeclared until that field became
        # required, which made 400 reachable on this path for the first time; strict contract
        # validation flagged the omission the moment a test asserted it.
        '400': { $ref: 'openapi-common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '422': { $ref: 'openapi-common.yaml#/components/responses/UnprocessableEntity' }
  /policies/{policyNumber}:
    get:
      summary: Get policy detail
      description: >
        Customers may only fetch a policy where policyholderPartyId matches their
        token's party_id claim (object-level check, not just realm/role membership).
        Agents are scoped to policies where they are agentOfRecord or within their
        agency hierarchy. Staff have unrestricted read within their tenant.
      security:
        - customersAuth: [profile]
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyView' }
        '401': { $ref: 'openapi-common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
  /policies:
    get:
      summary: Search policies
      description: >
        Customers are force-scoped to their own policies: a client-supplied policyholderPartyId is
        overridden with the token's party_id claim. Agents are scoped to their agency hierarchy.
        Staff have unrestricted read within their tenant.
      security:
        - customersAuth: [profile]
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - name: policyholderPartyId
          in: query
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PartyRef' }
        - name: relatedPartyId
          in: query
          description: >
            Policies this party is connected to in ANY recorded capacity: as the policyholder,
            as the life assured, or as an active named beneficiary. A different question from
            policyholderPartyId, and the one a claims desk asks -- a claimant is frequently not
            the owner, and on a death claim is usually a beneficiary. Ignored for customer-realm
            callers, who are already scoped to their own policies. The capacity itself is not
            returned as a field: policyholderPartyId, lifeAssuredPartyId and beneficiaries are
            all already on PolicyView, so a client can say which leg matched.
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PartyRef' }
        - name: status
          in: query
          schema: { type: string, enum: [PROPOSED, ACTIVE, LAPSED, SUSPENDED, SURRENDERED, MATURED, REINSTATED, NOT_TAKEN_UP, EXPIRED, PAID_UP] }
        - name: q
          in: query
          description: Free-text, case-insensitive substring match against policyNumber.
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PolicyView' }
                  page: { $ref: 'openapi-common.yaml#/components/schemas/PageMeta' }
  /policies/{policyNumber}/endorsements:
    post:
      summary: Apply an endorsement (contract amendment)
      security:
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        - $ref: 'openapi-common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EndorsementRequest' }
      responses:
        '201':
          description: Endorsement applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyView' }
        '409': { $ref: 'openapi-common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'openapi-common.yaml#/components/responses/UnprocessableEntity' }
  /policies/{policyNumber}/beneficiaries:
    put:
      summary: Replace the beneficiary designation set
      description: >
        Enforces exactly-one-of (partyId, freeformDesignee) per beneficiary
        (Deliverable 3 Rev 2, Po2) and that active shares sum to 100%.
      security:
        - customersAuth: [profile]
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/BeneficiaryInput' }
      responses:
        '200': { description: Beneficiaries updated }
        '422':
          description: Shares don't sum to 100%, or a beneficiary has both/neither of partyId and freeformDesignee
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /policies/{policyNumber}/suspend:
    post:
      summary: Suspend an ACTIVE policy
      description: >
        Only the product categories listed in refdata's
        POLICY_SUSPENSION_ELIGIBLE_CATEGORIES may be suspended; any other
        category, or a policy not currently ACTIVE, 409s.
      security:
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuspendPolicyRequest' }
      responses:
        '200':
          description: Policy suspended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyView' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'openapi-common.yaml#/components/responses/Conflict' }
  /policies/{policyNumber}/resume:
    post:
      summary: Resume a SUSPENDED policy back to ACTIVE
      security:
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
      responses:
        '200':
          description: Policy resumed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyView' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'openapi-common.yaml#/components/responses/Conflict' }
  /policies/{policyNumber}/reinstate:
    post:
      summary: Reinstate a LAPSED policy
      description: >
        Only within refdata's TZ_REINSTATEMENT_WINDOW_MONTHS of the lapse date;
        a policy lapsed longer ago than that, or not currently LAPSED, 409s.
        Reinstated status stays REINSTATED going forward (not written back to
        ACTIVE), distinguishing it for audit/actuarial purposes -- coverage is
        equivalent either way.
      security:
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
      responses:
        '200':
          description: Policy reinstated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyView' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'openapi-common.yaml#/components/responses/Conflict' }
  /policies/{policyNumber}/paid-up:
    post:
      summary: Make a savings policy paid-up
      description: >
        The customer stops paying and keeps reduced cover. The sum assured drops to the paid-up
        figure -- proportionate to the premium term completed, or from the product's paid-up table --
        the coverage a claim pays against is restated, the status becomes PAID_UP (in force, no
        premium due) and billing stops. 409 when the policy is not a savings product, not in a
        convertible status (ACTIVE, REINSTATED or LAPSED), or has no value yet. Not a lapse: no
        commission is clawed back.
      security:
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
      responses:
        '200':
          description: Policy made paid-up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyView' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'openapi-common.yaml#/components/responses/Conflict' }
  /policies/{policyNumber}/surrender-value:
    get:
      summary: Quote current surrender value (does not commit to surrender)
      description: Produces SurrenderValueCalculated internally — a quote only, per Deliverable 2 Rev 2 event catalog.
      security:
        - customersAuth: [profile]
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  policyNumber: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
                  quotedValue: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
                  quotedAt: { type: string, format: date-time }
  /policies/{policyNumber}/surrender:
    post:
      summary: Initiate policy surrender (asynchronous — loan-netting choreography)
      description: >
        Returns 202 immediately; the actual net-of-loan disbursement completes via the
        Camunda process described in Deliverable 3 Rev 2 §12. Poll the returned
        processInstanceId via GET /policies/{policyNumber}/processes/{processInstanceId}.
      security:
        - customersAuth: [profile]
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        - $ref: 'openapi-common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payeeRef: { type: string, description: "Mobile money / bank payout destination" }
      responses:
        '202':
          description: Surrender process started
          content:
            application/json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProcessStatus' }
        '409':
          description: Policy not in a surrenderable state, or a LoanValueReservation is currently RESERVED
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
        '501':
          description: >
            Surrender/maturity loan-netting choreography is deferred pending a workflow-engine
            decision (Camunda 7 is EOL; Camunda 8 needs a paid licence and a cross-tenant leak
            review) -- this endpoint is real, routable, and correctly secured, but returns 501
            instead of 202 until that engine is chosen. Interim state, not the intended eventual
            behaviour (see the 202/409 responses above).
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /policies/{policyNumber}/processes/{processInstanceId}:
    get:
      summary: Poll status of an async surrender/maturity process
      security:
        - customersAuth: [profile]
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        - name: processInstanceId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProcessStatus' }
        '501':
          description: >
            Surrender/maturity loan-netting choreography is deferred pending a workflow-engine
            decision (Camunda 7 is EOL; Camunda 8 needs a paid licence and a cross-tenant leak
            review) -- there is no process engine to poll, so this endpoint returns 501 instead
            of 200 until that engine is chosen. Interim state, not the intended eventual
            behaviour (see the 200 response above).
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /policies/{policyNumber}/coverage-status:
    get:
      summary: Coverage status as of a given date (used by claims, staff, support)
      security:
        - customersAuth: [profile]
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        - name: asOf
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoverageStatusView' }
  /policies/{policyNumber}/in-force:
    get:
      summary: Lightweight boolean in-force check (Deliverable 3 Rev 2, Po3)
      security:
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        - name: asOf
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  inForce: { type: boolean }
  /beneficiaries:
    get:
      summary: Policies naming a given party as beneficiary
      description: >-
        The reverse of a policy's beneficiary list -- "which policies pay out to this person" --
        which nothing on the platform could answer before: beneficiary rows were only ever read by
        policy number.


        Its own resource rather than /policies/beneficiaries, which would sit underneath
        /policies/{policyNumber} and depend on a literal segment being preferred over a path
        variable. Correct today, but a poor thing to rest an endpoint on.


        Only ACTIVE beneficiary rows appear; replacing a policy's beneficiaries deactivates the old
        rows rather than deleting them, and that history is a different question. An agents-realm
        token may ask only about a client it registered -- this reveals who stands to be paid on
        someone else's contract, so it is scoped exactly as the party-detail read is. Customers are
        excluded: their own exposure is a reasonable thing to show them, but it has not been
        designed.
      security:
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - name: partyId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BeneficiaryOfView' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
  /group-schemes:
    post:
      summary: Issue a master group policy with its opening member schedule (exception path)
      # THE EXCEPTION ROUTE. Ordinary group business is proposed as an underwriting case
      # (POST /underwriting/cases/group) and issued by the decision, exactly as individual
      # business is. This endpoint is the group counterpart of /policies/manual-issue: a
      # scheme already in force elsewhere, or a correction. reasonForManualIssue records why.
      description: >-
        One master policy, many insured lives. ABC Company buys Group Life for 500 employees:
        the company is the policyholder, the employees are the lives, and a member is not a
        policy of their own.


        Issued together with its opening schedule rather than issued-then-populated, because a
        scheme's sum assured IS the total of its members' cover -- a scheme issued empty has a
        sum assured of nil, which policy_sum_assured_positive rejects and rightly. Atomicity
        also means a failure part-way through a 500-row schedule leaves no half-populated
        scheme for somebody to find and mistake for a complete one.


        There is deliberately no sumAssured field. It is derived from openingSchedule in one
        place; a caller able to supply it is a caller able to supply one that disagrees with
        the schedule underneath it.


        UNDERWRITER role required, not merely a staff token. This puts a contract on risk —
        it accepts N lives, fixes the free cover limit and the premium, and the scheme is
        ACTIVE the moment it returns — and every other decision to take risk on this platform
        is role-gated the same way. Reading a scheme and its schedule stays open to any staff
        token: a claims assessor must be able to check whether a life was covered.


        Staff only in the realm sense too: a scheme is set up from a submitted employee
        schedule at a desk, and no agent- or customer-facing flow for it has been designed.
      security:
        - staffAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueGroupSchemeRequest' }
      responses:
        '201':
          description: Scheme issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupSchemeView' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '409':
          description: >-
            The product is not GROUP_LIFE, the schedule is empty or names somebody twice, the
            commencement date is in the future, or a member's inputs do not match the scheme's
            benefit basis.
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
        '422': { $ref: 'openapi-common.yaml#/components/responses/UnprocessableEntity' }
  /group-schemes/{policyNumber}:
    get:
      summary: Get a scheme's configuration and current totals
      security:
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupSchemeView' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '409':
          description: >-
            The policy exists but is an individual policy, not a scheme. Distinct from 404 on
            purpose: "you are looking at an individual policy" and "there is no such policy"
            send whoever asked to different places.
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /group-schemes/{policyNumber}/agent-of-record:
    post:
      summary: Correct who earns commission on a scheme, from now on (staff -- FINANCE_OFFICER or ADMIN)
      description: >-
        On credit life the commission belongs to the lender (spec 2.8), but a scheme could only get
        its agent at issuance, where whoever registered the lender's party won. Forward only:
        accruals already booked stay with whoever earned them. Publishes
        policy.AgentOfRecordChanged, which distribution follows and audit records.
      security:
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                agentOfRecordId:
                  type: [string, "null"]
                  format: uuid
                  description: The agent who earns from now on; null makes the scheme direct.
                reason: { type: string, minLength: 1 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyView' }
        '400': { $ref: 'openapi-common.yaml#/components/responses/BadRequest' }
        '401': { $ref: 'openapi-common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '409':
          description: >-
            The policy is not a scheme, or it is a credit-life scheme and the agent is not its
            lender — on credit life only the lender itself earns commission (spec 2.8).
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
        '422':
          description: agentOfRecordId names no agent in this tenant (UNKNOWN_AGENT_OF_RECORD).
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /group-schemes/{policyNumber}/members/{policyMemberId}:
    get:
      summary: One member of a scheme, by id (staff)
      description: >-
        Built exactly as a row of the roll. For a screen that holds a member id and needs the
        person -- finance's bank-transfer queue knows a claim, and a claim knows only its
        member's id; the roll could be searched by name or reference but not by id.
      security:
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { type: string }
        - name: policyMemberId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyMemberView' }
        '401': { $ref: 'openapi-common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '409':
          description: The policy is not a scheme, or no member with that id is on it.
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /group-schemes/{policyNumber}/members:
    get:
      summary: One page of a scheme's member schedule
      description: >-
        Ordered by joinedOn then member id -- a TOTAL order. A bulk schedule gives every row
        the same join date, and paging a query whose order has ties can show one member twice
        while never showing another: on a member roll that is a person who believes they are
        insured and is missing from the page nobody scrolled twice.


        Each row carries the benefit in force for that member as at today, resolved for the
        whole page in one query.
      security:
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        - name: status
          in: query
          required: false
          description: >-
            Omit for every member including those who have left. An exited member is never
            deleted: a claim can arrive after somebody leaves the employer, and "were they
            covered on the date of event" needs the dates to still exist.
          schema: { type: string, enum: [ACTIVE, EXITED] }
        - name: q
          in: query
          required: false
          description: >-
            Free-text, case-insensitive substring match against the MEMBER'S NAME. Omit for
            no name search; combines with `status` rather than replacing it.


            A member row carries a party id and no name -- the name belongs to the party
            module, which guards it -- so this is resolved to matching party ids there and
            applied as an id filter here. That is also why it matches a name and nothing
            else: a grade code or a join date is on the row and could be filtered directly,
            but a 500-life schedule is searched for a person.
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 25, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyMemberPage' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
    post:
      summary: Add one life to an existing scheme
      description: >-
        Values the member against the scheme's basis, tests them against its free cover limit,
        and restates the master policy's sum assured in the same transaction -- so the contract
        total and the member schedule cannot disagree even for an instant.
      security:
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupMemberInput' }
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyMemberView' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '409':
          description: >-
            Already an active member, the scheme is not in force, the join date is in the future
            or before commencement, the inputs do not match the scheme's benefit basis, the
            member is outside the product's entry age or loan term, or the scheme is credit
            life — borrowers join only through an enrolment file a second person accepts.
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
        '422': { $ref: 'openapi-common.yaml#/components/responses/UnprocessableEntity' }

  /credit-life-schemes/{policyNumber}/enrolments:
    post:
      summary: Submit a lender's enrolment schedule. Enrols nobody.
      description: >-
        A lender's monthly file of borrowers. Every row is parsed, judged and recorded with
        its outcome, and NOBODY is put on risk: a second staff user must accept the
        submission before any cover exists.


        One submission may be in flight per scheme at a time. A file missing a required
        column is refused whole and no submission is created -- every row would fail
        identically, and a pending submission would block the corrected file.


        STAFF ONLY in this build. The lender-facing upload additionally needs a public PKCE
        client on the customers realm, CORS, and a party_id that can name a corporate party.
      security:
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The schedule as CSV, in the nine-column template.
      responses:
        '201':
          description: Judged. Nobody is enrolled until this submission is accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrolmentSubmissionView' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '409':
          description: >-
            Not a credit-life scheme, a submission is already awaiting acceptance, or the
            file is unreadable as a whole.
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }

    get:
      summary: Every enrolment submission this scheme has had, newest first
      description: >-
        Every other read here needs a submissionId, which the upload flow has and a console
        page opening on a scheme does not. Without this there is no way to reach the report of
        a file sent last month.


        Empty rather than 404 for a scheme that has had none: that is the normal state of a
        scheme on its first day, not an error.
      security:
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
      responses:
        '200':
          description: Newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EnrolmentSubmissionView' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
  /credit-life-schemes/{policyNumber}/exits:
    post:
      summary: Submit a lender's monthly exits file. Takes nobody off cover.
      description: >-
        The loans that ended -- repaid early, refinanced, written off or cancelled -- and the
        cover that comes off with them. Every row is judged and recorded, and NOBODY leaves
        cover until a second staff user accepts the submission.


        CSV or XLSX, the same as the enrolment upload. This was CSV-only on the argument that an
        exits file is a short list from a loan system, so a second format would buy a second set
        of numeric-coercion traps for nobody. That missed the thing that matters: the file carries
        an exit_date, and a CSV cannot survive Excel, which rewrites dates on open and again on
        save. Two real enrolment files were refused entire that way before that side moved to a
        workbook; this side was exposed to the identical failure and had merely not been reached.


        The coercion traps were already handled -- XlsxToCsv is what both paths read a workbook
        through, and the exits service has always called it. Only the controller refused one.


        One submission may be in flight per scheme at a time.


        THIS SURFACE DID NOT EXIST until 2026-09-23. The feature was built complete -- parser,
        state machine, pro-rata refund, commission clawback -- and shipped with no controller,
        so no HTTP client could run a lender's monthly file at all.
      security:
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The exits file as CSV -- member reference, exit date, reason, outstanding balance.
      responses:
        '201':
          description: Judged. Nobody leaves cover until this submission is accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExitSubmissionView' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '409':
          description: >-
            Not a credit-life scheme, a submission is already awaiting acceptance, or the file
            is unreadable as a whole.
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
    get:
      summary: Every exits submission this scheme has had, newest first
      security:
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
      responses:
        '200':
          description: Newest first. Empty for a scheme that has had none.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExitSubmissionView' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }

  /credit-life-schemes/{policyNumber}/exits/{submissionId}:
    get:
      summary: One exits submission and where it stands
      security:
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        - name: submissionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The submission.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExitSubmissionView' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }

  /credit-life-schemes/{policyNumber}/exits/{submissionId}/rows:
    get:
      summary: Every row of an exits file, with its outcome
      security:
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        - name: submissionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: One entry per row of the uploaded file.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExitRowView' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }

  /credit-life-schemes/{policyNumber}/exits/{submissionId}/acceptance:
    post:
      summary: A second person turns the judged rows into actual exits
      description: >-
        This is what takes cover away, refunds unearned premium and claws back the commission
        it earned. The accepting user must be a DIFFERENT person from the submitter.
      security:
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        - name: submissionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Accepted. The good rows are off cover.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExitSubmissionView' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'openapi-common.yaml#/components/responses/Conflict' }

  /credit-life-schemes/{policyNumber}/exits/{submissionId}/withdrawal:
    post:
      summary: Withdraw a submission nobody should accept
      security:
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        - name: submissionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Withdrawn. The scheme is free to receive a corrected file.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExitSubmissionView' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'openapi-common.yaml#/components/responses/Conflict' }

  /credit-life-schemes/{policyNumber}/exits/{submissionId}/report:
    get:
      summary: The report that goes back to the lender, as CSV
      description: >-
        The only place a lender learns which exits were refused and why. Served as a download
        because it is read in the spreadsheet the file came from, beside the rows it judges.
      security:
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        - name: submissionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The report.
          content:
            text/csv:
              schema: { type: string }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
  /credit-life-schemes/{policyNumber}/enrolments/{submissionId}:
    get:
      summary: One submission and where it stands
      security:
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        - name: submissionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The submission.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrolmentSubmissionView' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }

  /credit-life-schemes/{policyNumber}/enrolments/{submissionId}/rows:
    get:
      summary: Every line of the file and what happened to it
      description: >-
        In the lender's own line order, so the answer reads beside the spreadsheet that
        produced it. Line 1 is the header; data starts at 2.
      security:
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        - name: submissionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: One entry per non-blank line of the file.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EnrolmentRowView' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }

  /credit-life-schemes/{policyNumber}/enrolments/{submissionId}/acceptance:
    post:
      summary: A second person turns the acceptable rows into cover
      description: >-
        The accepter MUST NOT be the person who submitted the file. One user who can upload
        a schedule and then accept it has an audit trail and no control.


        Both identities come from the bearer token, never from a request body.
      security:
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        - name: submissionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Accepted. The acceptable rows are now members.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrolmentSubmissionView' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '409':
          description: Already accepted or withdrawn, or the accepter uploaded it.
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }

  /credit-life-schemes/{policyNumber}/enrolments/{submissionId}/withdrawal:
    post:
      summary: Abandon a pending submission without enrolling anybody
      description: >-
        The submitter may withdraw their own file: the two-person rule exists to stop cover
        being created unattended, not to stop it being declined.
      security:
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        - name: submissionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Withdrawn. Nobody was enrolled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrolmentSubmissionView' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '409':
          description: Not pending.
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }

  /group-schemes/{policyNumber}/free-cover-limit:
    put:
      summary: Move a scheme's free cover limit, restating every member's cover against it
      description: >-
        The ONLY term on a group scheme that can be amended, and the restriction is the domain's
        rather than this endpoint's. An interest method and a repayment frequency were used to
        count every existing member's schedule; a premium rate was used to CHARGE them, and their
        refund is computed from what they paid. Restating any of those rewrites history. A free
        cover limit was used for neither -- it decides how much of a benefit is covered TODAY,
        cover is effective-dated, and moving the limit writes new rows from today rather than
        altering what was true yesterday.


        RAISING IT IS THE CASE THIS EXISTS FOR. A limit is typed once at set-up, and a wrong one
        insures every borrower for a fraction of their loan and opens an underwriting case for
        each of them. Until this existed the only remedy was a second scheme.


        AN AMENDMENT MAY NOT REDUCE ANYBODY'S COVER and is refused with a 409 naming how many
        members it would. Lowering below live cover would leave borrowers part-uninsured from a
        date nobody told them about. Lowering is allowed where it caps nobody already on the roll,
        which is the honest half of the case: it binds only members yet to come.


        Omitting `fclAmount` means the scheme has NO limit -- a real design, and never the same as
        zero, which would send every borrower to underwriting.
      security:
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                fclAmount:
                  description: >-
                    Omit for a scheme with no limit at all. Zero is refused rather than accepted
                    and reinterpreted.
                  type: [string, "null"]
                  pattern: '^\d+(\.\d{1,2})?$'
                reason:
                  description: >-
                    Required. A limit is a term agreed with a lender, so an amendment with no
                    stated reason is an unexplained change to what every borrower is covered for.
                  type: string
                  minLength: 1
      responses:
        '200':
          description: OK -- the scheme as it now stands, with its restated total
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupSchemeView' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '409':
          description: >-
            The limit would reduce somebody's cover, or it is the limit the scheme already has.
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }

  /credit-life-schemes/{policyNumber}/template:
    get:
      summary: The enrolment file this scheme's lender fills in, with a worked example
      description: >-
        The header row, generated from the parser that reads it so the two cannot disagree, plus
        the scheme's OWN opening borrower as an example row.


        Scoped to the scheme rather than the product, although the columns are identical for
        every lender. A header row plus a page of prose is not how anybody learns a file format;
        the borrower somebody typed into the set-up form, echoed back in the file they are about
        to send, answers what the prose was trying to. And when the lender's portal lands, "the
        template" has to mean their scheme's.


        The example row is safe to return unchanged: it names a loan already on cover, and the
        judge refuses a row whose borrower, date of birth, disbursement date and principal match
        an existing member -- so it comes back ALREADY_ENROLLED rather than insuring anybody
        twice. That is why a REAL borrower can be shown here where an invented one could not.
      security:
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
      responses:
        '200':
          description: OK -- CSV, served as an attachment
          content:
            text/csv:
              schema: { type: string }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }

  /credit-life-schemes/{policyNumber}/exits-template.xlsx:
    get:
      summary: The monthly exits file as a spreadsheet, with its instructions sheet
      description: >-
        The one to send a lender who works in Excel. A CSV cannot survive it -- Excel rewrites
        dates on open and again on save -- and this file carries an exit_date, so it was exposed
        to the failure that refused two real enrolment files before that side moved to a workbook.


        The workbook also carries a "How to fill this in" sheet, which is the only way the format
        rules reach the lender at all: the console column guide is on a staff screen they never
        see, and nothing delivers it for them.
      security:
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
      responses:
        '200':
          description: OK -- an XLSX workbook, served as an attachment
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }

  /credit-life-schemes/{policyNumber}/exits-template:
    get:
      summary: The monthly exits file this scheme's lender fills in, with an example row
      description: >-
        Header row generated by `ExitCsvParser`, plus an example whose `member_reference` quotes
        this scheme's prefix with sequence 000000 -- a reference the sequence can never mint,
        since it starts at one.


        That asymmetry with the enrolment template is deliberate. An enrolment example defends
        itself: returned unchanged it duplicates a covered loan and is refused. An exits example
        does not -- a real reference with a real date would take a living borrower off cover,
        refund their premium and claw back the commission, and every one of those looks correct
        downstream. So the shape is shown and the member is not.


        `member_reference` is REQUIRED here where it is optional on an enrolment file: an
        enrolment may name a new borrower, an exit cannot.
      security:
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
      responses:
        '200':
          description: OK -- CSV, served as an attachment
          content:
            text/csv:
              schema: { type: string }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }

  /credit-life-schemes/{policyNumber}/enrolments/{submissionId}/report:
    get:
      summary: The rejection report that goes back to the lender
      description: >-
        CSV, as a download, because it is read in the spreadsheet the file came from. Every
        rejected row's reason ends with the sentence THIS BORROWER IS NOT COVERED.
      security:
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        - name: submissionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: One line per row of the submitted file.
          content:
            text/csv:
              schema: { type: string }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }

components:
  schemas:
    ExitSubmissionView:
      type: object
      description: >-
        One monthly exits file and where it stands. Structurally the twin of
        EnrolmentSubmissionView and differing in exactly one field -- exitedCount where that
        has enrolledCount -- because the two flows share a shape and not a meaning.
      properties:
        submissionId: { type: string, format: uuid }
        policyNumber: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        status: { type: string, enum: [PENDING, ACCEPTED, WITHDRAWN] }
        fileName: { type: string }
        rowCount: { type: integer }
        exitedCount:
          type: integer
          description: Zero until the submission is accepted. Submitting takes nobody off cover.
        rejectedCount: { type: integer }
        submittedBy: { type: string }
        submittedAt: { type: string, format: date-time }
        acceptedBy: { type: [string, 'null'] }
        acceptedAt: { type: [string, 'null'], format: date-time }
    ExitRowView:
      type: object
      description: >-
        One row of an exits file, with what the platform made of it. Field-for-field from
        policy/api/ExitRowView.java -- the first draft of this schema invented rowNumber,
        reason-as-the-enum and outstandingBalance, none of which the record has, which is a spec
        that lies about the API it documents.
      properties:
        lineNumber:
          type: integer
          description: The line in the lender's own file. 1 is the header.
        memberReference: { type: [string, 'null'] }
        exitDate: { type: [string, 'null'], format: date }
        exitReason:
          type: [string, 'null']
          enum: [SETTLED_EARLY, REFINANCED, WRITTEN_OFF, CANCELLED, null]
          description: Why the loan ended. A settled claim never arrives on this file.
        outstandingBalanceAtExit: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        outcome: { type: string, enum: [EXITED, REJECTED] }
        reasonCode:
          type: [string, 'null']
          enum: [MISSING_REQUIRED_FIELD, MALFORMED_VALUE, UNKNOWN_MEMBER_REFERENCE, DUPLICATE_REFERENCE, ALREADY_EXITED, EXIT_BEFORE_COVER_STARTED, UNKNOWN_EXIT_REASON, DEATH_CLAIM_IN_PROGRESS, null]
          description: Why this row was refused. Absent on a row that will exit.
        reason:
          type: [string, 'null']
          description: The refusal in words, beside the code.
        policyMemberId:
          type: [string, 'null']
          format: uuid
          description: The member this row exits.
    EnrolmentSubmissionView:
      description: >-
        A lender's submitted schedule. enrolledCount is zero until the submission is
        accepted -- rowCount minus rejectedCount is what WOULD be enrolled, which is the
        distinction this whole flow exists to make.
      type: object
      required: [submissionId, policyNumber, status, rowCount, enrolledCount, rejectedCount, submittedBy, submittedAt]
      properties:
        submissionId: { type: string, format: uuid }
        policyNumber: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        status: { type: string, enum: [PENDING, ACCEPTED, WITHDRAWN] }
        fileName: { type: string, nullable: true }
        rowCount: { type: integer }
        enrolledCount: { type: integer }
        rejectedCount: { type: integer }
        submittedBy: { type: string }
        submittedAt: { type: string, format: date-time }
        acceptedBy: { type: string, nullable: true }
        acceptedAt: { type: string, format: date-time, nullable: true }
        premiumTotal:
          description: >-
            What the insurer charges for this file, and the figure its invoice is built from.
            Null until the submission is accepted.
          type: [number, "null"]
        statedPremiumTotal:
          description: >-
            What the LENDER's own file said, summed across the rows the insurer charged for.
            Null where the file carried no premium column, which is legitimate and is NOT the
            same as stating zero — both real schedules carry one, and it used to be discarded.
          type: [number, "null"]
        premiumVariance:
          description: >-
            `premiumTotal` less `statedPremiumTotal`, or null where there is nothing to compare.
            Positive means the lender is invoiced MORE than their own file predicted.


            Returned rather than left to the caller to subtract, so two clients cannot disagree
            about the sign of a reconciliation. A variance never blocks acceptance: the insurer
            prices the cover and the lender's figure is evidence, not an instruction — bouncing a
            whole month over a disagreement would be worse than invoicing and saying so.
          type: [number, "null"]

    EnrolmentRowView:
      description: >-
        One line of the lender's file and its outcome. ENROLLED_CAPPED is COVER, not a
        refusal: the borrower is insured up to the free cover limit with a referral open
        for the excess. reasonCode names refusals only.
      type: object
      required: [lineNumber, outcome]
      properties:
        lineNumber:
          type: integer
          description: The line in the lender's own file. 1 is the header.
        loanAccountNumber: { type: string, nullable: true }
        borrowerFullName: { type: string, nullable: true }
        outcome: { type: string, enum: [ENROLLED, ENROLLED_CAPPED, REJECTED] }
        reasonCode:
          type: string
          nullable: true
          enum: [MISSING_REQUIRED_FIELD, MALFORMED_VALUE, DUPLICATE_LOAN_ACCOUNT_NUMBER,
                 DISBURSEMENT_DATE_IN_FUTURE, ENTRY_AGE_OR_TERM_OUT_OF_BOUNDS,
                 LOAN_BEFORE_SCHEME_COMMENCED, ALREADY_ENROLLED, null]
        reason: { type: string, nullable: true }
        policyMemberId:
          type: string
          format: uuid
          nullable: true
          description: The member this row became, written at acceptance.
        memberReference:
          description: >-
            The reference the INSURER minted for this borrower, written at acceptance. Carried by
            EnrolmentRowView since enrolment was built and never declared here, so no generated
            client had the field and the console could not read one -- which is why its rows table
            said member references live only in the report. True of this contract, false of the
            data.
          type: [string, "null"]
        premiumAmount:
          description: >-
            What this borrower was charged, null on a refused row because nothing is charged for
            somebody who was not enrolled. Money, never a bare number: this endpoint returned the
            domain view directly until 2026-09-24, and its sibling on the exits side reached the
            browser as a raw JSON figure with no currency, rendering as "undefined undefined".
          oneOf:
            - $ref: 'openapi-common.yaml#/components/schemas/Money'
          nullable: true

    BeneficiaryOfView:
      description: >-
        One policy naming this party. policyStatus is carried because the share is meaningless
        without it -- being named on a LAPSED policy is not being named on one in force, and a
        percentage alone would imply a benefit that may not exist.
      type: object
      properties:
        policyNumber: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        policyStatus: { type: string }
        sharePercent: { type: number }
        revocable: { type: boolean }
    ManualIssueRequest:
      type: object
      properties:
        underwritingCaseId: { type: string, format: uuid }
        policyholderPartyId: { $ref: 'openapi-common.yaml#/components/schemas/PartyRef' }
        lifeAssuredPartyId:
          description: >-
            Whose life is insured, when that is not the policyholder. Optional: omitting it means
            self-insured, and the aggregate resolves it to the policyholder rather than storing a null,
            so an issued policy always answers the question.
          allOf:
            - $ref: 'openapi-common.yaml#/components/schemas/PartyRef'
          nullable: true
        productVersionId: { type: string, format: uuid }
        sumAssured: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        premiumAmount: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        agentOfRecordId:
          description: >-
            Who earns commission on this policy. HONOURED ONLY AS A FALLBACK: where the
            policyholder was registered by an agent, that agent is bound at issuance and the
            value sent here is ignored, because an attribution an issue form could rewrite is
            a commission an issue form could reassign.

            Null means a direct sale and accrues no commission to anybody. A non-null value
            that is not an agent in this tenant is REFUSED with 422 `UNKNOWN_AGENT_OF_RECORD`
            rather than stored: an unrecognised agent id silently earns nobody anything, and
            the failure is invisible to whoever issued the policy.
          type: [string, "null"]
          format: uuid
        # SINGLE is charged once, at inception, and never again. It takes a
        # `premiumPayingTermMonths` of 1 (or null) and is refused with anything else: a
        # contract paid once cannot have a paying term of several months.
        premiumFrequency: { type: string, enum: [MONTHLY, QUARTERLY, ANNUALLY, SINGLE] }
        beneficiaries:
          type: array
          items: { $ref: '#/components/schemas/BeneficiaryInput' }
        reasonForManualIssue: { type: string, description: "Required — feeds audit." }
        commencementDate:
          description: >-
            When risk starts. Distinct from the issue date: a policy issued today may carry risk
            from next month. Optional, and null on a product that does not term.
          type: [string, "null"]
          format: date
        policyTermMonths:
          description: >-
            How long cover runs. Null for a product that does not term — whole life, an annuity,
            an annually renewable group scheme.
          type: [integer, "null"]
          minimum: 1
        premiumPayingTermMonths:
          description: >-
            How long premiums are paid. On a limited-payment policy this is shorter than the
            cover term; it may never exceed it.
          type: [integer, "null"]
          minimum: 1
        issuanceBasis:
          description: >-
            Why this policy is being issued by hand, and whether cover starts immediately.
            MIGRATION, CONVERSION and REINSTATEMENT start cover at once — the contract is
            already in force elsewhere, or the money has already arrived. UNDERWRITING_OVERRIDE
            and GUARANTEED_ISSUE are new business and wait for the first premium like any other:
            overturning an automated block changes who may be covered, and guaranteed acceptance
            waives evidence of insurability, but neither waives the premium.
          type: string
          enum: [MIGRATION, CONVERSION, REINSTATEMENT, UNDERWRITING_OVERRIDE, GUARANTEED_ISSUE]
      required: [underwritingCaseId, policyholderPartyId, productVersionId, sumAssured, premiumAmount, agentOfRecordId, reasonForManualIssue, issuanceBasis]
    BeneficiaryInput:
      type: object
      properties:
        type: { type: string, enum: [PARTY, FREEFORM] }
        partyId: { $ref: 'openapi-common.yaml#/components/schemas/PartyRef' }
        freeformDesignee: { type: [string, "null"] }
        sharePercent: { type: number, minimum: 0, maximum: 100 }
        revocable: { type: boolean, default: true }
      required: [type, sharePercent]
    EndorsementRequest:
      type: object
      required: [endorsementType, effectiveDate, changes]
      properties:
        endorsementType: { type: string }
        effectiveDate: { type: string, format: date }
        changes:
          type: object
          description: Endorsement-type-specific change payload.
    SuspendPolicyRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
    PolicyView:
      type: object
      properties:
        policyNumber: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        policyholderPartyId: { $ref: 'openapi-common.yaml#/components/schemas/PartyRef' }
        lifeAssuredPartyId:
          description: >-
            Whose life is insured, as opposed to who owns the contract. Equal to policyholderPartyId on a
            self-insured policy -- the common case, but not the only one, and a death claim is assessed
            against this party. Null only on policies issued before the column existed.
          allOf:
            - $ref: 'openapi-common.yaml#/components/schemas/PartyRef'
          nullable: true
        productId: { type: string, format: uuid }
        productVersionId: { type: string, format: uuid }
        agentOfRecordId: { type: [string, "null"], format: uuid }
        status: { type: string, enum: [PROPOSED, ACTIVE, LAPSED, SUSPENDED, SURRENDERED, MATURED, REINSTATED, NOT_TAKEN_UP, EXPIRED, PAID_UP] }
        issueDate: { type: string, format: date }
        sumAssured: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        cashValue: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        premium: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        # SINGLE included so a single-premium policy is readable: a view that cannot express
        # the frequency a policy was written on refuses to render it at all.
        premiumFrequency: { type: string, enum: [MONTHLY, QUARTERLY, ANNUALLY, SINGLE] }
        beneficiaries:
          type: array
          items: { $ref: '#/components/schemas/BeneficiaryInput' }
        commencementDate: { type: [string, "null"], format: date }
        policyTermMonths: { type: [integer, "null"] }
        premiumPayingTermMonths: { type: [integer, "null"] }
        maturityDate:
          description: >-
            Derived at issue from commencementDate plus policyTermMonths and stored, so a maturity
            sweep can index it and a reader never has to do date arithmetic. Not accepted on the
            issue request — the aggregate is the only place it is computed. Null on a product that
            does not mature (whole life, annuity) and on any policy issued before the term columns
            existed.
          type: [string, "null"]
          format: date
        productCategory:
          description: >-
            What kind of contract this is, copied from the product at issuance. Stored since
            M3 and exposed only now: nothing reading a policy could previously tell an
            individual term-life contract from a 500-life group scheme. That matters, because
            a GROUP_LIFE policy's lives are its member schedule — its lifeAssuredPartyId is
            deliberately null rather than merely missing — and it is the one kind of policy
            that also answers on /group-schemes/{policyNumber}.
          type: [string, "null"]
          enum: [TERM_LIFE, ENDOWMENT, WHOLE_LIFE, ANNUITY, UNIT_LINKED, GROUP_LIFE, EDUCATION_SAVINGS, CREDIT_LIFE, null]
        underwritingCaseId:
          description: >-
            The decided underwriting case this policy — or scheme — was issued from. Null on an
            exception route with no case behind it, and on policies older than the rule.
          type: [string, "null"]
          format: uuid
        issuanceBasis:
          description: >-
            Why it was issued outside the ordinary proposal, decision and first premium
            (MIGRATION, UNDERWRITING_OVERRIDE, ...). Null for ordinary new business.
          type: [string, "null"]
        issuanceReason:
          description: The issuer's own words for an exception-route issuance. Null otherwise.
          type: [string, "null"]
        issuedByName:
          description: >-
            Who issued it, by name from their token — for a credit-life scheme set up from agreed
            terms, the underwriter of record. Null for automatic issuance and older policies.
          type: [string, "null"]
    IssueGroupSchemeRequest:
      description: >-
        No sumAssured field, deliberately: a scheme's sum assured is the total of its members'
        cover, derived from openingSchedule in one place. Which of flatBenefitAmount /
        salaryMultiple / grades is required depends on benefitBasis, so none can be marked
        required here -- the service checks the combination and answers 409 naming what is
        missing, which says more than a schema-level "required" could.
      type: object
      properties:
        policyholderPartyId:
          description: The employer or association that owns the contract. Not a life assured.
          allOf:
            - $ref: 'openapi-common.yaml#/components/schemas/PartyRef'
        productVersionId: { type: string, format: uuid }
        agentOfRecordId:
          description: >-
            Present-but-nullable. A scheme sold direct has no broker.

            Honoured only as a fallback, exactly as on `ManualIssueRequest`: an employer
            registered by an agent has that agent bound at issuance. A non-null value that is
            not an agent in this tenant is refused with 422 `UNKNOWN_AGENT_OF_RECORD`.
          type: [string, "null"]
          format: uuid
        benefitBasis:
          description: >-
            How each member's benefit is arrived at. One basis per scheme: flat is typical for
            SACCO, funeral and credit-linked cover; salary multiple is the standard for formal
            employer schemes; graded splits by staff category.
          type: string
          enum: [FLAT, SALARY_MULTIPLE, GRADED, AMORTISING_LOAN]
        flatBenefitAmount:
          description: >-
            A bare decimal string against this scheme's `currency`, not a JSON number and not
            a Money object. Not a number because money on this platform never travels as one:
            a decimal that survives Postgres and Java exactly should not become a double on
            the last hop. Not a Money because the scheme declares one currency for everything
            on it, and a per-field currency code could only agree with it or contradict it.
          type: [string, "null"]
          pattern: '^(?!0+(\.0{1,2})?$)\d+(\.\d{1,2})?$'
        salaryMultiple:
          description: >-
            A ratio, not money -- 3.5x has no currency -- so this one genuinely is a number.
          type: [number, "null"]
          exclusiveMinimum: 0
        fclAmount:
          description: >-
            Free cover limit -- the benefit a member gets WITHOUT medical evidence. Omit
            entirely for a scheme that has none, which is a real design for small flat schemes
            and is NOT the same as a limit of zero (that would send every member to
            underwriting). Zero is therefore rejected by the pattern rather than reinterpreted.
          type: [string, "null"]
          pattern: '^(?!0+(\.0{1,2})?$)\d+(\.\d{1,2})?$'
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        grades:
          description: Required on a GRADED scheme, rejected on any other.
          type: array
          items: { $ref: '#/components/schemas/GroupSchemeGradeInput' }
        openingSchedule:
          description: >-
            The lives the scheme opens with. REQUIRED to be non-empty on every basis but
            AMORTISING_LOAN, and the difference is the shape of the contract rather than a
            convenience.


            An employer scheme's schedule IS the contract: agreed and signed as a whole, so one
            insuring nobody for nothing is not a policy. A credit-life scheme is an agreement with
            a lender -- the rate, the free cover limit, the interest method -- and it exists before
            any borrower does; the book arrives monthly by file and never stops. Forcing a borrower
            in at set-up made somebody type a life they then met again on the member roll without
            recognising them.


            Not expressed as `minItems` because the rule depends on `benefitBasis`, which JSON
            Schema cannot condition on here; the service refuses with a message naming the basis.
          type: array
          items: { $ref: '#/components/schemas/GroupMemberInput' }
        premium: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        premiumFrequency:
          description: >-
            SINGLE is REQUIRED on an AMORTISING_LOAN scheme and refused on every other basis,
            and its absence here was not cosmetic: a credit-life premium is charged once per
            borrower when their loan is written, the service refuses any cycle outright
            ("a cycle here would bill the master policy for..."), and the only value this
            product accepts could not be expressed by a generated client at all.
          type: string
          enum: [MONTHLY, QUARTERLY, ANNUALLY, SINGLE]
        commencementDate:
          description: >-
            When the scheme's risk starts. Backdating is normal -- a schedule reaches the
            insurer weeks after cover started -- but a future date is refused for now: the
            stored total and the derived total would disagree until commencement.
          type: [string, "null"]
          format: date
        policyTermMonths:
          description: Null for the usual annually renewable scheme.
          type: [integer, "null"]
          minimum: 1
        reasonForManualIssue: { type: [string, "null"] }
        issuanceBasis:
          description: >-
            Omit for an ordinary offer: the scheme is issued PROPOSED and the employer accepts
            it by paying the first premium, exactly as an individual customer does. A basis
            that already carries cover (MIGRATION, CONVERSION, REINSTATEMENT) puts it on risk
            at once, because the contract is in force somewhere else already.


            Optional here, unlike ManualIssueRequest where it is required. On the individual
            manual-issue path every issuance is an exception that must name itself; here the
            ordinary case is an offer, and omitting it says exactly that.
          type: [string, "null"]
          # Matched to policy/api/IssuanceBasis. NEW_BUSINESS was listed here and does not
          # exist -- a client that sent it got a 400 from a value this contract promised --
          # and GUARANTEED_ISSUE exists and was missing. Ordinary new business is the NULL
          # case, which is what made the invented value look plausible.
          enum: [MIGRATION, CONVERSION, REINSTATEMENT, UNDERWRITING_OVERRIDE, GUARANTEED_ISSUE, null]
        interestMethod:
          description: >-
            This and the two fields below belong to AMORTISING_LOAN and no other benefit basis,
            and all three were absent from this request entirely until 2026-09-23 -- which made
            credit life unreachable over HTTP however complete the domain behind it was.


            FLAT_RATE is the answer for both real lender files. Cover declines straight-line, so
            the method is never read to value a claim, but the scheme records what it was
            written on.
          type: [string, "null"]
          enum: [FLAT_RATE, REDUCING_BALANCE, null]
        repaymentFrequency:
          description: >-
            How often the borrower repays -- the schedule the declining cover follows. Only
            MONTHLY and QUARTERLY exist; SEMI_ANNUALLY and ANNUALLY were listed here and are
            not values of policy/api/RepaymentFrequency, so a client following this contract
            would have been refused by the enum converter.
          type: [string, "null"]
          enum: [MONTHLY, QUARTERLY, null]
        premiumRatePercent:
          description: >-
            Per-lender and negotiable; 0.5% and 0.6% are the two the real schedules carry.
            Charged once per borrower, always on the amount they borrowed rather than on a
            declining balance — what varies between lenders is not the base but how the rate
            is applied to it, which `premiumBasis` states.
          type: [number, "null"]
          minimum: 0.0001
        premiumBasis:
          description: >-
            How the rate becomes money. Required with `premiumRatePercent` and refused without
            it, because a rate without a basis does not say what to do with itself.


            `FLAT_ON_PRINCIPAL` charges the rate once on the disbursed amount and ignores the
            term: a two-month loan costs what a twelve-month loan of the same size costs.
            `PER_ANNUM_ON_PRINCIPAL` multiplies it by the term in years.
            `ANNUAL_ON_DECLINING_BALANCE` charges it once per policy year on the principal still
            outstanding when that year begins, straight-line, and sums them.


            All three are a SINGLE premium charged at enrolment. The third walks years to reach
            its figure because that is how the lender's own schedule presents it, not because
            anything is invoiced annually.


            No default. The three agree exactly on a twelve-month loan and diverge on every
            other term, so a wrong basis is silent on an annual book and large on a short one.
          type: [string, "null"]
          enum: [FLAT_ON_PRINCIPAL, PER_ANNUM_ON_PRINCIPAL, ANNUAL_ON_DECLINING_BALANCE, null]
        underwritingCaseId:
          description: >-
            The group case this scheme is issued on. REQUIRED for a GROUP_LIFE (employer)
            scheme — as manual issue requires one for a single life — and refused with 409 when
            absent, when it is not a group proposal by this employer on this product version, or
            when a scheme already came from it. Not required for CREDIT_LIFE, which an
            underwriter sets up from agreed terms; their name is recorded as underwriter of record.
          type: [string, "null"]
          format: uuid
      # The three above are not in this list for the same reason flatBenefitAmount and
      # salaryMultiple are not: which fields a scheme requires depends on its benefitBasis,
      # OpenAPI cannot express that here, and the service refuses with a message naming the basis.
      required: [policyholderPartyId, productVersionId, benefitBasis, currency, openingSchedule, premium]
    GroupSchemeGradeInput:
      type: object
      properties:
        gradeCode: { type: string, maxLength: 30 }
        benefitAmount:
          description: A bare decimal string against the scheme's currency — see IssueGroupSchemeRequest.flatBenefitAmount.
          type: string
          pattern: '^(?!0+(\.0{1,2})?$)\d+(\.\d{1,2})?$'
      required: [gradeCode, benefitAmount]
    GroupSchemeGrade:
      description: One band as read back, with the scheme's currency attached to the figure.
      type: object
      properties:
        gradeCode: { type: string, maxLength: 30 }
        benefit: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
      required: [gradeCode, benefit]
    GroupMemberInput:
      description: >-
        gradeCode and salaryAmount are each required on exactly one benefit basis and rejected
        on the others -- a grade on a flat scheme is a caller who believes something about the
        contract that is not true. The condition cannot be expressed here, so the service
        answers 409 naming the basis.
      type: object
      properties:
        memberPartyId: { $ref: 'openapi-common.yaml#/components/schemas/PartyRef' }
        gradeCode: { type: [string, "null"], maxLength: 30 }
        salaryAmount:
          description: A bare decimal string against the scheme's currency — see IssueGroupSchemeRequest.flatBenefitAmount.
          type: [string, "null"]
          pattern: '^(?!0+(\.0{1,2})?$)\d+(\.\d{1,2})?$'
        joinedOn:
          description: >-
            When cover starts for this person. Omit on an opening schedule to mean the scheme's
            commencement date. Backdating is allowed; a future date is refused.
          type: [string, "null"]
          format: date
        memberType:
          description: >-
            PARTY for a person the platform already knows, FREEFORM for a name on a lender's
            schedule. Absent means PARTY, which is what every caller before credit life meant.
          type: [string, "null"]
          enum: [PARTY, FREEFORM, null]
        memberName:
          description: Required on a FREEFORM member and ignored on a PARTY one.
          type: [string, "null"]
          maxLength: 200
        memberDateOfBirth: { type: [string, "null"], format: date }
        loanAccountNumber:
          description: >-
            The lender's own reference, optional since policy/V16 -- neither real lender holds
            one, which is why the insurer mints the member reference instead.
          type: [string, "null"]
          maxLength: 50
        loanTerms:
          description: >-
            Required on an AMORTISING_LOAN scheme and rejected on any other. Optional here
            because the condition belongs to the scheme, and the service answers it.
          allOf: [{ $ref: '#/components/schemas/LoanTermsInput' }]
      # NO required LIST, deliberately. memberPartyId used to be the only entry, required
      # unconditionally, and that made a whole product unreachable over HTTP: a credit-life
      # member is a LOAN, carried FREEFORM with a name and a date of birth and no party row at
      # all, because a lender's file of several hundred borrowers cannot mint a party per row.
      # The real rule -- a PARTY member needs an id, a FREEFORM member needs a name -- is
      # conditional on memberType, like every other conditional rule on this request, and the
      # service answers it.
    LoanTermsInput:
      description: >-
        The loan a credit-life member IS. On this product a member is not a person with a loan
        attached; the member is the loan, and the amount insured is derived from these terms,
        declining straight-line over the term.
      type: object
      required: [principalAmount, annualInterestRatePercent, termMonths, repaymentFrequency, disbursementDate, firstRepaymentDate]
      properties:
        principalAmount:
          description: A bare decimal string. What the borrower borrowed, not what they still owe.
          type: string
          pattern: '^(?!0+(\.0{1,2})?$)\d+(\.\d{1,2})?$'
        annualInterestRatePercent:
          description: >-
            Zero is the normal case and a true statement rather than a missing value: cover
            declines straight-line, so no rate is ever read to value a claim, and both real
            lender files charge premium on the disbursed amount.
          type: number
          minimum: 0
        termMonths: { type: integer, minimum: 1 }
        # Same correction as the scheme-level field above: RepaymentFrequency has two values.
        repaymentFrequency: { type: string, enum: [MONTHLY, QUARTERLY] }
        disbursementDate: { type: string, format: date }
        firstRepaymentDate: { type: string, format: date }
    GroupSchemeView:
      type: object
      properties:
        policyNumber: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        policyholderPartyId: { $ref: 'openapi-common.yaml#/components/schemas/PartyRef' }
        status: { type: string, enum: [PROPOSED, ACTIVE, LAPSED, SUSPENDED, SURRENDERED, MATURED, REINSTATED, NOT_TAKEN_UP, EXPIRED, PAID_UP] }
        commencementDate: { type: [string, "null"], format: date }
        policyTermMonths: { type: [integer, "null"] }
        # AMORTISING_LOAN is credit life: the member IS a loan and the amount insured is the
        # declining balance. It was missing from both enums here while schemes were being issued
        # with it, so the generated client could not even express the value the server returns.
        benefitBasis: { type: string, enum: [FLAT, SALARY_MULTIPLE, GRADED, AMORTISING_LOAN] }
        flatBenefit:
          description: Null unless the basis is FLAT.
          allOf:
            - $ref: 'openapi-common.yaml#/components/schemas/Money'
          nullable: true
        salaryMultiple:
          description: A ratio, not money. Null unless the basis is SALARY_MULTIPLE.
          type: [number, "null"]
        fcl:
          description: Null for a scheme with no free cover limit. Never rendered as zero -- the two mean opposite things.
          allOf:
            - $ref: 'openapi-common.yaml#/components/schemas/Money'
          nullable: true
        activeMemberCount: { type: integer }
        totalCovered:
          description: >-
            What every active member is actually covered for. Derived from the schedule on
            every read, and equal to the master policy's sum assured, which the service
            restates inside the same transaction as any membership change.
          allOf:
            - $ref: 'openapi-common.yaml#/components/schemas/Money'
        membersRequiringEvidence:
          description: >-
            Active members over the free cover limit with underwriting still outstanding -- the
            queue a scheme administrator works, counted here so nobody has to find them by eye
            down a 500-row schedule.
          type: integer
        grades:
          type: array
          items: { $ref: '#/components/schemas/GroupSchemeGrade' }
    PolicyMemberView:
      description: >-
        `benefit` and `covered` differ whenever the free cover limit bites: a 150m benefit
        against a 100m limit is 100m of real cover while evidence is outstanding. `covered`
        is the figure a claim pays and the only one that should be quoted to a member as
        "your cover". Each carries the scheme's currency, so no reader has to fetch the
        scheme to know what the number is denominated in.


        All three money fields are null for a member whose cover has not started as at today --
        to be rendered as "not yet in force", never as a zero, which would read as insured for
        nothing.
      type: object
      properties:
        policyMemberId: { type: string, format: uuid }
        memberPartyId: { $ref: 'openapi-common.yaml#/components/schemas/PartyRef' }
        gradeCode: { type: [string, "null"] }
        joinedOn: { type: string, format: date }
        leftOn: { type: [string, "null"], format: date }
        status: { type: string, enum: [ACTIVE, EXITED] }
        underwritingStatus:
          description: >-
            Four states, not a boolean. EVIDENCE_REQUIRED ("over the limit, underwriting
            outstanding") and DECLINED ("over the limit, excess refused, cover stays at the
            limit") produce the same covered amount and mean different things, and a claim
            assessor has to be able to tell them apart.
          type: string
          enum: [WITHIN_FCL, EVIDENCE_REQUIRED, ACCEPTED, DECLINED]
        underwritingCaseId: { type: [string, "null"], format: uuid }
        salary:
          description: The input the benefit came from. Null on any scheme that is not SALARY_MULTIPLE.
          allOf:
            - $ref: 'openapi-common.yaml#/components/schemas/Money'
          nullable: true
        benefit:
          allOf:
            - $ref: 'openapi-common.yaml#/components/schemas/Money'
          nullable: true
        covered:
          allOf:
            - $ref: 'openapi-common.yaml#/components/schemas/Money'
          nullable: true
        benefitEffectiveFrom:
          description: >-
            The date the in-force benefit row took effect, so a benefit set at inception is
            distinguishable from one restated at renewal without opening the history.
          type: [string, "null"]
          format: date
        memberType:
          description: >-
            PARTY for a life the platform holds a party record for, FREEFORM for a name on a
            lender's schedule.
          type: [string, "null"]
          enum: [PARTY, FREEFORM, null]
        memberName:
          description: >-
            The insured life's name where there is no party row to look it up from. Present on
            every credit-life borrower and absent on a PARTY member, whose name comes from the
            party record.


            This field and the three below existed on PolicyMemberView.java and were absent from
            this schema, so no client could read them. The consequence was not cosmetic: a
            credit-life scheme's member roll rendered an em dash for every borrower, because the
            only name it could reach was through memberPartyId, which a FREEFORM member does not
            have. A roll whose whole purpose is answering "is this person covered" could not name
            a single person on it.
          type: [string, "null"]
          maxLength: 200
        memberReference:
          description: >-
            The reference the INSURER minted for this member, CL-<scheme>-<seq>. The lender
            quotes it back on later files, and it is how an exits file names who is leaving.
          type: [string, "null"]
        loanAccountNumber:
          description: The lender's own reference, optional since policy/V16.
          type: [string, "null"]
        exitReason:
          description: Why this member left. Null while they are still on cover.
          type: [string, "null"]
          enum: [CLAIM_SETTLED, SETTLED_EARLY, REFINANCED, WRITTEN_OFF, CANCELLED, null]
        outstandingBalanceAtExit:
          description: >-
            What the borrower still owed when they left, as the lender reported it. Null on a
            claim-settled exit and on any non-credit-life member.
          oneOf:
            - $ref: 'openapi-common.yaml#/components/schemas/Money'
          nullable: true
        openDeathClaimId:
          description: >-
            A death claim on this life that is registered and not yet paid. The member is still
            ACTIVE -- they leave cover when it settles, dated to the death -- and while this is
            set an exits file cannot take them off, since the claim decides how they leave. Null
            when there is none.
          type: [string, "null"]
          format: uuid
        arrivedOnSubmissionId:
          description: >-
            The enrolment file this member arrived on, so a console can link from the roll to the
            submission that put them on cover. NULL when they did not arrive on one -- a member of
            the opening schedule, or one added singly on an employer scheme.
          type: [string, "null"]
          format: uuid
        arrivedOnFileName:
          description: >-
            That file's name, as the lender sent it. Null for the same reasons as above, and the
            console renders the absence rather than leaving a blank that reads as missing data.


            This exists because of a question the roll could not answer: "three names, and I
            uploaded two." The third was typed at set-up, and nothing distinguished it. It is also
            the operational form of the same question -- on which file did you put this borrower
            on cover? -- which is what a lender asks in a dispute.
          type: [string, "null"]
    PolicyMemberPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PolicyMemberView' }
        page: { $ref: 'openapi-common.yaml#/components/schemas/PageMeta' }
    CoverageStatusView:
      type: object
      properties:
        policyNumber: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        asOf: { type: string, format: date }
        activeCoverages:
          type: array
          items:
            type: object
            properties:
              benefitType: { type: string, enum: [DEATH, DISABILITY, CRITICAL_ILLNESS, MATURITY, SURRENDER] }
              sumAssured: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
