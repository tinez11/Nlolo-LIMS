openapi: 3.1.0
info:
  title: Accumulation API
  version: "0.1.0-draft"
  description: >
    External REST surface of the `accumulation` module -- the guide's "bucket" (§21.4). A savings
    account behind an ACCOUNT-basis policy: contributions in, charges out, interest credited at the
    higher of a declared rate and the version's guarantee. The module owns the balance and every
    transaction that changes it; entries are immutable and corrected only by reversing or
    adjustment entries.
servers:
  - url: https://api.nlolo-lifeplatform.tz/v1
paths:
  /products/{productId}/rate-declarations:
    get:
      summary: Every rate declared for a product, newest effective date first
      description: FINANCE_OFFICER or ADMIN. Includes proposals still awaiting a second person.
      security:
        - staffAuth: []
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The product's declarations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RateDeclaration' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
    post:
      summary: Propose a declared rate
      description: >
        ADMIN only -- setting a price is ADMIN's, as publishing a version is. Every account on the
        product is credited at the higher of the approved declared rate and its own version's
        guarantee, from effectiveFrom. Refused when effectiveFrom is on or before interest already
        credited on any account of the product: a declaration may not rewrite what a customer has
        been told.
      security:
        - staffAuth: []
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 200 }, description: "The same key is the same request: a retry is answered with what the first one created, and creates nothing. Reused for a different request, it is refused (422)." }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RateDeclarationRequest' }
      responses:
        '201':
          description: Proposed, awaiting a second person's approval
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RateDeclaration' }
        '400': { $ref: 'openapi-common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '422':
          description: Refused -- out of range, or reaching back past credited interest
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /rate-declarations/{declarationId}/approve:
    post:
      summary: Approve a proposed rate, by someone other than its proposer
      description: >
        A different ADMIN, or a FINANCE_OFFICER. The reach-back rule is checked again here, because
        the month-end run may have passed the effective date since the proposal.
      security:
        - staffAuth: []
      parameters:
        - { name: declarationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RateDeclaration' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '422':
          description: Refused -- the proposer approving, not PROPOSED, reaching back, or a rate already approved for that day
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /rate-declarations/{declarationId}/withdraw:
    post:
      summary: Withdraw a proposal
      description: ADMIN. Only a PROPOSED rate -- an approved one may already have earned interest.
      security:
        - staffAuth: []
      parameters:
        - { name: declarationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Withdrawn
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RateDeclaration' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '422':
          description: Refused -- not PROPOSED
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /products/{productId}/versions/{versionId}/savings-quote:
    post:
      summary: Price a savings product before any policy exists
      description: >
        What a deposit would be worth at maturity, or what rate an account earns. A fixed-term deposit answers with
        the rate for the band the amount falls in -- a rate FOR THE TERM, not a yearly one -- the term's interest and
        the maturity value; an interest-bearing account answers with today's effective annual rate, which is
        max(latest approved declaration, the version's guarantee). Read-only: no account, no deposit period, no
        interest and no ledger entry are created by asking.


        A term or an amount the grid does not price is NOT an error: it comes back 200 with `refusal` saying why and
        `offeredTermMonths` saying what is on sale, because the useful answer to "9 months" is "this one runs 3, 6
        or 12". 422 only for a version that keeps no account at all -- a premium-rated product is priced from its
        own rate table through POST /products/{productId}/premium-quote instead.
      security:
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavingsQuoteRequest' }
      responses:
        '200':
          description: The quote, priced or refused with its reason
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavingsQuote' }
        '401': { $ref: 'openapi-common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '422':
          description: This version keeps no account, so it has no savings rate to quote
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /policies/{policyNumber}/account:
    get:
      summary: A policy's savings account and its whole ledger
      description: >
        Any staff member. 404 for a policy valued by a cash-value scale -- every policy sold before
        product step 3 -- which has no account. Entries are in sequence order and immutable; a
        correction appears as a REVERSAL or ADJUSTMENT entry, never as an edited one.
      security:
        - staffAuth: []
      parameters:
        - { name: policyNumber, in: path, required: true, schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' } }
      responses:
        '200':
          description: The account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
  /policies/{policyNumber}/account/quote:
    get:
      summary: What closing the account today would pay, before any surrender charge
      description: >
        The balance plus interest accrued since the last month-end. The surrender approval shows it
        beside the request's own estimate, so the approver sees the figure that will actually be paid.
      security:
        - staffAuth: []
      parameters:
        - { name: policyNumber, in: path, required: true, schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' } }
      responses:
        '200':
          description: The quote
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClosingQuote' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '422':
          description: Refused -- the account is closed
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /policies/{policyNumber}/account/statement:
    get:
      summary: A period of the account, computed and reconciled -- not filed
      description: >
        Entries are selected by effective date, up to the account's last entry when asked. The
        closing balance is checked against the ledger's own sum before anything is returned.
      security:
        - staffAuth: []
      parameters:
        - { name: policyNumber, in: path, required: true, schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: The statement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Statement' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '422':
          description: Refused -- the period ends before it starts
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /policies/{policyNumber}/account/statements:
    get:
      summary: Every filed statement, latest period first
      security:
        - staffAuth: []
      parameters:
        - { name: policyNumber, in: path, required: true, schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' } }
      responses:
        '200':
          description: The filed statements
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/StatementRecord' } }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
    post:
      summary: File a statement as a PDF
      description: >
        Returns the existing statement when nothing has been posted since one was filed for the same
        period, so regenerating is provably the same statement; a later correction makes a new one.
        No SMS -- only the annual run sends one. Staff deliver an on-demand statement.
      security:
        - staffAuth: []
      parameters:
        - { name: policyNumber, in: path, required: true, schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatementPeriod' }
      responses:
        '201':
          description: Filed, or the existing filing returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatementRecord' }
        '400': { $ref: 'openapi-common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '422':
          description: Refused -- the period ends before it starts
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /account-statements/{statementId}/pdf:
    get:
      summary: Download a filed statement
      security:
        - staffAuth: []
      parameters:
        - { name: statementId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '422':
          description: No such statement (including one belonging to another tenant)
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /policies/{policyNumber}/account/withdrawals:
    get:
      summary: Every partial withdrawal on the account, newest first
      security:
        - staffAuth: []
      parameters:
        - { name: policyNumber, in: path, required: true, schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' } }
      responses:
        '200':
          description: The withdrawals
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Withdrawal' } }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
    post:
      summary: Request a partial withdrawal
      description: >
        Any staff member. Valued now and again at approval: refused when it would leave less than
        the version's minimum balance, net of any loan lien, and while another withdrawal is in flight.
      security:
        - staffAuth: []
      parameters:
        - { name: policyNumber, in: path, required: true, schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 200 }, description: "The same key is the same request: a retry is answered with what the first one created, and creates nothing. Reused for a different request, it is refused (422)." }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WithdrawalRequest' }
      responses:
        '201':
          description: Requested, awaiting a second person's approval
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Withdrawal' }
        '400': { $ref: 'openapi-common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '422':
          description: Refused -- below the minimum balance, a withdrawal in flight, or the account closed
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /account-withdrawals/{withdrawalId}/approve:
    post:
      summary: Approve a withdrawal, by someone other than its requester
      description: >
        FINANCE_OFFICER or ADMIN. The WITHDRAWAL entry is posted now and the payment REQUESTED from
        the rail -- not yet paid. A failed payment puts the money back with a REVERSAL entry.
      security:
        - staffAuth: []
      parameters:
        - { name: withdrawalId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '202':
          description: Approved; the payment has been requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Withdrawal' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '422':
          description: Refused -- the requester approving, not REQUESTED, or now below the minimum balance
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /account-withdrawals/{withdrawalId}/reject:
    post:
      summary: Refuse a withdrawal, saying why, by someone other than its requester
      description: >
        2026-10-29. FINANCE_OFFICER or ADMIN. Nothing is posted: the money leaves the account only at approval, so a
        refused request never moved it.
      security:
        - staffAuth: []
      parameters:
        - { name: withdrawalId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Withdrawal' }
        '400': { $ref: 'openapi-common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '422':
          description: Refused -- the requester rejecting, or not REQUESTED
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /policies/{policyNumber}/account/top-ups/received:
    post:
      summary: Record money already received for the account, and credit it (finance only)
      description: >
        2026-10-29. Cash, a bank deposit, a cheque, a Lipa number or TANQR, with the method's own reference and the day
        it came. Finance alone (collections.manage): customer service may request a mobile-money top-up but cannot say
        money was received. Credited at once; a reference already recorded under the same method is refused (422).
      security:
        - staffAuth: []
      parameters:
        - { name: policyNumber, in: path, required: true, schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TopUpRequest' }
      responses:
        '201':
          description: Recorded and credited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopUp' }
        '400': { $ref: 'openapi-common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '422':
          description: Refused -- no reference, a future day, a reference already recorded, or the account cannot take it
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /policies/{policyNumber}/account/top-ups:
    get:
      summary: Every top-up on the account, newest first
      security:
        - staffAuth: []
      parameters:
        - { name: policyNumber, in: path, required: true, schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' } }
      responses:
        '200':
          description: The top-ups
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/TopUp' } }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
    post:
      summary: Request a top-up -- money the customer adds, collected through the payment rail
      description: >
        Any staff member. 202: the collection is REQUESTED; it is credited, at the contribution
        allocation rate, only once the payment provider confirms it.
      security:
        - staffAuth: []
      parameters:
        - { name: policyNumber, in: path, required: true, schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 200 }, description: "The same key is the same request: a retry is answered with what the first one created, and creates nothing. Reused for a different request, it is refused (422)." }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TopUpRequest' }
      responses:
        '202':
          description: Collection requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopUp' }
        '400': { $ref: 'openapi-common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '422':
          description: Refused -- the account is closed
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /policies/{policyNumber}/account/transfers-in:
    get:
      summary: Every transfer in from another scheme, newest first
      security:
        - staffAuth: []
      parameters:
        - { name: policyNumber, in: path, required: true, schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' } }
      responses:
        '200':
          description: The transfers in
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/TransferIn' } }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
    post:
      summary: Record money received from another scheme
      description: FINANCE_OFFICER or ADMIN. Credited at once, at the transfer allocation rate.
      security:
        - staffAuth: []
      parameters:
        - { name: policyNumber, in: path, required: true, schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 200 }, description: "The same key is the same request: a retry is answered with what the first one created, and creates nothing. Reused for a different request, it is refused (422)." }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferInRequest' }
      responses:
        '201':
          description: Recorded and credited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferIn' }
        '400': { $ref: 'openapi-common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '422':
          description: Refused -- the account is closed
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /policies/{policyNumber}/account/adjustments:
    get:
      summary: Every proposed, approved and rejected adjustment, newest first
      security:
        - staffAuth: []
      parameters:
        - { name: policyNumber, in: path, required: true, schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' } }
      responses:
        '200':
          description: The adjustments
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Adjustment' } }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
    post:
      summary: Propose a correction -- a signed amount and a reason
      description: >
        FINANCE_OFFICER or ADMIN. Posted as an ADJUSTMENT entry only once a different person approves
        it; the database refuses an adjustment entry whose approver is its proposer.
      security:
        - staffAuth: []
      parameters:
        - { name: policyNumber, in: path, required: true, schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 200 }, description: "The same key is the same request: a retry is answered with what the first one created, and creates nothing. Reused for a different request, it is refused (422)." }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdjustmentRequest' }
      responses:
        '201':
          description: Proposed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Adjustment' }
        '400': { $ref: 'openapi-common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '422':
          description: Refused -- the account is closed
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /account-adjustments/{adjustmentId}/approve:
    post:
      summary: Approve an adjustment, by someone other than its proposer -- posts the entry
      security:
        - staffAuth: []
      parameters:
        - { name: adjustmentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Approved and posted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Adjustment' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '422':
          description: Refused -- the proposer deciding, not PROPOSED, or it would take the balance below zero
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /account-adjustments/{adjustmentId}/reject:
    post:
      summary: Reject an adjustment, by someone other than its proposer -- nothing is posted
      security:
        - staffAuth: []
      parameters:
        - { name: adjustmentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Adjustment' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '422':
          description: Refused -- the proposer deciding, or not PROPOSED
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /policies/{policyNumber}/account/deposit:
    get:
      summary: A fixed-term deposit -- its terms, the interest so far, and what happens at maturity
      security:
        - staffAuth: []
      parameters:
        - { name: policyNumber, in: path, required: true, schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' } }
      responses:
        '200':
          description: The deposit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deposit' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
  /policies/{policyNumber}/account/deposit/maturity-instruction:
    post:
      summary: Record the client's choice for the end of the running term
      description: >
        Any staff member. REINVEST takes a term offered by the version active for new business; PAY_OUT
        takes an optional payee (blank pays to the number the deposit was collected from). A new
        instruction supersedes the last; with none, the deposit is paid out.
      security:
        - staffAuth: []
      parameters:
        - { name: policyNumber, in: path, required: true, schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 200 }, description: "The same key is the same request: a retry is answered with what the first one created, and creates nothing. Reused for a different request, it is refused (422)." }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaturityInstructionRequest' }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaturityInstruction' }
        '400': { $ref: 'openapi-common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '422':
          description: Refused -- no running term, or a term the product does not offer
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /deposits/awaiting-payee:
    get:
      summary: Matured deposits whose money waits for a payee
      description: Finance. A deposit lands here when no number came with it, or the payment to it failed.
      security:
        - staffAuth: []
      responses:
        '200':
          description: The waiting deposits, longest-waiting first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AwaitingPayee' } }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
  /policies/{policyNumber}/account/deposit/payout:
    post:
      summary: Pay a matured deposit to a payee finance records
      security:
        - staffAuth: []
      parameters:
        - { name: policyNumber, in: path, required: true, schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 200 }, description: "The same key is the same request: a retry is answered with what the first one created, and creates nothing. Reused for a different request, it is refused (422)." }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepositPayoutRequest' }
      responses:
        '202':
          description: Requested from the payment rail, not yet paid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepositPeriod' }
        '400': { $ref: 'openapi-common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '422':
          description: Refused -- nothing on this policy is waiting for a payee
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /policies/{policyNumber}/account/term-account:
    get:
      summary: A term account -- the rate its policy locked at sale, when it matures, and what became of it
      description: >-
        2026-10-21. A savings account that pays nothing out until it matures: a withdrawal or a surrender is refused
        (422) until then, and at maturity the whole balance is paid to the number contributions came from. Its balance
        and movements are the account's own (GET /policies/{policyNumber}/account and its entries).
      security:
        - staffAuth: []
      parameters:
        - { name: policyNumber, in: path, required: true, schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' } }
      responses:
        '200':
          description: The term account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TermAccount' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
  /term-accounts/awaiting-payee:
    get:
      summary: Matured term accounts whose money waits for a payee
      description: Finance. A term account lands here when no number came with its contributions, or the payment failed.
      security:
        - staffAuth: []
      responses:
        '200':
          description: The waiting term accounts, longest-waiting first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AwaitingPayee' } }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
  /policies/{policyNumber}/account/term-account/payout:
    post:
      summary: Pay a matured term account to a payee finance records
      security:
        - staffAuth: []
      parameters:
        - { name: policyNumber, in: path, required: true, schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 200 }, description: "The same key is the same request: a retry is answered with what the first one created, and creates nothing. Reused for a different request, it is refused (422)." }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepositPayoutRequest' }
      responses:
        '202':
          description: Requested from the payment rail, not yet paid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TermAccount' }
        '400': { $ref: 'openapi-common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '422':
          description: Refused -- this term account is not waiting for a payee
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
components:
  schemas:
    TermAccount:
      type: object
      additionalProperties: false
      required: [policyNumber, ratePercent, maturityDate, status]
      properties:
        policyNumber: { type: string }
        ratePercent: { type: number, description: "% a year, locked when the policy was sold; never a declared rate" }
        maturityDate: { type: string, format: date }
        status:
          type: string
          enum: [RUNNING, MATURED, AWAITING_PAYEE]
          description: "MATURED: the balance was sent to a payee. AWAITING_PAYEE: matured with nobody to pay, or its payment failed."
        defaultPayeeRef: { type: [string, "null"], description: "Where the maturity goes: the number contributions came from" }
        maturedOn: { type: [string, "null"], format: date }
    DepositPeriod:
      type: object
      required: [periodId, seq, principal, termMonths, ratePercent, rateVersionId, startDate, maturityDate, status]
      properties:
        periodId: { type: string, format: uuid }
        seq: { type: integer }
        principal: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        termMonths: { type: integer }
        ratePercent: { type: number, description: "For the whole term, not a year" }
        rateVersionId: { type: string, format: uuid }
        startDate: { type: string, format: date }
        maturityDate: { type: string, format: date }
        status: { type: string, enum: [RUNNING, MATURED, TERMINATED, CANCELLED] }
        interestPosted:
          type: [object, "null"]
          description: What the term posted when it ended; null while it runs
          required: [amount, currencyCode]
          properties:
            amount: { type: string, pattern: '^-?\d+(\.\d{1,2})?$' }
            currencyCode: { type: string }
        closedOn: { type: [string, "null"], format: date }
    MaturityInstruction:
      type: object
      required: [instructionId, periodId, action, recordedBy, recordedAt]
      properties:
        instructionId: { type: string, format: uuid }
        periodId: { type: string, format: uuid }
        action: { type: string, enum: [REINVEST, PAY_OUT] }
        termMonths: { type: [integer, "null"] }
        payeeRef: { type: [string, "null"] }
        recordedBy: { type: string }
        recordedAt: { type: string, format: date-time }
        method: { type: [string, "null"], enum: [MOBILE_MONEY, EFT, CHEQUE, null] }
        payeeBank: { type: [string, "null"] }
        payeeBranch: { type: [string, "null"] }
        payeeAccountName: { type: [string, "null"] }
        payeeAccountNumber: { type: [string, "null"] }
    MaturityInstructionRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [REINVEST, PAY_OUT] }
        termMonths: { type: integer, minimum: 1, maximum: 120 }
        payeeRef: { type: string, maxLength: 200 }
        method: { type: string, enum: [MOBILE_MONEY, EFT, CHEQUE], description: "How it is paid (2026-10-28); absent is mobile money" }
        payeeBank: { type: string, maxLength: 100 }
        payeeBranch: { type: string, maxLength: 100 }
        payeeAccountName: { type: string, maxLength: 200 }
        payeeAccountNumber: { type: string, maxLength: 50 }
    DepositPayoutRequest:
      type: object
      description: >
        Who is paid and how (2026-10-28): mobile money to payeeRef (the default), a bank transfer to the account the
        bank fields name, or a cheque made out to payeeRef. A missing field is a 422 naming it.
      properties:
        payeeRef: { type: string, maxLength: 200 }
        method: { type: string, enum: [MOBILE_MONEY, EFT, CHEQUE], description: "How it is paid (2026-10-28); absent is mobile money" }
        payeeBank: { type: string, maxLength: 100 }
        payeeBranch: { type: string, maxLength: 100 }
        payeeAccountName: { type: string, maxLength: 200 }
        payeeAccountNumber: { type: string, maxLength: 50 }

    Deposit:
      type: object
      required: [policyNumber, periods, interestSoFar, awaitingPayee, termsOffered]
      properties:
        policyNumber: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        periods: { type: array, items: { $ref: '#/components/schemas/DepositPeriod' } }
        instruction:
          type: [object, "null"]
          description: The current instruction for the running term; null when none is recorded (it will be paid out)
          required: [instructionId, periodId, action, recordedBy, recordedAt]
          properties:
            instructionId: { type: string, format: uuid }
            periodId: { type: string, format: uuid }
            action: { type: string, enum: [REINVEST, PAY_OUT] }
            termMonths: { type: [integer, "null"] }
            payeeRef: { type: [string, "null"] }
            recordedBy: { type: string }
            recordedAt: { type: string, format: date-time }
            method: { type: [string, "null"], enum: [MOBILE_MONEY, EFT, CHEQUE, null], description: "How a pay-out is paid (2026-10-28)" }
            payeeBank: { type: [string, "null"] }
            payeeBranch: { type: [string, "null"] }
            payeeAccountName: { type: [string, "null"] }
            payeeAccountNumber: { type: [string, "null"] }
        interestSoFar: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        defaultPayeeRef: { type: [string, "null"], description: "The number the deposit was collected from" }
        awaitingPayee: { type: boolean }
        termsOffered: { type: array, items: { type: integer } }
        schedule:
          description: >-
            The running term worked forward (2026-10-09): what it pays at maturity, and what it would pay if closed
            early at each monthly date -- interest to that day at the term's rate, before any early-closing charge.
            Null when no term runs.
          anyOf:
            - type: 'null'
            - $ref: '#/components/schemas/DepositSchedule'
    DepositSchedule:
      type: object
      required: [principal, termMonths, ratePercent, startDate, maturityDate, interestAtMaturity, amountAtMaturity, ifClosedEarly]
      properties:
        principal: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        termMonths: { type: integer }
        ratePercent: { type: number, description: For the whole term, not a year }
        startDate: { type: string, format: date }
        maturityDate: { type: string, format: date }
        interestAtMaturity: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        amountAtMaturity: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        ifClosedEarly:
          type: array
          items:
            type: object
            required: [closedOn, interest, paidOut]
            properties:
              closedOn: { type: string, format: date }
              interest: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
              paidOut: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
    AwaitingPayee:
      type: object
      required: [policyNumber, balance, maturedOn]
      properties:
        policyNumber: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        balance: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        maturedOn: { type: string, format: date }
    StatementPeriod:
      type: object
      required: [from, to]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
    Statement:
      type: object
      required: [policyNumber, periodFrom, periodTo, lastSeq, openingBalance, groups, closingBalance]
      properties:
        policyNumber: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        periodFrom: { type: string, format: date }
        periodTo: { type: string, format: date }
        lastSeq: { type: integer, minimum: 0, description: "The last entry included -- what the statement was built from" }
        openingBalance: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        groups:
          type: array
          description: One per kind of movement, in the order money moves -- in, charges, interest, out, corrections.
          items:
            type: object
            required: [type, total, entries]
            properties:
              type: { type: string }
              total: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
              entries: { type: array, items: { $ref: '#/components/schemas/LedgerEntry' } }
        closingBalance: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
    StatementRecord:
      type: object
      required: [statementId, policyNumber, periodFrom, periodTo, lastSeq, generatedBy, generatedAt]
      properties:
        statementId: { type: string, format: uuid }
        policyNumber: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        periodFrom: { type: string, format: date }
        periodTo: { type: string, format: date }
        lastSeq: { type: integer, minimum: 0 }
        generatedBy: { type: string }
        generatedAt: { type: string, format: date-time }
    SavingsQuoteRequest:
      type: object
      properties:
        amount:
          type: [number, "null"]
          description: >-
            The deposit, or an account's opening balance, or a term account's contribution per payment. Required,
            except on a term account quoted for a targetAmount.
        ratePercent:
          type: [number, "null"]
          description: "A term account's rate, % a year, inside its version's band."
        frequency:
          type: [string, "null"]
          enum: [MONTHLY, QUARTERLY, ANNUALLY, SINGLE, null]
          description: How often a term account's contribution is paid.
        targetAmount:
          type: [number, "null"]
          description: "What the customer wants a term account to pay at maturity: the contribution is solved for it."
        currency: { type: [string, "null"], description: "The product's own currency. Defaults to TZS." }
        termMonths:
          type: [integer, "null"]
          description: A deposit's term. Null asks which terms are offered without pricing one; ignored by an account.
        asOf:
          type: [string, "null"]
          format: date
          description: The proposed commencement -- the day the rate is read on and the term counted from. Defaults to today in Dar es Salaam.
    SavingsQuote:
      type: object
      required: [kind, offeredTermMonths]
      properties:
        kind:
          type: string
          enum: [DEPOSIT, ACCOUNT, TERM_ACCOUNT]
          description: >-
            Which kind this version is. They answer different questions, so they fill different rows. A TERM_ACCOUNT
            (2026-10-21) is projected to maturity at the named rate: amount is then the contribution per payment, and
            interest, maturityValue and maturityDate are the projection's, assuming every contribution is paid on time.
        amount: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        ratePercent:
          type: [string, "null"]
          description: >
            For a DEPOSIT, the rate for the whole term from the amount's band -- not a yearly rate. For an ACCOUNT,
            the effective annual rate today. Null when nothing priced, which `refusal` then explains.
        offeredTermMonths:
          type: array
          items: { type: integer }
          description: Every term the deposit grid offers. Empty for an account, which has no term.
        termMonths: { type: [integer, "null"] }
        interest:
          oneOf:
            - $ref: 'openapi-common.yaml#/components/schemas/Money'
            - type: "null"
          description: The term's interest, once.
        maturityValue:
          oneOf:
            - $ref: 'openapi-common.yaml#/components/schemas/Money'
            - type: "null"
          description: The deposit plus its interest.
        maturityDate: { type: [string, "null"], format: date }
        minimumBalance:
          oneOf:
            - $ref: 'openapi-common.yaml#/components/schemas/Money'
            - type: "null"
          description: An ACCOUNT's floor -- the least a partial withdrawal may leave behind.
        smallestDeposit:
          oneOf:
            - $ref: 'openapi-common.yaml#/components/schemas/Money'
            - type: "null"
          description: A DEPOSIT's lowest band start -- the least this product takes.
        refusal:
          type: [string, "null"]
          description: Why nothing priced, in words a staff member can act on. Null when the quote priced.
        termAccount:
          description: A TERM_ACCOUNT's projection; null on a deposit or an ordinary account.
          oneOf:
            - type: "null"
            - type: object
              required: [contributions, minRatePercent, maxRatePercent]
              properties:
                frequency: { type: [string, "null"], enum: [MONTHLY, QUARTERLY, ANNUALLY, SINGLE, null] }
                contributions: { type: integer, description: How many payments the term takes. }
                paidIn:
                  oneOf: [{ $ref: 'openapi-common.yaml#/components/schemas/Money' }, { type: "null" }]
                charges:
                  description: "The version's allocation charges and monthly fees over the term."
                  oneOf: [{ $ref: 'openapi-common.yaml#/components/schemas/Money' }, { type: "null" }]
                targetAmount:
                  description: The figure the contribution was solved for; null when the contribution was named.
                  oneOf: [{ $ref: 'openapi-common.yaml#/components/schemas/Money' }, { type: "null" }]
                minRatePercent: { type: string }
                maxRatePercent: { type: string }
                schedule:
                  description: >-
                    Where the account stands at each year end (each month end on a term of two years or less) and
                    on the maturity day, last -- cumulative figures from the projection's own running totals, so a
                    chart drawn from them agrees with the totals above. Empty when nothing priced.
                  type: array
                  items:
                    type: object
                    required: [month, date, paidIn, charges, interest, value]
                    properties:
                      month: { type: integer, minimum: 1, description: Months into the term. }
                      date: { type: string, format: date }
                      paidIn: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
                      charges: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
                      interest: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
                      value:
                        description: The balance with interest earned but not yet posted.
                        $ref: 'openapi-common.yaml#/components/schemas/Money'
    ClosingQuote:
      type: object
      required: [policyNumber, asOf, balance, interestToDate, value]
      properties:
        policyNumber: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        asOf: { type: string, format: date }
        balance: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        interestToDate: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        value: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
    Account:
      type: object
      required: [policyNumber, status, balance, openedOn, totals, entries]
      properties:
        policyNumber: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        status: { type: string, enum: [OPEN, CLOSED] }
        balance: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        totals:
          type: object
          description: >
            The ledger summed by what each line did. A reversal counts against the line it reverses;
            adjustments are in none of the four. paidOut and charges are positive.
          required: [paidIn, paidOut, interest, charges]
          properties:
            paidIn: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
            paidOut: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
            interest: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
            charges: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        openedOn: { type: string, format: date }
        closedReason:
          type: [string, "null"]
          description: EXHAUSTED, SURRENDERED, MATURED, DEATH or FREE_LOOK
        closedOn: { type: [string, "null"], format: date }
        entries: { type: array, items: { $ref: '#/components/schemas/LedgerEntry' } }
    LedgerEntry:
      type: object
      required: [entryId, seq, type, amount, balanceAfter, effectiveDate, postedAt, sourceType, sourceRef, createdBy]
      properties:
        entryId: { type: string, format: uuid }
        seq: { type: integer, minimum: 1 }
        type:
          type: string
          enum: [CONTRIBUTION, TOP_UP, TRANSFER_IN, ALLOCATION_CHARGE, POLICY_FEE, INTEREST, WITHDRAWAL,
                 SURRENDER, MATURITY, DEATH_CLAIM, FREE_LOOK_REFUND, ADJUSTMENT, REVERSAL, VESTING]
        amount:
          description: Signed -- a charge or a payment out is negative.
          $ref: 'openapi-common.yaml#/components/schemas/Money'
        balanceAfter: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        effectiveDate: { type: string, format: date }
        postedAt: { type: string, format: date-time }
        sourceType: { type: string }
        sourceRef: { type: string }
        reversesEntryId: { type: [string, "null"], format: uuid }
        reason: { type: [string, "null"] }
        createdBy: { type: string }
        approvedBy: { type: [string, "null"] }
    WithdrawalRequest:
      type: object
      description: >
        How the money reaches them (2026-10-28): mobile money to payeeRef (the default when method is
        absent), a bank transfer to the account the bank fields name, or a cheque made out to payeeRef.
        A transfer or cheque waits for finance to make it by hand. A missing field is a 422 naming it.
      required: [amount]
      properties:
        amount: { type: string, pattern: '^\d+(\.\d{1,2})?$' }
        payeeRef: { type: string, maxLength: 200, description: The phone number, or the name a cheque is made out to. }
        method: { type: string, enum: [MOBILE_MONEY, EFT, CHEQUE] }
        payeeBank: { type: string, maxLength: 100 }
        payeeBranch: { type: string, maxLength: 100 }
        payeeAccountName: { type: string, maxLength: 200 }
        payeeAccountNumber: { type: string, maxLength: 50 }
    Withdrawal:
      type: object
      required: [withdrawalId, policyNumber, amount, payeeRef, status, requestedBy, requestedAt, method]
      properties:
        withdrawalId: { type: string, format: uuid }
        policyNumber: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        amount: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        payeeRef: { type: string }
        status: { type: string, enum: [REQUESTED, APPROVED, PAID, FAILED, REJECTED] }
        requestedBy: { type: string }
        requestedAt: { type: string, format: date-time }
        approvedBy: { type: [string, "null"] }
        approvedAt: { type: [string, "null"], format: date-time }
        method: { type: string, enum: [MOBILE_MONEY, EFT, CHEQUE] }
        payeeBank: { type: [string, "null"] }
        payeeBranch: { type: [string, "null"] }
        payeeAccountName: { type: [string, "null"] }
        payeeAccountNumber: { type: [string, "null"] }
        rejectedBy: { type: [string, "null"] }
        rejectedAt: { type: [string, "null"], format: date-time }
        rejectionReason: { type: [string, "null"] }
    TopUpRequest:
      type: object
      description: >
        A mobile-money request to payerRef's phone (method absent or MOBILE_MONEY) on /top-ups, or money already
        received on /top-ups/received (finance only, 2026-10-29): cash, a bank deposit, a cheque, a Lipa number or TANQR,
        with the method's own reference and the day it came. A received method sent to /top-ups is refused (422).
      required: [amount]
      properties:
        amount: { type: string, pattern: '^\d+(\.\d{1,2})?$' }
        payerRef: { type: string, maxLength: 200, description: The phone to ask on mobile money; who paid, optionally, otherwise. }
        method: { type: string, enum: [MOBILE_MONEY, CASH, BANK_DEPOSIT, CHEQUE, LIPA_NUMBER, TANQR] }
        reference: { type: string, maxLength: 100 }
        receivedOn: { type: string, format: date }
    TopUp:
      type: object
      required: [topUpId, policyNumber, amount, payerRef, status, requestedBy, requestedAt, method]
      properties:
        topUpId: { type: string, format: uuid }
        policyNumber: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        amount: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        payerRef: { type: string }
        status: { type: string, enum: [REQUESTED, COLLECTED, FAILED] }
        requestedBy: { type: string }
        requestedAt: { type: string, format: date-time }
        method: { type: string, enum: [MOBILE_MONEY, CASH, BANK_DEPOSIT, CHEQUE, LIPA_NUMBER, TANQR] }
        reference: { type: [string, "null"] }
        receivedOn: { type: [string, "null"], format: date }
    TransferInRequest:
      type: object
      required: [amount, sourceScheme]
      properties:
        amount: { type: string, pattern: '^\d+(\.\d{1,2})?$' }
        sourceScheme: { type: string, maxLength: 200 }
        documentRef: { type: [string, "null"], maxLength: 200 }
    TransferIn:
      type: object
      required: [transferId, policyNumber, amount, sourceScheme, recordedBy, recordedAt]
      properties:
        transferId: { type: string, format: uuid }
        policyNumber: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        amount: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        sourceScheme: { type: string }
        documentRef: { type: [string, "null"] }
        recordedBy: { type: string }
        recordedAt: { type: string, format: date-time }
    AdjustmentRequest:
      type: object
      required: [amount, reason]
      properties:
        amount: { type: string, pattern: '^-?\d+(\.\d{1,2})?$', description: "Signed" }
        reason: { type: string, maxLength: 500 }
    Adjustment:
      type: object
      required: [adjustmentId, policyNumber, amount, reason, status, proposedBy, proposedAt]
      properties:
        adjustmentId: { type: string, format: uuid }
        policyNumber: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
        amount: { type: string, description: "Signed decimal string" }
        reason: { type: string }
        status: { type: string, enum: [PROPOSED, APPROVED, REJECTED] }
        proposedBy: { type: string }
        proposedAt: { type: string, format: date-time }
        decidedBy: { type: [string, "null"] }
        decidedAt: { type: [string, "null"], format: date-time }
    RateDeclarationRequest:
      type: object
      required: [ratePercent, effectiveFrom]
      properties:
        ratePercent: { type: number, minimum: 0, maximum: 100, description: "Effective annual rate" }
        effectiveFrom: { type: string, format: date }
    RateDeclaration:
      type: object
      required: [declarationId, productId, ratePercent, effectiveFrom, status, proposedBy, proposedAt]
      properties:
        declarationId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        ratePercent: { type: string, description: "Decimal string, effective annual" }
        effectiveFrom: { type: string, format: date }
        status: { type: string, enum: [PROPOSED, APPROVED, WITHDRAWN] }
        proposedBy: { type: string }
        proposedAt: { type: string, format: date-time }
        approvedBy: { type: [string, "null"] }
        approvedAt: { type: [string, "null"], format: date-time }
