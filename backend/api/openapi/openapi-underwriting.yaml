openapi: 3.1.0
info:
  title: Underwriting & Risk Assessment API
  version: "0.1.0-draft"
  description: >
    External REST surface of the `underwriting` module. Internal calls (e.g. `policy`
    consuming UnderwritingDecisionMade, `claims` calling checkContestability) are
    in-process Spring Modulith calls per Deliverable 2 and are NOT part of this contract —
    only endpoints a channel (agent portal, mobile app, staff back-office) invokes directly
    are specified here.
servers:
  - url: https://api.nlolo-lifeplatform.tz/v1
security:
  - agentsAuth: []
  - staffAuth: []
paths:
  /underwriting/cases:
    get:
      summary: List underwriting cases for the current tenant
      description: >-
        An agents-realm token is force-scoped to applicants it registered; it cannot broaden the
        result by supplying its own applicantPartyId. Until the client-register work this endpoint
        applied no agent scoping at all, so any agents-realm token could list every case in the
        tenant. Staff see the whole tenant.
      security:
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [OPEN, IN_REVIEW, DECIDED] }
        - name: applicantPartyId
          in: query
          description: Narrows to one applicant, for a client's underwriting panel.
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/UnderwritingCaseView' }
                  page: { $ref: 'openapi-common.yaml#/components/schemas/PageMeta' }
    post:
      summary: Submit a new business application for underwriting
      description: Entry point for new business — agent portal, bancassurance portal, or staff back-office.
      security:
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - $ref: 'openapi-common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenCaseRequest' }
      responses:
        '201':
          description: Case opened
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnderwritingCaseView' }
        '400': { $ref: 'openapi-common.yaml#/components/responses/BadRequest' }
        '401': { $ref: 'openapi-common.yaml#/components/responses/Unauthorized' }
        '422': { $ref: 'openapi-common.yaml#/components/responses/UnprocessableEntity' }
  /underwriting/cases/group:
    post:
      summary: Propose a group scheme
      description: >-
        An employer asking to cover a schedule of lives. UNDERWRITER, matching
        POST /group-schemes: proposing a scheme is the front of the same act that ends in a
        contract on risk.


        Its own path rather than a branch inside POST /underwriting/cases, because that one
        requires a sumAssured and a group case deliberately has none — valuing a schedule
        needs the benefit calculator that lives in the policy module, so the figure appears
        only when policy derives it at issuance. The same reasoning already split
        /group-schemes out of /policies.
      security:
        - staffAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenGroupCaseRequest' }
      responses:
        '201':
          description: Case opened
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnderwritingCaseView' }
        '400': { $ref: 'openapi-common.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '422':
          description: The schedule is empty, or the product is not GROUP_LIFE
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /underwriting/cases/{caseId}:
    get:
      summary: Get underwriting case status and decision
      security:
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnderwritingCaseView' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
  /underwriting/cases/{caseId}/assessments:
    post:
      summary: Submit a risk assessment (medical/financial/occupational) against an open case
      description: Staff-only (UNDERWRITER role). Not exposed to agents or customers.
      security:
        - staffAuth: []
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitAssessmentRequest' }
      responses:
        '201':
          description: Assessment recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnderwritingCaseView' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '409': { $ref: 'openapi-common.yaml#/components/responses/Conflict' }
  /underwriting/cases/{caseId}/decision:
    post:
      summary: Record the underwriting decision (UNDERWRITER; SENIOR_UNDERWRITER to override)
      description: >-
        The human decision. The ONLY producer of `UnderwritingDecisionMade`, and therefore the
        only thing that puts a policy in force — submitting an assessment records evidence and
        the rules engine's recommendation, and settles nothing.


        A decision whose outcome differs from the case's recorded `recommendationOutcome` is an
        override and requires SENIOR_UNDERWRITER on top of UNDERWRITER. Agreeing with the
        recommendation needs only UNDERWRITER. This cannot be a static role gate: whether a
        given decision IS an override depends on the recommendation currently on the case.


        Requires at least one assessment. A decision with no evidence behind it is not
        underwriting, and nothing structural prevented one before this endpoint existed.
      security:
        - staffAuth: []
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecideRequest' }
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnderwritingCaseView' }
        '403':
          description: >-
            `SENIOR_UNDERWRITER_APPROVAL_REQUIRED` — the decision departs from the
            recommendation and the caller is not a senior underwriter. Also the ordinary
            Forbidden for a caller without UNDERWRITER at all.
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
        '409': { $ref: 'openapi-common.yaml#/components/responses/Conflict' }
        '422': { $ref: 'openapi-common.yaml#/components/responses/UnprocessableEntity' }
  /underwriting/cases/{caseId}/beneficiaries:
    get:
      summary: The beneficiary nominations taken on this proposal
      description: >-
        Its own sub-resource rather than a field on UnderwritingCaseView, matching how
        disclosures are exposed on this module. `GET /underwriting/cases` returns twenty case
        views at a time, and carrying nominations on each would be twenty queries for
        something the queue never shows — so a list view carries none, and an empty array
        there would read as "nobody nominated" when it means "not loaded". A separate
        resource cannot be misread that way.


        The console reads this before manual-issuing against a case. That form sends its own
        beneficiary list, so without prefilling from here a proposal's nominations would be
        silently dropped by the very path meant to honour them.
      security:
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK. An empty array means nobody was nominated on this proposal.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BeneficiaryNomination' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
  /underwriting/cases/{caseId}/group-proposal:
    get:
      summary: The group scheme this case proposes
      description: >-
        Its own sub-resource rather than a field on UnderwritingCaseView, for the same reason
        beneficiaries are — and more so. A scheme schedule runs to hundreds of lives, and
        `GET /underwriting/cases` returns the same view twenty at a time, so carrying the
        proposal on it would ship a 500-row schedule with every row of a queue page. The case
        carries only the groupScheme flag, which is what a queue needs.


        404 when the case is not a scheme: there is no proposal to fetch, and that is the
        plain meaning of the URL not resolving.
      security:
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupProposal' }
        '404': { $ref: 'openapi-common.yaml#/components/responses/NotFound' }
  /underwriting/cases/{caseId}/referral:
    post:
      summary: Refer a borderline case to a senior underwriter
      description: Sets referralStatus separately from the final decision (Deliverable 3 Rev 2, U1).
      security:
        - staffAuth: []
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Referral recorded }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
  /underwriting/cases/{caseId}/disclosures:
    post:
      summary: Record what the applicant declared on the proposal form
      description: >-
        AGENTS or STAFF, deliberately not the UNDERWRITER role that gates assessment and
        referral: taking a proposal is not underwriting it, and the person who asked the
        questions is the one who should record the answers.


        Recordable at any point in a case's life, including after a decision -- a
        non-disclosure usually surfaces when a claim is made, long after the case closed, and
        the record exists to say what was asked and answered at the time. Recording a second
        set does not amend the first; both stay on the case.


        Does NOT feed the decision. Mapping a declared condition to a risk score is actuarial
        policy this platform does not have -- SimpleRulesEngine is an explicit placeholder
        with no validated thresholds -- and RiskProfile requires that new rating data extend
        the profile and the engine together rather than being invented here.
      security:
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordDisclosuresRequest' }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MedicalDisclosureView' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { description: "No such case in this tenant" }
        '422': { $ref: 'openapi-common.yaml#/components/responses/UnprocessableEntity' }
    get:
      summary: Every disclosure set recorded on this case, oldest first
      security:
        - agentsAuth: [agent]
        - staffAuth: []
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MedicalDisclosureView' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
        '404': { description: "No such case in this tenant" }
components:
  schemas:
    DisclosureAnswer:
      description: >-
        One question the applicant was asked and what they answered. The platform does not own
        the question set -- which questions a proposal form asks is product-specific and shaped
        by what the regulator and reinsurer require -- so it records what was asked rather than
        validating it against a canonical list.
      type: object
      required: [questionCode, question, answer]
      properties:
        questionCode:
          description: The product's own identifier, so answers stay comparable when wording is edited.
          type: string
        question:
          description: >-
            The wording actually put to the applicant. Stored rather than looked up: contesting
            a claim turns on what the person was asked at the time, not on what the current
            version of the form says.
          type: string
        answer:
          description: >-
            Free text, not a boolean. "Have you ever been treated for heart disease" is often
            answered with a qualification, and flattening that to yes/no discards the part a
            reviewer needs.
          type: string
        notes: { type: [string, "null"] }
    RecordDisclosuresRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/DisclosureAnswer' }
    MedicalDisclosureView:
      type: object
      properties:
        medicalDisclosureId: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        answers:
          type: array
          items: { $ref: '#/components/schemas/DisclosureAnswer' }
        recordedBy:
          description: JWT subject of whoever took the proposal -- who asked, not just when.
          type: [string, "null"]
        recordedAt: { type: string, format: date-time }
    OpenCaseRequest:
      type: object
      # sumAssured uses the platform's shared Money schema (a decimal STRING amount,
      # never a binary float -- see openapi-common.yaml#Money's own description) rather
      # than a flattened sumAssuredAmount/sumAssuredCurrency pair of bare numbers. This
      # was flattened to bare number/string fields by an earlier task to match the code
      # as it existed then; the final review (finding 6) found that divergence from the
      # platform's own Money convention was a real (if currently latent) precision-loss
      # risk at any double-parsing client boundary (JS/TS frontends, most generated
      # client SDKs), with zero external consumers today making it free to fix now and
      # expensive after external codegen exists. Reversed deliberately: the code (see
      # tz.co.nlolo.lifeplatform.underwriting.infrastructure.OpenCaseRequest) was changed
      # to match this spec, not the other way round. Matches openapi-policy.yaml's own
      # sumAssured usage of this same shared schema.
      required: [applicantPartyId, productId, productVersionId, sumAssured]
      properties:
        applicantPartyId: { $ref: 'openapi-common.yaml#/components/schemas/PartyRef' }
        productId: { type: string, format: uuid }
        productVersionId: { type: string, format: uuid }
        sumAssured: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        agentOfRecordId:
          description: >-
            Who sold it. Carried through to automatic issuance so commission accrues on the
            normal path -- the listener used to hardcode this absent, and distribution skips
            accrual entirely for a policy with no agent of record, so no commission had ever
            accrued on an automatically issued policy. Optional: a self-service application
            is a genuine direct sale.
          type: [string, "null"]
          format: uuid
        # The four proposal-identity fields below (Build 4b) reached
        # OpenCaseRequest.java and UnderwritingCaseView in this same document, but
        # were never added HERE. Nothing caught it: swagger-request-validator does
        # not reject undeclared request properties without additionalProperties:
        # false, so the contract test stayed green while the generated request type
        # omitted all four -- which is what actually surfaced it, as four typecheck
        # errors in the console's own openCaseForm test. A request schema that is a
        # subset of what the endpoint accepts is not a smaller contract, it is a
        # wrong one: every generated client is built from it.
        lifeAssuredPartyId:
          description: >-
            Whose life is insured, when that is not the applicant — a parent insures a child,
            an employer its staff. Omitting it means self-insured, and the service resolves it
            to the applicant rather than storing a null, so a newly opened case always answers
            the question.
          # `nullable: true` over an allOf-wrapped $ref, not oneOf with a
          # {type: "null"} branch -- see UnderwritingCaseView.lifeAssuredPartyId
          # below for why that spelling switches validation off entirely.
          allOf:
            - $ref: 'openapi-common.yaml#/components/schemas/PartyRef'
          nullable: true
        branch:
          description: Which office took the proposal.
          type: [string, "null"]
          maxLength: 100
        sourceOfBusiness:
          description: >-
            Free text, deliberately not an enum — the platform does not own this vocabulary,
            and minting one here would make it the de facto schema before anybody ratified it.
          type: [string, "null"]
          maxLength: 60
        proposedCommencementDate:
          description: >-
            When the applicant wants risk to start. A proposal taken today commonly asks for
            cover from the first of next month.
          type: [string, "null"]
          format: date
        # What the applicant asks for about the CONTRACT, as distinct from the risk above.
        # These lived only on POST /policies/manual-issue until now, which made manual issue
        # the only screen able to produce a complete policy: one issued on the normal path had
        # no term, no maturity date (it is derived from commencement plus term) and nobody
        # nominated, because nobody had ever asked.
        requestedTermMonths:
          description: >-
            How long cover should run. Validated against the product version's eligibility
            bounds — those bounds existed since Build 3 and were enforced in exactly one place,
            the console's manual issue form, so the normal path accepted a term the product may
            not sell. Omit for a product that does not term.
          type: [integer, "null"]
          minimum: 1
        premiumPayingTermMonths:
          description: >-
            How long premiums are paid. Shorter than the cover term on a limited-payment
            policy, never longer.
          type: [integer, "null"]
          minimum: 1
        premiumFrequency:
          description: >-
            How often the applicant intends to pay. The automatic issuance path divides the
            annual premium by this rather than always by twelve.
          type: [string, "null"]
          enum: [MONTHLY, QUARTERLY, ANNUALLY, null]
        beneficiaries:
          description: >-
            Nominations as taken on the proposal form. Optional — a proposal arriving with the
            nomination blank is routine, and beneficiaries can still be designated after
            issuance via PUT /policies/{policyNumber}/beneficiaries. If any are given, shares
            must total exactly 100, the same rule the policy side applies.
          type: array
          items: { $ref: '#/components/schemas/BeneficiaryNomination' }
        # medicalDisclosure is deliberately NOT a field here. It was once declared on this
        # request and never existed in OpenCaseRequest.java, so a client sending one got a 201
        # and had it silently discarded. Disclosures are now real, but as their own resource --
        # POST /underwriting/cases/{caseId}/disclosures -- because a proposal form is answered
        # in a sitting and can be re-taken when new evidence arrives, which a field on the
        # create request cannot express.
    OpenGroupCaseRequest:
      description: >-
        A group scheme proposal plus who is asking for it. No sumAssured: it is derived from
        the schedule at issuance, in the policy module that owns the benefit calculation.
      type: object
      required: [policyholderPartyId, productId, productVersionId, benefitBasis, currency, openingSchedule, premiumAmount, premiumCurrency, premiumFrequency]
      properties:
        policyholderPartyId: { $ref: 'openapi-common.yaml#/components/schemas/PartyRef' }
        productId: { type: string, format: uuid }
        productVersionId: { type: string, format: uuid }
        agentOfRecordId: { type: [string, "null"], format: uuid }
        benefitBasis: { type: string, enum: [FLAT, SALARY_MULTIPLE, GRADED] }
        flatBenefitAmount: { type: [string, "null"] }
        salaryMultiple: { type: [number, "null"] }
        fclAmount: { type: [string, "null"] }
        currency: { type: string }
        grades:
          type: array
          items:
            type: object
            properties:
              gradeCode: { type: string }
              benefitAmount: { type: string }
        openingSchedule:
          type: array
          items:
            type: object
            properties:
              memberPartyId: { type: string, format: uuid }
              gradeCode: { type: [string, "null"] }
              salaryAmount: { type: [string, "null"] }
        premiumAmount: { type: string }
        premiumCurrency: { type: string }
        premiumFrequency: { type: string, enum: [MONTHLY, QUARTERLY, ANNUALLY] }
        commencementDate: { type: [string, "null"], format: date }
        policyTermMonths: { type: [integer, "null"] }
    GroupProposal:
      description: >-
        A group scheme as asked for, before anybody has agreed to write it. Everything policy
        needs to issue one, held on the case so an underwriter can see the whole proposal
        before a contract exists — the same relationship BeneficiaryNomination has with
        policy.BeneficiaryInput, one size up.
      type: object
      required: [benefitBasis, currency, openingSchedule, premiumAmount, premiumCurrency, premiumFrequency]
      properties:
        benefitBasis: { type: string, enum: [FLAT, SALARY_MULTIPLE, GRADED] }
        flatBenefitAmount: { type: [string, "null"] }
        salaryMultiple: { type: [number, "null"] }
        fclAmount:
          description: The benefit a member gets without medical evidence. Null means no limit.
          type: [string, "null"]
        currency: { type: string }
        grades:
          type: array
          items:
            type: object
            properties:
              gradeCode: { type: string }
              benefitAmount: { type: string }
        openingSchedule:
          type: array
          items:
            type: object
            properties:
              memberPartyId: { type: string, format: uuid }
              gradeCode: { type: [string, "null"] }
              salaryAmount: { type: [string, "null"] }
        premiumAmount:
          description: >-
            The premium AGREED with the employer, not a computed one. A scheme is not priced
            by the individual formula — that prices one life from one age band, and the age it
            would read is the employer's. Carried verbatim to issuance.
          type: string
        premiumCurrency: { type: string }
        premiumFrequency: { type: string, enum: [MONTHLY, QUARTERLY, ANNUALLY] }
        commencementDate: { type: [string, "null"], format: date }
        policyTermMonths: { type: [integer, "null"] }
    BeneficiaryNomination:
      type: object
      # Field-for-field identical to policy's BeneficiaryInput, deliberately. The two say the
      # same thing at two points in time -- before and after a policy exists -- and keeping
      # them identical is what lets the issuance listener MAP one to the other rather than
      # interpret it. They are separate types because the underwriting module does not depend
      # on policy and must not: policy already depends on underwriting.
      required: [type, sharePercent]
      properties:
        type:
          description: PARTY for somebody on the party register, FREEFORM for a name written on the form.
          type: string
          enum: [PARTY, FREEFORM]
        partyId:
          description: Required for a PARTY nomination, and forbidden on a FREEFORM one.
          type: [string, "null"]
          format: uuid
        freeformDesignee:
          description: Required for a FREEFORM nomination, and forbidden on a PARTY one.
          type: [string, "null"]
          maxLength: 255
        sharePercent:
          description: This nomination's share. Shares across a proposal must total exactly 100.
          type: number
          minimum: 0
          maximum: 100
        revocable:
          description: >-
            Whether the policyholder may change this nomination later. An irrevocable
            nomination is a real instrument and cannot be revised without the beneficiary's
            consent. Defaults to true.
          type: boolean
    SubmitAssessmentRequest:
      type: object
      required: [assessmentType, findings]
      properties:
        assessmentType: { type: string, enum: [MEDICAL, FINANCIAL, OCCUPATIONAL] }
        findings: { type: string }
        riskScore: { type: [number, "null"] }
    DecideRequest:
      type: object
      required: [outcome, reason]
      properties:
        outcome: { type: string, enum: [ACCEPT, LOADED, DECLINED, POSTPONED] }
        loadingPercent:
          description: >-
            Required for LOADED and forbidden for every other outcome, mirroring the
            `chk_loading_only_when_loaded` CHECK. Enforced in the service rather than by
            schema, because the pairing is conditional on `outcome`.
          type: [number, "null"]
        reason:
          description: >-
            The underwriter's own words. Required: a decision nobody explained is one nobody
            can review, and on a DECLINED or POSTPONED case it is what the applicant is
            eventually told.
          type: string
          maxLength: 500
    UnderwritingCaseView:
      type: object
      # The decision is intentionally flattened to decisionOutcome/decisionLoadingPercent/
      # decisionDeclineReason/decisionDecidedAt here to match
      # tz.co.nlolo.lifeplatform.underwriting.api.UnderwritingCaseView -- confirmed against
      # the real controller/DTO by Task 7's UnderwritingContractTest.
      properties:
        caseId: { type: string, format: uuid }
        applicantPartyId: { $ref: 'openapi-common.yaml#/components/schemas/PartyRef' }
        productId: { type: string, format: uuid }
        status: { type: string, enum: [OPEN, IN_REVIEW, DECIDED] }
        referralStatus: { type: string, enum: [NONE, REFERRED_TO_SENIOR, REFERRAL_RESOLVED] }
        decisionOutcome: { type: [string, "null"], enum: [ACCEPT, LOADED, DECLINED, POSTPONED, null] }
        decisionLoadingPercent: { type: [number, "null"] }
        decisionDeclineReason: { type: [string, "null"] }
        decisionDecidedAt: { type: [string, "null"], format: date-time }
        agentOfRecordId: { type: [string, "null"], format: uuid }
        proposalNumber:
          description: >-
            Human handle for the proposal, shaped like a policy number (PRO-XXXXXXXX). A case was
            previously identifiable only by its UUID, which nobody can quote over the phone.
            Null on cases opened before the column existed.
          type: [string, "null"]
        lifeAssuredPartyId:
          description: >-
            Whose life is insured, which is NOT always the applicant — a parent insures a child, an
            employer its staff. Resolved to the applicant when the caller states nothing, so a
            newly opened case always answers it. Null only on cases predating the column.
          # `nullable: true` over an allOf-wrapped $ref, matching the handful of other
          # nullable $ref fields on this platform (see openapi-distribution.yaml's
          # flatAmount). NOT oneOf with a {type: "null"} branch: PLAN.md §10 item 3
          # records that spelling making swagger-request-validator match EVERY value,
          # silently switching validation off while the tests stay green.
          allOf:
            - $ref: 'openapi-common.yaml#/components/schemas/PartyRef'
          nullable: true
        branch: { type: [string, "null"] }
        sourceOfBusiness:
          description: >-
            Free text, deliberately not an enum. The platform does not own this vocabulary — TIRA's
            return catalogue is an open item — and minting one here would make it the de facto
            schema before anybody ratified it.
          type: [string, "null"]
        proposedCommencementDate: { type: [string, "null"], format: date }
        recommendationOutcome:
          description: >-
            What the rules engine suggests on the evidence gathered so far. ADVICE, not the
            decision — it is recomputed from scratch every time an assessment arrives, and it
            binds nothing. Null until the first assessment, and on every case decided before
            the recommendation existed.


            Until this split, the engine's verdict WAS the decision: submitting one assessment
            ran it, wrote straight into the decision fields, and an acceptance issued a real
            policy. Its own source calls its thresholds "illustrative, not actuarially
            validated".
          type: [string, "null"]
          enum: [ACCEPT, LOADED, DECLINED, POSTPONED, null]
        recommendationLoadingPercent: { type: [number, "null"] }
        recommendationReason: { type: [string, "null"] }
        decisionDecidedBy:
          description: >-
            The staff subject who made the decision. Null on a case decided before decisions had
            authors — which is every case decided by the engine alone, and is why the column
            carries no backfill.
          type: [string, "null"]
        decisionOverrodeRecommendation:
          description: >-
            Whether the decision departed from `recommendationOutcome`. Only a SENIOR_UNDERWRITER
            may make such a decision. Stored at decision time rather than derived, because a
            later assessment recomputes the recommendation and must not rewrite the fact that
            somebody once disagreed with it.
          type: boolean
        requestedTermMonths:
          description: >-
            The term the applicant asked for, validated at openCase against the product
            version's eligibility bounds. Those bounds were previously only ever checked by the
            console's manual issue form, so the normal path accepted a term the product may not
            sell. Null for a product that does not term — whole life, an annuity, an annually
            renewable group scheme — and on every case opened before the field existed.
          type: [integer, "null"]
        premiumPayingTermMonths:
          description: >-
            How long premiums are paid, which on a limited-payment policy is shorter than the
            cover term and never longer.
          type: [integer, "null"]
        premiumFrequency:
          description: >-
            How often the applicant intends to pay. Drives the instalment the automatic
            issuance path computes — it divided the annual premium by twelve unconditionally
            until this was captured.
          type: [string, "null"]
          enum: [MONTHLY, QUARTERLY, ANNUALLY, null]
        groupScheme:
          description: >-
            True when this case is a group scheme rather than one life. The queue needs it to
            tell a 500-life scheme from an individual proposal, and sumAssuredAmount cannot
            say which — it is deliberately null on a group case, because valuing a schedule
            needs the benefit calculator that lives in the policy module.


            The proposal itself — terms, grade table and the schedule of lives — is NOT on
            this view: a 500-row schedule has no business on every row of a twenty-case queue
            page. It is read from GET /underwriting/cases/{caseId}.
          type: boolean
