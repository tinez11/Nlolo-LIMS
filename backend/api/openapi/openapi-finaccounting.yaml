openapi: 3.1.0
info:
  title: Finaccounting API
  version: "1.0.0"
  description: >
    External REST surface of the `finaccounting` module: the double-entry general ledger --
    journal entries with their two legs (GL postings), and the chart of accounts. IFRS 17
    measurement (CSM roll-forward, LRC, LIC) is NOT YET IMPLEMENTED -- it is blocked on C1
    (Actuarial) -- so a consumer of this spec should not expect a CSM, LRC, or LIC endpoint to
    exist anywhere below.


    Journal entries and GL postings stay READ ONLY, permanently: every entry is derived from a
    domain event by finaccounting's own listeners, nothing is hand-entered, and a correction is a
    future reversal entry (deferred, see the design spec's section 9), never an edit to an
    existing one. That absence is what makes the ledger trustworthy, and nothing in this file
    changes it.


    The chart of accounts is NOT read-only: it has a real create/rename/delete surface below,
    added on explicit request after the module first shipped read-only. `accountType` and
    `normalBalance` stay derived from the account code's own leading digit and are never
    independently settable on either create or rename. Deleting an account is rejected once any
    real posting references it (a real foreign key at the database layer) -- retiring an in-use
    account is a distinct, deferred concern, not built here.


    Every endpoint requires the staff realm AND the fine-grained FINANCE_OFFICER or ADMIN role,
    the same decision M7 recorded for `distribution` and M8/M9 recorded for `reinsurance`: there
    is no finaccounting-specific staff role, and finaccounting is itself a finance/back-office
    concern.


    Every money field is a pattern-constrained decimal string, never a JSON number -- this
    platform forbids floats anywhere in the wire format.
servers:
  - url: https://api.nlolo-lifeplatform.tz/v1
paths:
  /gl-postings:
    get:
      summary: List journal entries (GL postings), optionally filtered by period, policy number and/or account
      description: >
        Each item is one journal entry with BOTH of its legs -- an entry always has exactly two
        legs in M9, and their DR and CR totals are always equal. Omitting every filter returns
        every journal entry visible to the caller's tenant, ONE PAGE AT A TIME: journal_entry is
        an append-only ledger fed by every money-moving event on the platform, so an unpaged
        read of it has no upper bound. Newest entries first, by postedAt.


        `accountCode` is what lets a balance be opened up. Every posting already carried an
        account code, so "what made up account 1210" was in the data and unanswerable here --
        which is why the chart of accounts and this list sat side by side with no way to reach
        each other. An entry is returned ONCE however many of its legs hit the account.
      security:
        - staffAuth: []
      parameters:
        - $ref: '#/components/parameters/Period'
        - $ref: '#/components/parameters/PolicyNumberFilter'
        - name: accountCode
          in: query
          required: false
          description: >-
            Restricts to entries with at least one leg against this account. Matches the chart's
            own five-block convention.
          schema: { type: string, pattern: '^[1-5]\d{3}$' }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: pageSize
          in: query
          required: false
          description: "Capped server-side at 100 regardless of the value sent."
          schema: { type: integer, minimum: 1, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalEntrySearchResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /gl-postings/{journalEntryId}:
    get:
      summary: Get one journal entry, with both legs
      security:
        - staffAuth: []
      parameters:
        - $ref: '#/components/parameters/JournalEntryId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalEntryView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /chart-of-accounts:
    get:
      summary: List the chart of accounts
      description: >
        Every account on this platform started as a PLACEHOLDER pending Finance sign-off, seeded
        rather than authored through this API -- this endpoint now also returns any account
        created through POST below.
      security:
        - staffAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChartOfAccountView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a chart-of-account row
      description: >
        `accountType` and `normalBalance` are NOT accepted here -- both are derived server-side
        from `accountCode`'s own leading digit (1=ASSET, 2=LIABILITY, 3=EQUITY, 4=INCOME,
        5=EXPENSE), so an account can never disagree with its own code's block convention.
      security:
        - staffAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccountRequest' }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChartOfAccountView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "An account with this accountCode already exists in this tenant, or the named parent already carries postings"
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /chart-of-accounts/balances:
    get:
      summary: The chart with its balances, and whether the ledger balances
      description: >
        The aggregation this module never had. Nothing anywhere summed a posting, so a ledger
        holding thousands of balanced entries could not state the balance of a single account --
        and the chart of accounts, hierarchy and all, was a structural reference list rather than
        a ledger view.


        A separate path from GET /chart-of-accounts rather than a flag on it: that one is bounded
        reference data read to render a tree or fill a picker, while this aggregates the whole
        posting table behind it.


        BALANCES ROLL UP. A parent reports itself plus every descendant, which is the standard
        convention and the one this chart is shaped for -- `postingAllowed` marks the accounts
        that take direct postings, making every other account a summary of those beneath it. Each
        row carries its OWN figures beside the rolled ones so the two cannot be confused.


        THE TOTALS DO NOT ROLL UP. They sum each account's own postings, because adding rolled
        figures would count every posting once for its own account and again for every ancestor,
        reporting a sound ledger as wildly out. `balanced` is stated by the server rather than
        left to a caller comparing two decimal strings.
      security:
        - staffAuth: []
      parameters:
        - name: period
          in: query
          required: false
          description: >-
            YYYY-MM. Omitted means inception-to-date. Echoed back on the response, because a
            balance with no period beside it cannot be reconciled against anything.
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrialBalanceView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /chart-of-accounts/{accountCode}:
    put:
      summary: Update a chart-of-account row
      description: >
        Name and description. `accountCode` is this resource's own identifier, `accountType`/
        `normalBalance` stay derived from it, and `parentCode`/`level` are equally fixed -- moving
        an account is a distinct, deferred concern that carries real risk to historical reporting.
      security:
        - staffAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountCode'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAccountRequest' }
      responses:
        '200':
          description: Account updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChartOfAccountView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Delete a chart-of-account row
      description: >
        Rejected once any real GL posting references this account, and rejected once it has
        children. Retiring an account that has history is what `deactivate` below is for: deleting
        it would orphan the postings booked to it.
      security:
        - staffAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountCode'
      responses:
        '204':
          description: Account deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "At least one GL posting already references this account, or it has children -- it cannot be deleted"
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /chart-of-accounts/{accountCode}/activate:
    post:
      summary: Return a retired account to service
      description: "Sets status to ACTIVE, so the account may receive new postings again."
      security:
        - staffAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountCode'
      responses:
        '200':
          description: The account, now ACTIVE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChartOfAccountView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /chart-of-accounts/{accountCode}/deactivate:
    post:
      summary: Retire an account from new postings, keeping its history readable
      description: >
        Sets status to INACTIVE. The ledger then refuses any new leg naming this account, while
        every posting already booked to it stays resolvable. This -- not DELETE -- is how an
        account that has been used is taken out of service.
      security:
        - staffAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountCode'
      responses:
        '200':
          description: The account, now INACTIVE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChartOfAccountView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  parameters:
    JournalEntryId:
      name: journalEntryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Period:
      name: period
      in: query
      required: false
      description: "Filter to one accounting period, formatted YYYY-MM"
      schema: { type: string, pattern: '^\d{4}-\d{2}$' }
    PolicyNumberFilter:
      name: policyNumber
      in: query
      required: false
      schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
    AccountCode:
      name: accountCode
      in: path
      required: true
      schema: { type: string, pattern: '^[1-5]\d{3}$' }
  responses:
    BadRequest:
      description: "Malformed request body -- a missing/blank name, or an accountCode that is not 4 digits with a leading 1-5 block"
      content:
        application/problem+json:
          schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
    UnprocessableEntity:
      description: "Well-formed but rejected by a domain rule -- most often an accountCode that falls outside its parent's block"
      content:
        application/problem+json:
          schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/problem+json:
          schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
    Forbidden:
      description: "Authenticated but not permitted - wrong realm, or missing FINANCE_OFFICER/ADMIN role"
      content:
        application/problem+json:
          schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
    NotFound:
      description: "No such journal entry in this tenant. Also returned for a journal entry belonging to another tenant, so that cross-tenant existence is not leaked."
      content:
        application/problem+json:
          schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  schemas:
    PostingDirection:
      type: string
      enum: [DR, CR]
      description: "Carries the SIGN of a posting. gl_posting.amount is always a positive magnitude; a reversal is a new journal entry with the two directions swapped, never a negative amount on the original."
    AccountType:
      type: string
      enum: [ASSET, LIABILITY, EQUITY, INCOME, EXPENSE]
    GlPostingView:
      type: object
      required: [postingId, journalEntryId, accountCode, direction, amount, period, sourceEvent, sourceRef]
      properties:
        postingId: { type: string, format: uuid }
        journalEntryId: { type: string, format: uuid }
        accountCode: { type: string }
        direction: { $ref: '#/components/schemas/PostingDirection' }
        amount: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        period:
          type: string
          description: "Accounting period, formatted YYYY-MM"
        policyNumber:
          # See openapi-distribution.yaml flatAmount for why nullable: true stays on
          # nullable $ref fields specifically.
          allOf:
            - $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef'
          nullable: true
          description: "Null for a posting not tied to a specific policy."
        sourceEvent:
          type: string
          description: "The domain event this posting was derived from, e.g. billing.PremiumInvoiceGenerated"
        sourceRef:
          type: string
          description: "The source event's own idempotency key -- pairs with sourceEvent and this entry's tenant to make a redelivery a no-op."
    JournalEntrySearchResponse:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/JournalEntryView' }
        page: { $ref: 'openapi-common.yaml#/components/schemas/PageMeta' }
    JournalEntryView:
      type: object
      required: [journalEntryId, sourceEvent, sourceRef, period, postedAt, postings]
      properties:
        journalEntryId: { type: string, format: uuid }
        sourceEvent:
          type: string
          description: "The domain event this entry was derived from, e.g. billing.PremiumInvoiceGenerated"
        sourceRef: { type: string }
        period:
          type: string
          description: "Accounting period, formatted YYYY-MM"
        policyNumber:
          # See openapi-distribution.yaml flatAmount for why nullable: true stays on
          # nullable $ref fields specifically.
          allOf:
            - $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef'
          nullable: true
          description: "Null for an entry not tied to a specific policy."
        postedAt: { type: string, format: date-time }
        postings:
          type: array
          description: "Always exactly two legs in M9, one DR and one CR, with equal totals."
          items: { $ref: '#/components/schemas/GlPostingView' }
    AccountStatus:
      type: string
      description: >
        INACTIVE is the RETIREMENT path and is distinct in kind from deletion: an account that has
        ever been posted against must stay resolvable, so it is deactivated rather than deleted.
      enum: [ACTIVE, INACTIVE]
    TrialBalanceView:
      type: object
      required: [accounts, totalDebit, totalCredit, balanced]
      properties:
        period:
          type: string
          nullable: true
          description: "Echoed back. Null means inception-to-date."
        accounts:
          type: array
          items: { $ref: '#/components/schemas/AccountBalanceView' }
        totalDebit:
          allOf: [{ $ref: 'openapi-common.yaml#/components/schemas/Money' }]
          description: >-
            Sum of every account's OWN debits, never the rolled figures -- adding those would
            count each posting once per ancestor and report a sound ledger as out.
        totalCredit: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        balanced:
          type: boolean
          description: >-
            Whether totalDebit equals totalCredit. Stated by the server rather than left to a
            caller comparing two decimal strings.
    AccountBalanceView:
      type: object
      required: [accountCode, name, accountType, normalBalance, level, postingAllowed, status,
                 ownDebit, ownCredit, debit, credit, balance]
      description: >
        One account's structure and its figures. `ownDebit`/`ownCredit` are postings against this
        account code alone; `debit`/`credit` roll up every descendant and are equal to the `own`
        pair for a leaf. Both are present so a summary account reporting millions it never
        received directly cannot be mistaken for one that did.
      properties:
        accountCode: { type: string }
        name: { type: string }
        accountType: { $ref: '#/components/schemas/AccountType' }
        normalBalance: { $ref: '#/components/schemas/PostingDirection' }
        parentCode: { type: string, nullable: true }
        level: { type: integer }
        postingAllowed: { type: boolean }
        status: { $ref: '#/components/schemas/AccountStatus' }
        ownDebit: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        ownCredit: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        debit: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        credit: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        balance:
          allOf: [{ $ref: 'openapi-common.yaml#/components/schemas/Money' }]
          description: >-
            Rolled debit and credit netted in THIS account's normal direction, so a positive value
            always means "normal" and a negative one is a real anomaly rather than an artefact of
            which way the subtraction ran. Unlike a posting's amount, this one is signed.
    ChartOfAccountView:
      type: object
      required: [accountCode, name, accountType, normalBalance, level, postingAllowed, status, currency]
      properties:
        accountCode: { type: string }
        name: { type: string }
        accountType: { $ref: '#/components/schemas/AccountType' }
        normalBalance: { $ref: '#/components/schemas/PostingDirection' }
        parentCode:
          type: string
          nullable: true
          description: "Null only for the five block roots (1000/2000/3000/4000/5000)."
        level:
          type: integer
          description: "Depth in the parent chain; a block root is 1. Derived server-side, never accepted from a client."
        postingAllowed:
          type: boolean
          description: "False for any account with children -- a header never receives a posting, and the ledger refuses a leg that names one."
        status: { $ref: '#/components/schemas/AccountStatus' }
        currency: { type: string, minLength: 3, maxLength: 3 }
        controlOf:
          type: string
          nullable: true
          description: >
            The subledger module owning this account's detail (BILLING, CLAIMS, DISTRIBUTION,
            POLICYLOAN, REINSURANCE). A documented label: nothing enforces it, because the ledger
            is event-only and no manual journal entry surface exists. Its intended consumer is a
            subledger reconciliation report that is not yet built.
        description: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string, nullable: true }
    CreateAccountRequest:
      type: object
      required: [accountCode, name]
      properties:
        accountCode:
          type: string
          pattern: '^[1-5]\d{3}$'
          description: "4 digits, leading block 1=ASSET, 2=LIABILITY, 3=EQUITY, 4=INCOME, 5=EXPENSE -- accountType/normalBalance are derived from it server-side, never accepted here."
        parentCode:
          type: string
          pattern: '^[1-5]\d{3}$'
          nullable: true
          description: >
            Must already exist in this tenant, and accountCode must begin with its significant
            prefix -- the parent's code with trailing zeros stripped, so 1210 may hang off 1200 but
            2110 may not. Omit to create a block root.
        name: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000, nullable: true }
        # No `default:` on either of these, deliberately. openapi-typescript treats a
        # property carrying a default as REQUIRED in the generated request type, which
        # would force every client to send a value it is entitled to omit. The
        # defaulting is the server's job and lives in CreateAccountRequestDto's compact
        # constructor: currency falls back to the tenant functional currency (TZS) and
        # postingAllowed to true.
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: "Omit to use the tenant functional currency (TZS)."
        postingAllowed:
          type: boolean
          description: "Omit to default to true. Forced to false anyway once the account gains a child."
    UpdateAccountRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000, nullable: true }
