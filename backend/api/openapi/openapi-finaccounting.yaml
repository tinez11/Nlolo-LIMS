openapi: 3.1.0
info:
  title: Finaccounting API
  version: "1.0.0"
  description: >
    External REST surface of the `finaccounting` module: the double-entry general ledger --
    journal entries with their two legs (GL postings), and the chart of accounts. IFRS 17
    measurement (CSM roll-forward, LRC, LIC) is NOT YET IMPLEMENTED -- it is blocked on C1
    (Actuarial) -- so a consumer of this spec should not expect a CSM, LRC, or LIC endpoint to
    exist anywhere below.


    Journal entries and GL postings stay READ ONLY, permanently: every entry is derived from a
    domain event by finaccounting's own listeners, nothing is hand-entered, and a correction is a
    future reversal entry (deferred, see the design spec's section 9), never an edit to an
    existing one. That absence is what makes the ledger trustworthy, and nothing in this file
    changes it.


    The chart of accounts is NOT read-only: it has a real create/rename/delete surface below,
    added on explicit request after the module first shipped read-only. `accountType` and
    `normalBalance` stay derived from the account code's own leading digit and are never
    independently settable on either create or rename. Deleting an account is rejected once any
    real posting references it (a real foreign key at the database layer) -- retiring an in-use
    account is a distinct, deferred concern, not built here.


    Every endpoint requires the staff realm AND the fine-grained FINANCE_OFFICER or ADMIN role,
    the same decision M7 recorded for `distribution` and M8/M9 recorded for `reinsurance`: there
    is no finaccounting-specific staff role, and finaccounting is itself a finance/back-office
    concern.


    Every money field is a pattern-constrained decimal string, never a JSON number -- this
    platform forbids floats anywhere in the wire format.
servers:
  - url: https://api.nlolo-lifeplatform.tz/v1
paths:
  /gl-postings:
    get:
      summary: List journal entries (GL postings), optionally filtered by period, policy number and/or account
      description: >
        Each item is one journal entry with BOTH of its legs -- an entry always has exactly two
        legs in M9, and their DR and CR totals are always equal. Omitting every filter returns
        every journal entry visible to the caller's tenant, ONE PAGE AT A TIME: journal_entry is
        an append-only ledger fed by every money-moving event on the platform, so an unpaged
        read of it has no upper bound. Newest entries first, by postedAt.


        `accountCode` is what lets a balance be opened up. Every posting already carried an
        account code, so "what made up account 1210" was in the data and unanswerable here --
        which is why the chart of accounts and this list sat side by side with no way to reach
        each other. An entry is returned ONCE however many of its legs hit the account.
      security:
        - staffAuth: []
      parameters:
        - $ref: '#/components/parameters/Period'
        - $ref: '#/components/parameters/PolicyNumberFilter'
        - name: accountCode
          in: query
          required: false
          description: >-
            Restricts to entries with at least one leg against this account. Matches the chart's
            own nine-class convention (the IFRS 17 posting guide).
          schema: { type: string, pattern: '^[1-9]\d{3}$' }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: pageSize
          in: query
          required: false
          description: "Capped server-side at 100 regardless of the value sent."
          schema: { type: integer, minimum: 1, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalEntrySearchResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /gl-postings/{journalEntryId}:
    get:
      summary: Get one journal entry, with both legs
      security:
        - staffAuth: []
      parameters:
        - $ref: '#/components/parameters/JournalEntryId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalEntryView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /chart-of-accounts:
    get:
      summary: List the chart of accounts
      description: >
        Every account on this platform started as a PLACEHOLDER pending Finance sign-off, seeded
        rather than authored through this API -- this endpoint now also returns any account
        created through POST below.
      security:
        - staffAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChartOfAccountView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a chart-of-account row
      description: >
        `accountType` and `normalBalance` are NOT accepted here -- both are derived server-side
        from `accountCode`'s own leading digit (1=ASSET, 2=LIABILITY, 3=EQUITY, 4=INCOME,
        5=EXPENSE), so an account can never disagree with its own code's block convention.
      security:
        - staffAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccountRequest' }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChartOfAccountView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "An account with this accountCode already exists in this tenant, or the named parent already carries postings"
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /finance/unit-linked-reconciliation:
    get:
      summary: Every fund's units in issue at its latest price, against the 2150 ledger balance
      description: >-
        Product step 6. Finance or an admin. The difference should always be zero: every approved price
        trues 2150 up to units x price, so a non-zero difference is a defect to investigate, not timing.
      security:
        - staffAuth: [finance_officer, admin]
      responses:
        '200':
          description: The reconciliation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnitLinkedReconciliation' }
        '403': { $ref: 'openapi-common.yaml#/components/responses/Forbidden' }
  /chart-of-accounts/balances:
    get:
      summary: The chart with its balances, and whether the ledger balances
      description: >
        The aggregation this module never had. Nothing anywhere summed a posting, so a ledger
        holding thousands of balanced entries could not state the balance of a single account --
        and the chart of accounts, hierarchy and all, was a structural reference list rather than
        a ledger view.


        A separate path from GET /chart-of-accounts rather than a flag on it: that one is bounded
        reference data read to render a tree or fill a picker, while this aggregates the whole
        posting table behind it.


        BALANCES ROLL UP. A parent reports itself plus every descendant, which is the standard
        convention and the one this chart is shaped for -- `postingAllowed` marks the accounts
        that take direct postings, making every other account a summary of those beneath it. Each
        row carries its OWN figures beside the rolled ones so the two cannot be confused.


        THE TOTALS DO NOT ROLL UP. They sum each account's own postings, because adding rolled
        figures would count every posting once for its own account and again for every ancestor,
        reporting a sound ledger as wildly out. `balanced` is stated by the server rather than
        left to a caller comparing two decimal strings.
      security:
        - staffAuth: []
      parameters:
        - name: period
          in: query
          required: false
          description: >-
            YYYY-MM. Omitted means inception-to-date. Echoed back on the response, because a
            balance with no period beside it cannot be reconciled against anything.
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrialBalanceView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /chart-of-accounts/{accountCode}:
    put:
      summary: Update a chart-of-account row
      description: >
        Name and description. `accountCode` is this resource's own identifier, `accountType`/
        `normalBalance` stay derived from it, and `parentCode`/`level` are equally fixed -- moving
        an account is a distinct, deferred concern that carries real risk to historical reporting.
      security:
        - staffAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountCode'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAccountRequest' }
      responses:
        '200':
          description: Account updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChartOfAccountView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Delete a chart-of-account row
      description: >
        Rejected once any real GL posting references this account, and rejected once it has
        children. Retiring an account that has history is what `deactivate` below is for: deleting
        it would orphan the postings booked to it.
      security:
        - staffAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountCode'
      responses:
        '204':
          description: Account deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "At least one GL posting already references this account, or it has children -- it cannot be deleted"
          content:
            application/problem+json:
              schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  /chart-of-accounts/{accountCode}/activate:
    post:
      summary: Return a retired account to service
      description: "Sets status to ACTIVE, so the account may receive new postings again."
      security:
        - staffAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountCode'
      responses:
        '200':
          description: The account, now ACTIVE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChartOfAccountView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /chart-of-accounts/{accountCode}/deactivate:
    post:
      summary: Retire an account from new postings, keeping its history readable
      description: >
        Sets status to INACTIVE. The ledger then refuses any new leg naming this account, while
        every posting already booked to it stays resolvable. This -- not DELETE -- is how an
        account that has been used is taken out of service.
      security:
        - staffAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountCode'
      responses:
        '200':
          description: The account, now INACTIVE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChartOfAccountView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /finance/periods:
    get:
      summary: The accounting periods that have left OPEN at least once, newest first
      description: >-
        IFRS 17 spec 5.4. A period with no row here is OPEN. Finance or an admin.
      security:
        - staffAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AccountingPeriodView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /finance/periods/{period}:
    get:
      summary: One accounting period's status
      security:
        - staffAuth: []
      parameters:
        - $ref: '#/components/parameters/PeriodPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountingPeriodView' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /finance/periods/{period}/closing:
    post:
      summary: Start closing an OPEN period -- it then takes only SYSTEM and ENGINE_RUN journals
      security:
        - staffAuth: []
      parameters:
        - $ref: '#/components/parameters/PeriodPath'
      responses:
        '200':
          description: The period, now CLOSING
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountingPeriodView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/StateConflict' }
  /finance/periods/{period}/lock:
    post:
      summary: Lock a CLOSING period
      description: >-
        Refused while any earlier period holding postings is not locked, or while a clearing account (9xxx) does
        not net to zero in this one.
      security:
        - staffAuth: []
      parameters:
        - $ref: '#/components/parameters/PeriodPath'
      responses:
        '200':
          description: The period, now LOCKED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountingPeriodView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/StateConflict' }
  /finance/periods/{period}/reopen-request:
    post:
      summary: Ask for a LOCKED period to be reopened, with a reason
      security:
        - staffAuth: []
      parameters:
        - $ref: '#/components/parameters/PeriodPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReopenRequest' }
      responses:
        '200':
          description: The period, still LOCKED, with the request on it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountingPeriodView' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/StateConflict' }
  /finance/periods/{period}/reopen-approval:
    post:
      summary: A second person approves the reopening; the period is OPEN again
      security:
        - staffAuth: []
      parameters:
        - $ref: '#/components/parameters/PeriodPath'
      responses:
        '200':
          description: The period, now OPEN
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountingPeriodView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/StateConflict' }
  /finance/policy-classifications/{policyNumber}:
    get:
      summary: A policy's IFRS 17 classification, oldest first
      description: >-
        IFRS 17 I2. Empty for a policy issued before I2 that the development backfill has not reached, or one whose
        PolicyIssued has not been processed yet.
      security:
        - staffAuth: []
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PolicyClassificationView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /finance/accounting-policies:
    get:
      summary: The accounting policy elections in force on a date, those scheduled after it, and every one proposed
      description: >-
        IFRS 17 spec 3. One election in force per key and scope -- the latest approved one effective on or before
        asOf -- then the APPROVED ones effective after asOf, then the PROPOSED ones. The baseline is seeded for
        every tenant.
      security:
        - staffAuth: []
      parameters:
        - name: asOf
          in: query
          required: false
          description: "Omitted means today (Africa/Dar_es_Salaam)."
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PolicyElectionView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Propose an election, effective today or later
      security:
        - staffAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyElectionInput' }
      responses:
        '201':
          description: The election, PROPOSED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyElectionView' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /finance/accounting-policies/{electionId}/approval:
    post:
      summary: A second person approves the election with its sign-off; it becomes the register's next version
      security:
        - staffAuth: []
      parameters:
        - $ref: '#/components/parameters/ElectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyElectionApproval' }
      responses:
        '200':
          description: The election, APPROVED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyElectionView' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }
  /finance/accounting-policies/{electionId}/rejection:
    post:
      summary: A second person rejects the election, with a reason
      security:
        - staffAuth: []
      parameters:
        - $ref: '#/components/parameters/ElectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyElectionRejection' }
      responses:
        '200':
          description: The election, REJECTED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyElectionView' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }
components:
  parameters:
    JournalEntryId:
      name: journalEntryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Period:
      name: period
      in: query
      required: false
      description: "Filter to one accounting period, formatted YYYY-MM"
      schema: { type: string, pattern: '^\d{4}-\d{2}$' }
    PolicyNumberFilter:
      name: policyNumber
      in: query
      required: false
      schema: { $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef' }
    PeriodPath:
      name: period
      in: path
      required: true
      description: "YYYY-MM"
      schema: { type: string, pattern: '^\d{4}-\d{2}$' }
    ElectionId:
      name: electionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AccountCode:
      name: accountCode
      in: path
      required: true
      schema: { type: string, pattern: '^[1-9]\d{3}$' }
  responses:
    BadRequest:
      description: "Malformed request body -- a missing/blank name, or an accountCode that is not 4 digits with a leading 1-5 block"
      content:
        application/problem+json:
          schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
    UnprocessableEntity:
      description: "Well-formed but rejected by a domain rule -- most often an accountCode that falls outside its parent's block"
      content:
        application/problem+json:
          schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
    StateConflict:
      description: "Refused in the current state -- a period or election not in the state the step needs, a lock precondition unmet, or the person who asked trying to approve their own request"
      content:
        application/problem+json:
          schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/problem+json:
          schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
    Forbidden:
      description: "Authenticated but not permitted - wrong realm, or missing FINANCE_OFFICER/ADMIN role"
      content:
        application/problem+json:
          schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
    NotFound:
      description: "No such journal entry in this tenant. Also returned for a journal entry belonging to another tenant, so that cross-tenant existence is not leaked."
      content:
        application/problem+json:
          schema: { $ref: 'openapi-common.yaml#/components/schemas/ProblemDetails' }
  schemas:
    UnitLinkedReconciliation:
      type: object
      additionalProperties: false
      required: [funds, totalValue, ledgerBalance2150, difference]
      properties:
        funds:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [fundCode, unitsInIssue, value, currency]
            properties:
              fundCode: { type: string }
              unitsInIssue: { type: string, description: Decimal string }
              price: { type: [string, "null"], description: "Decimal string; null before the fund's first approved price" }
              priceDate: { type: [string, "null"], format: date }
              value: { type: string, description: Decimal string }
              currency: { type: string }
        totalValue: { type: string, description: Decimal string }
        ledgerBalance2150: { type: string, description: Decimal string }
        difference: { type: string, description: "Decimal string; ledger less units value, zero when reconciled" }
    PostingDirection:
      type: string
      enum: [DR, CR]
      description: "Carries the SIGN of a posting. gl_posting.amount is always a positive magnitude; a reversal is a new journal entry with the two directions swapped, never a negative amount on the original."
    AccountType:
      type: string
      description: "CLEARING is class 9: temporary accounts that must return to zero before a period locks."
      enum: [ASSET, LIABILITY, EQUITY, INCOME, EXPENSE, CLEARING]
    PostingMode:
      type: string
      description: >-
        The IFRS 17 posting guide's posting mode. AUTO takes EVENT, SYSTEM and ENGINE_RUN journals; MAN takes
        SYSTEM, ENGINE_RUN and MANUAL; BOTH takes all four, a MANUAL one with a reason code. The ledger refuses
        anything else.
      enum: [AUTO, MAN, BOTH]
    JournalSource:
      type: string
      description: "What wrote the journal: a domain event, the platform itself, an IFRS 17 engine run, or a person."
      enum: [EVENT, SYSTEM, ENGINE_RUN, MANUAL]
    LineDimensions:
      type: object
      description: >-
        The dimensions every journal line carries (posting guide 2.2). Each may be null: classification at sale
        and the posting rules fill them in later sub-projects.
      properties:
        ifrs17Group: { type: string, nullable: true }
        measurementModel: { type: string, nullable: true }
        movementType: { type: string, nullable: true, description: "PRM_REN, IC_SUR, UL_SWITCH ... (guide 2.4)" }
        productId: { type: string, format: uuid, nullable: true }
        portfolio: { type: string, nullable: true }
        channel: { type: string, nullable: true }
        branch: { type: string, nullable: true }
        fund: { type: string, nullable: true }
        referenceType: { type: string, nullable: true }
        reference: { type: string, nullable: true }
    PeriodStatus:
      type: string
      description: "OPEN takes journals; CLOSING takes only SYSTEM and ENGINE_RUN ones; LOCKED takes nothing."
      enum: [OPEN, CLOSING, LOCKED]
    AccountingPeriodView:
      type: object
      required: [period, status]
      description: "A period never touched reads OPEN with every other field null."
      properties:
        period: { type: string, pattern: '^\d{4}-\d{2}$' }
        status: { $ref: '#/components/schemas/PeriodStatus' }
        closingStartedBy: { type: string, nullable: true }
        closingStartedAt: { type: string, format: date-time, nullable: true }
        lockedBy: { type: string, nullable: true }
        lockedAt: { type: string, format: date-time, nullable: true }
        reopenRequestedBy: { type: string, nullable: true }
        reopenRequestedAt: { type: string, format: date-time, nullable: true }
        reopenReason: { type: string, nullable: true }
        reopenedBy: { type: string, nullable: true }
        reopenedAt: { type: string, format: date-time, nullable: true }
    ReopenRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }
    PolicyElectionStatus:
      type: string
      enum: [PROPOSED, APPROVED, REJECTED]
    PolicyElectionInput:
      type: object
      required: [key, value, effectiveFrom]
      properties:
        key:
          type: string
          enum: [MEASUREMENT_MODEL, INVESTMENT_COMPONENT_RULE, MODEL_OVERRIDE_ALLOWED, POLICY_LOANS,
                 ACQUISITION_CASH_FLOWS, OCI_OPTION, RIDERS, PREMIUM_BILLING, CONTRACT_RECOGNITION, COHORT]
        scope:
          type: string
          nullable: true
          description: "A portfolio code (TERM, ULIP ...), a measurement model for ACQUISITION_CASH_FLOWS, or * (company-wide). Omitted means *."
        value: { type: string, description: "One of the key's permitted values; refused otherwise." }
        effectiveFrom:
          type: string
          format: date
          description: "Today or later. A past change is a restatement, made through journals."
        rationale: { type: string, nullable: true }
    PolicyElectionView:
      type: object
      required: [electionId, key, scope, value, effectiveFrom, status, proposedBy, proposedAt]
      properties:
        electionId: { type: string, format: uuid }
        key: { type: string }
        scope: { type: string }
        value: { type: string }
        effectiveFrom: { type: string, format: date }
        status: { $ref: '#/components/schemas/PolicyElectionStatus' }
        rationale: { type: string, nullable: true }
        signOffRef: { type: string, nullable: true, description: "The memo or minute an approval rests on." }
        decisionReason: { type: string, nullable: true, description: "Why it was rejected." }
        proposedBy: { type: string }
        proposedAt: { type: string, format: date-time }
        decidedBy: { type: string, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        registerVersion:
          type: integer
          nullable: true
          description: "The register version its approval made current; null until approved. Every journal records the version in force."
    PolicyElectionApproval:
      type: object
      required: [signOffRef]
      properties:
        signOffRef: { type: string, minLength: 1 }
    PolicyElectionRejection:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }
    PolicyClassificationView:
      type: object
      description: >-
        How a contract is classified for IFRS 17 (spec §6, §7.2): the facts it was sold with, and what finaccounting
        decided from them -- the measurement model under the accounting policy register in force on the date, why,
        and the group of contracts. Never changed; a vesting pension has a second row (reason VESTING).
      required: [policyNumber, reason, effectiveFrom, groupKey, measurementModel, modelBasis, registerVersion,
                 portfolioCode, cohortYear, profitabilityBucket, classifiedAt]
      properties:
        policyNumber: { type: string }
        reason: { type: string, enum: [ISSUE, VESTING] }
        effectiveFrom: { type: string, format: date }
        groupKey: { type: string, description: "PORTFOLIO-MODEL-YEAR-BUCKET, e.g. END-GMM-2026-REM" }
        measurementModel: { type: string, enum: [GMM, VFA, PAA, IFRS9] }
        modelBasis:
          type: string
          enum: [REGISTER, OVERRIDE, OVERRIDE_REFUSED]
          description: >-
            REGISTER: the register's model for the portfolio. OVERRIDE: the version's override, which the register
            allows. OVERRIDE_REFUSED: the version asked for a model the register does not allow, so the register's
            applies -- a configuration to correct on the product.
        requestedOverride: { type: [string, "null"], enum: [GMM, VFA, PAA, IFRS9, null] }
        registerVersion: { type: integer }
        portfolioCode: { type: string }
        cohortYear: { type: integer }
        profitabilityBucket: { type: string, enum: [ONEROUS, NO_SIGNIFICANT_RISK, REMAINING] }
        salesChannel: { type: [string, "null"] }
        branchCode: { type: [string, "null"] }
        classifiedAt: { type: string, format: date-time }
    GlPostingView:
      type: object
      required: [postingId, journalEntryId, accountCode, direction, amount, period, sourceEvent, sourceRef]
      properties:
        postingId: { type: string, format: uuid }
        journalEntryId: { type: string, format: uuid }
        accountCode: { type: string }
        direction: { $ref: '#/components/schemas/PostingDirection' }
        amount: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        period:
          type: string
          description: "Accounting period, formatted YYYY-MM"
        policyNumber:
          # See openapi-distribution.yaml flatAmount for why nullable: true stays on
          # nullable $ref fields specifically.
          allOf:
            - $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef'
          nullable: true
          description: "Null for a posting not tied to a specific policy."
        sourceEvent:
          type: string
          description: "The domain event this posting was derived from, e.g. billing.PremiumInvoiceGenerated"
        sourceRef:
          type: string
          description: "The source event's own idempotency key -- pairs with sourceEvent and this entry's tenant to make a redelivery a no-op."
        dimensions: { $ref: '#/components/schemas/LineDimensions' }
    JournalEntrySearchResponse:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/JournalEntryView' }
        page: { $ref: 'openapi-common.yaml#/components/schemas/PageMeta' }
    JournalEntryView:
      type: object
      required: [journalEntryId, sourceEvent, sourceRef, period, postedAt, postings, sourceType,
                 policyRegisterVersion]
      properties:
        journalEntryId: { type: string, format: uuid }
        sourceEvent:
          type: string
          description: "The domain event this entry was derived from, e.g. billing.PremiumInvoiceGenerated"
        sourceRef: { type: string }
        period:
          type: string
          description: "Accounting period, formatted YYYY-MM"
        policyNumber:
          # See openapi-distribution.yaml flatAmount for why nullable: true stays on
          # nullable $ref fields specifically.
          allOf:
            - $ref: 'openapi-common.yaml#/components/schemas/PolicyNumberRef'
          nullable: true
          description: "Null for an entry not tied to a specific policy."
        postedAt: { type: string, format: date-time }
        postings:
          type: array
          description: "Two or more legs whose DR and CR totals are equal; the database refuses an unbalanced journal at commit."
          items: { $ref: '#/components/schemas/GlPostingView' }
        sourceType: { $ref: '#/components/schemas/JournalSource' }
        policyRegisterVersion:
          type: integer
          description: "The accounting policy register version in force when the journal was posted."
    AccountStatus:
      type: string
      description: >
        INACTIVE is the RETIREMENT path and is distinct in kind from deletion: an account that has
        ever been posted against must stay resolvable, so it is deactivated rather than deleted.
      enum: [ACTIVE, INACTIVE]
    TrialBalanceView:
      type: object
      required: [accounts, totalDebit, totalCredit, balanced]
      properties:
        period:
          type: string
          nullable: true
          description: "Echoed back. Null means inception-to-date."
        accounts:
          type: array
          items: { $ref: '#/components/schemas/AccountBalanceView' }
        totalDebit:
          allOf: [{ $ref: 'openapi-common.yaml#/components/schemas/Money' }]
          description: >-
            Sum of every account's OWN debits, never the rolled figures -- adding those would
            count each posting once per ancestor and report a sound ledger as out.
        totalCredit: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        balanced:
          type: boolean
          description: >-
            Whether totalDebit equals totalCredit. Stated by the server rather than left to a
            caller comparing two decimal strings.
    AccountBalanceView:
      type: object
      required: [accountCode, name, accountType, normalBalance, level, postingAllowed, status,
                 ownDebit, ownCredit, debit, credit, balance]
      description: >
        One account's structure and its figures. `ownDebit`/`ownCredit` are postings against this
        account code alone; `debit`/`credit` roll up every descendant and are equal to the `own`
        pair for a leaf. Both are present so a summary account reporting millions it never
        received directly cannot be mistaken for one that did.
      properties:
        accountCode: { type: string }
        name: { type: string }
        accountType: { $ref: '#/components/schemas/AccountType' }
        normalBalance: { $ref: '#/components/schemas/PostingDirection' }
        parentCode: { type: string, nullable: true }
        level: { type: integer }
        postingAllowed: { type: boolean }
        status: { $ref: '#/components/schemas/AccountStatus' }
        ownDebit: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        ownCredit: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        debit: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        credit: { $ref: 'openapi-common.yaml#/components/schemas/Money' }
        balance:
          allOf: [{ $ref: 'openapi-common.yaml#/components/schemas/Money' }]
          description: >-
            Rolled debit and credit netted in THIS account's normal direction, so a positive value
            always means "normal" and a negative one is a real anomaly rather than an artefact of
            which way the subtraction ran. Unlike a posting's amount, this one is signed.
    ChartOfAccountView:
      type: object
      required: [accountCode, name, accountType, normalBalance, level, postingAllowed, status, currency, mode]
      properties:
        accountCode: { type: string }
        name: { type: string }
        accountType: { $ref: '#/components/schemas/AccountType' }
        normalBalance: { $ref: '#/components/schemas/PostingDirection' }
        parentCode:
          type: string
          nullable: true
          description: "Null only for the five block roots (1000/2000/3000/4000/5000)."
        level:
          type: integer
          description: "Depth in the parent chain; a block root is 1. Derived server-side, never accepted from a client."
        postingAllowed:
          type: boolean
          description: "False for any account with children -- a header never receives a posting, and the ledger refuses a leg that names one."
        status: { $ref: '#/components/schemas/AccountStatus' }
        currency: { type: string, minLength: 3, maxLength: 3 }
        controlOf:
          type: string
          nullable: true
          description: >
            The subledger module owning this account's detail (BILLING, CLAIMS, DISTRIBUTION,
            POLICYLOAN, REINSURANCE). A documented label: nothing enforces it, because the ledger
            is event-only and no manual journal entry surface exists. Its intended consumer is a
            subledger reconciliation report that is not yet built.
        description: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string, nullable: true }
        mode: { $ref: '#/components/schemas/PostingMode' }
    CreateAccountRequest:
      type: object
      required: [accountCode, name]
      properties:
        accountCode:
          type: string
          pattern: '^[1-9]\d{3}$'
          description: "4 digits in one of the posting guide's nine classes. accountType/normalBalance are derived server-side -- a child takes its parent's, a class root its class's -- and never accepted here."
        parentCode:
          type: string
          pattern: '^[1-9]\d{3}$'
          nullable: true
          description: >
            Must already exist in this tenant, and accountCode must begin with its significant
            prefix -- the parent's code with trailing zeros stripped, so 1210 may hang off 1200 but
            2110 may not. Omit to create a block root.
        name: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000, nullable: true }
        # No `default:` on either of these, deliberately. openapi-typescript treats a
        # property carrying a default as REQUIRED in the generated request type, which
        # would force every client to send a value it is entitled to omit. The
        # defaulting is the server's job and lives in CreateAccountRequestDto's compact
        # constructor: currency falls back to the tenant functional currency (TZS) and
        # postingAllowed to true.
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: "Omit to use the tenant functional currency (TZS)."
        postingAllowed:
          type: boolean
          description: "Omit to default to true. Forced to false anyway once the account gains a child."
    UpdateAccountRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000, nullable: true }
