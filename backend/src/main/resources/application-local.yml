spring:
  config:
    activate:
      on-profile: local
  datasource:
    # 15432, not the standard 5432 -- see infra/docker-compose.yml's postgres port comment.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/lifeplatform}
    username: ${SPRING_DATASOURCE_USERNAME:app_role}
    password: ${SPRING_DATASOURCE_PASSWORD:devapppassword}

server:
  port: 8080

# The payout drains run hourly in production, which is right for them: an instalment is dated to a
# DAY, so nothing is lost by noticing it an hour late. On the dev stack that means an e2e test
# issuing a policy whose benefit is already due would wait up to an hour to see it fall due, so
# both are tightened here rather than in code -- the defaults stay hourly for every other profile.
benefitpayout:
  due-drain-interval-ms: 5000
  run-drain-interval-ms: 10000
