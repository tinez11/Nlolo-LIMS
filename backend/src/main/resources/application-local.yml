spring:
  config:
    activate:
      on-profile: local
  datasource:
    # 15432, not the standard 5432 -- see infra/docker-compose.yml's postgres port comment.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/lifeplatform}
    username: ${SPRING_DATASOURCE_USERNAME:app_role}
    password: ${SPRING_DATASOURCE_PASSWORD:devapppassword}

server:
  port: 8080

# The payout drains run hourly in production, which is right for them: an instalment is dated to a
# DAY, so nothing is lost by noticing it an hour late. On the dev stack that means an e2e test
# issuing a policy whose benefit is already due would wait up to an hour to see it fall due, so
# both are tightened here rather than in code -- the defaults stay hourly for every other profile.
benefitpayout:
  due-drain-interval-ms: 5000
  run-drain-interval-ms: 10000
  # Product step 5: daily elsewhere; an annuity stream only needs topping up a year ahead.
  annuity-rollforward-interval-ms: 60000
# Product step 3: month-end interest and fees are posted hourly elsewhere -- a completed month is
# not urgent -- but an e2e test funding an account commenced months ago must see them in seconds.
accumulation:
  month-end-interval-ms: 10000
  # Daily elsewhere; the annual statement files once per account per year either way.
  statement-interval-ms: 30000
  # A fixed-term deposit's maturity run: hourly elsewhere, seconds here for the e2e suite.
  deposit-maturity-interval-ms: 10000
# Product step 4: an approved bonus declaration attaches hourly elsewhere, seconds here for e2e.
bonus:
  declaration-interval-ms: 10000
