# IFRS 17 posting rules. The source of truth for every journal an event posts; the console shows it read-only until a
# database editor with maker-checker exists. Bump `version` on ANY change: every journal records the version it was
# posted under.
#
# A rule: the event it posts, the measurement models it applies to (GMM, VFA, PAA, IFRS9 from the contract's
# classification; NONE for an event with no policy; ANY for any classified contract -- never an unclassified one),
# an optional `when` on the event's attributes (the rule with the most `when` attributes wins), optional dates
# (effectiveFrom inclusive, effectiveTo exclusive), and its lines. A line names a side and account, the fact that
# gives its amount, and the guide's movement type (2.4). A line whose amount is zero is left out; a journal with no
# lines left is not posted. `post: false` is a rule that deliberately posts nothing (an IFRS 9 contract's invoice,
# whose money its own account ledger posts) -- without one the event would queue as unmapped. The account BANK is the
# rail's: 1130 for a bank transfer (EFT), 1140 for mobile money (I3b, user answer Q3). The application refuses to start
# on a rule that names an unknown account, a MAN account, an unknown fact or movement, or that another rule could be
# chosen over.
#
# Ids are the guide's entries (A-06, B-02, I-01 ...); PLAT-* are the platform's own journals for what the guide has no
# entry for. Splits are computed by the emitting module, never here (user decision 4). Rates (premium levy, commission
# withholding) are the accounting policy register's; none in force, none posted (decisions 6 and 7).
#
# v2 (IFRS 17 I3b): money out in two steps as the guide does it -- the payable when it is decided (claim approved,
# surrender approved, payout due), the bank when it is paid; commission earned and withheld; loan interest; IFRS 9
# accounts (G); premium levy. Unit-linked VFA exits (F-08/F-09) are as v1 posted them.
#
# v3 (IFRS 17 I3c): reinsurance held from the monthly bordereau (K-01, K-02) instead of a cession posting the ceded
# SUM ASSURED as premium; the reinsurer's share of a claim (B-05) when the claim is approved, to 6120 -- not to the
# claims expense, and with no staff confirmation.

version: 3
rules:

  # ---- Premium: billed, collected, credited, restated, waived ------------------------------------------------------

  - id: A-06
    event: billing.PremiumInvoiceGenerated
    models: [GMM, VFA]
    description: Premium falls due (billing)
    lines:
      - {dr: "2122", amount: amount, movement: PRM_REN}
      - {cr: "2121", amount: amount, movement: PRM_REN}

  - id: I-01
    event: billing.PremiumInvoiceGenerated
    models: [PAA]
    description: PAA premium billed -- earned monthly by the PAA earning job (I-03)
    lines:
      - {dr: "2142", amount: amount, movement: PRM_REN}
      - {cr: "2141", amount: amount, movement: PRM_REN}

  - id: G-BILLED
    event: billing.PremiumInvoiceGenerated
    models: [IFRS9]
    description: An IFRS 9 contract's invoice -- nothing; its money posts from its account ledger when it arrives (G-05)
    post: false

  - id: I-03
    event: finaccounting.PaaRevenueEarned
    models: [PAA]
    description: Month-end PAA revenue earned, straight-line over the cover each premium pays for (a SYSTEM journal)
    lines:
      - {dr: "2141", amount: amount}
      - {cr: "4160", amount: amount}

  - id: PLAT-A07
    event: billing.PremiumCollected
    models: [GMM, VFA]
    description: Premium collected, straight to the mobile money wallet; the premium levy at the rate in force (A-19)
    lines:
      - {dr: "1140", amount: amount}
      - {cr: "2122", amount: amount, movement: PRM_REN}
      - {dr: "5220", amount: levy}
      - {cr: "2650", amount: levy}

  - id: I-02
    event: billing.PremiumCollected
    models: [PAA]
    description: PAA premium received; the premium levy at the rate in force (A-19)
    lines:
      - {dr: "1140", amount: amount}
      - {cr: "2142", amount: amount, movement: PRM_REN}
      - {dr: "5220", amount: levy}
      - {cr: "2650", amount: levy}

  - id: G-COLLECTED
    event: billing.PremiumCollected
    models: [IFRS9]
    description: An IFRS 9 contract's premium -- posted by its account ledger's contribution (G-05), not here
    post: false

  - id: PLAT-A18
    event: billing.PremiumRefundDue
    models: [GMM, VFA]
    description: Premium credited back -- the invoice posting run backwards for the part given back
    lines:
      - {dr: "2121", amount: amount, movement: PRM_REN}
      - {cr: "2122", amount: amount, movement: PRM_REN}

  - id: PLAT-A18-PAA
    event: billing.PremiumRefundDue
    models: [PAA]
    description: PAA premium credited back; the earning schedule stops earning what was given back
    lines:
      - {dr: "2141", amount: amount, movement: PRM_REN}
      - {cr: "2142", amount: amount, movement: PRM_REN}

  - id: G-REFUND
    event: billing.PremiumRefundDue
    models: [IFRS9]
    description: An IFRS 9 contract's credit -- nothing was billed to the ledger
    post: false

  - id: PLAT-A06-UP
    event: billing.PremiumInvoiceIncreased
    models: [GMM, VFA]
    description: An untouched instalment restated upward -- the difference only
    lines:
      - {dr: "2122", amount: amount, movement: PRM_REN}
      - {cr: "2121", amount: amount, movement: PRM_REN}

  - id: PLAT-A06-UP-PAA
    event: billing.PremiumInvoiceIncreased
    models: [PAA]
    description: A PAA instalment restated upward -- the difference only
    lines:
      - {dr: "2142", amount: amount, movement: PRM_REN}
      - {cr: "2141", amount: amount, movement: PRM_REN}

  - id: G-RESTATED-UP
    event: billing.PremiumInvoiceIncreased
    models: [IFRS9]
    description: An IFRS 9 contract's restated invoice -- nothing was billed to the ledger
    post: false

  - id: PLAT-A06-DOWN
    event: billing.PremiumInvoiceReduced
    models: [GMM, VFA]
    description: An untouched instalment restated downward -- the difference only
    lines:
      - {dr: "2121", amount: amount, movement: PRM_REN}
      - {cr: "2122", amount: amount, movement: PRM_REN}

  - id: PLAT-A06-DOWN-PAA
    event: billing.PremiumInvoiceReduced
    models: [PAA]
    description: A PAA instalment restated downward -- the difference only
    lines:
      - {dr: "2141", amount: amount, movement: PRM_REN}
      - {cr: "2142", amount: amount, movement: PRM_REN}

  - id: G-RESTATED-DOWN
    event: billing.PremiumInvoiceReduced
    models: [IFRS9]
    description: An IFRS 9 contract's restated invoice -- nothing was billed to the ledger
    post: false

  - id: A-14
    event: billing.InvoiceWaived
    models: [GMM, VFA]
    description: Lapse, write-off or end of contract -- cancel the unpaid billed premium
    lines:
      - {dr: "2121", amount: amount, movement: PRM_REN}
      - {cr: "2122", amount: amount, movement: PRM_REN}

  - id: A-14-PAA
    event: billing.InvoiceWaived
    models: [PAA]
    description: A PAA invoice waived; the earning schedule stops earning what was waived
    lines:
      - {dr: "2141", amount: amount, movement: PRM_REN}
      - {cr: "2142", amount: amount, movement: PRM_REN}

  - id: G-WAIVED
    event: billing.InvoiceWaived
    models: [IFRS9]
    description: An IFRS 9 contract's waived invoice -- nothing was billed to the ledger
    post: false

  # ---- Commission (A-04, A-09, A-05; a clawback reverses, A-14's note) ---------------------------------------------

  - id: A-04
    event: distribution.CommissionAccrued
    models: [ANY]
    when: {direction: ACCRUAL, channel: AGENT}
    description: Commission earned by a tied agent (first-year A-04, renewal A-09, override)
    lines:
      - {dr: "2123", amount: amount, movement: "attr:movement"}
      - {cr: "2510", amount: amount}

  - id: A-04-BROKER
    event: distribution.CommissionAccrued
    models: [ANY]
    when: {direction: ACCRUAL, channel: BROKER}
    description: Brokerage earned
    lines:
      - {dr: "2123", amount: amount, movement: "attr:movement"}
      - {cr: "2520", amount: amount}

  - id: A-04-BANC
    event: distribution.CommissionAccrued
    models: [ANY]
    when: {direction: ACCRUAL, channel: BANCASSURANCE}
    description: Bancassurance commission earned
    lines:
      - {dr: "2123", amount: amount, movement: "attr:movement"}
      - {cr: "2530", amount: amount}

  - id: A-15
    event: distribution.CommissionAccrued
    models: [ANY]
    when: {direction: REVERSAL, channel: AGENT}
    description: Commission clawed back -- netted on the agent's next statement, so the payable falls
    lines:
      - {dr: "2510", amount: amount}
      - {cr: "2123", amount: amount, movement: IACF_CLAW}

  - id: A-15-BROKER
    event: distribution.CommissionAccrued
    models: [ANY]
    when: {direction: REVERSAL, channel: BROKER}
    description: Brokerage clawed back
    lines:
      - {dr: "2520", amount: amount}
      - {cr: "2123", amount: amount, movement: IACF_CLAW}

  - id: A-15-BANC
    event: distribution.CommissionAccrued
    models: [ANY]
    when: {direction: REVERSAL, channel: BANCASSURANCE}
    description: Bancassurance commission clawed back
    lines:
      - {dr: "2530", amount: amount}
      - {cr: "2123", amount: amount, movement: IACF_CLAW}

  - id: A-05
    event: distribution.CommissionPaid
    models: [NONE]
    when: {channel: AGENT}
    description: Commission paid, net of the withholding tax in force (none until Finance sets a rate)
    lines:
      - {dr: "2510", amount: gross}
      - {cr: BANK, amount: paid}
      - {cr: "2610", amount: withheld}

  - id: A-05-BROKER
    event: distribution.CommissionPaid
    models: [NONE]
    when: {channel: BROKER}
    description: Brokerage paid, net of withholding tax
    lines:
      - {dr: "2520", amount: gross}
      - {cr: BANK, amount: paid}
      - {cr: "2610", amount: withheld}

  - id: A-05-BANC
    event: distribution.CommissionPaid
    models: [NONE]
    when: {channel: BANCASSURANCE}
    description: Bancassurance commission paid, net of withholding tax
    lines:
      - {dr: "2530", amount: gross}
      - {cr: BANK, amount: paid}
      - {cr: "2610", amount: withheld}

  # ---- Claims (B, C-04): the liability at approval (user answer Q1), the bank at settlement --------------------------

  - id: B-02
    event: claims.ClaimApproved
    models: [GMM, VFA, PAA]
    description: Claim admitted -- the insurance cost to 5110, any investment component (C-04) to 2124
    lines:
      - {dr: "5110", amount: insured}
      - {dr: "2124", amount: investmentComponent, movement: IC_DTH}
      - {cr: "2211", amount: amount}

  - id: G-CLAIM-APPROVED
    event: claims.ClaimApproved
    models: [IFRS9]
    description: An IFRS 9 account's claim -- its account ledger books the payable (G-04)
    post: false

  - id: B-04
    event: claims.ClaimSettled
    models: [GMM, VFA, PAA]
    description: Claim paid
    lines:
      - {dr: "2211", amount: amount}
      - {cr: BANK, amount: amount}

  - id: G-CLAIM-PAID
    event: claims.ClaimSettled
    models: [IFRS9]
    description: An IFRS 9 account's claim paid
    lines:
      - {dr: "2340", amount: amount}
      - {cr: BANK, amount: amount}

  # ---- Surrenders (C-05, C-06) ---------------------------------------------------------------------------------------

  - id: C-05
    event: policy.SurrenderPayoutRequested
    models: [GMM, VFA, PAA]
    description: Surrender approved -- the value is all investment component (no loan offset at exit yet)
    lines:
      - {dr: "2124", amount: amount, movement: IC_SUR}
      - {cr: "2213", amount: amount}

  - id: G-SURRENDER-APPROVED
    event: policy.SurrenderPayoutRequested
    models: [IFRS9]
    description: An IFRS 9 account surrendered -- its account ledger books the payable (G-04)
    post: false

  - id: C-06
    event: policy.SurrenderPaid
    models: [GMM, VFA, PAA]
    description: Surrender paid
    lines:
      - {dr: "2213", amount: amount}
      - {cr: BANK, amount: amount}

  - id: G-SURRENDER-PAID
    event: policy.SurrenderPaid
    models: [IFRS9]
    description: An IFRS 9 account's surrender paid
    lines:
      - {dr: "2340", amount: amount}
      - {cr: BANK, amount: amount}

  # ---- Benefit payouts: due (C-01, D-01, D-05, H-02, A-17) and paid (C-03, D-02, H-03, A-18) -----------------------

  - id: C-01
    event: benefitpayout.PayoutRequested
    models: [ANY]
    when: {kind: MATURITY}
    description: Maturity due -- the investment component to 2124, anything above it to 5115
    lines:
      - {dr: "2124", amount: investmentComponent, movement: IC_MAT}
      - {dr: "5115", amount: insured}
      - {cr: "2212", amount: gross}

  - id: D-01
    event: benefitpayout.PayoutRequested
    models: [ANY]
    when: {kind: SURVIVAL}
    description: Survival benefit due -- the version's investment component share to 2124, the rest to 5115
    lines:
      - {dr: "2124", amount: investmentComponent, movement: IC_SB}
      - {dr: "5115", amount: insured}
      - {cr: "2214", amount: gross}

  - id: D-05
    event: benefitpayout.PayoutRequested
    models: [ANY]
    when: {kind: INCOME}
    description: Income instalment due -- the version's investment component share to 2124, the rest to 5115
    lines:
      - {dr: "2124", amount: investmentComponent, movement: IC_SB}
      - {dr: "5115", amount: insured}
      - {cr: "2214", amount: gross}

  - id: PLAT-D-PREMIUM-RETURN
    event: benefitpayout.PayoutRequested
    models: [ANY]
    when: {kind: RETURN_OF_PREMIUM}
    description: Premiums returned -- repaid in all circumstances, so all investment component
    lines:
      - {dr: "2124", amount: investmentComponent, movement: IC_MAT}
      - {dr: "5115", amount: insured}
      - {cr: "2214", amount: gross}

  - id: PLAT-D-COMMUTATION
    event: benefitpayout.PayoutRequested
    models: [ANY]
    when: {kind: COMMUTATION}
    description: A pension's lump sum at vesting -- repayment of its savings, all investment component
    lines:
      - {dr: "2124", amount: investmentComponent, movement: IC_MAT}
      - {dr: "5115", amount: insured}
      - {cr: "2214", amount: gross}

  - id: H-02
    event: benefitpayout.PayoutRequested
    models: [ANY]
    when: {kind: ANNUITY}
    description: Annuity instalment due
    lines:
      - {dr: "5120", amount: insured}
      - {dr: "2124", amount: investmentComponent}
      - {cr: "2215", amount: gross}

  - id: A-17
    event: benefitpayout.PayoutRequested
    models: [GMM, VFA, PAA]
    when: {kind: FREE_LOOK}
    description: Free-look cancellation -- only the refunded part leaves the liability
    lines:
      - {dr: "2121", amount: gross}
      - {cr: "2430", amount: gross}

  - id: G-FREE-LOOK
    event: benefitpayout.PayoutRequested
    models: [IFRS9]
    when: {kind: FREE_LOOK}
    description: An IFRS 9 account's free-look refund -- out of what its account ledger made payable
    lines:
      - {dr: "2340", amount: gross}
      - {cr: "2430", amount: gross}

  - id: C-03
    event: benefitpayout.PayoutPaid
    models: [ANY]
    when: {kind: MATURITY}
    description: Maturity paid, tax withheld where it applies
    lines:
      - {dr: "2212", amount: gross}
      - {cr: BANK, amount: paid}
      - {cr: "2615", amount: withheld}

  - id: D-02
    event: benefitpayout.PayoutPaid
    models: [ANY]
    when: {kind: SURVIVAL}
    description: Survival benefit paid, tax withheld where it applies
    lines:
      - {dr: "2214", amount: gross}
      - {cr: BANK, amount: paid}
      - {cr: "2615", amount: withheld}

  - id: D-02-INCOME
    event: benefitpayout.PayoutPaid
    models: [ANY]
    when: {kind: INCOME}
    description: Income instalment paid, tax withheld where it applies
    lines:
      - {dr: "2214", amount: gross}
      - {cr: BANK, amount: paid}
      - {cr: "2615", amount: withheld}

  - id: D-02-PREMIUM-RETURN
    event: benefitpayout.PayoutPaid
    models: [ANY]
    when: {kind: RETURN_OF_PREMIUM}
    description: Premiums returned, paid
    lines:
      - {dr: "2214", amount: gross}
      - {cr: BANK, amount: paid}
      - {cr: "2615", amount: withheld}

  - id: D-02-COMMUTATION
    event: benefitpayout.PayoutPaid
    models: [ANY]
    when: {kind: COMMUTATION}
    description: A pension's lump sum paid, tax withheld where it applies
    lines:
      - {dr: "2214", amount: gross}
      - {cr: BANK, amount: paid}
      - {cr: "2615", amount: withheld}

  - id: H-03
    event: benefitpayout.PayoutPaid
    models: [ANY]
    when: {kind: ANNUITY}
    description: Annuity instalment paid, tax withheld where it applies
    lines:
      - {dr: "2215", amount: gross}
      - {cr: BANK, amount: paid}
      - {cr: "2615", amount: withheld}

  - id: A-18
    event: benefitpayout.FreeLookRefundPaid
    models: [ANY]
    description: Refund paid
    lines:
      - {dr: "2430", amount: amount}
      - {cr: BANK, amount: amount}

  # ---- Policy loans (E) ----------------------------------------------------------------------------------------------

  - id: E-01
    event: policyloan.LoanDisbursed
    models: [NONE]
    description: Policy loan disbursed
    lines:
      - {dr: "2125", amount: amount}
      - {cr: BANK, amount: amount}

  - id: E-02
    event: policyloan.LoanInterestAccrued
    models: [ANY]
    description: A month's loan interest -- a contract inflow (the register's POLICY_LOANS = INSIDE_CONTRACT)
    lines:
      - {dr: "2126", amount: amount}
      - {cr: "2121", amount: amount, movement: LN_INT}

  - id: E-03
    event: policyloan.LoanRepaid
    models: [ANY]
    description: Loan repayment -- interest accrued first, then principal
    lines:
      - {dr: "1140", amount: amount}
      - {cr: "2126", amount: interest}
      - {cr: "2125", amount: principal}

  - id: E-06
    event: policyloan.LoanForcedLapseTriggered
    models: [ANY]
    description: Loan exceeds the surrender value -- the investment component repays it
    lines:
      - {dr: "2124", amount: total, movement: IC_SUR}
      - {cr: "2125", amount: principal}
      - {cr: "2126", amount: interest}

  # ---- IFRS 9 accounts (G): the account ledger's postings ------------------------------------------------------------

  - id: G-05
    event: accumulation.PostingRecorded
    models: [IFRS9]
    when: {flow: IN}
    description: Contribution, top-up or transfer in
    lines:
      - {dr: "1140", amount: amount}
      - {cr: "2320", amount: amount}

  - id: G-06
    event: accumulation.PostingRecorded
    models: [IFRS9]
    when: {flow: CHARGE}
    description: Allocation charge or policy fee -- fee income (IFRS 15)
    lines:
      - {dr: "2320", amount: amount}
      - {cr: "7310", amount: amount}

  - id: G-07
    event: accumulation.PostingRecorded
    models: [IFRS9]
    when: {flow: INTEREST}
    description: Return credited to the account
    lines:
      - {dr: "7320", amount: amount}
      - {cr: "2320", amount: amount}

  - id: G-04
    event: accumulation.PostingRecorded
    models: [IFRS9]
    when: {flow: OUT}
    description: Withdrawal, surrender, maturity, death claim or free-look refund -- payable until paid
    lines:
      - {dr: "2320", amount: amount}
      - {cr: "2340", amount: amount}

  - id: G-04-REVERSED
    event: accumulation.PostingRecorded
    models: [IFRS9]
    when: {flow: REVERSAL_UP}
    description: A payout that failed -- the money back on the account
    lines:
      - {dr: "2340", amount: amount}
      - {cr: "2320", amount: amount}

  - id: G-ADJUSTED-UP
    event: accumulation.PostingRecorded
    models: [IFRS9]
    when: {flow: ADJUSTMENT_UP}
    description: An approved adjustment credited to the account
    lines:
      - {dr: "7320", amount: amount}
      - {cr: "2320", amount: amount}

  - id: G-ADJUSTED-DOWN
    event: accumulation.PostingRecorded
    models: [IFRS9]
    when: {flow: ADJUSTMENT_DOWN}
    description: An approved adjustment debited from the account
    lines:
      - {dr: "2320", amount: amount}
      - {cr: "7320", amount: amount}

  - id: G-08
    event: accumulation.PostingRecorded
    models: [ANY]
    when: {flow: VESTING}
    description: Retirement -- the balance buys the annuity, a new insurance contract (its lump sum leaves as a payout)
    lines:
      - {dr: "2320", amount: amount}
      - {cr: "2121", amount: amount, movement: PRM_SGL}

  - id: G-06-SURRENDER
    event: accumulation.PayoutRequested
    models: [IFRS9]
    description: An IFRS 9 account's surrender charge -- fee income
    lines:
      - {dr: "2340", amount: charge}
      - {cr: "7310", amount: charge}

  - id: G-04-PAID
    event: accumulation.PayoutPaid
    models: [IFRS9]
    description: An IFRS 9 account's withdrawal or maturity paid
    lines:
      - {dr: "2340", amount: amount}
      - {cr: BANK, amount: amount}

  # ---- Reinsurance held (I3c): the monthly bordereau, and the reinsurer's share of a claim when it is approved ------

  # One journal per treaty and month, dated the month's last day. K-02 rides on the same bordereau: the commission not
  # contingent on claims reduces the ceded premium (IFRS 17 para 86) -- there is no reinsurance commission income.
  # Recoveries listed on the bordereau are only matched (K-03): they posted at approval (B-05).
  - id: K-01
    event: reinsurance.BordereauPosted
    models: [NONE]
    description: Bordereau -- reinsurance premium ceded (K-01) less the commission not contingent on claims (K-02)
    lines:
      - {dr: "1436", amount: premium}
      - {cr: "1430", amount: premium}
      - {dr: "1431", amount: commission}
      - {cr: "1436", amount: commission}

  - id: B-05
    event: reinsurance.RecoveryCalculated
    models: [ANY]
    description: Reinsurer's share of a claim admitted on a reinsured policy -- in the reinsurance result, never netted
    lines:
      - {dr: "1420", amount: amount}
      - {cr: "6120", amount: amount}

  # ---- Unit-linked (the guide's F entries; units in issue x price always equals 2131) -------------------------------

  - id: F-01
    event: unitlinked.UnitsAllocated
    models: [ANY]
    description: Premium allocated to units; the allocation charge stays inside the liability
    lines:
      - {dr: "2121", amount: premium}
      - {cr: "2131", amount: allocated}
      - {cr: "2132", amount: allocationCharge, movement: UL_ALLOC}

  - id: F-04
    event: unitlinked.ChargesTaken
    models: [ANY]
    description: The month's policy fee and mortality charge, cancelled from units
    lines:
      - {dr: "2131", amount: policyFee, movement: UL_ADM}
      - {dr: "2131", amount: costOfInsurance, movement: UL_MORT}
      - {cr: "2132", amount: policyFee, movement: UL_ADM}
      - {cr: "2132", amount: costOfInsurance, movement: UL_MORT}

  - id: F-03
    event: unitlinked.FundRevalued
    models: [NONE]
    when: {sign: POSITIVE}
    description: Unit price rises -- the liability trued up to units in issue x price
    lines:
      - {dr: "7130", amount: delta}
      - {cr: "2131", amount: delta}

  - id: F-03-FALL
    event: unitlinked.FundRevalued
    models: [NONE]
    when: {sign: NEGATIVE}
    description: Unit price falls
    lines:
      - {dr: "2131", amount: delta}
      - {cr: "7130", amount: delta}

  - id: PLAT-UL-EXIT
    event: unitlinked.ExitPriced
    models: [ANY]
    description: Units sold on an exit; the payout's own posting takes it from 5110 to cash (I3b -- F-08/F-09)
    lines:
      - {dr: "2131", amount: amount}
      - {cr: "5110", amount: amount}

  - id: PLAT-UL-RETURN
    event: unitlinked.PremiumReturned
    models: [ANY]
    description: A premium returned whole, its allocation charge with it
    lines:
      - {dr: "2121", amount: total}
      - {cr: "5110", amount: returned}
      - {cr: "2132", amount: allocationCharge, movement: UL_ALLOC}

  - id: PLAT-UL-CHARGE-REFUND
    event: unitlinked.ChargeRefunded
    models: [ANY]
    description: A charge refunded
    lines:
      - {dr: "2132", amount: amount}
      - {cr: "5110", amount: amount}

  - id: PLAT-UL-REINVEST
    event: unitlinked.UnitsReinvested
    models: [ANY]
    description: Money reinvested in units
    lines:
      - {dr: "5110", amount: amount}
      - {cr: "2131", amount: amount}

  - id: PLAT-UL-CORR-LIAB-UP
    event: unitlinked.PriceCorrected
    models: [ANY]
    when: {part: LIABILITY, sign: POSITIVE}
    description: A re-run exit sale -- the customer is owed more; the liability gives it up
    lines:
      - {dr: "2131", amount: difference}
      - {cr: "5110", amount: difference}

  - id: PLAT-UL-CORR-LIAB-DOWN
    event: unitlinked.PriceCorrected
    models: [ANY]
    when: {part: LIABILITY, sign: NEGATIVE}
    description: A re-run exit sale -- the customer is owed less
    lines:
      - {dr: "5110", amount: difference}
      - {cr: "2131", amount: difference}

  - id: PLAT-UL-CORR-OWED-TO
    event: unitlinked.PriceCorrected
    models: [ANY]
    when: {part: OWED, sign: POSITIVE}
    description: Already paid -- the difference is owed to the customer
    lines:
      - {dr: "5110", amount: difference}
      - {cr: "2213", amount: difference}

  - id: PLAT-UL-CORR-OWED-BY
    event: unitlinked.PriceCorrected
    models: [ANY]
    when: {part: OWED, sign: NEGATIVE}
    description: Already paid -- the customer owes the difference back
    lines:
      - {dr: "2122", amount: difference}
      - {cr: "5110", amount: difference}

  - id: PLAT-UL-PAYOUT
    event: unitlinked.PayoutPaid
    models: [ANY]
    description: An exit's or a withdrawal's payout, keyed on the disbursement
    lines:
      - {dr: "5110", amount: amount}
      - {cr: BANK, amount: amount}

  - id: PLAT-UL-PAYOUT-CORRECTION
    event: unitlinked.PayoutPaid
    models: [ANY]
    when: {purpose: PRICE_CORRECTION_PAYOUT}
    description: An adjustment paid to the customer
    lines:
      - {dr: "2213", amount: amount}
      - {cr: BANK, amount: amount}

  - id: PLAT-UL-PAYOUT-TOPUP
    event: unitlinked.PayoutPaid
    models: [ANY]
    when: {purpose: TOP_UP_REFUND}
    description: A top-up refunded whole -- it never bought a unit, so it leaves 2121 where it arrived
    lines:
      - {dr: "2121", amount: amount, movement: PRM_TOP}
      - {cr: BANK, amount: amount}

  - id: F-06
    event: unitlinked.SwitchExecuted
    models: [ANY]
    description: Fund switch fee (the units moved stay inside 2131)
    lines:
      - {dr: "2131", amount: fee, movement: UL_SWITCH}
      - {cr: "2132", amount: fee, movement: UL_SWITCH}

  - id: F-07
    event: unitlinked.WithdrawalPriced
    models: [ANY]
    when: {part: PROCEEDS}
    description: Partial withdrawal -- the units' proceeds
    lines:
      - {dr: "2131", amount: proceeds, movement: IC_WDL}
      - {cr: "5110", amount: proceeds}

  - id: PLAT-UL-WITHDRAWAL-CHARGE
    event: unitlinked.WithdrawalPriced
    models: [ANY]
    when: {part: SURRENDER_CHARGE}
    description: Partial withdrawal -- its surrender charge
    lines:
      - {dr: "5110", amount: surrenderCharge}
      - {cr: "2132", amount: surrenderCharge, movement: UL_SURCH}

  - id: PLAT-UL-SURRENDER-CHARGE
    event: unitlinked.SurrenderCharged
    models: [ANY]
    description: An exit's surrender charge, out of what the exit put in 5110
    lines:
      - {dr: "5110", amount: amount}
      - {cr: "2132", amount: amount, movement: UL_SURCH}

  - id: PLAT-UL-TOPUP
    event: unitlinked.TopUpReceived
    models: [ANY]
    description: A top-up's money in, before it buys units or goes back
    lines:
      - {dr: "1140", amount: amount}
      - {cr: "2121", amount: amount, movement: PRM_TOP}

  - id: PLAT-UL-ADJ-COLLECTED
    event: unitlinked.AdjustmentCollected
    models: [ANY]
    description: An amount owed by the customer, collected outside the platform
    lines:
      - {dr: "1140", amount: amount}
      - {cr: "2122", amount: amount}

  - id: PLAT-UL-ADJ-WAIVED-TO
    event: unitlinked.AdjustmentWaived
    models: [ANY]
    when: {direction: OWED_TO_CUSTOMER}
    description: An amount owed to the customer, waived
    lines:
      - {dr: "2213", amount: amount}
      - {cr: "5110", amount: amount}

  - id: PLAT-UL-ADJ-WAIVED-BY
    event: unitlinked.AdjustmentWaived
    models: [ANY]
    when: {direction: OWED_BY_CUSTOMER}
    description: An amount owed by the customer, waived
    lines:
      - {dr: "5110", amount: amount}
      - {cr: "2122", amount: amount}
