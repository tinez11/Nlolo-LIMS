# The guide's manual and period-end entries (IFRS 17 posting guide Part 4: M equity, N investments, O operating,
# Q intermediaries, R reinsurance statements) as templates for a manual journal (IFRS 17 I4). Generated from the
# guide 2026-10-06; edit by hand only to correct it. A template fills in accounts and sides; the preparer enters
# the amounts. An entry the guide puts on an AUTO account cannot be a manual journal (the chart locks AUTO accounts
# to manual posting, guide 2.3), so it carries `postedBy` -- where it will come from -- and is shown, not offered.
# Validated at startup: every account of an offered template is a MAN or BOTH posting account of the chart.

