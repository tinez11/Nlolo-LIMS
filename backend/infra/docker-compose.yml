# Digital Life Insurance Core Platform -- local development environment.
# Camunda is deliberately NOT a separate service here: Camunda 7 (the embedded,
# Spring-Boot-native engine) runs inside the `app` container itself, persisting to
# its own schema in the same Postgres instance -- consistent with the modular-monolith
# philosophy (Deliverable 3's surrender/maturity choreography is process logic living
# inside the `policy` module, not a call to an external distributed workflow service).
# This is a decision point flagged in the covering doc -- Camunda 8/Zeebe would be the
# right call ONLY if/when modules are actually extracted into separate services.

services:

  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: lifeplatform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-devapppassword}
    ports:
      # Host-side only -- every other service in this file reaches Postgres via the internal
      # "postgres:5432" DNS name, unaffected by this. 15432, not 5432, because a native Windows
      # PostgreSQL install on this machine's dev box permanently occupies host port 5432 -- see
      # docs/10-frontend-development.md gotcha 5.
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The documents: policy documents, KYC, underwriting and claim evidence. SeaweedFS, as the server stack runs
  # (deploy/server/compose.yml) -- MinIO withdrew its images on 2026-10-13, so `minio/minio:latest` now pulls on no
  # new machine at all; a laptop that still ran it was running a copy it happened to have cached.
  #
  # The platform talks to it with the same io.minio S3 client, on the same host port 9000 and the same dev
  # credentials, so application.yml's dev defaults are unchanged. There is no web console (MinIO's was on 9001).
  objectstore:
    image: chrislusf/seaweedfs:3.80
    command: ["server", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-dir=/data"]
    ports:
      - "9000:8333"   # S3 API, on the port the platform's dev default expects
    volumes:
      - objectstore-data:/data
      - ./objectstore/s3-dev.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # By its own hostname, NOT localhost: SeaweedFS binds the S3 port to the container's network address and not
      # to loopback, so a localhost probe is refused however healthy the server is.
      test: ["CMD-SHELL", "nc -z $$(hostname) 8333"]
      interval: 5s
      timeout: 5s
      retries: 30

  # The four buckets the platform writes to, made once the store is up -- as deploy/server/remote-release.sh does.
  # An existing bucket only reports that it exists, so this is safe to run on every `up`.
  objectstore-init:
    image: chrislusf/seaweedfs:3.80
    depends_on:
      objectstore:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      for b in policy-documents kyc-evidence underwriting-evidence claim-evidence; do
        echo \"s3.bucket.create -name $$b\" | weed shell -master=objectstore:9333 -filer=objectstore:8888;
      done;
      exit 0;
      "

  # Authentik (2026-11-19, the Authentik migration): replaced Keycloak, which left this file in ticket 02 of
  # .scratch/authentik-cutover. A server (the sign-in pages and API) and a worker (blueprints, notifications) from the
  # same stock image, on their own `authentik` database in this Postgres. The worker applies both blueprint folders --
  # production's, which the -auth image bakes in, and dev's test users, which no server ever mounts -- at start and on
  # every change. The issuer is http://localhost:9100/application/o/lifeplatform/ (trailing slash included).
  authentik-server:
    image: ghcr.io/goauthentik/server:2026.8.5
    command: server
    environment: &authentik-env
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-dev-only-authentik-secret-key-0123456789abcdef}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: postgres
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      # Set, not left to the default: the docs and the 2026.8.5 source disagree on it.
      AUTHENTIK_POSTGRESQL__SSLMODE: disable
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-devadmin}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:-dev-only-authentik-bootstrap-token}
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
      # The console's origin, for the provider's one exact redirect address.
      LP_APP_ORIGIN: http://localhost:5173
      # The backend's API token (ticket 03): the blueprint gives the lifeplatform-backend service account this key, and
      # the backend sends it as AUTHENTIK_API_TOKEN. Same dev default on both sides; production sets its own.
      AUTHENTIK_API_TOKEN: ${AUTHENTIK_API_TOKEN:-dev-only-authentik-api-token}
    ports:
      - "9100:9000"
    # Mounted on the server too, not only the worker: the admin API's "apply" runs here, and without the files it
    # re-applies stale content and still reports success (found 2026-11-19). A Windows bind mount sends no file events
    # into the container, so after editing a blueprint apply it through the API or restart the worker.
    volumes:
      - ../../deploy/authentik/blueprints/production:/blueprints/lifeplatform:ro
      - ../../deploy/authentik/blueprints/dev:/blueprints/lifeplatform-dev:ro
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.8.5
    command: worker
    environment: *authentik-env
    volumes:
      - ../../deploy/authentik/blueprints/production:/blueprints/lifeplatform:ro
      - ../../deploy/authentik/blueprints/dev:/blueprints/lifeplatform-dev:ro
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy

  mock-mobile-money:
    # Simulates Vodacom M-Pesa / Airtel Money / Tigo Pesa callback behavior for local
    # dev and integration tests, so `payment`'s ACL can be exercised without live
    # aggregator sandbox credentials. Stub mappings live in ./mock-mobile-money/mappings.
    image: wiremock/wiremock:3.5.4
    ports:
      - "8082:8080"
    volumes:
      - ../mock-mobile-money:/home/wiremock:ro
    command: ["--global-response-templating"]

  mock-sms-gateway:
    # Simulates a Tanzanian SMS aggregator so communication's ACL can be exercised without live
    # credentials. Same image and the same reasoning as mock-mobile-money above: SMS is the
    # channel most customers here are actually reachable on, and there is no sandbox to point at.
    image: wiremock/wiremock:3.5.4
    ports:
      - "8083:8080"
    volumes:
      - ../mock-sms-gateway:/home/wiremock:ro
    command: ["--global-response-templating"]

  mailpit:
    # Local email capture for communication-module testing (EMAIL channel) -- not a
    # production dependency, dev/test convenience only.
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # web UI
      - "1025:1025"   # SMTP

  app:
    build:
      context: ..
      dockerfile: infra/app/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lifeplatform
      SPRING_DATASOURCE_USERNAME: app_role
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:-devapppassword}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: "6379"
      MINIO_ENDPOINT: http://objectstore:8333
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      # No AUTHENTIK_ISSUER here yet: the issuer must be the address the browser signs in at, and this container cannot
      # reach localhost:9100. The server compose sets it (ticket 10 of .scratch/authentik-cutover); this service is not
      # used in dev, where the backend runs on the host.
      MOBILE_MONEY_GATEWAY_BASE_URL: http://mock-mobile-money:8080
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    ports:
      # ONLY the application port is published to the host. Actuator binds to 9090
      # (management.server.port in application.yml) and is deliberately NOT published here:
      # prometheus reaches it as app:9090 over this compose network, while the host has no
      # route to it at all. Publishing 9090 would defeat the entire reason actuator was moved
      # off 8080 -- see application.yml's own comment, and ActuatorExposureTest, which asserts
      # /actuator/prometheus is absent from the application port.
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      objectstore:
        condition: service_healthy
      authentik-server:
        condition: service_started

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@nlolo-lifeplatform.tz
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-devadmin}
    ports:
      - "5050:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - postgres
    profiles: ["tools"]   # `docker compose --profile tools up` -- optional, not part of default startup

volumes:
  postgres-data:
  redis-data:
  objectstore-data:
