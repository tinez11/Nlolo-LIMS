#
# Life Platform emails, English (2026-10-28). Plain words, the action as a button, how long the link lasts, and what
# to do if the email was not expected. Base said "credentials" and linked "Link to reset credentials".
#
# MessageFormat: a literal apostrophe is written twice (''). Placeholders are base's, unchanged:
#   passwordReset*    {0} link, {1} minutes, {2} realm name, {3} the lifetime in words
#   executeActions*   {0} link, {1} minutes, {2} realm name, {3} what to do, {4} the lifetime in words
#   eventUpdate*      the date and the address it came from
#

lpEmailFooter=An automatic message from Nlolo Life. Replies are not read.

passwordResetSubject=Reset your password
passwordResetBody=Someone asked to reset the password for your {2} account.\n\nIf it was you, choose a new password here:\n{0}\n\nThe link works once, for {3}. If you did not ask, ignore this email: your password stays as it is.
passwordResetBodyHtml=<p>Someone asked to reset the password for your <b>{2}</b> account.</p><p>If it was you, choose a new password:</p><p><a href="{0}" style="display:inline-block;padding:10px 20px;background:#0f6e64;color:#ffffff;border-radius:999px;text-decoration:none;font-weight:bold;">Choose a new password</a></p><p>The link works once, for {3}. If you did not ask, ignore this email: your password stays as it is.</p>

executeActionsSubject=Set your password
executeActionsBody=Your {2} account is ready. To start using it, {3}:\n{0}\n\nThe link works for {4}. If you were not expecting this, ignore this email.
executeActionsBodyHtml=<p>Your <b>{2}</b> account is ready. To start using it, {3}.</p><p><a href="{0}" style="display:inline-block;padding:10px 20px;background:#0f6e64;color:#ffffff;border-radius:999px;text-decoration:none;font-weight:bold;">Open your account</a></p><p>The link works for {4}. If you were not expecting this, ignore this email.</p>
requiredAction.UPDATE_PASSWORD=choose your password
requiredAction.VERIFY_EMAIL=confirm your email address
requiredAction.UPDATE_PROFILE=check your details

eventUpdatePasswordSubject=Your password was changed
eventUpdatePasswordBody=The password for your account was changed on {0} from {1}.\n\nIf this was you, there is nothing to do. If it was not, ask your administrator to lock the account now.
eventUpdatePasswordBodyHtml=<p>The password for your account was changed on {0} from {1}.</p><p>If this was you, there is nothing to do. If it was not, <b>ask your administrator to lock the account now</b>.</p>
eventUpdateCredentialSubject=Your sign-in details were changed
eventUpdateCredentialBody=Your {0} was changed on {1} from {2}.\n\nIf this was you, there is nothing to do. If it was not, ask your administrator to lock the account now.
eventUpdateCredentialBodyHtml=<p>Your {0} was changed on {1} from {2}.</p><p>If this was you, there is nothing to do. If it was not, <b>ask your administrator to lock the account now</b>.</p>
