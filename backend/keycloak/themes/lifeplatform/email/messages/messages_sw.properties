passwordResetSubject=Badilisha nenosiri lako
passwordResetBody=Mtu ameomba kubadilisha nenosiri la akaunti yako ya {2}.\n\nKama ni wewe, chagua nenosiri jipya hapa:\n{0}\n\nKiungo kinatumika mara moja tu, kwa dakika {1}. Kama hukuomba, puuza barua pepe hii: nenosiri lako halitabadilika.
