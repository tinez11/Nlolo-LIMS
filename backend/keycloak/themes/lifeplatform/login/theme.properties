#
# Life Platform login theme -- "The opening leaf"
#
# parent=base, NOT parent=keycloak. The stock `keycloak` theme pulls in three
# PatternFly stylesheets and Font Awesome; inheriting it would mean overriding a
# whole design system rather than replacing it, and PatternFly's tokens fight
# every value in DESIGN.md. `base` carries only the FreeMarker templates and
# their macros -- no CSS at all -- which is exactly what we want.
#
# The consequence that makes this economical: `template.ftl` here implements
# base's `registrationLayout` macro contract faithfully, so the ~40 login
# templates we do NOT override (update password, page expired, TOTP setup, the
# error page, logout confirm) still render inside this shell, and pick up this
# design through the kc* class properties mapped below. Only `login.ftl` is
# bespoke, because only the front door earns bespoke structure.
#
# `import=common/keycloak` is deliberately absent -- that is the PatternFly
# bundle by another name.
#
parent=base

styles=css/login.css
scripts=js/login.js

meta=viewport==width=device-width,initial-scale=1

# `locales` is deliberately NOT declared, so base's list is inherited. Only
# messages_en.properties is overridden here; every other language falls back to
# base's translations rather than to untranslated English.

# ---------------------------------------------------------------------------
# Class map. Base's templates emit these property values as class names, which
# is the whole mechanism by which an un-overridden template inherits this
# design. Every value below resolves in resources/css/login.css.
# ---------------------------------------------------------------------------

kcHtmlClass=lp-html
kcBodyClass=lp-body

kcFormClass=lp-form
kcFormGroupClass=lp-group
kcFormGroupErrorClass=lp-group--error
kcFormSettingClass=lp-setting
kcContentWrapperClass=lp-contentwrap

kcLabelClass=lp-label
kcLabelWrapperClass=lp-labelwrap
kcInputClass=lp-input
kcInputWrapperClass=lp-inputwrap
kcInputGroup=lp-inputgroup
kcTextareaClass=lp-input lp-input--area
kcInputErrorMessageClass=lp-err
kcInputHelperTextBeforeClass=lp-hint
kcInputHelperTextAfterClass=lp-hint

kcInputClassCheckbox=lp-check
kcInputClassCheckboxInput=lp-check__input
kcInputClassCheckboxLabel=lp-check__label
kcInputClassRadio=lp-check
kcInputClassRadioInput=lp-check__input
kcInputClassRadioLabel=lp-check__label
kcInputClassRadioCheckboxLabelDisabled=lp-check--disabled
kcCheckClass=lp-check
kcCheckInputClass=lp-check__input
kcCheckLabelClass=lp-check__label

kcFormOptionsClass=lp-options
kcFormOptionsWrapperClass=lp-options__aside
kcFormButtonsClass=lp-buttons

# The outline variant is the default in this system: a page with three
# equally-weighted primary buttons has no primary action.
kcButtonClass=lp-btn
kcButtonPrimaryClass=lp-btn--primary
kcButtonDefaultClass=lp-btn--outline
kcButtonBlockClass=lp-btn--block
# Deliberately empty: there is one control height (36px) plus a 32px compact,
# and "large" is not one of them.
kcButtonLargeClass=

kcFormCardClass=lp-card
kcFormHeaderClass=lp-card__head

kcAlertClass=lp-alert
kcAlertTitleClass=lp-alert__text

kcSrOnlyClass=lp-sr

kcFormSocialAccountSectionClass=lp-social
kcFormSocialAccountListClass=lp-social__list
kcFormSocialAccountListGridClass=lp-social__list--grid
kcFormSocialAccountListButtonClass=lp-btn lp-btn--outline lp-btn--block
kcFormSocialAccountGridItem=lp-social__griditem
kcFormSocialAccountNameClass=lp-social__name
kcFormSocialAccountLinkClass=lp-link

kcSignUpClass=lp-signup
kcInfoAreaClass=lp-info
kcInfoAreaWrapperClass=lp-info__inner

kcFormPasswordVisibilityButtonClass=lp-reveal

kcSelectAuthListClass=lp-authlist
kcSelectAuthListItemClass=lp-authlist__item
kcSelectAuthListItemBodyClass=lp-authlist__body
kcSelectAuthListItemHeadingClass=lp-authlist__heading
kcSelectAuthListItemDescriptionClass=lp-authlist__desc
kcSelectAuthListItemIconClass=lp-authlist__icon
kcSelectAuthListItemFillClass=lp-authlist__fill
kcSelectAuthListItemArrowClass=lp-authlist__arrow

kcRecoveryCodesList=lp-codes
kcRecoveryCodesActions=lp-codes__actions
kcRecoveryCodesWarning=lp-codes__warning
kcRecoveryCodesConfirmation=lp-check

kcLoginOTPListClass=lp-otplist
kcLoginOTPListItemHeaderClass=lp-otplist__header
kcLoginOTPListItemTitleClass=lp-otplist__title

## Locale
kcLocaleMainClass=lp-locale
kcLocaleWrapperClass=lp-locale__wrap
kcLocaleDropDownClass=lp-locale__dd
kcLocaleListClass=lp-locale__list
kcLocaleItemClass=lp-locale__item

# The feedback-icon properties base's own template.ftl uses (kcFeedbackErrorIcon
# and friends) are absent on purpose: they name Font Awesome classes, and
# template.ftl here draws its own inline SVG in the console's icon idiom
# instead -- 24px viewBox, 2px stroke, round caps, currentColor.
