#
# Voice overrides for the Life Platform login theme.
#
# Only the strings whose wording is wrong for this console are listed. Every
# other key falls through to base's bundle, and every other language falls
# through to base's translations rather than to untranslated English.
#
# THE ONE EXCEPTION, and what it costs: the `lp*` keys below are this theme's
# own, so base has no translation to fall through to. No realm sets
# `internationalizationEnabled`, so today every page renders from this file and
# they always resolve. The day a realm enables it, a locale with no
# `messages_<locale>.properties` beside this file renders those keys as
# `??lpUsernameLabel??` rather than in English -- so enabling i18n means
# translating this file, not just switching the flag.
#
# Two rules from the console's own copy discipline:
#   * Sentence case. Uppercase and Title Case are structural labelling here, and
#     a button is neither.
#   * An error names the problem AND the recovery. "Please specify username."
#     names neither -- it asks politely for something and leaves the reader to
#     work out what to do about it.
#
# Non-ASCII characters are written as \u escapes so the bundle's meaning does
# not depend on how the file is decoded.
#

# The browser tab. {0} is the realm's display name, or its machine name where an
# administrator has not set one. Applies to every page in the flow, so it names
# the platform rather than the action.
loginTitle=Life Platform \u00b7 {0}

# Registration is disabled on every realm, so everyone who reaches this page
# already has an account: "Welcome back" is true here in a way it is not on a
# login page that also sells sign-ups.
loginAccountTitle=Welcome back.
doLogIn=Log in

# Field labels, written as whole sentences rather than assembled from
# `msg("password")?lower_case` -- a string builtin on a message hits the same
# auto-escaping trap a captured assign does, and would take the front door down
# rather than degrade. Whole strings also give translators something to work
# with. The possessive phrasing follows the pinned reference.
lpUsernameLabel=Your username
lpUsernameOrEmailLabel=Your username or email
lpEmailLabel=Your email address
lpPasswordLabel=Your password

# Custom to this theme: the submit button's busy label while the POST is in
# flight. Present tense, because it is happening.
lpSigningIn=Signing in\u2026

# Which of the four realms this is. Operational rather than decorative: the same
# credentials do not exist in two of them. {0} is the realm's display name, and
# the emphasis is inside the string so a translator can move it -- rendered
# through kcSanitize, which is what keeps the <b> and nothing else.
lpSigningInTo=Signing in to <b>{0}</b>

# The identity strip on a re-authentication page, above the name Keycloak
# already knows.
lpSigningInAs=Signing in as

# Caps Lock, reported beside the password label while the key is latched. The
# commonest reason a correct password is rejected, and the one a server-side
# rejection can never name because the server cannot see it.
lpCapsLockOn=Caps Lock is on

# The brand panel's display statement and the line under it, on the realms that
# do not carry the photograph. Translatable like everything else a person reads:
# this is a sentence, not a logotype.
lpBrandStatement=Every figure, provable
lpBrandBody=Core administration for life assurance in Tanzania \u2014 underwriting through settlement, general ledger through statutory return.

# The region the pinned reference spends on third-party sign-in buttons. Which
# of these two prints is decided by the realm's own flags, so the sentence stops
# appearing the moment it stops being true.
lpAccessNoteNoSelfService=Accounts and password resets are handled by your administrator.
lpAccessNoteNoRegistration=Accounts are issued by your administrator.

# Deliberately does not say WHICH of the two was wrong -- that is the whole
# point of the message, and it is a security property rather than vagueness.
# What it adds to Keycloak's "Invalid username or password." is the recovery.
invalidUserMessage=We could not sign you in. Check the username and password, then try again.
invalidUsernameOrEmailMessage=We could not sign you in. Check the username and password, then try again.
invalidUsernameMessage=We could not sign you in. Check the username and password, then try again.
invalidPasswordMessage=We could not sign you in. Check the username and password, then try again.

# Base ships "New Password" in title case beside "Confirm password" in sentence
# case, so the two labels on the update-password page disagreed with each other.
passwordNew=New password

missingUsernameMessage=Enter your username.
missingPasswordMessage=Enter your password.
missingTotpMessage=Enter the code from your authenticator.

# Both of these end in a dead end unless the reader is told who can open it.
accountDisabledMessage=This account is disabled. An administrator has to re-enable it before you can sign in.
accountTemporarilyDisabledMessage=This account is locked after too many failed sign-in attempts. Wait a few minutes, or ask an administrator to unlock it.

# "We are sorry..." apologises without saying anything. Name the state.
errorTitle=Something went wrong
errorTitleHtml=Something went wrong

pageExpiredTitle=This sign-in page expired
pageExpiredMsg1=Start again
pageExpiredMsg2=Continue where you left off

# Base ships these with a raw &laquo; entity in the string.
backToApplication=Back to the console
backToLogin=Back to sign in

# Names the method, not the mechanism.
doTryAnotherWay=Use another sign-in method

loginTimeout=That sign-in attempt timed out. Start again from the beginning.
