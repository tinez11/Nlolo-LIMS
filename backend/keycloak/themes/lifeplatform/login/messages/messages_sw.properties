#
# Kiswahili for the Life Platform login theme (2026-10-28, user decision: English and Swahili).
#
# Every key in messages_en.properties is here, in the same order: the theme's own
# `lp*` keys have no base translation to fall back to, and Keycloak ships no
# Swahili of its own, so a key missing here shows as ??key?? on a Swahili page.
#
# Plain, everyday Swahili as a customer or an agent at a branch would speak it --
# "nenosiri" for password, "barua pepe" for email, "msimamizi" for administrator.
# Non-ASCII characters are written as \u escapes, as in the English file.
#

