spring:
  application:
    name: lifeplatform
  # Migrations are applied by scripts/migrate.sh as a separate pipeline/dev step,
  # per-module and per-module schema-history table -- not by Spring Boot on boot.
  # See this plan's Architecture note and Task 8/9.
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

app:
  security:
    issuers:
      customers: ${KEYCLOAK_ISSUER_CUSTOMERS:http://localhost:8081/realms/customers}
      agents: ${KEYCLOAK_ISSUER_AGENTS:http://localhost:8081/realms/agents}
      staff: ${KEYCLOAK_ISSUER_STAFF:http://localhost:8081/realms/staff}
      regulators: ${KEYCLOAK_ISSUER_REGULATORS:http://localhost:8081/realms/regulators}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
