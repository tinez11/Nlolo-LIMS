spring:
  application:
    name: lifeplatform
  # Migrations are applied by scripts/migrate.sh as a separate pipeline/dev step,
  # per-module and per-module schema-history table -- not by Spring Boot on boot.
  # See this plan's Architecture note and Task 8/9.
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
