groups:
  - name: lifeplatform-business-and-reliability
    rules:

      # Deliverable 5 §4 dead-letter table -- an event that exhausted retry is a
      # correctness problem (a domain side-effect that never happened), not just an
      # ops nuisance, so this alerts fast and on any growth, not on a high threshold.
      - alert: FailedEventBacklogGrowing
        expr: increase(lifeplatform_failed_event_total[15m]) > 0
        for: 5m
        labels: { severity: high }
        annotations:
          summary: "Events landing in audit.failed_event -- at least one consumer is failing repeatedly"
          description: "Check audit.failed_event for unresolved rows; a producer's event is not reaching its consumer(s)."

      # Deliverable 2 Rev 2 B4 / Deliverable 6 -- field-captured premium receipts that
      # missed their reconciliation SLA.
      - alert: FieldReceiptReconciliationOverdue
        expr: lifeplatform_field_receipt_overdue_count > 0
        for: 10m
        labels: { severity: medium }
        annotations:
          summary: "Field-captured premium receipts overdue for reconciliation"
          description: "One or more agent-captured receipts have exceeded the OFFLINE_RECEIPT_SLA_HOURS refdata parameter without a matching PaymentConfirmed."

      # Deliverable 3 Rev 2 §12 -- the surrender/maturity Camunda process stuck
      # mid-choreography (e.g. policyloan never replied to PolicySurrenderInitiated).
      - alert: SurrenderMaturityProcessStuck
        expr: camunda_process_instances{process="policy-surrender-maturity", state="IN_PROGRESS"} and on() (time() - camunda_process_instance_start_timestamp) > 3600
        for: 5m
        labels: { severity: high }
        annotations:
          summary: "A surrender/maturity process instance has been IN_PROGRESS for over an hour"
          description: "Per Deliverable 3 Rev 2 §12, this should escalate to a staff manual-resolution task well before this alert fires; if it fired, the escalation itself may have failed too."

      # Deliverable 6 §4 -- partition-maintenance is not optional; a missed run means
      # the platform is one insert away from a hard failure on a partitioned table
      # (exactly what Deliverable 6's smoke test demonstrated deliberately).
      - alert: PgPartmanMaintenanceFailed
        expr: increase(pg_cron_job_failed_total{jobname="pg-partman-maintenance"}[1d]) > 0
        labels: { severity: critical }
        annotations:
          summary: "pg_partman's daily maintenance job failed"
          description: "Partitioned tables (loan_transaction, payment_transaction, disbursement_instruction, gl_posting, audit_log, premium_invoice) risk running out of pre-created future partitions."

      - alert: PartitionHeadroomLow
        expr: (lifeplatform_max_partition_upper_bound_epoch - time()) < 30 * 86400
        labels: { severity: high }
        annotations:
          summary: "A partitioned table has less than 30 days of pre-created partition headroom"

      - alert: MobileMoneyGatewayErrorRateHigh
        expr: rate(lifeplatform_payment_gateway_requests_total{status="FAILED"}[5m]) / rate(lifeplatform_payment_gateway_requests_total[5m]) > 0.1
        for: 10m
        labels: { severity: high }
        annotations:
          summary: "Mobile money gateway failure rate above 10% over 10 minutes"

      # M5 final-review fix (I2). The counter has existed since Task 8's own review round but
      # nothing alerted on it, which left half of that fix undelivered: the whole reason the
      # ambiguous case was given its own counter (rather than sharing NOT_FOUND's log line) was so
      # that a real cross-tenant collision would be VISIBLE rather than reading like a data-entry
      # error. A metric no rule references is not visible.
      #
      # Alerts on ANY occurrence, not a rate: db-migrations/payment/V2's own comment records that a
      # gateway may legitimately reuse a reference across tenants, and when it happens this platform
      # correctly refuses to guess which tenant's row to mutate -- which means a genuine payout is
      # left sitting PENDING with no automated path to resolution. Every single one needs a human.
      - alert: PaymentCallbackAmbiguousReference
        expr: increase(lifeplatform_payment_callback_ambiguous_total[15m]) > 0
        for: 5m
        labels: { severity: high }
        annotations:
          summary: "A mobile-money callback's gatewayReference matched more than one tenant -- nothing was applied"
          description: "payment.applyGatewayCallback fails closed rather than guessing which tenant owns a shared gateway_reference, so the affected payment/disbursement is left in its prior state and needs manual reconciliation against the aggregator. Search logs for 'is AMBIGUOUS across more than one tenant'."

      # M5 final-review fix (C2). An IN_DOUBT row means the platform sent an instruction to the rail
      # and does NOT know whether money moved (read timeout, 5xx, or an ACCEPTED response carrying no
      # gatewayReference). Deliberately no domain event is published for that state -- publishing
      # payment.DisbursementFailed made policyloan write a REVERSAL and release the encumbrance for
      # payouts that may well have succeeded -- so THIS RULE IS THE ONLY AUTOMATED SIGNAL that such a
      # row exists. If it is removed, the state becomes invisible outside the database.
      #
      # Any occurrence, same reasoning as the ambiguous rule above: each one is money whose fate is
      # unknown and which must be reconciled against the aggregator's statement by hand.
      - alert: PaymentOutcomeInDoubt
        expr: increase(lifeplatform_payment_in_doubt_total[15m]) > 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "A payment/disbursement outcome is IN_DOUBT -- money may or may not have moved"
          description: "The rail neither confirmed nor declined (timeout, 5xx, or ACCEPTED with no gatewayReference). The row is recorded IN_DOUBT and NO *Failed event was published, so no compensation was triggered and the requesting module is still waiting. Reconcile against the aggregator's statement, then let the row resolve via the inbound webhook (IN_DOUBT is a valid source state for both terminal transitions). Search logs for 'INDETERMINATE gateway outcome'."

      # M5 final-review fix (C2, second half). An unrecognized callback status now applies NOTHING
      # (it previously drove a definitive FAILED transition on any string that was not "SUCCESS").
      # That is the safe behaviour, and it is also silent: if an aggregator renames its statuses, every
      # confirmation stops landing while the platform keeps returning HTTP 200. This is how that gets
      # noticed. Not `critical` because nothing incorrect has happened -- but it does mean
      # confirmations are being dropped, so it needs same-day attention.
      - alert: PaymentCallbackUnknownStatus
        expr: increase(lifeplatform_payment_callback_unknown_status_total[15m]) > 0
        for: 5m
        labels: { severity: high }
        annotations:
          summary: "A mobile-money callback carried a status this platform does not recognize -- nothing was applied"
          description: "MobileMoneyCallbackController validates status against a known dialect and refuses to let an unknown string drive a financial transition. A sustained rate means the aggregator's vocabulary has drifted and confirmations are silently not landing; the recognized sets in that class must be updated deliberately. Search logs for 'carried an UNRECOGNIZED status'."

      # M6 final-review fix (I5). claims.application.PaymentEventListener increments this on every
      # genuine rail DECLINE of a claim settlement payout. The claim is deliberately reverted
      # SETTLEMENT_REQUESTED -> APPROVED and left there: claims never retries a payout automatically
      # (a second attempt at real money must be a human decision), so the claim sits on a staff
      # worklist that nothing else announces. No domain event reaches an operator either --
      # claims.ClaimSettled is only published on success.
      #
      # Any occurrence, not a rate: each one is a beneficiary who has NOT been paid and who is
      # waiting. `medium` rather than high/critical because nothing incorrect happened and no money is
      # unaccounted for -- the rail said no, cleanly, and the platform recorded exactly that.
      - alert: ClaimSettlementDisbursementFailed
        expr: increase(lifeplatform_claims_settlement_failed_total[15m]) > 0
        for: 5m
        labels: { severity: medium }
        annotations:
          summary: "A claim settlement payout was declined by the rail -- the claim is back at APPROVED awaiting a staff retry"
          description: "The claim reverted to APPROVED with settlement_failure_reason recorded and will NOT be retried automatically. Find the claim (search logs for 'settlement disbursement FAILED'), resolve the cause named in the reason (e.g. INSUFFICIENT_FLOAT, a bad payeeRef), then re-issue the settlement decision with a NEW Idempotency-Key and the SAME approved amount -- a differing amount is rejected with 409 by design."

      # M6 final-review fix (C1, part 3). The claim is SETTLED and its disbursement COMPLETED -- the
      # money has genuinely left -- but the policy could not be closed, so billing will keep raising
      # premium invoices against a policy whose claim has already paid out. That is the exact bug the
      # policy-closure feature exists to prevent, silently reappearing for this one policy.
      #
      # THIS RULE IS THE ONLY AUTOMATED SIGNAL for that state. By design the claim is NOT rolled back
      # (rolling it back after the money moved is the Critical this counter was introduced alongside),
      # and claims.ClaimSettled IS published, so every downstream consumer sees a normal, complete
      # settlement. Nothing else anywhere indicates the policy half never happened.
      #
      # Any occurrence: the legitimate source states (ACTIVE, REINSTATED, LAPSED, SUSPENDED, plus
      # already-closed as a no-op) no longer throw at all, so if this fires the cause is genuinely
      # unexpected -- a PROPOSED policy, a missing policy row, a lock timeout -- and needs a human.
      - alert: ClaimSettledButPolicyNotClosed
        expr: increase(lifeplatform_claims_policy_closure_failed_total[15m]) > 0
        for: 5m
        labels: { severity: high }
        annotations:
          summary: "A claim settled and paid out, but its policy could not be closed -- billing will keep invoicing it"
          description: "The claim is correct and final; only the policy closure failed. Search logs for 'could NOT be closed' to get the claimId and policyNumber, then close the policy manually (MATURED for a MATURITY claim, SURRENDERED otherwise) and reconcile any premium invoices raised against it after the settlement date. Do NOT reopen or un-settle the claim -- the disbursement really did complete."

      # M7 Task 6. distribution.application.PolicyEventListener.handlePolicyLapsed increments this
      # on every genuine clawback -- a FIRST_YEAR commission accrual reversed because the policy
      # lapsed within TZ_COMMISSION_CLAWBACK_MONTHS of issue. This is a BUSINESS signal, not a
      # platform malfunction: the reversal itself is correct, expected behaviour (the whole point
      # of the clawback window), so a single occurrence needs no attention at all.
      #
      # `info`, not `medium`/`high`/`critical`, and deliberately not paged like the payment/claims
      # counters above: nothing here is broken, no money is unaccounted for, and no staff action is
      # implied. A SUSTAINED increase, though, is a distribution-quality signal worth a human
      # noticing -- it means a meaningful share of recently-issued business is not persisting past
      # its early months, which points at agent conduct, product-fit, or onboarding quality, not at
      # this platform. Rate-based (not "any occurrence", unlike the payment/claims counters above)
      # precisely because occasional clawbacks are the healthy, designed-for case.
      - alert: DistributionClawbackRateElevated
        expr: increase(lifeplatform_distribution_clawback_total[24h]) > 10
        for: 30m
        labels: { severity: info }
        annotations:
          summary: "More than 10 commission clawbacks in the last 24h -- an early-lapse rate worth a look"
          description: "Each clawback is individually correct (a FIRST_YEAR accrual reversed because its policy lapsed within TZ_COMMISSION_CLAWBACK_MONTHS of issue) -- this rule only flags the AGGREGATE rate. Search logs for 'Clawed back' to see which agents/policies are driving it; a concentration on a few agents may indicate churn-selling, a concentration on one product may indicate a pricing or suitability problem. Not a page -- a weekly-review item."

      # M7 Task 8. distribution.application.PaymentEventListener.handleFailed increments this when
      # the rail DECLINES an agent's commission payout. Unlike the clawback counter above, this is
      # a platform/operational signal, not a business one: an agent who earned commission has not
      # been paid, the statement is parked at PAYOUT_FAILED, and distribution deliberately does NOT
      # retry -- a retry needs a NEW idempotency key, which only a human requesting payout again
      # supplies. So nothing moves until someone acts, which is why this alerts on ANY occurrence
      # (matching the payment/claims counters above) rather than on a rate.
      #
      # Note what this does NOT cover, deliberately: an INDETERMINATE rail outcome publishes no
      # event at all, so a statement stuck at PAYOUT_REQUESTED never reaches this counter. That
      # gap is real and is already covered one layer down by PaymentInDoubtOutcome on
      # lifeplatform_payment_in_doubt_total -- see distribution's PaymentEventListener javadoc.
      - alert: DistributionCommissionPayoutFailed
        expr: increase(lifeplatform_distribution_payout_failed_total[15m]) > 0
        for: 5m
        labels: { severity: medium }
        annotations:
          summary: "An agent's commission payout was declined by the rail and is awaiting a staff retry"
          description: "The statement is at PAYOUT_FAILED with the rail's reason recorded, and no automatic retry will happen. Search logs for 'Commission payout FAILED' to get the statementId and reason. Common causes are a bad or unregistered payee MSISDN and insufficient float. Fix the underlying cause, then request payout again -- the retry MUST use a new idempotency key, or payment will dedupe it away silently."

      # M8 final-review fix (I5). reinsurance.application.PolicyEventListener and
      # ClaimEventListener each wrap their event handling in a catch-all that used to be log-only:
      # a malformed payload or an unexpected runtime exception during cession or recovery
      # processing was invisible to anything but someone reading logs after the fact, exactly the
      # class of gap M6's I5/C1 and M7's equivalent fixes closed for claims/distribution.
      #
      # Any occurrence: a cession or recovery that fails to process is a missed financial record
      # (ceded risk never booked, or a reinsurance recoverable never booked) with no other signal
      # anywhere -- there is no compensating retry, and the redelivery/idempotency machinery here
      # only protects against DUPLICATE processing, not against a processing failure being silent.
      - alert: ReinsuranceEventProcessingFailed
        expr: increase(lifeplatform_reinsurance_event_processing_failed_total[15m]) > 0
        for: 5m
        labels: { severity: high }
        annotations:
          summary: "reinsurance failed to process a domain event -- a cession or recovery may be missing"
          description: "PolicyEventListener or ClaimEventListener threw while handling policy.PolicyIssued or claims.ClaimSettled. Search logs for 'reinsurance failed to process' to get the event type and tenant, then inspect whether the expected cession/recovery row exists and investigate the underlying cause (a malformed payload, a database error) before deciding whether to replay the event."

      # Task 6, Step 6 (M9 finaccounting). BillingEventListener/ClaimsEventListener/
      # DistributionEventListener/ReinsuranceEventListener/PolicyLoanEventListener each wrap their
      # event handling in the same catch-all shape M8's reinsurance listeners use (see
      # ReinsuranceEventProcessingFailed above) -- previously log-only, now alertable.
      #
      # Financially consequential, specifically: a swallowed exception here means a business event
      # (an invoice generated or collected, a claim settled, a commission paid, a cession or
      # recovery recorded, a policy loan disbursed or repaid) already moved -- or was recorded as
      # having moved -- real money in its OWN module, but no corresponding journal entry was ever
      # written in finaccounting. There is no compensating retry and no other signal: the ledger
      # falls silently out of sync with the systems of record it exists to reconcile, and every
      # day it goes unnoticed is a day the general ledger silently misstates the business.
      #
      # THE RUNBOOK BELOW NO LONGER MENTIONS REPLAYING THE EVENT, corrected by M9's final
      # whole-branch review (finding I4). It used to say "before deciding whether to replay it",
      # which offered an operator a capability that does not exist: there is no dead-letter store,
      # no retry scheduler and no replay endpoint for finaccounting -- or for any other consumer --
      # anywhere on this platform. The event is an in-process AFTER_COMMIT Spring
      # ApplicationEvent; once the listener's catch-all has swallowed it, the payload is GONE,
      # surviving only as whatever audit.audit_log recorded and as the source module's own rows. An
      # operator following that instruction at 2am would have burned the outage hunting for a
      # replay button. The runbook now names the recovery that genuinely exists.
      #
      # The absent capability itself is tracked, not quietly dropped: the design spec's §9 records
      # event replay/dead-lettering as an explicit finaccounting deferral, alongside
      # docs/05-event-catalog.md §7 item 2, which has tracked the platform-wide failed_event table
      # as an open item since Deliverable 5.
      - alert: FinaccountingEventProcessingFailed
        expr: increase(lifeplatform_finaccounting_event_processing_failed_total[15m]) > 0
        for: 5m
        labels: { severity: high }
        annotations:
          summary: "finaccounting failed to post a journal entry -- the ledger may be silently incomplete"
          description: "One of BillingEventListener/ClaimsEventListener/DistributionEventListener/ReinsuranceEventListener/PolicyLoanEventListener threw while handling a domain event. Search logs for 'finaccounting failed to process' to get the event type and tenant, and the accompanying stack trace for the cause. THERE IS NO REPLAY OR DEAD-LETTER PATH for this event -- do not look for one. Recovery is manual: identify the source event's own record in its owning module (the invoice, claim, commission statement, cession, recovery or loan transaction) plus audit.audit_log, confirm from finaccounting.journal_entry that no entry exists for that (tenant, source_event, source_ref), and if none does, have Finance construct the missing balanced entry by direct database insert under audit and four-eyes approval. journal_entry and gl_posting are append-only (UPDATE/DELETE are revoked from app_role), so a wrong manual entry can only be corrected by a further reversal entry -- get it right the first time. A swallowed exception here means money moved but the general ledger was never told."

      # Task 6 (M10) -- regreporting has no independent aggregate of its own; every one of its
      # tables (policy_dimension/policy_movement, claim_dimension/claims_movement,
      # premium_movement, reinsurance_movement) is a projection REBUILT from events, never a
      # transactional source of truth. Same "no replay/dead-letter path" gap as
      # FinaccountingEventProcessingFailed above (docs/05-event-catalog.md §7 item 2) -- an
      # AFTER_COMMIT ApplicationEvent whose listener throws is gone once the catch-all swallows it.
      - alert: RegreportingEventProcessingFailed
        expr: increase(lifeplatform_regreporting_event_processing_failed_total[15m]) > 0
        for: 5m
        labels: { severity: high }
        annotations:
          summary: "regreporting failed to apply a projection event -- the read model may have silently drifted from the business facts"
          description: "One of PolicyEventListener/ClaimsEventListener/BillingEventListener/ReinsuranceEventListener threw while handling a domain event. Search logs for 'regreporting failed to process' to get the event type and tenant, and the accompanying stack trace for the cause. WHAT MAKES THIS CONSEQUENTIAL: a swallowed exception here does not fail loudly the way a rejected API call would -- it means the read model has silently drifted from the business facts, so a regulatory return generated afterwards is not obviously broken, it is quietly WRONG (a missing policy, claim or premium movement understating a figure), and nothing else on this platform will notice until a regulator or an auditor does. WHAT MAKES THIS DIFFERENT FROM finaccounting's EQUIVALENT ALERT ABOVE: finaccounting's journal_entry/gl_posting are the transactional source of truth for money moved, so its recovery is to hand-construct a correcting entry under four-eyes approval. Every regreporting table is instead DERIVED -- it has no independent facts of its own, only a copy of what policy/claims/billing/reinsurance already recorded -- so hand-editing a fact-table row here would not correct anything, it would just be a second guess sitting next to the real data. The correct remedy is to REPLAY OR REBUILD the affected tenant/period's projection from the owning module's own real records (there is no replay tooling for this today, the same platform-wide gap finaccounting's own alert records), never to directly edit policy_movement/claims_movement/premium_movement/reinsurance_movement by hand."

      # M10 FINAL REVIEW, finding I3. The UNKNOWN sentinel (policy_movement.product_id =
      # 00000000-0000-0000-0000-000000000000, claims_movement.claim_type = 'UNKNOWN') is how this
      # module refuses to DROP a movement whose dimension row is missing -- a visibly-unattributed
      # figure is strictly better than one that silently vanished from a return. But until this
      # counter existed, a dimension miss only logged at WARN: nothing counted it, nothing alerted
      # on it, and there was no way to notice unattributed movements accumulating without already
      # suspecting a problem and going log-diving. LOW severity is deliberate and correct: this is
      # "notice a pattern", not "something is broken". A single miss is a legitimate out-of-order
      # delivery (a lapse arriving before this module has seen the issuance that carries productId).
      # A SUSTAINED rate is a real projection gap: every unattributed movement is missing from any
      # return line that filters on that dimension -- e.g. the seeded placeholder definition's CL-03
      # filters CLAIMS_SETTLED_AMOUNT on claim_type = 'DEATH', so an UNKNOWN-attributed settlement
      # is a shilling absent from that line while the tenant-wide total still contains it.
      - alert: RegreportingUnattributedMovements
        expr: increase(lifeplatform_regreporting_unattributed_movement_total[1h]) > 5
        for: 30m
        labels: { severity: low }
        annotations:
          summary: "regreporting is attributing movements to the UNKNOWN dimension sentinel -- dimension-filtered return lines are understated"
          description: "One or more of PolicyEventListener/ClaimsEventListener/BillingEventListener could not resolve a movement's dimension row (policy_dimension for productId, claim_dimension for claimType) and attributed the movement to the UNKNOWN sentinel instead of dropping it. The eventType label says which event. NOT AN OUTAGE, AND NOT SILENT DATA LOSS: the movement IS recorded, and every tenant-wide (unfiltered) return line still counts it correctly -- only lines carrying a dimension_filter are affected, because an UNKNOWN-attributed row matches no real product id or claim type. Diagnose by cause, not by editing rows: a HANDFUL of misses is expected and benign (this module's listeners are unordered against each other, so a lapse/premium/claim decision can genuinely arrive before the PolicyIssued/ClaimRegistered event that writes the dimension row). A SUSTAINED rate means the dimension-writing event is not arriving at all for those keys -- check that policy.PolicyIssued and claims.ClaimRegistered are being published and that RegreportingEventProcessingFailed is not also firing (a failed dimension write shows up here as a knock-on). Remedy is the same as that alert's: REPLAY OR REBUILD the affected tenant/period's projection from the owning module's own records once the dimension rows exist, never hand-edit a fact table."

      - alert: PostgresDiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/var/lib/postgresql/data"} / node_filesystem_size_bytes{mountpoint="/var/lib/postgresql/data"}) < 0.15
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "Postgres data volume below 15% free space"

      # NOT YET LIVE -- corrected after a review found this annotation was asserting a producer
      # that does not exist. Neither gauge below is emitted by anything: `git grep` for either
      # name returns only this file. The failure mode is real and Deliverable 6 did discover it
      # during validation, but today it is caught ONLY in CI and by
      # AppRolePrivilegesIntegrationTest / RowLevelSecurityIntegrationTest -- nothing checks it in
      # a running deployment, so this critical rule cannot fire. Closing it needs a scheduled
      # pg_roles query publishing these two gauges; note a Java @Scheduled thread has no
      # TenantContext (RLS shows it zero rows), so follow billing's pg_cron + SECURITY DEFINER
      # pattern in db-migrations/_post-migration/configure-billing-sweep.sql. Tracked by
      # AlertRuleMetricProducerTest, which fails if this claim silently changes either way.
      - alert: RlsBypassRoleDetected
        expr: lifeplatform_app_role_has_bypassrls == 1 or lifeplatform_app_role_is_superuser == 1
        labels: { severity: critical }
        annotations:
          summary: "The application's runtime DB role has BYPASSRLS or superuser -- every Row-Level Security policy is silently inactive"
          description: "Deliverable 6 discovered this exact failure mode during validation. NOTE: no producer emits these gauges yet, so this rule is currently inert -- the property is enforced in CI and by the app_role/RLS integration tests, not in production. See AlertRuleMetricProducerTest."
