groups:
  - name: lifeplatform-business-and-reliability
    rules:

      # Deliverable 5 §4 dead-letter table -- an event that exhausted retry is a
      # correctness problem (a domain side-effect that never happened), not just an
      # ops nuisance, so this alerts fast and on any growth, not on a high threshold.
      - alert: FailedEventBacklogGrowing
        expr: increase(lifeplatform_failed_event_total[15m]) > 0
        for: 5m
        labels: { severity: high }
        annotations:
          summary: "Events landing in audit.failed_event -- at least one consumer is failing repeatedly"
          description: "Check audit.failed_event for unresolved rows; a producer's event is not reaching its consumer(s)."

      # Deliverable 2 Rev 2 B4 / Deliverable 6 -- field-captured premium receipts that
      # missed their reconciliation SLA.
      - alert: FieldReceiptReconciliationOverdue
        expr: lifeplatform_field_receipt_overdue_count > 0
        for: 10m
        labels: { severity: medium }
        annotations:
          summary: "Field-captured premium receipts overdue for reconciliation"
          description: "One or more agent-captured receipts have exceeded the OFFLINE_RECEIPT_SLA_HOURS refdata parameter without a matching PaymentConfirmed."

      # Deliverable 3 Rev 2 §12 -- the surrender/maturity Camunda process stuck
      # mid-choreography (e.g. policyloan never replied to PolicySurrenderInitiated).
      - alert: SurrenderMaturityProcessStuck
        expr: camunda_process_instances{process="policy-surrender-maturity", state="IN_PROGRESS"} and on() (time() - camunda_process_instance_start_timestamp) > 3600
        for: 5m
        labels: { severity: high }
        annotations:
          summary: "A surrender/maturity process instance has been IN_PROGRESS for over an hour"
          description: "Per Deliverable 3 Rev 2 §12, this should escalate to a staff manual-resolution task well before this alert fires; if it fired, the escalation itself may have failed too."

      # Deliverable 6 §4 -- partition-maintenance is not optional; a missed run means
      # the platform is one insert away from a hard failure on a partitioned table
      # (exactly what Deliverable 6's smoke test demonstrated deliberately).
      - alert: PgPartmanMaintenanceFailed
        expr: increase(pg_cron_job_failed_total{jobname="pg-partman-maintenance"}[1d]) > 0
        labels: { severity: critical }
        annotations:
          summary: "pg_partman's daily maintenance job failed"
          description: "Partitioned tables (loan_transaction, payment_transaction, disbursement_instruction, gl_posting, audit_log, premium_invoice) risk running out of pre-created future partitions."

      - alert: PartitionHeadroomLow
        expr: (lifeplatform_max_partition_upper_bound_epoch - time()) < 30 * 86400
        labels: { severity: high }
        annotations:
          summary: "A partitioned table has less than 30 days of pre-created partition headroom"

      - alert: MobileMoneyGatewayErrorRateHigh
        expr: rate(lifeplatform_payment_gateway_requests_total{status="FAILED"}[5m]) / rate(lifeplatform_payment_gateway_requests_total[5m]) > 0.1
        for: 10m
        labels: { severity: high }
        annotations:
          summary: "Mobile money gateway failure rate above 10% over 10 minutes"

      # M5 final-review fix (I2). The counter has existed since Task 8's own review round but
      # nothing alerted on it, which left half of that fix undelivered: the whole reason the
      # ambiguous case was given its own counter (rather than sharing NOT_FOUND's log line) was so
      # that a real cross-tenant collision would be VISIBLE rather than reading like a data-entry
      # error. A metric no rule references is not visible.
      #
      # Alerts on ANY occurrence, not a rate: db-migrations/payment/V2's own comment records that a
      # gateway may legitimately reuse a reference across tenants, and when it happens this platform
      # correctly refuses to guess which tenant's row to mutate -- which means a genuine payout is
      # left sitting PENDING with no automated path to resolution. Every single one needs a human.
      - alert: PaymentCallbackAmbiguousReference
        expr: increase(lifeplatform_payment_callback_ambiguous_total[15m]) > 0
        for: 5m
        labels: { severity: high }
        annotations:
          summary: "A mobile-money callback's gatewayReference matched more than one tenant -- nothing was applied"
          description: "payment.applyGatewayCallback fails closed rather than guessing which tenant owns a shared gateway_reference, so the affected payment/disbursement is left in its prior state and needs manual reconciliation against the aggregator. Search logs for 'is AMBIGUOUS across more than one tenant'."

      # M5 final-review fix (C2). An IN_DOUBT row means the platform sent an instruction to the rail
      # and does NOT know whether money moved (read timeout, 5xx, or an ACCEPTED response carrying no
      # gatewayReference). Deliberately no domain event is published for that state -- publishing
      # payment.DisbursementFailed made policyloan write a REVERSAL and release the encumbrance for
      # payouts that may well have succeeded -- so THIS RULE IS THE ONLY AUTOMATED SIGNAL that such a
      # row exists. If it is removed, the state becomes invisible outside the database.
      #
      # Any occurrence, same reasoning as the ambiguous rule above: each one is money whose fate is
      # unknown and which must be reconciled against the aggregator's statement by hand.
      - alert: PaymentOutcomeInDoubt
        expr: increase(lifeplatform_payment_in_doubt_total[15m]) > 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "A payment/disbursement outcome is IN_DOUBT -- money may or may not have moved"
          description: "The rail neither confirmed nor declined (timeout, 5xx, or ACCEPTED with no gatewayReference). The row is recorded IN_DOUBT and NO *Failed event was published, so no compensation was triggered and the requesting module is still waiting. Reconcile against the aggregator's statement, then let the row resolve via the inbound webhook (IN_DOUBT is a valid source state for both terminal transitions). Search logs for 'INDETERMINATE gateway outcome'."

      # M5 final-review fix (C2, second half). An unrecognized callback status now applies NOTHING
      # (it previously drove a definitive FAILED transition on any string that was not "SUCCESS").
      # That is the safe behaviour, and it is also silent: if an aggregator renames its statuses, every
      # confirmation stops landing while the platform keeps returning HTTP 200. This is how that gets
      # noticed. Not `critical` because nothing incorrect has happened -- but it does mean
      # confirmations are being dropped, so it needs same-day attention.
      - alert: PaymentCallbackUnknownStatus
        expr: increase(lifeplatform_payment_callback_unknown_status_total[15m]) > 0
        for: 5m
        labels: { severity: high }
        annotations:
          summary: "A mobile-money callback carried a status this platform does not recognize -- nothing was applied"
          description: "MobileMoneyCallbackController validates status against a known dialect and refuses to let an unknown string drive a financial transition. A sustained rate means the aggregator's vocabulary has drifted and confirmations are silently not landing; the recognized sets in that class must be updated deliberately. Search logs for 'carried an UNRECOGNIZED status'."

      # M6 final-review fix (I5). claims.application.PaymentEventListener increments this on every
      # genuine rail DECLINE of a claim settlement payout. The claim is deliberately reverted
      # SETTLEMENT_REQUESTED -> APPROVED and left there: claims never retries a payout automatically
      # (a second attempt at real money must be a human decision), so the claim sits on a staff
      # worklist that nothing else announces. No domain event reaches an operator either --
      # claims.ClaimSettled is only published on success.
      #
      # Any occurrence, not a rate: each one is a beneficiary who has NOT been paid and who is
      # waiting. `medium` rather than high/critical because nothing incorrect happened and no money is
      # unaccounted for -- the rail said no, cleanly, and the platform recorded exactly that.
      - alert: ClaimSettlementDisbursementFailed
        expr: increase(lifeplatform_claims_settlement_failed_total[15m]) > 0
        for: 5m
        labels: { severity: medium }
        annotations:
          summary: "A claim settlement payout was declined by the rail -- the claim is back at APPROVED awaiting a staff retry"
          description: "The claim reverted to APPROVED with settlement_failure_reason recorded and will NOT be retried automatically. Find the claim (search logs for 'settlement disbursement FAILED'), resolve the cause named in the reason (e.g. INSUFFICIENT_FLOAT, a bad payeeRef), then re-issue the settlement decision with a NEW Idempotency-Key and the SAME approved amount -- a differing amount is rejected with 409 by design."

      # M6 final-review fix (C1, part 3). The claim is SETTLED and its disbursement COMPLETED -- the
      # money has genuinely left -- but the policy could not be closed, so billing will keep raising
      # premium invoices against a policy whose claim has already paid out. That is the exact bug the
      # policy-closure feature exists to prevent, silently reappearing for this one policy.
      #
      # THIS RULE IS THE ONLY AUTOMATED SIGNAL for that state. By design the claim is NOT rolled back
      # (rolling it back after the money moved is the Critical this counter was introduced alongside),
      # and claims.ClaimSettled IS published, so every downstream consumer sees a normal, complete
      # settlement. Nothing else anywhere indicates the policy half never happened.
      #
      # Any occurrence: the legitimate source states (ACTIVE, REINSTATED, LAPSED, SUSPENDED, plus
      # already-closed as a no-op) no longer throw at all, so if this fires the cause is genuinely
      # unexpected -- a PROPOSED policy, a missing policy row, a lock timeout -- and needs a human.
      - alert: ClaimSettledButPolicyNotClosed
        expr: increase(lifeplatform_claims_policy_closure_failed_total[15m]) > 0
        for: 5m
        labels: { severity: high }
        annotations:
          summary: "A claim settled and paid out, but its policy could not be closed -- billing will keep invoicing it"
          description: "The claim is correct and final; only the policy closure failed. Search logs for 'could NOT be closed' to get the claimId and policyNumber, then close the policy manually (MATURED for a MATURITY claim, SURRENDERED otherwise) and reconcile any premium invoices raised against it after the settlement date. Do NOT reopen or un-settle the claim -- the disbursement really did complete."

      - alert: PostgresDiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/var/lib/postgresql/data"} / node_filesystem_size_bytes{mountpoint="/var/lib/postgresql/data"}) < 0.15
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "Postgres data volume below 15% free space"

      - alert: RlsBypassRoleDetected
        expr: lifeplatform_app_role_has_bypassrls == 1 or lifeplatform_app_role_is_superuser == 1
        labels: { severity: critical }
        annotations:
          summary: "The application's runtime DB role has BYPASSRLS or superuser -- every Row-Level Security policy is silently inactive"
          description: "Deliverable 6 discovered this exact failure mode during validation; this metric is emitted by a scheduled query against pg_roles specifically to catch it in production, not just in testing."
