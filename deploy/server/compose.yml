# The pilot server (2026-10-13, deployment pilot §2). Run from the platform directory:
#   docker compose --env-file .env --env-file versions.env -f compose.yml <command>
# remote-release.sh does that for you; the runbook shows the few times you would type it yourself.
name: platform

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:

  postgres:
    image: ${IMAGE_PREFIX}-postgres:${RELEASE}
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: lifeplatform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The documents: policy documents, KYC evidence, underwriting evidence, claim evidence. SeaweedFS rather than
  # MinIO -- see versions.env. Kept on this server rather than in someone else's cloud: these buckets hold scanned
  # national IDs and death certificates, which is exactly the material a Tanzanian insurer should keep custody of.
  objectstore:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION}
    restart: unless-stopped
    logging: *logging
    command: ["server", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-dir=/data"]
    volumes:
      - objectdata:/data
      - ./objectstore/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # By its own hostname, NOT localhost: SeaweedFS binds the S3 port to the container's network address and not to
      # loopback, so a localhost probe is refused however healthy the server is.
      test: ["CMD-SHELL", "nc -z $$(hostname) 8333"]
      interval: 10s
      timeout: 5s
      retries: 20

  # The money rail is still a mock (the pilot records premiums as cash and field receipts). Internal only: nothing
  # outside this network can reach it, which is what keeps an unauthenticated mock from being an open door.
  mock-mobile-money:
    image: wiremock/wiremock:${WIREMOCK_VERSION}
    restart: unless-stopped
    logging: *logging
    command: ["--global-response-templating"]
    volumes:
      - ./mock-mobile-money:/home/wiremock:ro

  keycloak:
    image: ${IMAGE_PREFIX}-auth:${RELEASE}
    restart: unless-stopped
    logging: *logging
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: https://${AUTH_DOMAIN}
      # The admin console answers only on the tunnelled port below; Caddy 404s /admin from the internet.
      KC_HOSTNAME_ADMIN: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
    ports:
      # Loopback only: reachable through `ssh -L 8081:localhost:8081`, from nowhere else.
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  keycloak-config:
    image: adorsys/keycloak-config-cli:${KC_CONFIG_CLI_VERSION}
    profiles: [tools]
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: ${KC_ADMIN_PASSWORD}
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      IMPORT_FILES_LOCATIONS: /config/*.json
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      # Staff created with add-user.sh and customers created by portal invites are in no realm file. Without this
      # every release would delete all of them.
      IMPORT_MANAGED_USER: no-delete
      APP_DOMAIN: ${APP_DOMAIN}
      PORTAL_ADMIN_CLIENT_SECRET: ${PORTAL_ADMIN_CLIENT_SECRET}
      STAFF_ADMIN_CLIENT_SECRET: ${STAFF_ADMIN_CLIENT_SECRET}
      MAIL_ENABLED: ${MAIL_ENABLED}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    volumes:
      - ./realms:/config:ro

  backend:
    image: ${IMAGE_PREFIX}-backend:${RELEASE}
    restart: unless-stopped
    logging: *logging
    # EXACTLY ONE. The platform runs 32 @Scheduled jobs with no cluster lock: a second instance would send every
    # reminder twice and run the bordereau and statement jobs concurrently.
    mem_limit: 2500m
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lifeplatform
      SPRING_DATASOURCE_USERNAME: app_role
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD}
      MINIO_ENDPOINT: http://objectstore:8333
      MINIO_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY}
      MINIO_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY}
      KEYCLOAK_ISSUER_CUSTOMERS: https://${AUTH_DOMAIN}/realms/customers
      KEYCLOAK_ISSUER_AGENTS: https://${AUTH_DOMAIN}/realms/agents
      KEYCLOAK_ISSUER_STAFF: https://${AUTH_DOMAIN}/realms/staff
      KEYCLOAK_ISSUER_REGULATORS: https://${AUTH_DOMAIN}/realms/regulators
      # The portal's user administration goes straight to Keycloak inside the network: Caddy blocks /admin publicly,
      # and this call is the platform's own, not a browser's.
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_PORTAL_ADMIN_SECRET: ${PORTAL_ADMIN_CLIENT_SECRET}
      KEYCLOAK_STAFF_ADMIN_SECRET: ${STAFF_ADMIN_CLIENT_SECRET}
      STAFF_CONSOLE_URL: https://${APP_DOMAIN}/staff
      PORTAL_URL: https://${APP_DOMAIN}/customers
      MOBILE_MONEY_GATEWAY_BASE_URL: http://mock-mobile-money:8080
      MOBILE_MONEY_CALLBACK_HMAC_SECRET: ${MOBILE_MONEY_CALLBACK_HMAC_SECRET}
      SMS_GATEWAY_BASE_URL: ${SMS_GATEWAY_BASE_URL}
      SMS_GATEWAY_AUTHORIZATION: ${SMS_GATEWAY_AUTHORIZATION}
      SMS_GATEWAY_SENDER_NAME: ${SMS_GATEWAY_SENDER_NAME}
      SMS_GATEWAY_LIVE: ${SMS_GATEWAY_LIVE}
      SMS_GATEWAY_ALLOWED_RECIPIENTS: ${SMS_GATEWAY_ALLOWED_RECIPIENTS}
      MAIL_ENABLED: ${MAIL_ENABLED}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      NOTIFICATION_FROM_ADDRESS: ${MAIL_FROM}
      EXTRA_CA_FILE: ${EXTRA_CA_FILE}
    volumes:
      # Read only during the rehearsal, where EXTRA_CA_FILE points into it. Harmless in production.
      - caddydata:/caddy-data:ro
    depends_on:
      postgres:
        condition: service_healthy
      objectstore:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  caddy:
    image: ${IMAGE_PREFIX}-web:${RELEASE}
    restart: unless-stopped
    logging: *logging
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      AUTH_DOMAIN: ${AUTH_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddydata:/data
      - caddyconfig:/config
    networks:
      default:
        aliases:
          # The backend fetches each realm's signing keys from https://AUTH_DOMAIN, because SecurityConfig requires a
          # token's issuer to match that address exactly. Inside this network the name resolves to Caddy, so the call
          # never leaves the machine, still presents a valid certificate, and the issuers agree.
          - ${AUTH_DOMAIN}

volumes:
  pgdata:
  objectdata:
  caddydata:
  caddyconfig:
