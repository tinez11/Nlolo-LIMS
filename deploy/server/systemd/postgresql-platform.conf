# The platform's Postgres settings (installed as /etc/postgresql/16/main/conf.d/platform.conf).
#
# Loopback only: every client -- the backend, Authentik, the scripts -- is on this machine.
listen_addresses = 'localhost'
# Headroom for Authentik (2026-11-20): its server and worker hold a dozen connections idle and more under load, beside
# the backend's pool of up to 24, migrations, backups and pg_cron. The default 100 left too little.
max_connections = 200
# pg_cron runs the platform's scheduled sweeps inside the database (db-migrations/_post-migration).
shared_preload_libraries = 'pg_cron'
cron.database_name = 'lifeplatform'
