# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
#
# The platform's Authentik configuration (2026-11-19, the Authentik migration;
# backend/docs/superpowers/specs/2026-11-19-authentik-migration-design.md). Baked into the -auth image for production
# and mounted by the dev compose; applied by the worker at start and on every change, idempotently.
#
# Ticket 01 of .scratch/authentik-cutover: groups, the sign-in flow, the token's claims, the provider, the application
# and the brand's sign-in flow. Ticket 02 added PKCE S256 and the superuser refusal. The sign-in code, notifications,
# recovery and the look come in later tickets.
version: 1
metadata:
  name: lifeplatform
  labels:
    blueprints.goauthentik.io/description: Nlolo Life platform -- sign-in, tokens, groups

entries:
  # ---- The backend's own login (ticket 03): a service account whose API token the backend holds as
  # AUTHENTIK_API_TOKEN. Its role may add users anywhere, but may only see, change, delete and reset the password of
  # the users it created itself (initial permissions). It is never given a global reset-password right: a leaked token
  # could then reset an administrator's password. Workspace rights are per group, below.
  - model: authentik_rbac.role
    id: role-backend
    identifiers: {name: lifeplatform-backend}
    attrs:
      permissions:
        - authentik_core.add_user

  - model: authentik_rbac.initialpermissions
    identifiers: {name: lifeplatform-backend-created-users}
    attrs:
      role: !KeyOf role-backend
      permissions:
        - !Find [auth.permission, [codename, view_user], [content_type__app_label, authentik_core]]
        - !Find [auth.permission, [codename, change_user], [content_type__app_label, authentik_core]]
        - !Find [auth.permission, [codename, delete_user], [content_type__app_label, authentik_core]]
        - !Find [auth.permission, [codename, reset_user_password], [content_type__app_label, authentik_core]]

  - model: authentik_core.user
    id: user-backend
    identifiers: {username: lifeplatform-backend}
    attrs:
      name: Nlolo Life backend
      type: service_account
      path: lifeplatform/service
      is_active: true
      roles:
        - !KeyOf role-backend

  # Non-expiring: an expiring token gets a new key when it lapses and the backend silently loses access. The key comes
  # from the environment, with no default: unset, Authentik generates one nobody holds, and the backend fails loudly.
  - model: authentik_core.token
    identifiers: {identifier: lifeplatform-backend-api}
    attrs:
      user: !KeyOf user-backend
      intent: api
      expiring: false
      description: The platform backend's access to the users API
      key: !Env AUTHENTIK_API_TOKEN

  # ---- The four workspaces. Job roles are NOT groups: they live in the platform's iam tables, and reach it once at a
  # staff member's first sign-in through the login's job_roles attribute (see the claims mapping below).
  # The backend may add people to staff, never remove them (a closed staff login is disabled instead), and has no
  # right at all on regulator: regulator logins are made by hand on the server.
  - model: authentik_core.group
    id: group-staff
    identifiers: {name: staff}
    permissions:
      - {permission: authentik_core.view_group, role: !KeyOf role-backend}
      - {permission: authentik_core.add_user_to_group, role: !KeyOf role-backend}
  # Agent and customer access are opened and closed from the platform (ticket 04), so the backend may add and remove.
  - model: authentik_core.group
    id: group-agent
    identifiers: {name: agent}
    permissions:
      - {permission: authentik_core.view_group, role: !KeyOf role-backend}
      - {permission: authentik_core.add_user_to_group, role: !KeyOf role-backend}
      - {permission: authentik_core.remove_user_from_group, role: !KeyOf role-backend}
  - model: authentik_core.group
    id: group-customer
    identifiers: {name: customer}
    permissions:
      - {permission: authentik_core.view_group, role: !KeyOf role-backend}
      - {permission: authentik_core.add_user_to_group, role: !KeyOf role-backend}
      - {permission: authentik_core.remove_user_from_group, role: !KeyOf role-backend}
  - model: authentik_core.group
    id: group-regulator
    identifiers: {name: regulator}

  # ---- Sign-in: username and password on one page (identification carries the password stage), then the session.
  - model: authentik_stages_password.passwordstage
    id: stage-password
    identifiers: {name: lifeplatform-password}
    attrs:
      backends: [authentik.core.auth.InbuiltBackend]
      failed_attempts_before_cancel: 5

  - model: authentik_stages_identification.identificationstage
    id: stage-identification
    identifiers: {name: lifeplatform-identification}
    attrs:
      user_fields: [username]
      password_stage: !KeyOf stage-password
      case_insensitive_matching: true
      show_matched_user: false

  - model: authentik_stages_user_login.userloginstage
    id: stage-user-login
    identifiers: {name: lifeplatform-user-login}
    attrs:
      session_duration: hours=10

  - model: authentik_flows.flow
    id: flow-sign-in
    identifiers: {slug: lifeplatform-sign-in}
    attrs:
      name: Nlolo Life sign-in
      title: Welcome back.
      designation: authentication

  - model: authentik_flows.flowstagebinding
    identifiers: {target: !KeyOf flow-sign-in, stage: !KeyOf stage-identification, order: 10}
  - model: authentik_flows.flowstagebinding
    identifiers: {target: !KeyOf flow-sign-in, stage: !KeyOf stage-user-login, order: 100}

  # ---- Superusers never sign in here (ticket 02; replaces Keycloak's 404 on the master realm). The deny stage runs
  # only when its policy passes, judged once the login is known: the policy's user is the pending user, not the
  # anonymous visitor the flow was planned for. Authentik's administrators sign in through the stock
  # default-authentication-flow instead (/if/flow/default-authentication-flow/?next=/if/admin/).
  - model: authentik_policies_expression.expressionpolicy
    id: policy-is-superuser
    identifiers: {name: lifeplatform-login-is-superuser}
    attrs:
      expression: |
        return request.user.is_superuser

  - model: authentik_stages_deny.denystage
    id: stage-deny-superuser
    identifiers: {name: lifeplatform-deny-superuser}
    attrs:
      deny_message: This login cannot sign in here.

  - model: authentik_flows.flowstagebinding
    id: binding-deny-superuser
    identifiers: {target: !KeyOf flow-sign-in, stage: !KeyOf stage-deny-superuser, order: 50}
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true

  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf binding-deny-superuser, policy: !KeyOf policy-is-superuser, order: 0}

  # ---- The staff sign-in code (ticket 05; today's texted code, 2026-11-14). Authentik makes the code and checks it; the
  # backend texts it -- to the phone on the staff record, else the login's `phone` attribute -- with its own wording,
  # and caps it at 5 an hour and 1 a minute. Its refusals ("No phone number is on file for you...", "Too many
  # codes...") come back as plain text, which Authentik shows as it is.
  - model: authentik_events.notificationwebhookmapping
    id: mapping-sign-in-code
    identifiers: {name: lifeplatform-sign-in-code}
    attrs:
      expression: |
        attributes = user.attributes or {}
        return {
            "tenantId": attributes.get("tenant_id"),
            "userId": str(user.uuid),
            "code": token,
            "phone": attributes.get("phone"),
        }

  - model: authentik_stages_authenticator_sms.authenticatorsmsstage
    id: stage-sms-setup
    identifiers: {name: lifeplatform-sms-setup}
    attrs:
      provider: generic
      from_number: Nlolo
      account_sid: !Format ["%s/internal/staff-sign-in-code/sms", !Env [LP_BACKEND_URL, "http://host.docker.internal:8080"]]
      auth_type: bearer
      auth: !Env SIGN_IN_CODE_WEBHOOK_SECRET
      mapping: !KeyOf mapping-sign-in-code
      verify_only: false

  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: stage-sign-in-code
    identifiers: {name: lifeplatform-sign-in-code}
    attrs:
      device_classes: [sms]
      not_configured_action: configure
      configuration_stages: [!KeyOf stage-sms-setup]
      last_auth_threshold: seconds=0

  # Who is asked: staff, while the STAFF_SIGN_IN_CODE switch is on (production refuses to start with it off), and the
  # dev-only e2e-sign-in-code group always, so its test runs with the switch off. The policy also puts the login's
  # username into the prompt data as the "phone", so the first sign-in sets the SMS device up with no phone screen:
  # the device's number is only a key; the backend decides where the text goes (proven in the migration's ticket 13).
  - model: authentik_policies_expression.expressionpolicy
    id: policy-needs-sign-in-code
    identifiers: {name: lifeplatform-needs-sign-in-code}
    attrs:
      expression: !Format
        - |
          switch_on = "%s".strip().lower() == "true"
          user = request.context.get("pending_user") or request.user
          asked = ak_is_group_member(user, name="e2e-sign-in-code") or (
              switch_on and ak_is_group_member(user, name="staff"))
          if not asked:
              return False
          request.context["flow_plan"].context.setdefault("prompt_data", {})["phone"] = user.username
          return True
        - !Env [STAFF_SIGN_IN_CODE, "false"]

  # Why a code can't be sent, shown before the code step (2026-11-19, the user's choice). Authentik's own code pages do
  # not show a refused send: over the cap they still say a code was sent, and with no phone the first sign-in shows a
  # phone screen. So the backend is asked first; when it says no (422 no phone, 429 too many), this deny stage ends the
  # sign-in with its words. The send stays capped by the backend all the same. If the backend can't be asked, the code
  # step goes ahead and the send itself decides.
  - model: authentik_policies_expression.expressionpolicy
    id: policy-code-refused
    identifiers: {name: lifeplatform-sign-in-code-refused}
    attrs:
      expression: !Format
        - |
          switch_on = "%s".strip().lower() == "true"
          user = request.context.get("pending_user") or request.user
          asked = ak_is_group_member(user, name="e2e-sign-in-code") or (
              switch_on and ak_is_group_member(user, name="staff"))
          if not asked:
              return False
          attributes = user.attributes or {}
          try:
              answer = requests.post(
                  "%s/internal/staff-sign-in-code/check",
                  json={"tenantId": attributes.get("tenant_id"), "userId": str(user.uuid),
                        "phone": attributes.get("phone")},
                  headers={"Authorization": "Bearer %s"},
                  timeout=10,
              )
          except Exception as error:
              ak_logger.warning("Sign-in code check failed", error=str(error))
              return False
          if answer.status_code in (422, 429):
              request.context["flow_plan"].context["deny_message"] = answer.text
              return True
          return False
        - !Env [STAFF_SIGN_IN_CODE, "false"]
        - !Env [LP_BACKEND_URL, "http://host.docker.internal:8080"]
        - !Env SIGN_IN_CODE_WEBHOOK_SECRET

  - model: authentik_stages_deny.denystage
    id: stage-no-sign-in-code
    identifiers: {name: lifeplatform-no-sign-in-code}
    attrs:
      deny_message: We couldn't send your code. Try again.

  # Runs only for someone asked for a code (the same rule as the code step's) whom the backend can't send one; agents
  # and customers never reach the backend call.
  - model: authentik_flows.flowstagebinding
    id: binding-no-sign-in-code
    identifiers: {target: !KeyOf flow-sign-in, stage: !KeyOf stage-no-sign-in-code, order: 54}
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf binding-no-sign-in-code, policy: !KeyOf policy-code-refused, order: 0}

  - model: authentik_flows.flowstagebinding
    id: binding-sign-in-code
    identifiers: {target: !KeyOf flow-sign-in, stage: !KeyOf stage-sign-in-code, order: 55}
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf binding-sign-in-code, policy: !KeyOf policy-needs-sign-in-code, order: 0}

  # ---- A temporary password must be replaced at the next sign-in (ticket 03; Keycloak's UPDATE_PASSWORD required
  # action). Authentik has no such flag: the backend sets the password, then the login's reset_password attribute to
  # true. These two stages run only while that attribute is exactly true -- judged once the login is known -- and the
  # user-write stage saves the new password and sets the attribute to the string "false": a hidden field's value is
  # its placeholder, taken from the server, never from the browser, and never evaluated as an expression.
  - model: authentik_policies_expression.expressionpolicy
    id: policy-must-change-password
    identifiers: {name: lifeplatform-must-change-password}
    attrs:
      expression: |
        return (request.user.attributes or {}).get("reset_password") is True

  # Keycloak's password rules, carried over: at least 8 characters and not the username. Its "not one of the last 3"
  # needs Authentik's enterprise unique-password policy; what stays is "not the temporary password itself", without
  # which the administrator who issued it would still know the password.
  - model: authentik_policies_password.passwordpolicy
    id: policy-password-rules
    identifiers: {name: lifeplatform-password-rules}
    attrs:
      password_field: password
      check_static_rules: true
      length_min: 8
      error_message: Use at least 8 characters.

  - model: authentik_policies_expression.expressionpolicy
    id: policy-password-not-reused
    identifiers: {name: lifeplatform-password-not-username-or-temporary}
    attrs:
      expression: |
        new = request.context.get("prompt_data", {}).get("password") or ""
        if new.lower() == request.user.username.lower():
            ak_message("Your password can't be your username.")
            return False
        if request.user.check_password(new):
            ak_message("Choose a password different from the one you were given.")
            return False
        return True

  - model: authentik_stages_prompt.prompt
    id: prompt-new-password
    identifiers: {name: lifeplatform-new-password}
    attrs:
      field_key: password
      label: New password
      type: password
      required: true
      placeholder: New password
      order: 0

  - model: authentik_stages_prompt.prompt
    id: prompt-new-password-repeat
    identifiers: {name: lifeplatform-new-password-repeat}
    attrs:
      field_key: password_repeat
      label: New password again
      type: password
      required: true
      placeholder: New password again
      order: 1

  - model: authentik_stages_prompt.prompt
    id: prompt-clear-reset-flag
    identifiers: {name: lifeplatform-clear-reset-password}
    attrs:
      field_key: attributes.reset_password
      label: reset_password
      type: hidden
      required: false
      placeholder: "false"
      placeholder_expression: false
      order: 2

  - model: authentik_stages_prompt.promptstage
    id: stage-choose-password
    identifiers: {name: lifeplatform-choose-password}
    attrs:
      fields:
        - !KeyOf prompt-new-password
        - !KeyOf prompt-new-password-repeat
        - !KeyOf prompt-clear-reset-flag
      validation_policies:
        - !KeyOf policy-password-rules
        - !KeyOf policy-password-not-reused

  - model: authentik_stages_user_write.userwritestage
    id: stage-save-password
    identifiers: {name: lifeplatform-save-password}
    attrs:
      user_creation_mode: never_create

  - model: authentik_flows.flowstagebinding
    id: binding-choose-password
    identifiers: {target: !KeyOf flow-sign-in, stage: !KeyOf stage-choose-password, order: 60}
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf binding-choose-password, policy: !KeyOf policy-must-change-password, order: 0}

  - model: authentik_flows.flowstagebinding
    id: binding-save-password
    identifiers: {target: !KeyOf flow-sign-in, stage: !KeyOf stage-save-password, order: 70}
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf binding-save-password, policy: !KeyOf policy-must-change-password, order: 0}

  # ---- Sign-out ends the Authentik session (ticket 02), as Keycloak's did. The stock provider invalidation flow only
  # signs the person out of the application: with the session still alive, the console's next sign-in redirect came
  # straight back signed in. The end-session endpoint then returns to the console's registered logout address.
  - model: authentik_stages_user_logout.userlogoutstage
    id: stage-user-logout
    identifiers: {name: lifeplatform-user-logout}

  - model: authentik_flows.flow
    id: flow-sign-out
    identifiers: {slug: lifeplatform-sign-out}
    attrs:
      name: Nlolo Life sign-out
      title: Signed out
      designation: invalidation
      authentication: none

  - model: authentik_flows.flowstagebinding
    identifiers: {target: !KeyOf flow-sign-out, stage: !KeyOf stage-user-logout, order: 0}

  # ---- What the token says about the person. roles: the workspace groups only, so Authentik's own groups never reach
  # a token. tenant_id / party_id / home_branch: from the login's attributes. job_roles: read once by the platform at a
  # staff member's first sign-in, nowhere else.
  - model: authentik_providers_oauth2.scopemapping
    id: mapping-claims
    identifiers: {name: lifeplatform-claims}
    attrs:
      scope_name: lifeplatform
      description: Workspaces, tenant and party
      expression: |
        workspaces = {"staff", "agent", "customer", "regulator"}
        claims = {"roles": sorted({g.name for g in request.user.all_groups()} & workspaces)}
        attributes = request.user.attributes or {}
        for key in ("tenant_id", "party_id", "home_branch"):
            if attributes.get(key):
                claims[key] = str(attributes[key])
        job_roles = attributes.get("job_roles")
        if job_roles:
            claims["job_roles"] = [str(r) for r in job_roles]
        return claims

  # ---- One public client for every console (universal login). The issuer is per provider:
  # <auth origin>/application/o/lifeplatform/ -- trailing slash included.
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers: {name: lifeplatform}
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !KeyOf flow-sign-out
      client_type: public
      client_id: lifeplatform-spa
      # 2026.8 lists the allowed grants on the provider, and an empty list allows none (found 2026-11-19: the
      # authorize endpoint answered "Invalid grant_type for provider"). The console needs the code flow and refresh;
      # nothing else (no password or client-credentials grant on the public client).
      grant_types: [authorization_code, refresh_token]
      # One exact address to come back to after sign-in, and one after sign-out (the console's post_logout_redirect_uri;
      # without it Authentik leaves the person on its own "signed out" page).
      redirect_uris:
        - matching_mode: strict
          url: !Format ["%s/", !Env [LP_APP_ORIGIN, "http://localhost:5173"]]
        - matching_mode: strict
          redirect_uri_type: logout
          url: !Format ["%s/", !Env [LP_APP_ORIGIN, "http://localhost:5173"]]
      sub_mode: user_uuid
      include_claims_in_id_token: true
      issuer_mode: per_provider
      access_token_validity: minutes=5
      refresh_token_validity: minutes=30
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
        - !KeyOf mapping-claims

  - model: authentik_core.application
    id: application
    identifiers: {slug: lifeplatform}
    attrs:
      name: Nlolo Life
      provider: !KeyOf provider
      # Every bound policy must pass.
      policy_engine_mode: all

  # ---- PKCE S256 is required (ticket 02). The authorize endpoint hands the application's policies the request's
  # challenge and method; a request with no challenge reports the method "plain". The token endpoint does not run
  # these policies for a refresh, and other callers (the user's library page) carry no OAuth context, so the check
  # applies only where that context exists.
  - model: authentik_policies_expression.expressionpolicy
    id: policy-pkce-s256
    identifiers: {name: lifeplatform-require-pkce-s256}
    attrs:
      expression: |
        if "oauth_code_challenge_method" not in request.context:
            return True
        if request.context.get("oauth_code_challenge") and request.context["oauth_code_challenge_method"] == "S256":
            return True
        ak_message("Sign-in needs PKCE (S256).")
        return False

  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf application, policy: !KeyOf policy-pkce-s256, order: 0}

  # ---- The default brand signs people in through the flow above.
  - model: authentik_brands.brand
    identifiers: {domain: authentik-default}
    attrs:
      branding_title: Nlolo Life
      flow_authentication: !KeyOf flow-sign-in
