  # Added 2026-11-19 (ticket 02 of .scratch/authentik-cutover): one login in two workspaces, an agent who is also a
  # customer, to prove the console's X-Workspace switch. Not in the Keycloak realm.
  - model: authentik_core.user
    state: created
    identifiers: {username: agent.customer}
    attrs:
      name: Rehema Both
      path: lifeplatform/dev
      is_active: true
      password: devpassword
      groups:
        - !Find [authentik_core.group, [name, agent]]
        - !Find [authentik_core.group, [name, customer]]
      attributes:
        tenant_id: "11111111-1111-1111-1111-111111111111"

  # Added 2026-11-19 (ticket 05 of .scratch/authentik-cutover): the staff sign-in code's test login. Members of
  # e2e-sign-in-code are asked for the code even with STAFF_SIGN_IN_CODE off, as dev runs; the backend texts it to the
  # login's phone until the staff record has one. Not in the Keycloak realm.
  - model: authentik_core.group
    id: group-e2e-sign-in-code
    identifiers: {name: e2e-sign-in-code}

  - model: authentik_core.user
    state: created
    identifiers: {username: e2e.sign-in-code}
    attrs:
      name: Sign-in Code Tester
      path: lifeplatform/dev
      is_active: true
      password: devpassword
      groups:
        - !Find [authentik_core.group, [name, staff]]
        - !KeyOf group-e2e-sign-in-code
      attributes:
        tenant_id: "11111111-1111-1111-1111-111111111111"
        home_branch: "DSM"
        phone: "+255700000099"
        job_roles: [UNDERWRITER]

  # ---- API-level sign-in for the e2e setup and the seed scripts (ticket 09 of .scratch/authentik-cutover). DEV ONLY.
  # Keycloak's password grant took the login's own password; Authentik's takes an app-password token instead
  # (grant_type=password, client_id=lifeplatform-spa, username, password=<the token's key>, scope openid profile
  # lifeplatform). Every test user but e2e.sign-in-code (whose point is the code) gets one with a fixed key,
  # dev-app-password-<username>, and the provider allows the grant here only: the production blueprint lists
  # authorization_code and refresh_token and nothing else. Applying production alone takes the grant back away until this
  # file is applied again (this file applies production first, so applying it is always enough).
  - model: authentik_providers_oauth2.oauth2provider
    identifiers: {name: lifeplatform}
    attrs:
      grant_types: [authorization_code, refresh_token, password]

  - model: authentik_core.token
    identifiers: {identifier: dev-app-password-staff-underwriter}
    attrs:
      intent: app_password
      user: !Find [authentik_core.user, [username, staff.underwriter]]
      key: dev-app-password-staff.underwriter
      expiring: false
      description: DEV ONLY, the e2e setup's and the seed scripts' API sign-in

  - model: authentik_core.token
