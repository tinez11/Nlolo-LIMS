# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
#
# DEV ONLY -- never baked into the -auth image, never mounted on a server (smoke.sh fails if one of these users exists).
# The 14 test users, carried over from the Keycloak realm JSON on 2026-11-19 (ticket 01 of .scratch/authentik-cutover):
# same usernames, names, attributes and workspaces, password devpassword, and their Keycloak job roles as the job_roles
# attribute the platform imports once at first sign-in.
#
# Each user is `state: created`: made when missing, never rewritten (ticket 09). An apply replaces a user's attributes
# whole, and the worker re-applies this file whenever it changes, so `present` wiped the party_id the seed script writes
# onto the agent and customer logins. A change to a user here therefore reaches a fresh stack, not an existing one.
version: 1
metadata:
  name: lifeplatform-dev-users
  labels:
    blueprints.goauthentik.io/description: DEV ONLY test users

entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers: {name: lifeplatform}
      required: true

  - model: authentik_core.user
    state: created
    identifiers: {username: staff.underwriter}
    attrs:
      name: Halima Underwriter
      path: lifeplatform/dev
      is_active: true
      password: devpassword
      groups:
        - !Find [authentik_core.group, [name, staff]]
      attributes:
        tenant_id: "11111111-1111-1111-1111-111111111111"
        home_branch: "DSM"
        job_roles: [UNDERWRITER]

